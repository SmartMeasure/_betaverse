        bagSizeLabel: b.bagSizeLabel||'', componentsSummary: b.componentsSummary||'', qtyKg: b.qtyKg, totalInvoiced: b.totalInvoiced!=null?b.totalInvoiced:b.chargeAmt, blendedRate: b.blendedRate!=null?b.blendedRate:b.invoiceRate, blendedRatePerPc: b.blendedRatePerPc!=null?b.blendedRatePerPc:'',
        diffPerKg: b.diff, diffPerPc: b.diffPerPc!=null?b.diffPerPc:'', diffPerBag: b.diffPerBag!=null?b.diffPerBag:'',
        pctLabel: b.pct==null?'':((b.pct>0?'+':'')+b.pct+'%'), statusLabel, diffAmountLabel: (b.chargeAmt>0?'+':'')+fmtMoney(b.chargeAmt),
        overchargeAmt: b.status==='over' ? (b.overchargeAmt||0) : '',
        underchargeAmt: b.status==='under' ? (b.underchargeAmt||0) : '',
        gstMismatchLabel: b.gstMismatch ? (b.gstEntrySuspect ? `⚠ Check entry — ${b.gstPctCharged}% isn't a realistic GST rate` : `${b.gstPctCharged}% charged vs correct ${b.gstPct}% = ${b.gstMismatchAmt>0?'+':''}₹${fmtMoney(b.gstMismatchAmt)}`) : '',
        billCopy: '', collectedBy:b.collectedBy||'', designation:b.designation||'', verifiedBy:b.verifiedBy||'', submissionStr:b.submissionStr,
      };
      cols.forEach((c,i)=>{ if(c.key!=='billCopy') row.getCell(i+1).value = vals[c.key]; });
      let photoEmbedded = false;
      if(bf){
        const isImageKind = bf.kind==='image' || EMBEDDABLE_EXT[(bf.ext||'').toLowerCase()];
        if(isImageKind){
          // Photos are embedded directly into the workbook — self-contained, single .xlsx,
          // no ZIP/Bills-folder needed, so Windows never flags it as "potentially harmful".
          if(!embeddedUids.has(b.billUid)){
            embeddedUids.add(b.billUid);
            const embedExt = EMBEDDABLE_EXT[(bf.ext||'').toLowerCase()] || 'jpeg';
            try{
              const base64 = (bf.dataUrl.split(',')[1]) || '';
              if(base64){
                const imgId = wb.addImage({ base64, extension: embedExt });
                ws.addImage(imgId, {
                  tl:{ col: billCopyColIdx + 0.06, row: (r-1) + 0.06 },
                  ext:{ width:88, height:66 },
                  editAs:'oneCell'
                });
                photoEmbedded = true;
                embeddedPhotoCount++;
              }
            }catch(imgErr){ console.error('embed image failed', imgErr); }
          }
        } else {
          // A PDF bill copy can't be embedded — fall back to a hyperlink that only
          // resolves once the exported ZIP is unzipped with its Bills folder intact.
          if(pdfBillUids.indexOf(b.billUid)===-1) pdfBillUids.push(b.billUid);
          const bcCell = row.getCell(billCopyColIdx+1);
          bcCell.value = { text:'📎 View PDF', hyperlink: `Bills/${bf.savedName}` };
          bcCell.font = {name:'Calibri', size:10, color:{argb:ACCENTINK}, underline:true};
        }
      }
      ['companyRate','companyRatePerPc','blendedRate','blendedRatePerPc','totalInvoiced','overchargeAmt','underchargeAmt','diffPerKg','diffPerPc','diffPerBag'].forEach(k=>{
        const idx = cols.findIndex(c=>c.key===k)+1;
        if(idx>0) row.getCell(idx).numFmt = '#,##0.00';
      });
      const GSTMISMATCHSOFT = 'FFF1E8FC';
      const GSTSUSPECTSOFT = 'FFFDF0DA';
      const fillColor = b.gstMismatch ? (b.gstEntrySuspect ? GSTSUSPECTSOFT : GSTMISMATCHSOFT) : (b.status==='over' ? DANGERSOFT : (b.status==='negligible' ? NEGLIGIBLESOFT : (b.status==='under' ? WARNSOFT : SUCCESSSOFT)));
      row.eachCell({includeEmpty:true}, cell=>{
        cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:fillColor}};
        cell.border = {bottom:{style:'hair', color:{argb:'FFD2C8AC'}}};
        if(!cell.font || !cell.font.underline) cell.font = {name:'Calibri', size:10, color:{argb:'FF1E2438'}};
      });
      const statusColorArgb = b.status==='over'?DANGER:(b.status==='negligible'?NEGLIGIBLE:(b.status==='under'?'FF9C6B12':'FF1E2438'));
      const cellByKey = (key)=>{ const idx = cols.findIndex(c=>c.key===key)+1; return idx>0 ? row.getCell(idx) : null; };
      const statusCell = cellByKey('statusLabel');
      if(statusCell) statusCell.font = {name:'Calibri', size:10, bold:true, color:{argb: statusColorArgb}};
      const pctCell = cellByKey('pctLabel');
      if(pctCell) pctCell.font = {name:'Calibri', size:10, bold:true, color:{argb: statusColorArgb}};
      const diffCell = cellByKey('diffAmountLabel');
      if(diffCell) diffCell.font = {name:'Calibri', size:10, bold:true, color:{argb: statusColorArgb}};
      const overCell = cellByKey('overchargeAmt');
      if(overCell && b.status==='over') overCell.font = {name:'Calibri', size:10, bold:true, color:{argb:DANGER}};
      const underCell = cellByKey('underchargeAmt');
      if(underCell && b.status==='under') underCell.font = {name:'Calibri', size:10, bold:true, color:{argb:'FF9C6B12'}};
      if(b.gstMismatch){
        const gstCell = cellByKey('gstMismatchLabel');
        if(gstCell){
          gstCell.font = {name:'Calibri', size:10, bold:true, color:{argb: b.gstEntrySuspect?'FF9C6B12':'FF9B59EB'}};
          gstCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb: b.gstEntrySuspect?'FFFDF0DA':'FFF1E8FC'}};
        }
      }
      row.height = photoEmbedded ? 54 : 18;
      r++;
    });

    ws.autoFilter = { from:{row:4,column:1}, to:{row:4,column:cols.length} };

    // Summary sheet
    const ws2 = wb.addWorksheet('Summary');
    ws2.columns = [{width:28},{width:18}];
    ws2.getCell('A1').value = 'RATE LEDGER — SUMMARY';
    ws2.getCell('A1').font = {size:13,bold:true,color:{argb:WHITE}};
    ws2.mergeCells('A1:B1'); ws2.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}};
    ws2.getRow(1).height=22;
    const underCount = rows.filter(r=>r.status==='under').length;
    const underAmt = rows.filter(r=>r.status==='under').reduce((s,b)=>s+(b.underchargeAmt||0),0);
    const negCount = rows.filter(r=>r.status==='negligible').length;
    const negAmt = rows.filter(r=>r.status==='negligible').reduce((s,b)=>s+(b.negligibleAmt||0),0);
    const byLoc = {};
    rows.forEach(b=>{ byLoc[b.location]=byLoc[b.location]||{total:0,over:0,overAmt:0,under:0,underAmt:0}; byLoc[b.location].total++;
      if(b.status==='over'){byLoc[b.location].over++; byLoc[b.location].overAmt+=(b.overchargeAmt||0);}
      if(b.status==='under'){byLoc[b.location].under++; byLoc[b.location].underAmt+=(b.underchargeAmt||0);} });
    let sr = 3;
    ws2.getCell(`A${sr}`).value='Total lines checked'; ws2.getCell(`B${sr}`).value=rows.length; sr++;
    ws2.getCell(`A${sr}`).value='Overcharge instances (≥1% of rate)'; ws2.getCell(`B${sr}`).value=overCount; sr++;
    ws2.getCell(`A${sr}`).value='Total overcharge value (₹)'; ws2.getCell(`B${sr}`).value=clamp2(overAmt); sr++;
    ws2.getCell(`A${sr}`).value='Undercharge instances'; ws2.getCell(`B${sr}`).value=underCount; sr++;
    ws2.getCell(`A${sr}`).value='Total undercharge value (₹)'; ws2.getCell(`B${sr}`).value=clamp2(underAmt); sr++;
    ws2.getCell(`A${sr}`).value='Negligible instances (<1% of rate)'; ws2.getCell(`B${sr}`).value=negCount; sr++;
    ws2.getCell(`A${sr}`).value='Total negligible value (₹, excluded from overcharge)'; ws2.getCell(`B${sr}`).value=clamp2(negAmt); sr+=2;
    ws2.getCell(`A${sr}`).value='Location'; ws2.getCell(`B${sr}`).value='Overcharge lines'; ws2.getCell(`C${sr}`).value='Undercharge lines';
    ws2.getRow(sr).eachCell(c=>{ c.font={bold:true,color:{argb:WHITE}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ACCENT}}; });
    sr++;
    Object.entries(byLoc).forEach(([loc,v])=>{ ws2.getCell(`A${sr}`).value=loc; ws2.getCell(`B${sr}`).value=v.over; ws2.getCell(`C${sr}`).value=v.under; sr++; });

    const buf = await wb.xlsx.writeBuffer();
    const stamp = new Date().toISOString().slice(0,10);

    if(pdfBillUids.length){
      // A PDF bill copy can't be embedded in the sheet, so it still needs the ZIP+hyperlink
      // fallback (photos above are already embedded directly and need no such thing).
      btn.innerHTML = `<span class="loader"></span> Packing PDF bill copies…`;
      const zip = new JSZip();
      zip.file(`Overinvoicing_Report_${stamp}.xlsx`, buf);
      const billsFolder = zip.folder('Bills');
      pdfBillUids.forEach(uid=>{
        const bf = STATE.billFiles[uid];
        const b64 = (bf.dataUrl.split(',')[1])||'';
        billsFolder.file(bf.savedName, b64, {base64:true});
      });
      const zipBlob = await zip.generateAsync({type:'blob'});
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url; a.download = `Overinvoicing_Report_${stamp}.zip`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      const photoNote = embeddedPhotoCount>0 ? ` (${embeddedPhotoCount} photo${embeddedPhotoCount===1?'':'s'} embedded directly, no unzip needed for ${embeddedPhotoCount===1?'it':'them'})` : '';
      toast(`Exported as ZIP — ${pdfBillUids.length} PDF bill${pdfBillUids.length===1?'':'s'} linked via the Bills folder${photoNote}. Right-click the ZIP → Properties → Unblock before extracting, so Windows doesn't flag the files.`, 'ok');
    } else {
      const blob = new Blob([buf], {type:'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `Overinvoicing_Report_${stamp}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast(embeddedPhotoCount>0 ? `Report exported — ${embeddedPhotoCount} bill photo${embeddedPhotoCount===1?'':'s'} embedded directly in the Excel file` : 'Report exported', 'ok');
    }
  }catch(err){
    console.error(err); toast('Export failed: '+err.message, 'err');
  }finally{
    btn.innerHTML = origText; btn.disabled = false;
  }
}

/* ---------------- Background: distributor-network field ---------------- */
/* A quiet constellation of drifting nodes with connecting lines when they're
   close — a visual echo of the DB→beat→retailer network this tool audits.
   Self-contained; never touches STATE. Respects prefers-reduced-motion. */
(function(){
  function start(){
    const canvas = document.getElementById('bgfx');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W=0, H=0, DPR = Math.min(window.devicePixelRatio||1, 2);
    let nodes = [];
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W*DPR; canvas.height = H*DPR;
      canvas.style.width = W+'px'; canvas.style.height = H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const count = Math.max(24, Math.min(70, Math.round((W*H)/26000)));
      nodes = Array.from({length:count}, ()=>({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.18, vy: (Math.random()-0.5)*0.18,
        r: 1 + Math.random()*1.6,
      }));
    }
    function step(){
      ctx.clearRect(0,0,W,H);
      // Node/line color adapts to the current theme so the field stays a
      // quiet background layer on both the dark and light themes.
      const isLight = document.documentElement.getAttribute('data-theme')==='light';
      const lineRGB = isLight ? '16,17,20' : '255,255,255';
      const dotFill = isLight ? 'rgba(16,17,20,0.35)' : 'rgba(230,230,235,0.6)';
      const dotGlow = isLight ? 'rgba(16,17,20,0.3)' : 'rgba(255,255,255,0.55)';
      const linkDist = Math.min(150, Math.max(110, W/9));
      for(let i=0;i<nodes.length;i++){
        const a = nodes[i];
        if(!reduced){
          a.x += a.vx; a.y += a.vy;
          if(a.x<0||a.x>W) a.vx*=-1;
          if(a.y<0||a.y>H) a.vy*=-1;
        }
        for(let j=i+1;j<nodes.length;j++){
          const b = nodes[j];
          const dx=a.x-b.x, dy=a.y-b.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist<linkDist){
            const op = (1 - dist/linkDist) * 0.16;
            ctx.strokeStyle = `rgba(${lineRGB},${op})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      for(const n of nodes){
        ctx.beginPath();
        ctx.fillStyle = dotFill;
        ctx.shadowColor = dotGlow;
        ctx.shadowBlur = 4;
        ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      if(!reduced) requestAnimationFrame(step);
    }
    resize();
    step();
    window.addEventListener('resize', resize);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

/* ---------------- Login gate ---------------- */
function renderLoginGate(errorMsg){
  const app = $('#app');
  app.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div class="card" style="max-width:380px;width:100%;padding:32px 28px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div class="brand-mark">RL</div>
          <div>
            <h1 style="font-size:19px;">Rate Ledger</h1>
            <p class="small-muted" style="margin-top:2px;">Sign in to continue</p>
          </div>
        </div>
        <div class="field"><label>User Code</label><input type="text" id="loginCode" autocomplete="username" style="text-transform:uppercase;"></div>
        <div class="field"><label>PIN</label>
          <div class="verifier-code-wrap" style="flex:none;">
            <input type="password" id="loginPin" autocomplete="current-password" style="width:100%;">
            <button type="button" class="eye-toggle" id="loginPinEye" tabindex="-1" title="Show/hide PIN">👁</button>
          </div>
        </div>
        <label class="gst-toggle" style="margin:2px 0 14px;"><input type="checkbox" id="loginRemember" checked> Remember me on this device</label>
        ${errorMsg ? `<p style="color:var(--danger);font-size:12.5px;margin:-6px 0 12px;">${esc(errorMsg)}</p>` : ''}
        <button class="btn accent wide" id="loginBtn">Log In</button>
        <p class="small-muted" style="margin-top:16px;text-align:center;">Ask your Admin for a User Code and PIN.</p>
      </div>
    </div>
  `;
  const doLogin = async ()=>{
    const code = $('#loginCode').value.trim();
    const pin = $('#loginPin').value;
    const remember = $('#loginRemember').checked;
    if(!code || !pin){ renderLoginGate('Enter both User Code and PIN.'); return; }
    const btn = $('#loginBtn'); btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Signing in…';
    try{
      const res = await backendPost({ action:'login', code, pin });
      if(res.ok){
        setSession({ code:res.code, pin, name:res.name, role:res.role, designation:res.designation }, remember);
        boot();
      } else {
        renderLoginGate(res.error || 'Login failed.');
      }
    }catch(err){
      renderLoginGate('Could not reach the server — check your internet connection and try again.');
    }
  };
  $('#loginBtn').addEventListener('click', doLogin);
  $('#loginPin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  const loginEye = $('#loginPinEye');
  if(loginEye) loginEye.addEventListener('click', ()=>{
    const pinEl = $('#loginPin');
    const showing = pinEl.type==='text';
    pinEl.type = showing ? 'password' : 'text';
    loginEye.textContent = showing ? '👁' : '🙈';
  });
  $('#loginCode').focus();
}
function logout(){
  clearSession();
  boot();
}

/* ---------------- Boot ---------------- */
async function boot(){
  if(backendConfigured() && !getSession()){
    renderLoginGate();
    return;
  }
  renderShell();
  switchTab('dashboard');
  if(backendConfigured() && getSession()){
    backendGet({action:'verifiers'}).then(res=>{
      if(res.ok){ STATE.verifiersList = res.verifiers; if(STATE.billForm) renderRateCheck(); }
    }).catch(()=>{});
    retryPendingSubmissions(true);
  }
}

/* ---------------- Init ---------------- */
document.addEventListener('DOMContentLoaded', ()=>{
  boot();
  // one delegated listener for every combo box (DB search, product search) —
  // closes any open results dropdown when the user clicks elsewhere.
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.combo')){
      $all('.combo-host').forEach(r=>r.innerHTML='');
    }
  });
});

</script>
