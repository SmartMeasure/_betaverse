          <span class="tag">📎 ${esc(f.billCopy.fileName)}</span>
          <button type="button" class="icon-btn" id="rcBillCopyClear" title="Remove attachment">✕</button>
        </div>` : `
        <div class="dropzone" id="rcBillCopyZone" style="padding:14px;">
          <label class="dz-btn" style="margin-top:0;">Attach bill copy<input type="file" id="rcBillCopyInput" accept="image/*,.pdf"></label>
          <div class="dz-hint">Photo or scan of this invoice/hand bill</div>
        </div>`}
    </div>

    <div class="section-title">Products on this bill</div>
    <div id="rcLineItems"></div>
    <button class="btn secondary small" id="rcAddLine" style="margin-top:10px;">+ Add product</button>

    <div class="divider"></div>
    <div style="display:flex;gap:12px;align-items:center;">
      <button class="btn accent" id="rcSaveBill">Save bill to report</button>
      <button class="btn secondary" id="rcResetBill">Clear form</button>
      <span class="small-muted" id="rcSaveErr" style="color:var(--danger);"></span>
    </div>
  `;

  wireDbCombo();
  const beatSel = $('#rcBeatSelect');
  if(beatSel) beatSel.addEventListener('change', e=>{
    const b = f.beats[Number(e.target.value)];
    if(b){ f.beatCode = b.code; f.beatName = b.name; }
  });
  $all('#rcBillType .pill-opt').forEach(p=>p.addEventListener('click', ()=>{ f.billType=p.dataset.billtype; renderRateCheck(); }));
  $('#rcRetailer').addEventListener('input', e=> f.retailer=e.target.value);
  $('#rcBillNo').addEventListener('input', e=> f.billNo=e.target.value);
  $('#rcBillDate').addEventListener('change', e=>{ f.billDateISO=e.target.value; const q=$('#rcBillDateQuick'); if(q){ q.value=''; q.classList.remove('quick-ok','quick-bad'); } recomputeAllLineRates(); renderLineItems(); });
  const rcQuick = $('#rcBillDateQuick');
  if(rcQuick) rcQuick.addEventListener('input', e=>{
    e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
    e.target.classList.remove('quick-ok','quick-bad');
    if(e.target.value.length===6){
      const iso = ddmmyyToISO(e.target.value);
      if(iso){
        f.billDateISO = iso;
        $('#rcBillDate').value = iso;
        e.target.classList.add('quick-ok');
        recomputeAllLineRates(); renderLineItems();
      } else {
        e.target.classList.add('quick-bad');
      }
    }
  });
  $('#rcCollectedBy').addEventListener('input', e=> f.collectedBy=e.target.value);
  $('#rcSubDate').addEventListener('change', e=> f.submissionISO=e.target.value);
  const bcInput = $('#rcBillCopyInput');
  if(bcInput) bcInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 8*1024*1024){ toast('Bill copy is larger than 8MB — please attach a smaller file', 'err'); return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
      f.billCopy = { fileName: file.name, ext, dataUrl: ev.target.result };
      renderRateCheck();
    };
    reader.onerror = ()=> toast('Could not read that file', 'err');
    reader.readAsDataURL(file);
  });
  const bcClear = $('#rcBillCopyClear');
  if(bcClear) bcClear.addEventListener('click', ()=>{ f.billCopy = null; renderRateCheck(); });
  $('#rcAddLine').addEventListener('click', ()=>{ f.lineItems.push(emptyLineItem()); renderLineItems(); });
  $('#rcSaveBill').addEventListener('click', saveBill);
  $('#rcResetBill').addEventListener('click', ()=>{ STATE.billForm = freshBillForm(); renderRateCheck(); });

  renderLineItems();
  if(f.lineItems.length===0){ f.lineItems.push(emptyLineItem()); renderLineItems(); }
}

function emptyLineItem(){ return {productCode:'', productName:'', sku:'', category:'', companyRate:null, gstPct:null, invoiceRate:'', qty:'', uom:'KG'}; }

function wireDbCombo(){
  const input = $('#rcDbCode');
  const results = $('#rcDbResults');
  function showResults(q){
    if(!q){ results.innerHTML=''; return; }
    const ql = q.toLowerCase();
    const hits = STATE.dbMaster.filter(d=> d.code.toLowerCase().includes(ql) || d.name.toLowerCase().includes(ql)).slice(0,25);
    if(!hits.length){ results.innerHTML = `<div class="combo-results"><div class="combo-empty">No DB matches "${esc(q)}"</div></div>`; return; }
    results.innerHTML = `<div class="combo-results">${hits.map(h=>`<div class="combo-item" data-pick="${esc(h.code)}"><div class="ci-name">${esc(h.name)} ${isInactiveStatus(h.active)?'<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Inactive</span>':''}</div><div class="ci-meta">Code ${esc(h.code)} · PG ${esc(h.pg)}${h.beats&&h.beats.length?(' · '+h.beats.length+' beat'+(h.beats.length>1?'s':'')):''}</div></div>`).join('')}</div>`;
    $all('[data-pick]', results).forEach(item=>item.addEventListener('click', ()=>{
      pickDb(item.dataset.pick); results.innerHTML='';
    }));
  }
  input.addEventListener('input', e=> showResults(e.target.value));
  input.addEventListener('focus', e=> showResults(e.target.value));
}
function pickDb(code){
  const f = STATE.billForm;
  const db = STATE.dbMaster.find(d=>d.code===code);
  if(!db) return;
  f.dbCode = db.code; f.dbName = db.name; f.pg = db.pg;
  f.location = locationForPG(db.pg) || '';
  f.active = db.active || '';
  const override = STATE.beatSoMap[db.code];
  if(override){
    f.so = override.so||''; f.asm = override.asm||''; f.rsm = override.rsm||'';
    f.beats = (override.beat||override.beatName) ? [{code:override.beat||'', name:override.beatName||''}] : [];
  } else {
    f.so = db.so||''; f.asm = db.asm||''; f.rsm = db.rsm||'';
    f.beats = db.beats || [];
  }
  const defaultBeat = f.beats[0] || {code:'', name:''};
  f.beatCode = defaultBeat.code; f.beatName = defaultBeat.name;
  recomputeAllLineRates();
  renderRateCheck();
}
function isInactiveStatus(v){ return /inactive/i.test(String(v||'')); }
function dbStatusBadge(v){
  if(!v) return '<span class="small-muted">—</span>';
  return isInactiveStatus(v) ? `<span class="badge under">Inactive</span>` : `<span class="badge match">Active</span>`;
}

function applicableRateRow(productCode){
  const f = STATE.billForm;
  if(!f.location || !f.billDateISO) return null;
  const billDate = isoToDMYDate(f.billDateISO);
  const candidates = STATE.rateRows.filter(r=> r.location===f.location && r.productCode===productCode && r.effDate<=billDate);
  if(!candidates.length) return null;
  candidates.sort((a,b)=> b.effDate - a.effDate);
  return candidates[0];
}
function recomputeAllLineRates(){
  const f = STATE.billForm;
  f.lineItems.forEach(li=>{
    if(!li.productCode) return;
    const rr = applicableRateRow(li.productCode);
    li.companyRate = rr ? rr.rate : null;
    li.gstPct = rr ? rr.gstPct : null;
    li.category = rr ? rr.category : li.category;
  });
}

function renderLineItems(){
  const f = STATE.billForm;
  const div = $('#rcLineItems');
  div.innerHTML = `
    <table class="li-table">
      <thead><tr><th style="width:26%;">Product</th><th>Category</th><th class="num">Company Rate<br><span class="small-muted" style="text-transform:none;">₹/kg incl. GST</span></th><th class="num">Invoice Rate<br><span class="small-muted" style="text-transform:none;">₹/kg incl. GST</span></th><th>Qty</th><th class="num">Diff<br><span class="small-muted" style="text-transform:none;">₹/kg</span></th><th>Status</th><th class="num">Total ₹</th><th></th></tr></thead>
      <tbody>
        ${f.lineItems.map((li,i)=>renderLineRow(li,i)).join('')}
      </tbody>
    </table>
  `;
  f.lineItems.forEach((li,i)=>{
    const searchInput = $(`#liSearch${i}`);
    const resultsDiv = $(`#liResults${i}`);
    if(!searchInput) return;
    searchInput.addEventListener('input', e=> showProductResults(i, e.target.value));
    searchInput.addEventListener('focus', e=> showProductResults(i, e.target.value));
    const invRate = $(`#liInvRate${i}`);
    if(invRate) invRate.addEventListener('input', e=>{ li.invoiceRate = e.target.value; updateLineDiff(i); });
    const qty = $(`#liQty${i}`);
    if(qty) qty.addEventListener('input', e=>{ li.qty = e.target.value; updateLineDiff(i); });
    const uomSel = $(`#liUom${i}`);
    if(uomSel) uomSel.addEventListener('change', e=>{ li.uom = e.target.value; updateLineDiff(i); });
    const rm = $(`#liRemove${i}`);
    if(rm) rm.addEventListener('click', ()=>{ f.lineItems.splice(i,1); renderLineItems(); });
  });
}
function renderLineRow(li,i){
  const diff = lineDiff(li);
  const status = lineStatus(li);
  const qtyKg = qtyToKg(li);
  const total = lineTotal(li);
  const uomOpts = uomOptionsForProduct(li.productCode);
  const totalColor = total==null?'inherit':(total>0.004?'var(--danger)':(total<-0.004?'var(--warn)':'var(--success)'));
  return `<tr>
    <td class="combo">
      <input type="text" class="prodsearch" id="liSearch${i}" placeholder="Search product name or code…" value="${esc(li.productName ? li.productName+(li.sku?(' — '+li.sku):'') : '')}">
      <div id="liResults${i}" class="combo-host"></div>
    </td>
    <td>${esc(li.category||'—')}</td>
    <td class="num">${li.companyRate!=null?fmtMoney(li.companyRate):'—'}</td>
    <td><input type="number" step="0.01" id="liInvRate${i}" value="${esc(li.invoiceRate)}" placeholder="0.00" ${!li.productCode?'disabled':''}></td>
    <td>
      <div style="display:flex;gap:4px;">
        <input type="number" step="0.01" id="liQty${i}" value="${esc(li.qty)}" placeholder="qty" style="width:64px;">
        ${uomOpts.length>1 ? `<select id="liUom${i}" style="width:auto;">${uomOpts.map(o=>`<option value="${esc(o.value)}" ${(li.uom||'KG')===o.value?'selected':''}>${esc(o.value)}</option>`).join('')}</select>` : `<span class="small-muted" style="align-self:center;">kg</span>`}
      </div>
      <div class="small-muted" id="liQtyKgHint${i}">${(qtyKg!=null && (li.uom||'KG')!=='KG') ? ('= '+qtyKg+' kg') : ''}</div>
    </td>
    <td class="num" id="liDiff${i}" style="font-weight:700;color:${diff==null?'inherit':(diff>0.004?'var(--danger)':(diff<-0.004?'var(--warn)':'var(--success)'))}">${diff==null?'—':(diff>0?'+':'')+clamp2(diff)}</td>
    <td id="liStatus${i}">${statusBadge(status)}</td>
    <td class="num" id="liTotal${i}" style="font-weight:700;color:${totalColor};">${total==null?'—':(total>0?'+':(total<0?'-':''))+'₹'+fmtMoney(Math.abs(total))}</td>
    <td><button class="icon-btn" id="liRemove${i}" title="Remove">✕</button></td>
  </tr>`;
}
function lineDiff(li){
  if(li.companyRate==null || li.invoiceRate===''||li.invoiceRate==null) return null;
  return clamp2(Number(li.invoiceRate) - Number(li.companyRate));
}
function lineStatus(li){
  const d = lineDiff(li);
  if(d==null) return null;
  if(d>0.004) return 'over'; if(d<-0.004) return 'under'; return 'match';
}
function lineTotal(li){
  const d = lineDiff(li);
  const qkg = qtyToKg(li);
  if(d==null || qkg==null) return null;
  return clamp2(d*qkg);
}
function statusBadge(status){
  if(!status) return '<span class="small-muted">—</span>';
  if(status==='over') return '<span class="badge over">Overcharge</span>';
  if(status==='under') return '<span class="badge under">Undercharge</span>';
  return '<span class="badge match">Match</span>';
}
function updateLineDiff(i){
  const f = STATE.billForm;
  // re-render just this row's computed cells without losing focus on whichever input the user is typing in.
  const li = f.lineItems[i];
  const d = lineDiff(li); const status = lineStatus(li);
  const qtyKg = qtyToKg(li); const total = lineTotal(li);
  const diffCell = $(`#liDiff${i}`);
  const statusCell = $(`#liStatus${i}`);
  const totalCell = $(`#liTotal${i}`);
  const hintEl = $(`#liQtyKgHint${i}`);
  if(diffCell){
    diffCell.textContent = d==null?'—':(d>0?'+':'')+clamp2(d);
    diffCell.style.color = d==null?'inherit':(d>0.004?'var(--danger)':(d<-0.004?'var(--warn)':'var(--success)'));
  }
  if(statusCell) statusCell.innerHTML = statusBadge(status);
  if(totalCell){
    totalCell.textContent = total==null?'—':(total>0?'+':(total<0?'-':''))+'₹'+fmtMoney(Math.abs(total));
    totalCell.style.color = total==null?'inherit':(total>0.004?'var(--danger)':(total<-0.004?'var(--warn)':'var(--success)'));
  }
  if(hintEl) hintEl.textContent = (qtyKg!=null && (li.uom||'KG')!=='KG') ? ('= '+qtyKg+' kg') : '';
}


function showProductResults(i, q){
  const f = STATE.billForm;
  const resultsDiv = $(`#liResults${i}`);
  if(!f.location){ resultsDiv.innerHTML = `<div class="combo-results"><div class="combo-empty">Pick a DB first so we know the location</div></div>`; return; }
  if(!q){ resultsDiv.innerHTML=''; return; }
  const billDate = isoToDMYDate(f.billDateISO);
  const ql = q.toLowerCase();
  let pool = STATE.rateRows.filter(r=> r.location===f.location && r.effDate<=billDate);
  // keep only the latest effective row per product code
  const latestByCode = {};
  pool.forEach(r=>{ if(!latestByCode[r.productCode] || r.effDate>latestByCode[r.productCode].effDate) latestByCode[r.productCode]=r; });
  let hits = Object.values(latestByCode).filter(r=> r.productName.toLowerCase().includes(ql) || r.productCode.includes(q));
  hits = hits.slice(0,25);
  if(!hits.length){ resultsDiv.innerHTML = `<div class="combo-results"><div class="combo-empty">No product matches "${esc(q)}" for ${esc(f.location)} on this bill date</div></div>`; return; }
  resultsDiv.innerHTML = `<div class="combo-results">${hits.map(h=>{
    const u = STATE.uomMap[h.productCode];
    const packInfo = u ? ` · Pack ${esc(u.packSize||(u.kgPerPc+' kg'))}${u.kgPerBag?(' · 1 BAG='+u.kgPerBag+'kg'):''}` : '';
    return `<div class="combo-item" data-pickprod="${esc(h.productCode)}"><div class="ci-name">${esc(h.productName)} <span class="tag">${esc(h.sku)}</span></div><div class="ci-meta">Code ${esc(h.productCode)} · ₹${fmtMoney(h.rate)}/kg incl. GST${h.gstPct}% · ${esc(h.category)}${packInfo}</div></div>`;
  }).join('')}</div>`;
  $all('[data-pickprod]', resultsDiv).forEach(item=>item.addEventListener('click', ()=>{
    const code = item.dataset.pickprod;
    const rr = latestByCode[code];
    const li = f.lineItems[i];
    li.productCode = rr.productCode; li.productName = rr.productName; li.sku = rr.sku; li.category = rr.category;
    li.companyRate = rr.rate; li.gstPct = rr.gstPct; li.uom = 'KG';
    resultsDiv.innerHTML = '';
    renderLineItems();
  }));
}

function saveBill(){
  const f = STATE.billForm;
  const errEl = $('#rcSaveErr');
  errEl.textContent = '';
  if(!f.dbCode){ errEl.textContent = 'Pick a DB code first.'; return; }
  if(!f.location){ errEl.textContent = "This DB's location could not be resolved — fix the Price Group Mapping."; return; }
  if(!f.retailer.trim()){ errEl.textContent = 'Retailer / outlet name is required.'; return; }
  if(!f.billDateISO){ errEl.textContent = 'Bill date is required.'; return; }
  const validLines = f.lineItems.filter(li=> li.productCode && li.invoiceRate!=='' && li.invoiceRate!=null);
  if(!validLines.length){ errEl.textContent = 'Add at least one product with an invoice rate.'; return; }

  const billUid = uid('bill');
  const billDate = isoToDMYDate(f.billDateISO);
  const subDate = isoToDMYDate(f.submissionISO);
  if(f.billCopy){
    const savedName = `Bill_${billUid.replace('bill_','')}.${f.billCopy.ext.replace(/[^a-z0-9]/gi,'')||'jpg'}`;
    STATE.billFiles[billUid] = { fileName: f.billCopy.fileName, ext: f.billCopy.ext, dataUrl: f.billCopy.dataUrl, savedName };
  }
  validLines.forEach(li=>{
    const diff = lineDiff(li);
    const status = lineStatus(li);
    const qty = li.qty!=='' && li.qty!=null ? Number(li.qty) : null;
    const uom = li.uom || 'KG';
    const qtyKg = qtyToKg(li);
    const chargeAmt = qtyKg!=null ? clamp2(diff*qtyKg) : diff;
    STATE.bills.push({
      sl: BILL_SEQ++, billUid,
      dbCode: f.dbCode, dbName: f.dbName, pg: f.pg, location: f.location,
      beatCode: f.beatCode, beatName: f.beatName, so: f.so, asm: f.asm, rsm: f.rsm, dbActive: f.active,
      billType: f.billType, retailer: f.retailer, billNo: f.billNo, billDateStr: fmtDMY(billDate),
      productName: li.productName, productCode: li.productCode, sku: li.sku, category: li.category,
      companyRate: li.companyRate, invoiceRate: Number(li.invoiceRate), gstPct: li.gstPct,
      diff, status, qty, uom, qtyKg, chargeAmt,
      overchargeAmt: status==='over' ? chargeAmt : 0,
      underchargeAmt: status==='under' ? clamp2(Math.abs(chargeAmt)) : 0,
      collectedBy: f.collectedBy, submissionStr: fmtDMY(subDate),
    });
  });
  toast(`Saved bill with ${validLines.length} product line(s)`, 'ok');
  const keepHeader = { ...f, lineItems: [] };
  keepHeader.retailer=''; keepHeader.billNo=''; keepHeader.lineItems=[emptyLineItem()]; keepHeader.billCopy=null;
  STATE.billForm = keepHeader;
  renderRateCheck();
  renderStatusStrip();
}

function filteredBills(){
  let rows = STATE.bills;
  if(REP_FILTERS.location) rows = rows.filter(b=>b.location===REP_FILTERS.location);
  if(REP_FILTERS.db) rows = rows.filter(b=>b.dbName===REP_FILTERS.db);
  if(REP_FILTERS.billType) rows = rows.filter(b=>b.billType===REP_FILTERS.billType);
  if(REP_FILTERS.status) rows = rows.filter(b=>b.status===REP_FILTERS.status);
  if(REP_FILTERS.from){ const f=isoToDMYDate(REP_FILTERS.from); rows = rows.filter(b=>parseDMY(b.billDateStr)>=f); }
  if(REP_FILTERS.to){ const t=isoToDMYDate(REP_FILTERS.to); rows = rows.filter(b=>parseDMY(b.billDateStr)<=t); }
  if(REP_FILTERS.q){
    const q = REP_FILTERS.q.toLowerCase();
    rows = rows.filter(b=> (b.retailer||'').toLowerCase().includes(q) || (b.billNo||'').toLowerCase().includes(q) || (b.productName||'').toLowerCase().includes(q) || (b.dbName||'').toLowerCase().includes(q));
  }
  return rows;
}

function qtyDisplay(b){
  if(b.qty==null) return '—';
  if((b.uom||'KG')==='KG') return `${b.qty} kg`;
  return `${b.qty} ${b.uom}${b.qtyKg!=null?` (${b.qtyKg} kg)`:''}`;
}
function billCopyCell(b){
  const bf = STATE.billFiles[b.billUid];

  return `<a href="#" class="bill-copy-link" data-view-bill="${esc(b.billUid)}" style="color:var(--cyan);font-weight:600;text-decoration:underline;">📎 View</a>`;
}
function renderReportTable(){
  const rows = filteredBills();
  const statsDiv = $('#repStats');
  const overRows = rows.filter(b=>b.status==='over');
  const underRows = rows.filter(b=>b.status==='under');
  const overAmt = overRows.reduce((s,b)=>s+(b.overchargeAmt||0),0);
  const underAmt = underRows.reduce((s,b)=>s+(b.underchargeAmt||0),0);
  const matchCount = rows.filter(b=>b.status==='match').length;
  statsDiv.innerHTML = `<div class="grid-4" style="margin-bottom:18px;">
    <div class="stat-card"><div class="stat-label">Lines shown</div><div class="stat-value" id="cuLinesShown">0</div></div>

  countUp($('#cuLinesShown'), rows.length);

  countUp($('#cuUnderLines'), underRows.length);
  countUp($('#cuMatchLines'), matchCount);
  const wrap = $('#repTableWrap');
  if(!rows.length){ wrap.innerHTML = emptyState('🧾','No bills checked yet','Run a check in the Rate Check tab, or clear filters.'); return; }
  wrap.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>

      <th>Product</th><th>Code</th><th class="num">Company Rate<br><span style="text-transform:none;">₹/kg</span></th><th class="num">Invoice Rate<br><span style="text-transform:none;">₹/kg</span></th><th class="num">Difference<br><span style="text-transform:none;">₹/kg</span></th>

      <th>Bill Copy</th><th>Collected By</th><th>Submitted</th><th></th>
    </tr></thead>
    <tbody>${rows.map((b,idx)=>`<tr class="${b.status==='over'?'row-over':''}">
      <td>${b.sl}</td><td style="font-family:var(--font-mono);">${esc(b.dbCode)}</td><td class="wrap">${esc(b.dbName)}</td><td>${esc(b.location)}</td>
      <td style="font-family:var(--font-mono);">${esc(b.beatCode||'—')}</td><td class="wrap">${esc(b.beatName||'—')}</td>
      <td>${esc(b.so||'—')}</td><td>${esc(b.asm||'—')}</td><td>${esc(b.rsm||'—')}</td><td>${dbStatusBadge(b.dbActive)}</td>
      <td class="wrap">${esc(b.retailer)}</td><td>${esc(b.billType)}</td>

      <td class="num" style="font-weight:700;color:${b.diff>0.004?'var(--danger)':(b.diff<-0.004?'var(--warn)':'var(--success)')}">${b.diff>0?'+':''}${clamp2(b.diff)}</td>

      <td>${statusBadge(b.status)}</td>
      <td class="num" style="font-weight:700;color:var(--danger);">${b.status==='over'?'₹'+fmtMoney(b.overchargeAmt):'—'}</td>

    </tr>`).join('')}</tbody>
  </table></div>`;
  $all('[data-del-bill]', wrap).forEach(btn=>btn.addEventListener('click', ()=>{

    renderReportTable(); renderStatusStrip();
  }));
  $all('[data-view-bill]', wrap).forEach(a=>a.addEventListener('click', (e)=>{
    e.preventDefault();
    const bf = STATE.billFiles[a.dataset.viewBill];
    if(!bf) return;
    try{

  }));
}
function dataUrlToBlob(dataUrl){
  const m = dataUrl.match(/^data:(.*?);base64,(.*)$/);
  if(!m) throw new Error('bad data url');
  const mime = m[1], b64 = m[2];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime||'application/octet-stream'});
}

/* ---------------- Background: distributor-network field ---------------- */
/* A quiet constellation of drifting nodes with connecting lines when they're
   close — a visual echo of the DB→beat→retailer network this tool audits.
   Self-contained; never touches STATE. Respects prefers-reduced-motion. */
(function(){
  function start(){
    const canvas = document.getElementById('bgfx');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W=0, H=0, DPR = Math.min(window.devicePixelRatio||1, 2);
    let nodes = [];
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W*DPR; canvas.height = H*DPR;
      canvas.style.width = W+'px'; canvas.style.height = H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const count = Math.max(24, Math.min(70, Math.round((W*H)/26000)));
      nodes = Array.from({length:count}, ()=>({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.18, vy: (Math.random()-0.5)*0.18,
        r: 1 + Math.random()*1.6,
      }));
    }
    function step(){
      ctx.clearRect(0,0,W,H);
      // Node/line color adapts to the current theme so the field stays a
      // quiet background layer on both the dark and light themes.
      const isLight = document.documentElement.getAttribute('data-theme')==='light';
      const lineRGB = isLight ? '16,17,20' : '255,255,255';
      const dotFill = isLight ? 'rgba(16,17,20,0.35)' : 'rgba(230,230,235,0.6)';
      const dotGlow = isLight ? 'rgba(16,17,20,0.3)' : 'rgba(255,255,255,0.55)';
      const linkDist = Math.min(150, Math.max(110, W/9));
      for(let i=0;i<nodes.length;i++){
        const a = nodes[i];
        if(!reduced){
          a.x += a.vx; a.y += a.vy;
          if(a.x<0||a.x>W) a.vx*=-1;
          if(a.y<0||a.y>H) a.vy*=-1;
        }
        for(let j=i+1;j<nodes.length;j++){
          const b = nodes[j];
          const dx=a.x-b.x, dy=a.y-b.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist<linkDist){
            const op = (1 - dist/linkDist) * 0.16;
            ctx.strokeStyle = `rgba(${lineRGB},${op})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }
      for(const n of nodes){
        ctx.beginPath();
        ctx.fillStyle = dotFill;
        ctx.shadowColor = dotGlow;
        ctx.shadowBlur = 4;
        ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      if(!reduced) requestAnimationFrame(step);
    }
    resize();
    step();
    window.addEventListener('resize', resize);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
