async function handleBeatSoFile(file){
  try{
    const wb = await readWorkbookFile(file);
    // let user pick sheet if multiple non-trivial sheets
    const mapDiv = $('#s4mapper');
    if(wb.SheetNames.length>1){
      mapDiv.innerHTML = `<div class="field"><label>Choose sheet</label><select id="s4sheet">${wb.SheetNames.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
        <button class="btn secondary small" id="s4sheetGo">Use this sheet</button>`;
      $('#s4sheetGo').addEventListener('click', ()=> processBeatSoSheet(wb.Sheets[$('#s4sheet').value], file.name, mapDiv));
    } else {
      processBeatSoSheet(wb.Sheets[wb.SheetNames[0]], file.name, mapDiv);
    }
  }catch(err){ console.error(err); toast('Could not read file: '+err.message, 'err'); }
}

function processBeatSoSheet(ws, fileName, mapDiv){
  const rows = sheetToRows(ws);
  // detect repeated "code" header columns -> month-block mode
  let headerRowIdx = -1, codeColIdxs = [];
  for(let r=0;r<Math.min(rows.length,6);r++){
    const hits = [];
    rows[r].forEach((cell,ci)=>{ if(/code/i.test(String(cell||'')) ) hits.push(ci); });
    if(hits.length>=1){ headerRowIdx=r; codeColIdxs=hits; break; }
  }
  if(headerRowIdx===-1){ toast('Could not find a header row with a Code column', 'err'); return; }
  const header = rows[headerRowIdx];

  if(codeColIdxs.length>1){
    // block mode: figure block width from spacing between consecutive code columns
    const blocks = codeColIdxs.map((startCol, bi)=>{
      const endCol = bi+1<codeColIdxs.length ? codeColIdxs[bi+1] : header.length;
      const nameCol = findInRange(header, startCol, endCol, /name|party/i);
      const asmCol = findInRange(header, startCol, endCol, /asm|bd/i);
      const soCol = findInRange(header, startCol, endCol, /tso|rso|so\b|ase/i);
      const beatCol = findInRange(header, startCol, endCol, /beat/i);
      return {startCol, endCol, codeCol:startCol, nameCol, asmCol, soCol, beatCol};
    });
    const map = {};
    for(let r=headerRowIdx+1;r<rows.length;r++){
      const row = rows[r];
      let code=null, name=null, asm=null, so=null, beat=null;
      blocks.forEach(b=>{
        const cd = row[b.codeCol];
        if(cd!=null && String(cd).trim()!==''){
          code = String(cd).trim();
          if(b.nameCol>=0 && row[b.nameCol]) name = String(row[b.nameCol]).trim();
          if(b.asmCol>=0 && row[b.asmCol]) asm = String(row[b.asmCol]).trim();
          if(b.soCol>=0 && row[b.soCol]) so = String(row[b.soCol]).trim();
          if(b.beatCol>=0 && row[b.beatCol]) beat = String(row[b.beatCol]).trim();
        }
      });
      if(code) map[code] = {name: name||'', asm: asm||'', so: so||'', beat: beat||''};
    }
    STATE.beatSoMap = map; STATE.beatSoFile = fileName; STATE.beatSoAuto = false;
    toast(`Loaded Beat/SO mapping for ${Object.keys(map).length} DBs (${blocks.length} month-blocks detected, using latest)`, 'ok');
    renderStep4(); renderStatusStrip();
  } else {
    // flat mode: use column mapper UI
    const dataRows = rows.slice(headerRowIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
    renderColumnMapper(mapDiv, header, dataRows, [
      {key:'code', label:'DB Code', required:true, patterns:[/code/i]},
      {key:'name', label:'DB Name', required:false, patterns:[/name|party/i]},
      {key:'beat', label:'Beat', required:false, patterns:[/beat/i]},
      {key:'so', label:'SO / ASM / ASE', required:false, patterns:[/tso|rso|so\b|ase/i]},
      {key:'asm', label:'ASM / BD', required:false, patterns:[/asm|bd/i]},
    ], (map)=>{
      const out = {};
      dataRows.forEach(r=>{
        const code = map.code>=0 ? String(r[map.code]).trim() : '';
        if(!code) return;
        out[code] = {
          name: map.name>=0 ? String(r[map.name]||'').trim() : '',
          beat: map.beat>=0 ? String(r[map.beat]||'').trim() : '',
          so: map.so>=0 ? String(r[map.so]||'').trim() : '',
          asm: map.asm>=0 ? String(r[map.asm]||'').trim() : '',
        };
      });
      STATE.beatSoMap = out; STATE.beatSoFile = fileName; STATE.beatSoAuto = false;
      toast(`Loaded Beat/SO mapping for ${Object.keys(out).length} DBs`, 'ok');
      renderStep4(); renderStatusStrip();
    });
  }
}
function findInRange(header, start, end, pattern){
  for(let i=start;i<end;i++){ if(pattern.test(String(header[i]||''))) return i; }
  return -1;
}

  `;

async function handleUomFile(file){
  try{
    const wb = await readWorkbookFile(file);
    const shName = wb.SheetNames[0];
    const rows = sheetToRows(wb.Sheets[shName]);
    let headerIdx = findHeaderRowIndex(rows, [/product\s*code/i, /pack\s*size/i]);
    let headers, dataRows;
    if(headerIdx===-1){ headers = rows[0].map(()=>''); dataRows = rows.filter(r=>r.some(c=>String(c).trim()!=='')); }
    else { headers = rows[headerIdx]; dataRows = rows.slice(headerIdx+1).filter(r=>r.some(c=>String(c).trim()!=='')); }
    const mapDiv = $('#s5mapper');
    renderColumnMapper(mapDiv, headers, dataRows, [
      {key:'code', label:'Product Code', required:true, patterns:[/product\s*code/i,/\bcode\b/i]},
      {key:'name', label:'Product Name', required:false, patterns:[/product\s*name/i,/\bname\b/i]},
      {key:'category', label:'Category', required:false, patterns:[/category/i]},
      {key:'packSize', label:'Pack Size', required:false, patterns:[/pack\s*size/i]},
      {key:'kgPerPc', label:'1 PC = ? KG', required:true, patterns:[/pc\s*kg/i,/per\s*pc/i,/1\s*pc/i]},
      {key:'kgPerBag', label:'1 BAG = ? KG', required:false, patterns:[/bag\s*kg/i,/per\s*bag/i,/1\s*bag/i]},
    ], (map)=>{
      const g = (r,k)=> map[k]>=0 ? String(r[map[k]]==null?'':r[map[k]]).trim() : '';
      const out = {};
      dataRows.forEach(r=>{
        const code = String(r[map.code]==null?'':r[map.code]).trim();
        if(!code || code==='undefined') return;
        const kgPerPc = parseFloat(g(r,'kgPerPc'));
        const kgPerBag = parseFloat(g(r,'kgPerBag'));
        out[code] = {
          name: g(r,'name'), category: g(r,'category'), packSize: g(r,'packSize'),
          kgPerPc: isNaN(kgPerPc)?null:kgPerPc,
          kgPerBag: isNaN(kgPerBag)?null:kgPerBag,
        };
      });
      STATE.uomMap = out; STATE.uomMapFile = file.name;
      toast(`Loaded UOM conversion for ${Object.keys(out).length} products`, 'ok');
      renderStep5(); renderStatusStrip();
    });
  }catch(err){ console.error(err); toast('Could not read file: '+err.message, 'err'); }
}
/* Available quantity units for a product: KG always; PC/BAG only when the UOM master defines them. */
function uomOptionsForProduct(productCode){
  const opts = [{value:'KG', label:'KG', factor:1}];
  const u = STATE.uomMap[productCode];
  if(u){
    if(u.kgPerPc) opts.push({value:'PC', label:`PC (${u.kgPerPc} kg)`, factor:u.kgPerPc});
    if(u.kgPerBag) opts.push({value:'BAG', label:`BAG (${u.kgPerBag} kg)`, factor:u.kgPerBag});
  }
  return opts;
}

/* ============================================================
   MULTI-UOM COMPONENT ENGINE
   A single bill line for one product can mix Bag + Pc + Kg all
   on the same invoice. Each such entry is a "component"; the
   product line holds an array of them. Within one component the
   operator only ever has two of {Qty, Rate, Total} printed on the
   bill — the third is always derived, deterministically. See
   UOM_Rate_Entry_Logic_Spec.md §2–4 for the full spec this
   implements.
   ============================================================ */

function parseNum(v){
  if(v===''||v==null) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

// SKU text like "1KG", "500GM", "7GM" -> kg-per-piece. Returns null if the
// SKU carries no extractable weight (e.g. "LAB REJECTION", "COMBO PACK").
function parsePackSizeKgFromSku(sku){
  const m = String(sku||'').match(/(\d+(?:\.\d+)?)\s*(KG|GM|G|GRAM|ML|L)\b/i);
  if(!m) return null;
  const num = parseFloat(m[1]);
  const unit = m[2].toUpperCase();
  if(unit==='KG') return num;
  if(unit==='GM'||unit==='G'||unit==='GRAM') return num/1000;
  return null; // ML/L are non-weight packs — never auto-guessed, always needs manual entry
}

// Pack size (kg per PC), in priority order: UOM Conversion master (authoritative,
// needs no confirmation) -> operator's manual entry for this line -> auto-parsed
// from the SKU text (flagged for confirmation) -> unknown.
function resolvePackSizeKg(li){
  const u = STATE.uomMap[li.productCode];
  if(u && u.kgPerPc) return {value:u.kgPerPc, source:'uom', needsConfirm:false};
  if(li.packSizeKgManual!=null && li.packSizeKgManual!=='' && !isNaN(Number(li.packSizeKgManual))) return {value:Number(li.packSizeKgManual), source:'manual', needsConfirm:false};
  const parsed = parsePackSizeKgFromSku(li.sku);
  if(parsed!=null) return {value:parsed, source:'sku', needsConfirm: !li.packSizeConfirmed};
  return {value:null, source:null, needsConfirm:true};
}
// Bag size (kg per BAG), in priority order: UOM Conversion master -> this
// session's remembered value for the same product code (so it's only ever
// typed once) -> this specific line's manual entry -> unknown (blocks BAG
// components from calculating rather than guessing).
function resolveBagSizeKg(li){
  const u = STATE.uomMap[li.productCode];
  if(u && u.kgPerBag) return {value:u.kgPerBag, source:'uom'};
  const cached = STATE.bagSizeByProductCode[li.productCode];
  const packInfo = resolvePackSizeKg(li);
  if(cached){
    const v = cached.unit==='PCS' ? (packInfo.value!=null ? cached.value*packInfo.value : null) : cached.value;
    return {value:v, source:'cache', unit:cached.unit, rawValue:cached.value};
  }
  if(li.bagSizeValue!=null && li.bagSizeValue!=='' && !isNaN(Number(li.bagSizeValue))){
    const v = li.bagSizeUnit==='PCS' ? (packInfo.value!=null ? Number(li.bagSizeValue)*packInfo.value : null) : Number(li.bagSizeValue);
    return {value:v, source:'manual', unit:li.bagSizeUnit, rawValue:Number(li.bagSizeValue)};
  }
  return {value:null, source:null};
}
function factorForUom(li, uom){
  if(uom==='KG') return {value:1, error:null};
  if(uom==='PC'){ const p = resolvePackSizeKg(li); return {value:p.value, error: p.value==null?'pack_size_missing':null}; }
  if(uom==='BAG'){ const b = resolveBagSizeKg(li); return {value:b.value, error: b.value==null?'bag_size_missing':null}; }
  return {value:null, error:'bad_uom'};
}

// The 2-of-3 rule: whichever of Qty/Rate/Total the operator leaves empty is
// the one that gets computed. If all three end up filled (operator typed
// over a value the app had auto-filled), Total is recomputed from Qty×Rate —
// Rate wins as the source of truth, since that's normally what's printed.
function resolveComponent(comp){
  const q = parseNum(comp.qty), r = parseNum(comp.rate), t = parseNum(comp.total);
  const hasQ = q!=null, hasR = r!=null, hasT = t!=null;
  const filled = [hasQ,hasR,hasT].filter(Boolean).length;
  if(filled<2) return {qty:q, rate:r, total:t, computed:null, error:'need_more'};
  if(hasQ && hasR){
    if(q<0||r<0) return {qty:q, rate:r, total:null, computed:null, error:'negative'};
    return {qty:q, rate:r, total:clamp2(q*r), computed:'total', error:null};
  }
  if(hasQ && hasT){
    if(q===0) return {qty:q, rate:null, total:t, computed:null, error:'qty_zero'};
    if(q<0) return {qty:q, rate:null, total:t, computed:null, error:'negative'};
    return {qty:q, rate:clamp2(t/q), total:t, computed:'rate', error:null};
  }
  if(hasR && hasT){
    if(r===0) return {qty:null, rate:r, total:t, computed:null, error:'rate_zero'};
    if(r<0) return {qty:null, rate:r, total:t, computed:null, error:'negative'};
    return {qty:clamp2(t/r), rate:r, total:t, computed:'qty', error:null};
  }
  return {qty:q, rate:r, total:t, computed:null, error:'need_more'};
}
const COMPONENT_ERROR_MSG = {
  need_more: 'Enter any 2 of Qty / Rate / Total — the third fills in.',
  qty_zero: 'Qty can\'t be 0 when deriving Rate from Total.',
  rate_zero: 'Rate can\'t be 0 when deriving Qty from Total.',
  negative: 'Values can\'t be negative.',
  pack_size_missing: 'Pack size (kg per PC) unknown for this product — enter it above.',
  bag_size_missing: 'Bag size unknown for this product — enter it above.',
};
function componentKgAndAmount(li, comp){
  const resolved = resolveComponent(comp);
  if(resolved.error) return {error:resolved.error, resolved};
  const f = factorForUom(li, comp.uom);
  if(f.error) return {error:f.error, resolved};
  return {kg: resolved.qty*f.value, amount: resolved.total, qty:resolved.qty, rate:resolved.rate, error:null};
}
// Aggregates every component of one product line into the single figure that
// actually answers "how much were they over/undercharged on this bill line":
// every UOM used is converted to a common kg basis and summed, so a bill that
// splits one SKU across Bag+Pc+Kg still produces one clean answer.
function aggregateLineItem(li){
  let totalQtyKg = 0, totalInvoiced = 0;
  const parts = [];
  let any = false;
  for(const comp of li.components){
    if((comp.qty===''||comp.qty==null) && (comp.rate===''||comp.rate==null) && (comp.total===''||comp.total==null)) continue;
    any = true;
    const r = componentKgAndAmount(li, comp);
    if(r.error) return {error:r.error, parts, any};
    totalQtyKg += r.kg; totalInvoiced += r.amount;
    parts.push({uom:comp.uom, qty:r.qty, rate:r.rate, total:r.amount});
  }
  if(!any) return {error:'empty', parts, any};
  if(li.companyRate==null) return {error:'no_company_rate', parts, any};
  // Company Rate is always GST-inclusive (that's how it's read off the Rate
  // Master). A bill's line "Amount" is usually GST-EXCLUSIVE — GST gets
  // added once at the bottom of the invoice, not per line — so unless the
  // operator says otherwise, the entered Amount needs the product's own GST%
  // added before it's comparable to the Company Rate at all.
  const gstPct = li.gstPct || 0;
  const totalInvoicedInclGst = li.amountExcludesGst ? totalInvoiced*(1+gstPct/100) : totalInvoiced;
  const blendedRatePerKg = totalInvoicedInclGst/totalQtyKg;
  const expectedAmount = li.companyRate*totalQtyKg;
  const diffAmount = totalInvoicedInclGst-expectedAmount;
  const diffPerKg = blendedRatePerKg-li.companyRate;
  const pct = clamp2((diffPerKg/li.companyRate)*100);
  let status;
  if(Math.abs(diffAmount)<0.01) status='match';
  else if(diffAmount>0) status = pct<1 ? 'negligible' : 'over';
  else status='under';
  // EXCEPTION-CASE ONLY compliance check, separate from the rate comparison
  // above: the operator sees this product's correct GST% right on the card
  // (0% for Papad, 5% for most others, etc.) and normally never touches this.
  // Only when they spot the invoice itself charging a different rate — like
  // GST wrongly added to a 0%-GST item — do they type in that line's own
  // tax-inclusive total (copied straight off the invoice, no % math), and
  // the mismatch + its rupee impact are derived and flagged automatically.
  const inclShown = (li.amountInclGstShown!==''&&li.amountInclGstShown!=null&&!isNaN(Number(li.amountInclGstShown))) ? Number(li.amountInclGstShown) : null;
  const gstPctCharged = (inclShown!=null && totalInvoiced>0) ? clamp2((inclShown/totalInvoiced - 1)*100) : null;
  const gstMismatch = gstPctCharged!=null && Math.abs(gstPctCharged-gstPct)>0.05;
  const gstMismatchAmt = gstMismatch ? clamp2(inclShown - totalInvoiced*(1+gstPct/100)) : 0;
  // A charged-GST% that's negative or wildly large almost always means the
  // "Amount incl. GST" box got the wrong number typed into it (e.g. a
  // per-unit rate instead of the line's total) rather than a real finding —
  // flag that distinctly instead of presenting a nonsense % as fact.
  const gstEntrySuspect = gstMismatch && (gstPctCharged<-0.5 || gstPctCharged>50);
  // Per-unit breakdowns of the SAME diffPerKg, so the operator never has to
  // do this multiplication by hand: "how much extra/less per piece, per bag"
  // reads straight off the pack/bag size already known for this product.
  const packInfoForDiff = resolvePackSizeKg(li);
  const bagInfoForDiff = resolveBagSizeKg(li);
  const diffPerPc = packInfoForDiff.value!=null ? clamp2(diffPerKg*packInfoForDiff.value) : null;
  const diffPerBag = bagInfoForDiff.value!=null ? clamp2(diffPerKg*bagInfoForDiff.value) : null;
  return {
    totalQtyKg: clamp2(totalQtyKg), totalInvoiced: clamp2(totalInvoicedInclGst), totalInvoicedExclGst: clamp2(totalInvoiced), gstPct,
    blendedRatePerKg: clamp2(blendedRatePerKg), expectedAmount: clamp2(expectedAmount),
    diffAmount: clamp2(diffAmount), diffPerKg: clamp2(diffPerKg), diffPerPc, diffPerBag, pct, status, parts, error:null,
    amountInclGstShown: inclShown, gstPctCharged, gstMismatch, gstMismatchAmt, gstEntrySuspect,
  };
}
function emptyComponent(uom){ return {uom: uom||'KG', qty:'', rate:'', total:''}; }

/* ---- Typo-tolerant product search ---- */
function levenshtein(a, b){
  if(a===b) return 0;
  const al=a.length, bl=b.length;
  if(al===0) return bl;
  if(bl===0) return al;
  let prev = new Array(bl+1), curr = new Array(bl+1);
  for(let j=0;j<=bl;j++) prev[j]=j;
  for(let i=1;i<=al;i++){
    curr[0]=i;
    for(let j=1;j<=bl;j++){
      const cost = a.charCodeAt(i-1)===b.charCodeAt(j-1) ? 0 : 1;
      curr[j] = Math.min(prev[j]+1, curr[j-1]+1, prev[j-1]+cost);
    }
    const tmp = prev; prev = curr; curr = tmp;
  }
  return prev[bl];
}
/* Scores how well a (possibly misspelled) query matches a target string.
   Exact substring wins outright; otherwise each query word is matched
   against the target's words allowing a small, length-scaled edit distance,
   so a typo like "sharbti" still finds "SHARBATI". */
function fuzzyScore(query, target){
  if(!query || !target) return 0;
  if(target.includes(query)) return 1000 - Math.min(200, target.length - query.length);
  const qWords = query.split(/\s+/).filter(Boolean);
  const tWords = target.split(/\s+/).filter(Boolean);
  if(!qWords.length) return 0;
  let total = 0;
  qWords.forEach(qw=>{
    let best = 0;
    tWords.forEach(tw=>{
      if(tw.includes(qw)) best = Math.max(best, 70);
      else if(qw.length>=3 && qw.includes(tw)) best = Math.max(best, 45);
      else{
        const allowed = qw.length<=4 ? 1 : (qw.length<=7 ? 2 : 3);
        const dist = levenshtein(qw, tw);
        if(dist<=allowed) best = Math.max(best, 55 - dist*12);
      }
    });
    total += best;
  });
  return qWords.length ? total/qWords.length : 0;
}

        <div class="date-combo">
          <input type="date" id="rcBillDate" value="${f.billDateISO}">
          <input type="text" id="rcBillDateQuick" placeholder="DDMMYY" maxlength="6" inputmode="numeric" title="Type as DDMMYY — e.g. 260826 = 26-08-26, 010826 = 01-08-26">
        </div>
        <div class="hint">or type DDMMYY, e.g. 260826 = 26‑08‑26</div>
      </div>
      <div class="field"><label>Collected By</label>
        <input type="text" id="rcCollectedBy" list="rcCollectedByList" value="${esc(f.collectedBy)}" style="text-transform:uppercase;">
        <datalist id="rcCollectedByList">${lsGetList('collectedByList').map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <div class="hint">Remembered on this device</div>
      </div>
      <div class="field"><label>Designation</label>
        <select id="rcDesignation">
          <option value="">— Select —</option>
          ${['Sales Officer','Merchandiser','ASM','ASE','RSM'].map(d=>`<option value="${d}" ${f.designation===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
      ${backendConfigured() ? (
        (getSession() && getSession().role==='Verifier') ? `
      <div class="field"><label>Verified By</label>
        <input type="text" value="${esc(f.verifiedBy)}" readonly style="background:var(--panel-2);color:var(--ink-soft);font-weight:600;">
        <div class="hint">You're logged in as this Verifier — it's locked to your own name and can't be changed to anyone else.</div>
      </div>
      ` : `
      <div class="field"><label>Verified By <span class="colmap-req">*</span></label>
        <div class="verifier-combo">
          <div class="verifier-code-wrap">
            <input type="password" id="rcVerifierCode" value="${esc(f.verifierCode||'')}" placeholder="Verifier code" autocomplete="off" inputmode="text">
            <button type="button" class="eye-toggle" id="rcVerifierCodeEye" tabindex="-1" title="Show/hide code">👁</button>
          </div>
          <input type="text" id="rcVerifierName" value="${esc(f.verifiedBy||'')}" placeholder="Name appears here" readonly>
        </div>
        <div class="hint" id="rcVerifierHint" style="${(f.verifierCode && !f.verifiedBy) ? 'color:var(--danger);' : ''}">${!STATE.verifiersList.length ? 'No verifiers loaded yet — ask your Admin to add some, or check your connection.' : (f.verifierCode && !f.verifiedBy ? 'Code not recognized.' : 'Verifier types their own code — their name fills in automatically.')}</div>
      </div>
      `
      ) : `
      <div class="field"><label>Verified By</label>
        <input type="text" id="rcVerifiedBy" list="rcVerifiedByList" value="${esc(f.verifiedBy)}" placeholder="Verifier's name" style="text-transform:uppercase;">
        <datalist id="rcVerifiedByList">${lsGetList('verifiedByList').map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <div class="hint">Remembered until you clear cache</div>
      </div>
      `}
      <div class="field"><label>Submission Date</label><input type="date" id="rcSubDate" value="${f.submissionISO}"></div>
    </div>
    <div class="field" style="max-width:420px;">
      <label>Bill Copy (photo / PDF) <span class="small-muted" style="text-transform:none;font-weight:400;">— optional; a photo is embedded right into the exported Excel, a PDF is linked via a Bills folder</span></label>
      ${f.billCopy ? `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--edge);border-radius:var(--radius-sm);background:var(--panel-2);">
          <span class="tag">📎 ${esc(f.billCopy.fileName)}</span>
          <button type="button" class="icon-btn" id="rcBillCopyClear" title="Remove attachment">✕</button>
        </div>` : `
        <div class="dropzone" id="rcBillCopyZone" style="padding:14px;">
          <label class="dz-btn" style="margin-top:0;">Attach bill copy<input type="file" id="rcBillCopyInput" accept="image/*,.pdf"></label>
          <div class="dz-hint">Photo or scan of this invoice/hand bill</div>
        </div>`}
    </div>

    <div class="section-title">Products on this bill</div>
    <div class="card" style="margin-bottom:12px;padding:11px 16px;font-size:12px;line-height:1.7;color:var(--ink-soft);">
      <div style="margin-bottom:6px;">
        <strong style="color:var(--ink);">Rate logic:</strong> Company Rate is always <strong>₹/kg</strong>. For every line, type the <strong>Bill Amount</strong> exactly as printed for that quantity (its "Amount" column — never the Rate column, which can be per-unit or tax-inclusive/exclusive and cause mix-ups) — the app divides by Qty and by the product's pack size itself to get ₹/kg, before comparing to the Company Rate.
        <span class="rate-pipeline"><span>₹ as billed</span><span class="rate-pipeline-arrow">→</span><span>÷ pack size</span><span class="rate-pipeline-arrow">→</span><span>₹/kg</span><span class="rate-pipeline-arrow">→</span><span>vs Company Rate</span></span>
      </div>
      <strong style="color:var(--ink);">How Status is decided:</strong> Diff (₹/kg) = Invoice Rate − Company Rate. Variance % = Diff ÷ Company Rate × 100.
      &nbsp;<span class="badge negligible" style="vertical-align:middle;">Overcharge – Negligible</span> = variance is positive but <strong>under 1%</strong>.
      &nbsp;<span class="badge over" style="vertical-align:middle;animation:none;">Overcharge</span> = variance is <strong>1% or more</strong>.
      &nbsp;<span class="badge under" style="vertical-align:middle;">Undercharge</span> = invoice rate is below Company Rate (no negligible band).
      Hover any <strong>Status</strong> badge below for that line's exact numbers.
    </div>
    <div id="rcLineItems"></div>
    <button class="btn secondary small" id="rcAddLine" style="margin-top:10px;">+ Add product</button>

    <div class="divider"></div>
    <div style="display:flex;gap:12px;align-items:center;">
      <button class="btn accent" id="rcSaveBill">Save bill to report</button>
      <button class="btn secondary" id="rcResetBill">Clear form</button>
      <span class="small-muted" id="rcSaveErr" style="color:var(--danger);"></span>
    </div>
  `;

  wireDbCombo();
  const beatSel = $('#rcBeatSelect');
  if(beatSel) beatSel.addEventListener('change', e=>{
    const b = f.beats[Number(e.target.value)];
    if(b){ f.beatCode = b.code; f.beatName = b.name; }
  });
  $all('#rcBillType .pill-opt').forEach(p=>p.addEventListener('click', ()=>{ f.billType=p.dataset.billtype; renderRateCheck(); }));
  $('#rcRetailer').addEventListener('input', e=>{
    const up = e.target.value.toUpperCase();
    if(e.target.value!==up) e.target.value = up;
    f.retailer = up;
  });
  $('#rcBillNo').addEventListener('input', e=> f.billNo=e.target.value);
  $('#rcBillDate').addEventListener('change', e=>{ f.billDateISO=e.target.value; const q=$('#rcBillDateQuick'); if(q){ q.value=''; q.classList.remove('quick-ok','quick-bad'); } recomputeAllLineRates(); renderLineItems(); });
  const rcQuick = $('#rcBillDateQuick');
  if(rcQuick) rcQuick.addEventListener('input', e=>{
    e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
    e.target.classList.remove('quick-ok','quick-bad');
    if(e.target.value.length===6){
      const iso = ddmmyyToISO(e.target.value);
      if(iso){
        f.billDateISO = iso;
        $('#rcBillDate').value = iso;
        e.target.classList.add('quick-ok');
        recomputeAllLineRates(); renderLineItems();
      } else {
        e.target.classList.add('quick-bad');
      }
    }
  });
  const collectedByEl = $('#rcCollectedBy');
  if(collectedByEl){
    collectedByEl.addEventListener('input', e=>{
      const up = e.target.value.toUpperCase();
      if(e.target.value!==up) e.target.value = up;
      f.collectedBy = up;
      lsSet('collectedBy', up);
    });
    collectedByEl.addEventListener('change', e=>{ if(e.target.value.trim()) lsAddToList('collectedByList', e.target.value.trim()); });
  }
  const designationEl = $('#rcDesignation');
  if(designationEl) designationEl.addEventListener('change', e=>{ f.designation=e.target.value; lsSet('designation', e.target.value); });
  const verifiedByEl = $('#rcVerifiedBy');
  if(verifiedByEl){
    verifiedByEl.addEventListener('input', e=>{
      const up = e.target.value.toUpperCase();
      if(e.target.value!==up) e.target.value = up;
      f.verifiedBy = up;
      lsSet('verifiedBy', up);
    });
    verifiedByEl.addEventListener('change', e=>{ if(e.target.value.trim()) lsAddToList('verifiedByList', e.target.value.trim()); });
  }
  const verifierCodeEl = $('#rcVerifierCode');
  if(verifierCodeEl){
    verifierCodeEl.addEventListener('input', e=>{
      const code = e.target.value.trim().toUpperCase();
      if(e.target.value!==code) e.target.value = code;
      f.verifierCode = code;
      lsSet('verifierCode', code);
      const match = lookupVerifierByCode(code);
      f.verifiedBy = match ? match.name : '';
      const nameEl = $('#rcVerifierName');
      if(nameEl) nameEl.value = f.verifiedBy;
      const hintEl = $('#rcVerifierHint');
      if(hintEl){
        if(!STATE.verifiersList.length){ hintEl.style.color=''; hintEl.textContent = 'No verifiers loaded yet — ask your Admin to add some, or check your connection.'; }
        else if(code && !match){ hintEl.style.color='var(--danger)'; hintEl.textContent = 'Code not recognized.'; }
        else{ hintEl.style.color=''; hintEl.textContent = 'Verifier types their own code here — their name fills in automatically.'; }
      }
    });
  }
  const verifierEyeEl = $('#rcVerifierCodeEye');
  if(verifierEyeEl && verifierCodeEl){
    verifierEyeEl.addEventListener('click', ()=>{
      const showing = verifierCodeEl.type==='text';
      verifierCodeEl.type = showing ? 'password' : 'text';
      verifierEyeEl.textContent = showing ? '👁' : '🙈';
    });
  }
  $('#rcSubDate').addEventListener('change', e=> f.submissionISO=e.target.value);
  const bcInput = $('#rcBillCopyInput');
  if(bcInput) bcInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 8*1024*1024){ toast('Bill copy is larger than 8MB — please attach a smaller file', 'err'); return; }
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    const isImage = /^image\//.test(file.type) || ['jpg','jpeg','png','webp','gif'].includes(ext);
    if(isImage){
      downscaleImage(file, 900, 0.75).then(dataUrl=>{
        f.billCopy = { fileName: file.name, ext:'jpg', dataUrl, kind:'image' };
        renderRateCheck();
      }).catch(()=> toast('Could not read that image', 'err'));
      return;
    }
    const reader = new FileReader();
    reader.onload = ev=>{
      f.billCopy = { fileName: file.name, ext, dataUrl: ev.target.result, kind:'pdf' };
      renderRateCheck();
    };
    reader.onerror = ()=> toast('Could not read that file', 'err');
    reader.readAsDataURL(file);
  });
  const bcClear = $('#rcBillCopyClear');
  if(bcClear) bcClear.addEventListener('click', ()=>{ f.billCopy = null; renderRateCheck(); });
  $('#rcAddLine').addEventListener('click', ()=>{ f.lineItems.push(emptyLineItem()); STATE._justAddedLine = true; renderLineItems(); });
  $('#rcSaveBill').addEventListener('click', saveBill);
  $('#rcResetBill').addEventListener('click', ()=>{ STATE.billForm = freshBillForm(); renderRateCheck(); });

  renderLineItems();
  if(f.lineItems.length===0){ f.lineItems.push(emptyLineItem()); renderLineItems(); }
}

function emptyLineItem(){ return {productCode:'', productName:'', sku:'', category:'', packSize:'', companyRate:null, gstPct:null, amountExcludesGst:true, amountInclGstShown:'', packSizeKgManual:'', packSizeConfirmed:false, bagSizeValue:'', bagSizeUnit:'KG', components:[emptyComponent('KG')]}; }

function wireDbCombo(){
  const input = $('#rcDbCode');
  const results = $('#rcDbResults');
  function showResults(q){
    if(!q){ results.innerHTML=''; return; }
    const ql = q.toLowerCase();
    const hits = STATE.dbMaster.filter(d=> d.code.toLowerCase().includes(ql) || d.name.toLowerCase().includes(ql)).slice(0,25);
    if(!hits.length){ results.innerHTML = `<div class="combo-results"><div class="combo-empty">No DB matches "${esc(q)}"</div></div>`; return; }
    results.innerHTML = `<div class="combo-results">${hits.map(h=>`<div class="combo-item" data-pick="${esc(h.code)}"><div class="ci-name">${esc(h.name)} ${isInactiveStatus(h.active)?'<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Inactive</span>':''}</div><div class="ci-meta">Code ${esc(h.code)} · PG ${esc(h.pg)}${h.beats&&h.beats.length?(' · '+h.beats.length+' beat'+(h.beats.length>1?'s':'')):''}</div></div>`).join('')}</div>`;
    $all('[data-pick]', results).forEach(item=>item.addEventListener('click', ()=>{
      pickDb(item.dataset.pick); results.innerHTML='';
    }));
  }
  input.addEventListener('input', e=> showResults(e.target.value));
  input.addEventListener('focus', e=> showResults(e.target.value));
}
function pickDb(code){
  const f = STATE.billForm;
  const db = STATE.dbMaster.find(d=>d.code===code);
  if(!db) return;
  f.dbCode = db.code; f.dbName = db.name; f.pg = db.pg;
  f.location = locationForPG(db.pg) || '';
  f.active = db.active || '';
  const override = STATE.beatSoMap[db.code];
  if(override){
    f.so = override.so||''; f.asm = override.asm||''; f.rsm = override.rsm||'';
    f.beats = (override.beat||override.beatName) ? [{code:override.beat||'', name:override.beatName||''}] : [];
  } else {
    f.so = db.so||''; f.asm = db.asm||''; f.rsm = db.rsm||'';
    f.beats = db.beats || [];
  }
  const defaultBeat = f.beats[0] || {code:'', name:''};
  f.beatCode = defaultBeat.code; f.beatName = defaultBeat.name;
  recomputeAllLineRates();
  renderRateCheck();
}
function isInactiveStatus(v){ return /inactive/i.test(String(v||'')); }
function dbStatusBadge(v){
  if(!v) return '<span class="small-muted">—</span>';
  return isInactiveStatus(v) ? `<span class="badge under">Inactive</span>` : `<span class="badge match">Active</span>`;
}

function applicableRateRow(productCode){
  const f = STATE.billForm;
  if(!f.location || !f.billDateISO) return null;
  const billDate = isoToDMYDate(f.billDateISO);
  const candidates = STATE.rateRows.filter(r=> r.location===f.location && r.productCode===productCode && r.effDate<=billDate);
  if(!candidates.length) return null;
  candidates.sort((a,b)=> b.effDate - a.effDate);
  return candidates[0];
}
function recomputeAllLineRates(){
  const f = STATE.billForm;
  f.lineItems.forEach(li=>{
    if(!li.productCode) return;
    const rr = applicableRateRow(li.productCode);
    li.companyRate = rr ? rr.rate : null;
    li.gstPct = rr ? rr.gstPct : null;
    li.category = rr ? rr.category : li.category;
  });
}

function statusColor(status){
  if(status==='over') return 'var(--danger)';
  if(status==='negligible') return 'var(--negligible)';
  if(status==='under') return 'var(--warn)';
  if(status==='match') return 'var(--success)';
  return 'inherit';
}
function renderLineItems(){
  const f = STATE.billForm;
  const div = $('#rcLineItems');
  div.innerHTML = f.lineItems.map((li,i)=>renderProductCard(li,i, STATE._justAddedLine && i===f.lineItems.length-1)).join('');
  STATE._justAddedLine = false;
  f.lineItems.forEach((li,i)=> wireProductCard(i));
}

function componentUomOptions(li){
  // Always offer all three units for selection — even when the pack/bag size
  // isn't known yet, since that's exactly what the inline "enter it" fields
  // (§2.1/§2.2) are for. uomOptionsForProduct's factor list is only used
  // elsewhere (search-result hints); components resolve their own factor via
  // resolvePackSizeKg/resolveBagSizeKg, which already fall back sensibly.
  return [{value:'KG'}, {value:'PC'}, {value:'BAG'}];
}

function renderComponentRow(li, liIdx, comp, compIdx, canRemove){
  const opts = componentUomOptions(li);
  const resolved = resolveComponent(comp);
  const rawQ = parseNum(comp.qty), rawR = parseNum(comp.rate), rawT = parseNum(comp.total);
  const qtyVal = rawQ!=null ? comp.qty : (resolved.computed==='qty' && resolved.qty!=null ? resolved.qty : '');
  const rateVal = rawR!=null ? comp.rate : (resolved.computed==='rate' && resolved.rate!=null ? resolved.rate : '');
  const totalVal = rawT!=null ? comp.total : (resolved.computed==='total' && resolved.total!=null ? resolved.total : '');
  const errMsg = resolved.error ? (COMPONENT_ERROR_MSG[resolved.error]||'') : '';
  return `<div class="component-row" id="li${liIdx}_c${compIdx}_row">
    <div class="component-field">
      <label>UOM</label>
      <select id="li${liIdx}_c${compIdx}_uom">${opts.map(o=>`<option value="${o.value}" ${comp.uom===o.value?'selected':''}>${o.value}</option>`).join('')}</select>
    </div>
    <div class="component-field">
      <label>Qty</label>
      <input type="number" step="any" id="li${liIdx}_c${compIdx}_qty" value="${esc(qtyVal)}" placeholder="qty" class="${resolved.computed==='qty'?'auto-filled':''}">
    </div>
    <div class="component-field">
      <label>Rate (per ${esc(comp.uom)})</label>
      <input type="number" step="any" id="li${liIdx}_c${compIdx}_rate" value="${esc(rateVal)}" placeholder="rate" class="${resolved.computed==='rate'?'auto-filled':''}">
      ${(li.amountExcludesGst && li.gstPct>0 && rateVal!=='' && !isNaN(Number(rateVal))) ? `<div class="small-muted rate-incl-gst-hint" id="li${liIdx}_c${compIdx}_rateHint">= ₹${fmtMoney(Number(rateVal)*(1+li.gstPct/100))}/${esc(comp.uom)} incl. GST — check against invoice's "Rate (Incl. of Tax)"</div>` : `<div class="small-muted rate-incl-gst-hint" id="li${liIdx}_c${compIdx}_rateHint"></div>`}
    </div>
    <div class="component-field">
      <label>Bill Amount (₹)</label>
      <input type="number" step="any" id="li${liIdx}_c${compIdx}_total" value="${esc(totalVal)}" placeholder="amount" class="${resolved.computed==='total'?'auto-filled':''}">
    </div>
    <button type="button" class="icon-btn component-remove" id="li${liIdx}_c${compIdx}_remove" title="Remove this quantity line" ${canRemove?'':'style="visibility:hidden;"'}>✕</button>
    <div class="component-err" id="li${liIdx}_c${compIdx}_err">${esc(errMsg)}</div>
  </div>`;
}

function cardSummaryHtml(li){
  const agg = aggregateLineItem(li);
  if(agg.error==='empty' || agg.error==='need_more' || !li.productCode){
    return `<div class="card-summary"><span class="cs-item small-muted">Enter Qty + Rate (or Amount) above to see the difference.</span></div>`;
  }
  if(agg.error){
    return `<div class="card-summary"><span class="cs-item" style="color:var(--danger);">${esc(COMPONENT_ERROR_MSG[agg.error]||'Cannot calculate yet — check the values above.')}</span></div>`;
  }
  const sColor = statusColor(agg.status);
  const showExclLine = (li.amountExcludesGst && agg.gstPct>0) || agg.gstMismatch;
  const gstLine = showExclLine ? `<span class="cs-item">Invoiced (excl. GST): <b>₹${fmtMoney(agg.totalInvoicedExclGst)}</b>${(li.amountExcludesGst && agg.gstPct>0)?` +${agg.gstPct}% GST →`:''}</span>` : '';
  const gstMismatchBadge = agg.gstMismatch ? (
    agg.gstEntrySuspect
      ? `<span class="gst-mismatch-badge suspect" title="Excl-GST Amount is ₹${fmtMoney(agg.totalInvoicedExclGst)}. The 'Amount incl. GST' you entered (₹${fmtMoney(agg.amountInclGstShown)}) works out to ${agg.gstPctCharged}% GST — that's not a realistic GST rate, so this is probably the wrong number (e.g. a per-unit rate instead of this line's total). Double-check and re-enter it in the box above.">⚠ Check this entry — ₹${fmtMoney(agg.amountInclGstShown)} implies ${agg.gstPctCharged}% GST, which isn't realistic</span>`
      : `<span class="gst-mismatch-badge" title="Excl-GST Amount ₹${fmtMoney(agg.totalInvoicedExclGst)} vs invoice's own incl-GST figure ₹${fmtMoney(agg.amountInclGstShown)} works out to ${agg.gstPctCharged}% GST actually charged, vs this product's correct rate of ${agg.gstPct}%. Tracked separately from the rate overcharge/undercharge above.">⚠ Wrong GST charged (${agg.gstPctCharged}% vs correct ${agg.gstPct}%): ${agg.gstMismatchAmt>0?'+':''}₹${fmtMoney(agg.gstMismatchAmt)}</span>`
  ) : '';
  return `<div class="card-summary">
    <span class="cs-item">Total Qty: <b>${agg.totalQtyKg} kg</b></span>
    ${gstLine}
    <span class="cs-item">Invoiced${li.amountExcludesGst&&agg.gstPct>0?' (incl. GST)':''}: <b>₹${fmtMoney(agg.totalInvoiced)}</b></span>
    ${agg.gstMismatch ? `<span class="cs-item">Invoice's incl-GST figure: <b>₹${fmtMoney(agg.amountInclGstShown)}</b></span>` : ''}
    <span class="cs-item">Blended Rate: <b>₹${fmtMoney(agg.blendedRatePerKg)}/kg</b>${(()=>{ const p=resolvePackSizeKg(li); return p.value!=null ? ` <span class="small-muted">(= ₹${fmtMoney(agg.blendedRatePerKg*p.value)}/PC)</span>` : ''; })()}</span>
    <span class="cs-item">vs Company: <b>₹${fmtMoney(li.companyRate)}/kg</b></span>
    ${gstMismatchBadge}
    <span class="cs-status">
      <span class="diff-breakdown" style="color:${sColor};" title="How much over/under, per unit — the exact figure this line's Total ₹ is built from.">
        ${agg.diffPerKg>0?'+':''}₹${fmtMoney(agg.diffPerKg)}/kg${agg.diffPerPc!=null?` · ${agg.diffPerPc>0?'+':''}₹${fmtMoney(agg.diffPerPc)}/PC`:''}${agg.diffPerBag!=null?` · ${agg.diffPerBag>0?'+':''}₹${fmtMoney(agg.diffPerBag)}/BAG`:''}
      </span>
      ${statusBadge(agg.status, statusExplainAggregate(li, agg), agg.pct)}
      <b style="color:${sColor};font-size:14px;">${agg.diffAmount>0?'+':(agg.diffAmount<0?'-':'')}₹${fmtMoney(Math.abs(agg.diffAmount))}</b>
    </span>
  </div>`;
}

function packSizeFieldHtml(li, liIdx){
  const p = resolvePackSizeKg(li);
  if(p.source==='uom') return `<span class="pm-item">Pack Size: <b>${esc(li.packSize||(p.value+' kg'))}</b></span>`;
  return `<span class="pm-item pack-size-field">Pack Size (kg/PC):
    <input type="number" step="any" id="li${liIdx}_packSizeKg" value="${p.value!=null?p.value:''}" placeholder="?" class="${p.needsConfirm?'needs-confirm':''}">
    <span class="unit-suffix">kg${p.needsConfirm?' — auto-guessed, please confirm':''}</span>
  </span>`;
}

function anyComponentUsesBag(li){ return li.components.some(c=>c.uom==='BAG'); }

function bagSizeInlineHtml(li, liIdx){
  if(!anyComponentUsesBag(li)) return '';
  const b = resolveBagSizeKg(li);
  if(b.source==='uom') return `<div class="small-muted" style="margin-top:6px;">Bag size (from UOM master): <b>${b.value} kg</b></div>`;
  const curVal = li.bagSizeValue!==''&&li.bagSizeValue!=null ? li.bagSizeValue : (b.rawValue!=null?b.rawValue:'');
  const curUnit = li.bagSizeUnit || (b.unit||'KG');
  return `<div class="bag-size-inline" id="li${liIdx}_bagSizeBox">
    <span>⚠ Bag size needed:</span>
    <input type="number" step="any" id="li${liIdx}_bagSizeValue" value="${esc(curVal)}" placeholder="e.g. 24">

    </select>
    <span class="small-muted">(1 Bag = value ${curUnit==='PCS'?'× pack size':''})</span>
  </div>`;
}

        ${li.productCode ? `<span class="prodsearch-check" title="Product selected">✓</span>` : ''}
        <div id="liResults${liIdx}" class="combo-host"></div>
      </div>
      <div class="product-card-meta">
        ${li.productCode ? `

          <span class="pm-item">Category: <b>${esc(li.category||'—')}</b></span>
          <span class="pm-item">Company Rate: <b>₹${li.companyRate!=null?fmtMoney(li.companyRate):'—'}/kg</b>${(()=>{ const p=resolvePackSizeKg(li); return (li.companyRate!=null && p.value!=null) ? ` <span class="small-muted">(= ₹${fmtMoney(li.companyRate*p.value)}/PC)</span>` : ''; })()}</span>
          ${packSizeFieldHtml(li, liIdx)}
          <span class="pm-item">GST: <b>${li.gstPct!=null?li.gstPct:'—'}%</b></span>
        ` : ''}
      </div>
    </div>
    ${li.productCode ? `
      ${STATE.billForm.billType==='Tax Invoice'
        ? `<div class="gst-toggle" style="cursor:default;"><span style="color:var(--success);">✓</span> Tax Invoice — GST (${li.gstPct||0}%) added automatically before comparing to Company Rate</div>`
        : `<label class="gst-toggle"><input type="checkbox" id="li${liIdx}_gstToggle" ${li.amountExcludesGst?'checked':''}> ${li.amountExcludesGst ? `Bill Amount excludes GST — add ${li.gstPct||0}% before comparing to Company Rate` : `Bill Amount is final/all-inclusive — no GST adjustment (typical for a Hand Bill)`}</label>`
      }
      ${(() => {
        const aggForHint = aggregateLineItem(li);
        const hasBase = !aggForHint.error && aggForHint.totalInvoicedExclGst>0;
        const correctIncl = hasBase ? fmtMoney(aggForHint.totalInvoicedExclGst*(1+(li.gstPct||0)/100)) : null;
        return `
      <details class="gst-exception" ${li.amountInclGstShown ? 'open' : ''}>
        <summary>Invoice looks like it charged the wrong GST on this product (e.g. tax added on a ${li.gstPct||0}%-GST item)? Click here</summary>
        <div class="gst-exception-body">
          <div id="li${liIdx}_gstExampleText">This line's Bill Amount is ₹${hasBase?fmtMoney(aggForHint.totalInvoicedExclGst):'—'}. At the correct ${li.gstPct||0}% GST, the invoice's own "incl. of tax" total for this line should read <b>₹${correctIncl||'—'}</b>.</div>
          <div style="margin-top:4px;">If your invoice shows a DIFFERENT incl-tax total for this line, type that exact number here: ₹<input type="number" step="any" id="li${liIdx}_gstInclShown" value="${esc(li.amountInclGstShown)}" placeholder="${correctIncl?`e.g. ${correctIncl}`:'total after tax'}"></div>

function wireProductCard(liIdx){
  const f = STATE.billForm;
  const li = f.lineItems[liIdx];
  const searchInput = $(`#liSearch${liIdx}`);
  if(searchInput){
    searchInput.addEventListener('input', e=> showProductResults(liIdx, e.target.value));
    searchInput.addEventListener('focus', e=> showProductResults(liIdx, e.target.value));
  }
  const rm = $(`#liRemove${liIdx}`);
  if(rm) rm.addEventListener('click', ()=>{ f.lineItems.splice(liIdx,1); if(!f.lineItems.length) f.lineItems.push(emptyLineItem()); renderLineItems(); });
  const gstToggle = $(`#li${liIdx}_gstToggle`);
  if(gstToggle) gstToggle.addEventListener('change', e=>{ li.amountExcludesGst = e.target.checked; refreshCard(liIdx); });
  const gstChargedEl = $(`#li${liIdx}_gstInclShown`);
  if(gstChargedEl) gstChargedEl.addEventListener('input', e=>{ li.amountInclGstShown = e.target.value; const summaryEl = $(`#liSummary${liIdx}`); if(summaryEl) summaryEl.innerHTML = cardSummaryHtml(li); });
  if(!li.productCode) return;
  const packEl = $(`#li${liIdx}_packSizeKg`);
  if(packEl) packEl.addEventListener('input', e=>{
    li.packSizeKgManual = e.target.value; li.packSizeConfirmed = true;
    packEl.classList.remove('needs-confirm');
    refreshCard(liIdx);
  });
  const bagValEl = $(`#li${liIdx}_bagSizeValue`);
  const bagUnitEl = $(`#li${liIdx}_bagSizeUnit`);
  function commitBagSize(){
    li.bagSizeValue = bagValEl.value; li.bagSizeUnit = bagUnitEl.value;
    if(li.bagSizeValue!=='' && !isNaN(Number(li.bagSizeValue))){
      STATE.bagSizeByProductCode[li.productCode] = {value:Number(li.bagSizeValue), unit:li.bagSizeUnit};
    }
    refreshCard(liIdx);
  }
  if(bagValEl) bagValEl.addEventListener('input', commitBagSize);
  if(bagUnitEl) bagUnitEl.addEventListener('change', commitBagSize);
  li.components.forEach((comp,ci)=> wireComponentRow(liIdx, ci));
  const addBtn = $(`#liAddComp${liIdx}`);
  if(addBtn) addBtn.addEventListener('click', ()=>{
    li.components.push(emptyComponent(li.components[li.components.length-1].uom));
    refreshCard(liIdx);
  });
}

function wireComponentRow(liIdx, compIdx){
  const f = STATE.billForm;
  const li = f.lineItems[liIdx];
  const comp = li.components[compIdx];
  const qtyEl = $(`#li${liIdx}_c${compIdx}_qty`);
  const rateEl = $(`#li${liIdx}_c${compIdx}_rate`);
  const totalEl = $(`#li${liIdx}_c${compIdx}_total`);
  const uomEl = $(`#li${liIdx}_c${compIdx}_uom`);
  const rmEl = $(`#li${liIdx}_c${compIdx}_remove`);
  if(qtyEl) qtyEl.addEventListener('input', e=>{ comp.qty = e.target.value; updateComponentRow(liIdx, compIdx); });
  if(rateEl) rateEl.addEventListener('input', e=>{ comp.rate = e.target.value; updateComponentRow(liIdx, compIdx); });
  if(totalEl) totalEl.addEventListener('input', e=>{ comp.total = e.target.value; updateComponentRow(liIdx, compIdx); });
  if(uomEl) uomEl.addEventListener('change', e=>{ comp.uom = e.target.value; refreshCard(liIdx); });
  if(rmEl) rmEl.addEventListener('click', ()=>{ li.components.splice(compIdx,1); refreshCard(liIdx); });
}

// Targeted update: recompute one component's derived field + the card's
// summary line, without re-rendering the whole card (keeps focus intact
// while the operator is still typing).
function updateComponentRow(liIdx, compIdx){
  const f = STATE.billForm;
  const li = f.lineItems[liIdx];
  const comp = li.components[compIdx];
  const resolved = resolveComponent(comp);
  const rawQ = parseNum(comp.qty), rawR = parseNum(comp.rate), rawT = parseNum(comp.total);
  const qtyEl = $(`#li${liIdx}_c${compIdx}_qty`);
  const rateEl = $(`#li${liIdx}_c${compIdx}_rate`);
  const totalEl = $(`#li${liIdx}_c${compIdx}_total`);
  if(qtyEl && document.activeElement!==qtyEl){
    if(rawQ==null && resolved.computed==='qty'){ qtyEl.value = resolved.qty; qtyEl.classList.add('auto-filled'); }
    else { qtyEl.classList.remove('auto-filled'); if(rawQ==null) qtyEl.value=''; }
  }
  if(rateEl && document.activeElement!==rateEl){
    if(rawR==null && resolved.computed==='rate'){ rateEl.value = resolved.rate; rateEl.classList.add('auto-filled'); }
    else { rateEl.classList.remove('auto-filled'); if(rawR==null) rateEl.value=''; }
  }
  if(totalEl && document.activeElement!==totalEl){
    if(rawT==null && resolved.computed==='total'){ totalEl.value = resolved.total; totalEl.classList.add('auto-filled'); }
    else { totalEl.classList.remove('auto-filled'); if(rawT==null) totalEl.value=''; }
  }
  const errEl = $(`#li${liIdx}_c${compIdx}_err`);
  if(errEl) errEl.textContent = resolved.error ? (COMPONENT_ERROR_MSG[resolved.error]||'') : '';
  const rateHintEl = $(`#li${liIdx}_c${compIdx}_rateHint`);
  if(rateHintEl){
    const rNow = rawR!=null ? rawR : (resolved.computed==='rate' ? resolved.rate : null);
    if(li.amountExcludesGst && li.gstPct>0 && rNow!=null){
      rateHintEl.textContent = `= ₹${fmtMoney(rNow*(1+li.gstPct/100))}/${comp.uom} incl. GST — check against invoice's "Rate (Incl. of Tax)"`;
    } else {
      rateHintEl.textContent = '';
    }
  }
  const summaryEl = $(`#liSummary${liIdx}`);
  if(summaryEl) summaryEl.innerHTML = cardSummaryHtml(li);
  const gstExampleEl = $(`#li${liIdx}_gstExampleText`);
  if(gstExampleEl){
    const aggForHint = aggregateLineItem(li);
    const hasBase = !aggForHint.error && aggForHint.totalInvoicedExclGst>0;
    const correctIncl = hasBase ? fmtMoney(aggForHint.totalInvoicedExclGst*(1+(li.gstPct||0)/100)) : null;
    gstExampleEl.innerHTML = `This line's Bill Amount is ₹${hasBase?fmtMoney(aggForHint.totalInvoicedExclGst):'—'}. At the correct ${li.gstPct||0}% GST, the invoice's own "incl. of tax" total for this line should read <b>₹${correctIncl||'—'}</b>.`;
    const gstInputEl = $(`#li${liIdx}_gstInclShown`);
    if(gstInputEl && correctIncl) gstInputEl.placeholder = `e.g. ${correctIncl}`;
  }
}

// Full but targeted refresh of one card (components list + summary) — used
// after structural changes (add/remove a quantity line, UOM switch, pack/bag
// size edits) where a per-field patch isn't enough.
function refreshCard(liIdx){
  const f = STATE.billForm;
  const li = f.lineItems[liIdx];
  const card = $(`#liCard${liIdx}`);
  if(!card) return;
  card.outerHTML = renderProductCard(li, liIdx, false);
  wireProductCard(liIdx);
}

function statusExplainAggregate(li, agg){
  const lines = [];
  agg.parts.forEach(p=>{
    lines.push(`${p.uom} × ${p.qty} @ ₹${fmtMoney(p.rate)}/${p.uom} = ₹${fmtMoney(p.total)}`);
  });
  lines.push(`Total Qty (kg-equiv) = ${agg.totalQtyKg} kg`);
  if(li.amountExcludesGst && agg.gstPct>0){
    lines.push(`Invoiced (excl. GST, as billed) = ₹${fmtMoney(agg.totalInvoicedExclGst)}`);
    lines.push(`+ ${agg.gstPct}% GST (from Rate Master for this product) → Invoiced (incl. GST) = ₹${fmtMoney(agg.totalInvoicedExclGst)} × ${(1+agg.gstPct/100).toFixed(2)} = ₹${fmtMoney(agg.totalInvoiced)}`);
  } else {
    lines.push(`Total Invoiced = ₹${fmtMoney(agg.totalInvoiced)}`);
  }
  if(agg.gstMismatch) lines.push(agg.gstEntrySuspect
    ? `GST check: excl-GST Amount ₹${fmtMoney(agg.totalInvoicedExclGst)} vs the incl-GST figure you entered (₹${fmtMoney(agg.amountInclGstShown)}) works out to ${agg.gstPctCharged}% — not a realistic GST rate. This entry is probably wrong (e.g. a per-unit rate instead of this line's total); double-check and re-enter it.`
    : `GST check: excl-GST Amount ₹${fmtMoney(agg.totalInvoicedExclGst)} vs invoice's own incl-GST figure ₹${fmtMoney(agg.amountInclGstShown)} → ${agg.gstPctCharged}% actually charged, vs correct ${agg.gstPct}% → ${agg.gstMismatchAmt>0?'+':''}₹${fmtMoney(agg.gstMismatchAmt)} wrong GST (tracked separately below).`);
  lines.push(`Blended Rate = Invoiced ÷ Qty(kg) = ₹${fmtMoney(agg.totalInvoiced)} ÷ ${agg.totalQtyKg} = ₹${fmtMoney(agg.blendedRatePerKg)}/kg`);
  lines.push(`Diff per kg = Blended − Company Rate = ${fmtMoney(agg.blendedRatePerKg)} − ${fmtMoney(li.companyRate)} = ${agg.diffPerKg>0?'+':''}₹${fmtMoney(agg.diffPerKg)}/kg`);
  if(agg.diffPerPc!=null) lines.push(`Diff per PC = Diff/kg × pack size = ${fmtMoney(agg.diffPerKg)} × ${resolvePackSizeKg(li).value}kg = ${agg.diffPerPc>0?'+':''}₹${fmtMoney(agg.diffPerPc)}/PC`);
  if(agg.diffPerBag!=null) lines.push(`Diff per BAG = Diff/kg × bag size = ${fmtMoney(agg.diffPerKg)} × ${resolveBagSizeKg(li).value}kg = ${agg.diffPerBag>0?'+':''}₹${fmtMoney(agg.diffPerBag)}/BAG`);
  lines.push(`Expected (at Company Rate) = ₹${fmtMoney(li.companyRate)} × ${agg.totalQtyKg} = ₹${fmtMoney(agg.expectedAmount)}`);
  lines.push(`Difference = Invoiced − Expected = ₹${fmtMoney(agg.totalInvoiced)} − ₹${fmtMoney(agg.expectedAmount)} = ${agg.diffAmount>0?'+':''}₹${fmtMoney(agg.diffAmount)}`);
  if(agg.status==='match') lines.push('Within ₹0.01 → Match.');
  else if(agg.status==='negligible') lines.push(`Variance ${agg.pct}% is BELOW the 1% negligible threshold → Overcharge – Negligible.`);
  else if(agg.status==='over') lines.push(`Variance ${agg.pct}% is AT OR ABOVE the 1% threshold → Overcharge.`);
  else lines.push('Invoiced is below expected → Undercharge. (Undercharge has no negligible band.)');
  if(Math.abs(agg.pct)>50) lines.push(`⚠ ${agg.pct}% is unusually large — check the entered Qty/Rate/Amount and units before trusting this line.`);
  return lines.join('\n');
}
function statusExplainSaved(b){
  const lines = [];
  if(b.componentsSummary) lines.push(`Components: ${b.componentsSummary}`);
  lines.push(`Total Qty (kg-equiv) = ${b.qtyKg} kg`);
  if(b.amountExcludesGst && b.gstPct>0){
    lines.push(`Invoiced (excl. GST, as billed) = ₹${fmtMoney(b.totalInvoicedExclGst)}`);
    lines.push(`+ ${b.gstPct}% GST → Invoiced (incl. GST) = ₹${fmtMoney(b.totalInvoiced!=null?b.totalInvoiced:b.chargeAmt)}`);
  } else {
    lines.push(`Total Invoiced = ₹${fmtMoney(b.totalInvoiced!=null?b.totalInvoiced:b.chargeAmt)}`);
  }
  if(b.gstMismatch) lines.push(b.gstEntrySuspect
    ? `GST check: the incl-GST figure entered (₹${fmtMoney(b.amountInclGstShown)}) works out to ${b.gstPctCharged}% vs excl-GST Amount ₹${fmtMoney(b.totalInvoicedExclGst)} — not a realistic GST rate, likely a data-entry mistake on this line.`
    : `GST check: excl-GST Amount ₹${fmtMoney(b.totalInvoicedExclGst)} vs invoice's own incl-GST figure ₹${fmtMoney(b.amountInclGstShown)} → ${b.gstPctCharged}% actually charged, vs correct ${b.gstPct}% → ${b.gstMismatchAmt>0?'+':''}₹${fmtMoney(b.gstMismatchAmt)} wrong GST.`);
  lines.push(`Blended Rate = ₹${fmtMoney(b.blendedRate!=null?b.blendedRate:b.invoiceRate)}/kg`);
  lines.push(`Expected (Company Rate × Qty) = ₹${fmtMoney(b.expectedAmount!=null?b.expectedAmount:clamp2(b.companyRate*b.qtyKg))}`);
  lines.push(`Difference = ${b.chargeAmt>0?'+':''}₹${fmtMoney(b.chargeAmt)}`);
  if(b.status==='match') lines.push('Within ₹0.01 → Match.');
  else if(b.status==='negligible') lines.push(`Variance ${b.pct}% is BELOW the 1% negligible threshold → Overcharge – Negligible.`);
  else if(b.status==='over') lines.push(`Variance ${b.pct}% is AT OR ABOVE the 1% threshold → Overcharge.`);
  else lines.push('Invoiced is below expected → Undercharge. (Undercharge has no negligible band.)');
  if(b.pct!=null && Math.abs(b.pct)>50) lines.push(`⚠ ${b.pct}% is unusually large — check the entered Qty/Rate/Amount and units before trusting this line.`);
  return lines.join('\n');
}
function statusBadge(status, tooltip, pct){
  if(!status) return '<span class="small-muted">—</span>';
  const t = tooltip ? ` title="${esc(tooltip)}"` : '';
  let badge;
  if(status==='over') badge = `<span class="badge over"${t}>Overcharge</span>`;
  else if(status==='negligible') badge = `<span class="badge negligible"${t}>Overcharge – Negligible</span>`;
  else if(status==='under') badge = `<span class="badge under"${t}>Undercharge</span>`;
  else badge = `<span class="badge match"${t}>Match</span>`;
  if(pct!=null && Math.abs(pct)>50){
    badge += `<span class="sanity-warn" title="Variance is ${pct>0?'+':''}${pct}% — unusually large for a real invoice. Double-check the entered Qty/Rate/Amount and units; a wrong unit is the most common cause of a number like this.">⚠ check values</span>`;
  }
  return badge;
}
function showProductResults(i, q){
  const f = STATE.billForm;
  const resultsDiv = $(`#liResults${i}`);
  if(!f.location){ resultsDiv.innerHTML = `<div class="combo-results"><div class="combo-empty">Pick a DB first so we know the location</div></div>`; return; }
  if(!q){ resultsDiv.innerHTML=''; return; }
  const billDate = isoToDMYDate(f.billDateISO);
  const qNorm = q.toUpperCase().trim().replace(/\s+/g,' ');
  let pool = STATE.rateRows.filter(r=> r.location===f.location && r.effDate<=billDate);
  // keep only the latest effective row per product code
  const latestByCode = {};
  pool.forEach(r=>{ if(!latestByCode[r.productCode] || r.effDate>latestByCode[r.productCode].effDate) latestByCode[r.productCode]=r; });
  const candidates = Object.values(latestByCode);
  const codeNorm = q.trim();
  const scored = candidates.map(r=>{
    const nameU = r.productName.toUpperCase();
    const skuU = String(r.sku||'').toUpperCase();
    const codeU = String(r.productCode||'');
    let score = 0;
    if(codeU===codeNorm) score = 5000;
    else if(codeNorm.length>=3 && codeU.includes(codeNorm)) score = 800;
    score = Math.max(score, fuzzyScore(qNorm, nameU));
    score = Math.max(score, fuzzyScore(qNorm, skuU) * 0.85);
    return {r, score};
  }).filter(x=>x.score>=30);
  scored.sort((a,b)=> b.score-a.score);
  const hits = scored.slice(0,25).map(x=>x.r);
  if(!hits.length){ resultsDiv.innerHTML = `<div class="combo-results"><div class="combo-empty">No product matches "${esc(q)}" for ${esc(f.location)} on this bill date</div></div>`; return; }
  resultsDiv.innerHTML = `<div class="combo-results">${hits.map(h=>{
    const u = STATE.uomMap[h.productCode];
    const packInfo = u ? ` · Pack ${esc(u.packSize||(u.kgPerPc+' kg'))}${u.kgPerBag?(' · 1 BAG='+u.kgPerBag+'kg'):''}` : '';
    return `<div class="combo-item" data-pickprod="${esc(h.productCode)}"><div class="ci-name">${esc(h.productName)} <span class="tag">${esc(h.sku)}</span></div><div class="ci-meta">Code ${esc(h.productCode)} · ₹${fmtMoney(h.rate)}/kg incl. GST${h.gstPct}% · ${esc(h.category)}${packInfo}</div></div>`;
  }).join('')}</div>`;
  $all('[data-pickprod]', resultsDiv).forEach(item=>item.addEventListener('click', ()=>{
    const code = item.dataset.pickprod;
    const rr = latestByCode[code];
    const li = f.lineItems[i];
    li.productCode = rr.productCode; li.productName = rr.productName; li.sku = rr.sku; li.category = rr.category;
    li.companyRate = rr.rate; li.gstPct = rr.gstPct;
    // A proper Tax Invoice's line "Amount" is almost always GST-exclusive (tax
    // gets added at the bottom); a Hand Bill / cash memo rarely has any formal
    // tax computation at all, so there's nothing to add back for those.
    li.amountExcludesGst = f.billType === 'Tax Invoice';
    const uomEntry = STATE.uomMap[rr.productCode];
    li.packSize = (uomEntry && uomEntry.packSize) || rr.sku || '';
    li.packSizeKgManual = ''; li.packSizeConfirmed = false;
    li.bagSizeValue = ''; li.bagSizeUnit = 'KG';
    li.components = [emptyComponent('KG')];
    resultsDiv.innerHTML = '';
    refreshCard(i);
    const card = $(`#liCard${i}`);
    if(card){
      card.classList.add('just-picked');
      card.scrollIntoView({behavior:'smooth', block:'nearest'});
      const firstQty = $(`#li${i}_c0_qty`);
      if(firstQty) setTimeout(()=>firstQty.focus(), 250);
    }
  }));
}

function saveBill(){
  const f = STATE.billForm;
  const errEl = $('#rcSaveErr');
  errEl.textContent = '';
  if(!f.dbCode){ errEl.textContent = 'Pick a DB code first.'; return; }
  if(!f.location){ errEl.textContent = "This DB's location could not be resolved — fix the Price Group Mapping."; return; }
  if(!f.retailer.trim()){ errEl.textContent = 'Retailer / outlet name is required.'; return; }
  if(!f.billDateISO){ errEl.textContent = 'Bill date is required.'; return; }
  if(backendConfigured() && !f.verifiedBy){ errEl.textContent = f.verifierCode ? 'Verifier code not recognized — check the code and try again.' : 'Verified By (verifier code) is required.'; return; }
  const validLines = f.lineItems.filter(li=> li.productCode && !aggregateLineItem(li).error);
  const incompleteLines = f.lineItems.filter(li=> li.productCode && aggregateLineItem(li).error && aggregateLineItem(li).error!=='empty');
  if(!validLines.length){ errEl.textContent = incompleteLines.length ? 'Finish entering every product line — some are still missing a value.' : 'Add at least one product with Qty + Rate/Amount filled in.'; return; }

  const billUid = uid('bill');
  const billDate = isoToDMYDate(f.billDateISO);
  const subDate = isoToDMYDate(f.submissionISO);
  if(f.billCopy){
    const savedName = `Bill_${billUid.replace('bill_','')}.${f.billCopy.ext.replace(/[^a-z0-9]/gi,'')||'jpg'}`;
    STATE.billFiles[billUid] = { fileName: f.billCopy.fileName, ext: f.billCopy.ext, dataUrl: f.billCopy.dataUrl, savedName, kind: f.billCopy.kind || 'pdf' };
  }
  const newRecords = [];
  validLines.forEach(li=>{
    const agg = aggregateLineItem(li);
    const componentsSummary = agg.parts.map(p=>`${p.uom}×${p.qty} @ ₹${fmtMoney(p.rate)}`).join('; ');
    const bagInfo = resolveBagSizeKg(li);
    const packInfo = resolvePackSizeKg(li);
    const record = {
      sl: BILL_SEQ++, billUid,
      dbCode: f.dbCode, dbName: f.dbName, pg: f.pg, location: f.location,
      beatCode: f.beatCode, beatName: f.beatName, so: f.so, asm: f.asm, rsm: f.rsm, dbActive: f.active,
      billType: f.billType, retailer: (f.retailer||'').toUpperCase(), billNo: (f.billNo||'').toUpperCase(), billDateStr: fmtDMY(billDate),
      productName: li.productName, productCode: li.productCode, sku: li.sku, category: li.category, packSize: li.packSize||li.sku||'',
      companyRate: li.companyRate, invoiceRate: agg.blendedRatePerKg, gstPct: li.gstPct,
      diff: agg.diffPerKg, diffPerPc: agg.diffPerPc, diffPerBag: agg.diffPerBag, pct: agg.pct, status: agg.status, qty: agg.totalQtyKg, uom: 'KG', qtyKg: agg.totalQtyKg, chargeAmt: agg.diffAmount,
      packSizeKg: packInfo.value, bagSizeLabel: bagInfo.value ? `${bagInfo.value} kg` : '', componentsSummary,
      companyRatePerPc: packInfo.value!=null ? clamp2(li.companyRate*packInfo.value) : null,
      blendedRatePerPc: packInfo.value!=null ? clamp2(agg.blendedRatePerKg*packInfo.value) : null,
      totalInvoiced: agg.totalInvoiced, blendedRate: agg.blendedRatePerKg, expectedAmount: agg.expectedAmount,
      amountExcludesGst: !!li.amountExcludesGst, totalInvoicedExclGst: agg.totalInvoicedExclGst,
      amountInclGstShown: agg.amountInclGstShown, gstPctCharged: agg.gstPctCharged, gstMismatch: agg.gstMismatch, gstMismatchAmt: agg.gstMismatchAmt, gstEntrySuspect: agg.gstEntrySuspect,
      overchargeAmt: agg.status==='over' ? agg.diffAmount : 0,
      underchargeAmt: agg.status==='under' ? clamp2(Math.abs(agg.diffAmount)) : 0,
      negligibleAmt: agg.status==='negligible' ? agg.diffAmount : 0,
      collectedBy: (f.collectedBy||'').toUpperCase(), designation: f.designation, verifiedBy: (f.verifiedBy||'').toUpperCase(), verifiedByCode: f.verifierCode||'', submissionStr: fmtDMY(subDate),
    };
    STATE.bills.push(record);
    newRecords.push(record);
  });
  if(f.collectedBy && f.collectedBy.trim()) lsAddToList('collectedByList', f.collectedBy.trim());
  if(f.verifiedBy && f.verifiedBy.trim()) lsAddToList('verifiedByList', f.verifiedBy.trim());

  if(backendConfigured()){
    const session = getSession();
    if(session){
      backendPost({ action:'submit', code:session.code, pin:session.pin, rows:newRecords })
        .then(res=>{
          if(res.ok){
            toast(`Saved locally and submitted ${res.submitted} line(s) to the Sheet`, 'ok');
            STATE.syncStatus = { state:'idle', message:'' };
          } else {
            queuePendingSubmission(newRecords);
            toast(`Saved locally — Sheet submit failed (${res.error||'unknown error'}), queued to retry`, 'err');
            STATE.syncStatus = { state:'error', message: res.error || 'Unknown error from the Sheet.' };
            renderStatusStrip();
          }
          renderSyncBanner();
        })
        .catch(()=>{
          queuePendingSubmission(newRecords);
          toast('Saved locally — no connection, queued to submit to the Sheet later', 'err');
          STATE.syncStatus = { state:'error', message:'Could not reach the server (check your internet connection, the Web App URL, and that it is deployed as "Anyone" access).' };
          renderStatusStrip();
          renderSyncBanner();
        });
    }
  } else {
    toast(`Saved bill with ${validLines.length} product line(s)`, 'ok');
  }

  const keepHeader = { ...f, lineItems: [] };
  keepHeader.retailer=''; keepHeader.billNo=''; keepHeader.lineItems=[emptyLineItem()]; keepHeader.billCopy=null;
  STATE.billForm = keepHeader;
  renderRateCheck();
  renderStatusStrip();
}

function filteredBills(){
  let rows = STATE.bills;
  if(REP_FILTERS.location) rows = rows.filter(b=>b.location===REP_FILTERS.location);
  if(REP_FILTERS.db) rows = rows.filter(b=>b.dbName===REP_FILTERS.db);
  if(REP_FILTERS.billType) rows = rows.filter(b=>b.billType===REP_FILTERS.billType);
  if(REP_FILTERS.status) rows = rows.filter(b=>b.status===REP_FILTERS.status);
  if(REP_FILTERS.from){ const f=isoToDMYDate(REP_FILTERS.from); rows = rows.filter(b=>parseDMY(b.billDateStr)>=f); }
  if(REP_FILTERS.to){ const t=isoToDMYDate(REP_FILTERS.to); rows = rows.filter(b=>parseDMY(b.billDateStr)<=t); }
  if(REP_FILTERS.q){
    const q = REP_FILTERS.q.toLowerCase();
    rows = rows.filter(b=> (b.retailer||'').toLowerCase().includes(q) || (b.billNo||'').toLowerCase().includes(q) || (b.productName||'').toLowerCase().includes(q) || (b.dbName||'').toLowerCase().includes(q));
  }
  return rows;
}

function dataUrlToBlob(dataUrl){
  const m = dataUrl.match(/^data:(.*?);base64,(.*)$/);
  if(!m) throw new Error('bad data url');
  const mime = m[1], b64 = m[2];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime||'application/octet-stream'});
}
