<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Ledger — Overinvoicing Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --void:#0A0A0B;
  --void-deep:#000000;
  --panel:#151517;
  --panel-2:#1D1D20;
  --panel-3:#29292E;
  --edge:rgba(255,255,255,0.16);
  --edge-soft:rgba(255,255,255,0.08);
  --ink:#F4F4F6;
  --ink-soft:#A6A6AE;
  --ink-faint:#68686F;
  --cyan:#FFFFFF;
  --cyan-dim:#C7C7CC;
  --violet:#8E8E96;
  --danger:#FF4D74;
  --danger-soft:rgba(255,77,116,0.16);
  --success:#33F0B4;
  --success-soft:rgba(51,240,180,0.14);
  --warn:#FFC24E;
  --warn-soft:rgba(255,194,78,0.16);
  --radius-sm:4px;
  --radius:8px;
  --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body:'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono:'JetBrains Mono', 'SF Mono', monospace;
  --shadow-card: 0 0 0 1px rgba(255,255,255,0.06), 0 14px 34px rgba(0,0,0,0.6);
  --glow-cyan: 0 0 14px rgba(255,255,255,0.35);
  --glow-violet: 0 0 16px rgba(200,200,205,0.3);
  --main-bg: linear-gradient(180deg, rgba(15,15,16,0.92), rgba(6,6,7,0.94));
  --input-bg: rgba(0,0,0,0.45);
}
/* ---------- Theme: Black & White (clean, clear, professional) ----------
   Toggled via [data-theme="light"] on <html>. Everything else in this file
   reads colors from the variables below, so switching themes needs no other
   changes anywhere else in the app. */
:root[data-theme="light"]{
  --void:#FFFFFF;
  --void-deep:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F4F5F7;
  --panel-3:#E7E9EC;
  --edge:rgba(10,10,15,0.14);
  --edge-soft:rgba(10,10,15,0.07);
  --ink:#12131A;
  --ink-soft:#53555C;
  --ink-faint:#8B8D93;
  --cyan:#101114;
  --cyan-dim:#3A3B40;
  --violet:#585A61;
  --danger:#D6234B;
  --danger-soft:rgba(214,35,75,0.12);
  --success:#0FA86B;
  --success-soft:rgba(15,168,107,0.12);
  --warn:#B9791A;
  --warn-soft:rgba(185,121,26,0.14);
  --shadow-card: 0 0 0 1px rgba(10,10,15,0.08), 0 10px 26px rgba(10,10,15,0.10);
  --glow-cyan: 0 0 14px rgba(16,17,20,0.18);
  --glow-violet: 0 0 12px rgba(16,17,20,0.12);
  --main-bg: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(248,249,251,0.98));
  --input-bg: rgba(16,17,20,0.035);
}
/* Legibility fixes for the handful of places that hardcode a dark label on
   top of the cyan/violet accent gradient — on the light theme that gradient
   turns dark, so the label needs to flip to white to stay readable. */
:root[data-theme="light"] .dz-btn,
:root[data-theme="light"] .btn.accent,
:root[data-theme="light"] .pill-opt.sel{ color:#FFFFFF; }
:root[data-theme="light"] ::selection{ background:rgba(10,10,15,0.14); color:#101114; }
:root[data-theme="light"] .stat-card .stat-value,
:root[data-theme="light"] .stat-card.danger .stat-value,
:root[data-theme="light"] .stat-card.success .stat-value,
:root[data-theme="light"] .stat-card.warn .stat-value{ text-shadow:none; }
:root[data-theme="light"] .stat-card:hover{ border-color:rgba(16,17,20,0.3); }
:root[data-theme="light"] .tab-indicator{ box-shadow:0 0 10px rgba(16,17,20,0.35), 0 0 16px rgba(16,17,20,0.15); }
:root[data-theme="light"] .field input:focus,
:root[data-theme="light"] .field select:focus,
:root[data-theme="light"] .field textarea:focus{ box-shadow:0 0 0 3px rgba(16,17,20,0.10); }
:root[data-theme="light"] .field.readonly input{ background:rgba(16,17,20,0.04); }

/* Theme switcher control in the topbar */
.theme-switch{display:flex;align-items:center;gap:6px;}
.theme-switch .pill-group{gap:6px;}
.theme-switch .pill-opt{padding:6px 12px;font-size:11.5px;}

/* Rate Check — quick numeric date entry next to the date picker */
.date-combo{display:flex;gap:6px;align-items:flex-start;}
.date-combo input[type=date]{flex:1;min-width:0;}
#rcBillDateQuick{width:82px;flex:none;font-family:var(--font-mono);text-align:center;letter-spacing:.03em;}
#rcBillDateQuick.quick-bad{border-color:var(--danger) !important;}
#rcBillDateQuick.quick-ok{border-color:var(--success) !important;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(1100px 640px at 12% -8%, rgba(190,190,196,0.16), transparent 60%),
    radial-gradient(900px 560px at 108% 10%, rgba(255,255,255,0.13), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 34px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 34px),
    var(--void-deep);
  min-height:100vh;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.75;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);letter-spacing:-0.01em;}
::selection{background:rgba(255,255,255,0.28);color:#fff;}
a{color:var(--cyan);}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Layout shell ---------- */
#app{max-width:1400px;margin:0 auto;padding:0 28px 60px;position:relative;z-index:1;}
.topbar{
  padding:28px 0 0;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;
  animation:dropIn .55s cubic-bezier(.2,.8,.2,1) both;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{
  width:46px;height:46px;border-radius:10px;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--cyan);
  background:linear-gradient(155deg, var(--panel-2), var(--panel));
  border:1px solid var(--edge);
  box-shadow:var(--glow-cyan), inset 0 0 14px rgba(255,255,255,0.08);
  animation:corePulse 3.6s ease-in-out infinite;
}
.brand-text h1{
  font-size:24px;letter-spacing:-0.01em;
  background:linear-gradient(90deg, var(--ink) 30%, var(--cyan) 65%, var(--violet) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-text p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft);}
.status-strip{display:flex;gap:8px;flex-wrap:wrap;}
.status-chip{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--edge);border-radius:100px;
  background:rgba(255,255,255,0.05);font-size:11.5px;color:var(--ink-soft);
  backdrop-filter:blur(6px);
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;}
.status-chip.ready .status-dot{background:var(--success);box-shadow:0 0 6px var(--success);}
.status-chip.ready{color:var(--ink);border-color:rgba(51,240,180,0.4);background:rgba(51,240,180,0.08);}

/* Tab strip */
.tabstrip{display:flex;gap:4px;margin-top:26px;border-bottom:1px solid var(--edge);padding-left:2px;position:relative;animation:dropIn .6s cubic-bezier(.2,.8,.2,1) .05s both;}
.tab-btn{
  font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink-soft);
  background:transparent;border:1px solid transparent;border-bottom:none;
  padding:11px 20px 12px;border-radius:8px 8px 0 0;position:relative;
  display:flex;align-items:center;gap:7px;transition:color .15s, background .15s;
}
.tab-btn .tab-num{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
.tab-btn.active{color:var(--ink);background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));}
.tab-btn.active .tab-num{color:var(--cyan);}
.tab-btn:not(.active):hover{background:rgba(255,255,255,0.06);color:var(--ink);}
.tab-btn:disabled{opacity:0.35;cursor:not-allowed;}
.tab-indicator{position:absolute;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(190,190,196,0.5);border-radius:2px;transition:left .35s cubic-bezier(.4,0,.2,1), width .35s cubic-bezier(.4,0,.2,1);pointer-events:none;}

main{
  background:var(--main-bg);
  border:1px solid var(--edge);border-top:none;border-radius:0 0 12px 12px;
  padding:32px;min-height:60vh;box-shadow:var(--shadow-card);backdrop-filter:blur(10px);
  animation:dropIn .65s cubic-bezier(.2,.8,.2,1) .1s both;
}
.view{display:none;}
.view.active{display:block;animation:materialize .3s cubic-bezier(.2,.8,.2,1);}
@keyframes materialize{from{opacity:0;transform:translateY(6px);filter:blur(3px);}to{opacity:1;transform:translateY(0);filter:blur(0);}}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes corePulse{0%,100%{box-shadow:var(--glow-cyan), inset 0 0 14px rgba(255,255,255,0.08);}50%{box-shadow:0 0 22px rgba(255,255,255,0.7), inset 0 0 18px rgba(255,255,255,0.16);}}

.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.view-head h2{font-size:21px;}
.view-head .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;max-width:60ch;}

/* ---------- Cards / Grid ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.card{
  background:linear-gradient(160deg, var(--panel-2), var(--panel));border:1px solid var(--edge);border-radius:var(--radius);
  padding:18px 20px;
}
.card.dashed{border-style:dashed;}

.stat-card{background:linear-gradient(160deg, var(--panel-2), var(--panel));border:1px solid var(--edge);border-radius:var(--radius);padding:16px 18px;transition:border-color .2s, transform .2s;}
.stat-card:hover{border-color:rgba(255,255,255,0.35);transform:translateY(-1px);}
.stat-card .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
.stat-card .stat-value{font-family:var(--font-mono);font-size:27px;font-weight:600;margin-top:6px;color:var(--cyan);text-shadow:0 0 18px rgba(255,255,255,0.35);}
.stat-card .stat-note{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.stat-card.danger .stat-value{color:var(--danger);text-shadow:0 0 18px rgba(255,77,116,0.4);}
.stat-card.success .stat-value{color:var(--success);text-shadow:0 0 18px rgba(51,240,180,0.35);}
.stat-card.warn .stat-value{color:var(--warn);text-shadow:0 0 18px rgba(255,194,78,0.35);}

/* ---------- Upload steps (Setup) ---------- */
.setup-step{border:1px solid var(--edge);border-radius:var(--radius);background:linear-gradient(160deg, var(--panel-2), var(--panel));margin-bottom:16px;overflow:hidden;transition:border-color .2s;}
.setup-step-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;}
.setup-step-num{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--edge);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none;background:var(--panel);color:var(--ink-soft);
}
.setup-step.done{border-color:rgba(51,240,180,0.3);}
.setup-step.done .setup-step-num{background:var(--success);color:#04241a;border-color:var(--success);box-shadow:0 0 10px rgba(51,240,180,0.55);}
.setup-step-title{font-weight:600;font-size:14.5px;flex:1;}
.setup-step-desc{font-size:12px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
.setup-step-status{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}
.setup-step.done .setup-step-status{color:var(--success);}
.setup-step-body{padding:0 20px 22px 60px;border-top:1px dashed var(--edge-soft);}
.setup-step-body.collapsed{display:none;}

.dropzone{
  border:1.5px dashed var(--edge);border-radius:var(--radius);padding:22px;text-align:center;
  background:rgba(255,255,255,0.03);margin-top:14px;transition:border-color .15s, box-shadow .15s;
}
.dropzone.drag{border-color:var(--cyan);background:rgba(255,255,255,0.06);box-shadow:0 0 0 3px rgba(255,255,255,0.12);}
.dropzone input[type=file]{display:none;}
.dz-btn{
  display:inline-block;padding:9px 20px;background:linear-gradient(120deg, var(--cyan), var(--violet));color:#0A0A0A;border:none;
  border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;margin-top:8px;box-shadow:0 4px 18px rgba(255,255,255,0.25);
}
.dz-hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}

/* column mapper */
.colmap-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:6px 0;}
.colmap-row label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.colmap-req{color:var(--danger);}

/* ---------- Form elements ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:var(--radius-sm);
  background:var(--input-bg);color:var(--ink);font-size:13.5px;transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(255,255,255,0.16);}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.field.mono input{font-family:var(--font-mono);}
.field.readonly input{background:rgba(255,255,255,0.05);color:var(--ink-soft);}
.inline-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}

/* ---------- Buttons ---------- */
.btn{
  padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid var(--edge);
  background:var(--panel-3);color:var(--ink);display:inline-flex;align-items:center;gap:7px;
  position:relative;overflow:hidden;transition:border-color .15s, transform .1s, box-shadow .15s;
}
.btn:hover{border-color:rgba(255,255,255,0.4);box-shadow:0 0 16px rgba(255,255,255,0.18);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.secondary{background:transparent;color:var(--ink-soft);}
.btn.secondary:hover{background:rgba(255,255,255,0.07);color:var(--ink);}
.btn.accent{background:linear-gradient(120deg, var(--cyan), var(--violet));border-color:transparent;color:#0A0A0A;font-weight:700;box-shadow:0 6px 22px rgba(255,255,255,0.28);}
.btn.accent:hover{box-shadow:0 8px 28px rgba(255,255,255,0.42);transform:translateY(-1px);}
.btn.danger{background:linear-gradient(120deg, var(--danger), #B23A5C);border-color:transparent;color:#fff;}
.btn.small{padding:6px 12px;font-size:12px;}
.btn.wide{width:100%;justify-content:center;}
.icon-btn{background:transparent;border:1px solid var(--edge);border-radius:var(--radius-sm);width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .15s, color .15s;}
.icon-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(255,255,255,0.25);}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:var(--radius);background:rgba(8,8,9,0.6);}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{
  text-align:left;padding:10px 12px;background:var(--panel-3);color:var(--ink-soft);
  font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  position:sticky;top:0;border-bottom:1px solid rgba(255,255,255,0.25);
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--edge-soft);vertical-align:middle;white-space:nowrap;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.05);}
td.num,th.num{font-family:var(--font-mono);text-align:right;}
td.wrap{white-space:normal;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.badge.over{background:var(--danger-soft);color:var(--danger);animation:alertPulse 1.8s ease-in-out infinite;}
.badge.under{background:var(--warn-soft);color:var(--warn);}
.badge.match{background:var(--success-soft);color:var(--success);}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor;}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 rgba(255,77,116,0);}50%{box-shadow:0 0 10px rgba(255,77,116,0.55);}}
.row-over{background:rgba(255,77,116,0.05);}
.row-over:hover{background:rgba(255,77,116,0.09) !important;}

.empty-state{padding:50px 20px;text-align:center;color:var(--ink-faint);}
.empty-state .em-icon{font-size:30px;margin-bottom:10px;opacity:.6;}
.empty-state h3{color:var(--ink-soft);font-size:15px;margin-bottom:6px;}
.empty-state p{font-size:12.5px;max-width:40ch;margin:0 auto;}

/* filters bar */
.filterbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:flex-end;}
.filterbar .field{margin-bottom:0;min-width:150px;}
.filterbar .field.grow{flex:1;min-width:200px;}

/* search combobox */
.combo{position:relative;}
.combo-results{
  position:absolute;top:100%;left:0;right:0;background:var(--panel-2);border:1px solid rgba(255,255,255,0.3);
  border-radius:var(--radius-sm);max-height:260px;overflow-y:auto;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.12);margin-top:3px;
}
.combo-item{padding:9px 12px;border-bottom:1px solid var(--edge-soft);font-size:12.5px;}
.combo-item:hover,.combo-item.hl{background:rgba(255,255,255,0.08);}
.combo-item .ci-name{font-weight:600;color:var(--ink);}
.combo-item .ci-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-top:2px;}
.combo-empty{padding:12px;color:var(--ink-faint);font-size:12px;}

/* line items grid */
.li-table{width:100%;border-collapse:collapse;margin-top:8px;}
.li-table th{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--edge);}
.li-table td{padding:6px 8px;border-bottom:1px solid var(--edge-soft);}
.li-table input{width:100%;border:1px solid var(--edge);border-radius:3px;padding:6px 8px;font-size:12.5px;font-family:var(--font-mono);background:var(--input-bg);color:var(--ink);}
.li-table input.prodsearch{font-family:var(--font-body);}

.tag{font-family:var(--font-mono);font-size:10.5px;background:rgba(255,255,255,0.1);color:var(--cyan);padding:2px 7px;border-radius:4px;border:1px solid rgba(255,255,255,0.2);}

.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';width:7px;height:7px;flex:none;background:var(--cyan);box-shadow:0 0 6px var(--cyan);border-radius:2px;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{
  background:var(--panel-2);color:var(--ink);padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;

}
.toast.err{border-left-color:var(--danger);box-shadow:0 14px 34px rgba(0,0,0,0.5), 0 0 20px rgba(255,77,116,0.18);}

@keyframes toastin{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}

.stamp-note{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);border-left:2px solid var(--edge);padding-left:10px;
}
.pill-group{display:flex;gap:8px;flex-wrap:wrap;}
.pill-opt{padding:7px 14px;border:1px solid var(--edge);border-radius:100px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--panel-2);transition:border-color .15s, color .15s;}
.pill-opt.sel{border-color:transparent;background:linear-gradient(120deg, var(--cyan), var(--violet));color:#0A0A0A;box-shadow:0 0 14px rgba(255,255,255,0.3);}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);margin:22px 0;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--panel);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:24px 26px;border:1px solid var(--edge);box-shadow:var(--shadow-card);}
.modal h3{margin-bottom:14px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--ink-soft);}
.small-muted{font-size:11.5px;color:var(--ink-faint);}
.kbd{font-family:var(--font-mono);background:var(--panel-2);border:1px solid var(--edge);padding:1px 6px;border-radius:3px;font-size:10.5px;color:var(--ink-soft);}
.loader{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;box-shadow:0 0 8px rgba(255,255,255,0.4);}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-bar{height:5px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:8px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg, var(--cyan), var(--violet));box-shadow:0 0 10px rgba(255,255,255,0.5);transition:width .2s;}
footer.appfoot{text-align:center;color:var(--ink-faint);font-size:11px;margin-top:26px;}
</style>

<body>
<canvas id="bgfx"></canvas>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script id="app-script">
/* ============================================================
   RATE LEDGER — Overinvoicing Audit
   Single-file client-side app. No data leaves the browser.
   ============================================================ */

/* ---------------- Global state ---------------- */
const STATE = {
  dbMaster: [],        // {code, name, pg, pgName, active, beatCode, beatName, so, asm, rsm}
  dbMasterFile: null,
  priceGroupMap: [],   // {location, pg} — auto-filled from DB Master's Price Group + Price Group Name columns, or upload Step 2 to override
  pgMapFile: null,
  pgMapAuto: false,     // true when priceGroupMap came from the DB Master upload, not a separate Step 2 file
  rateRows: [],        // {location, category, gstPct, productName, sku, productCode, rate, effDate(Date), effDateStr, sourceFile}
  rateFiles: [],        // {fileName, location, matchedLocation, effDateStr, rowCount, status}
  beatSoMap: {},        // code -> {name, beat, beatName, so, asm, rsm} — manual Step 4 override only
  beatSoFile: null,
  beatSoAuto: false,    // true when the DB Master upload itself carried Beat/SO/ASM/RSM columns (routing then lives on STATE.dbMaster records)
  uomMap: {},            // productCode -> {name, category, packSize, kgPerPc, kgPerBag} — UOM conversion master
  uomMapFile: null,
  bills: [],            // flattened report rows
  billFiles: {},        // billUid -> {fileName, ext, dataUrl, savedName} — attached bill photo/PDF copy
  currentTab: 'dashboard',
  billForm: null,       // in-progress bill header + line items
};

let BILL_SEQ = 1;

/* ---------------- Small utils ---------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9); }
function fmtMoney(n){ if(n==null||isNaN(n)) return '—'; return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return (n==null||isNaN(n))?'—':n.toLocaleString('en-IN'); }
function clamp2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function prefersReducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
/* Animated readout — counts a stat-value node up from 0 to target on render. */
function countUp(el, target, opts){
  if(!el) return;
  opts = opts || {};
  const prefix = opts.prefix||'', suffix = opts.suffix||'', decimals = opts.decimals||0, duration = opts.duration||700;
  const finalText = prefix + (decimals ? target.toLocaleString('en-IN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}) : Math.round(target).toLocaleString('en-IN')) + suffix;
  if(prefersReducedMotion() || !isFinite(target)){ el.textContent = finalText; return; }
  const t0 = performance.now();
  function frame(now){
    const p = Math.min(1, (now-t0)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = target*eased;
    el.textContent = prefix + (decimals ? val.toLocaleString('en-IN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}) : Math.round(val).toLocaleString('en-IN')) + suffix;
    if(p<1) requestAnimationFrame(frame); else el.textContent = finalText;
  }
  requestAnimationFrame(frame);
}

function toast(msg, type){
  const wrap = $('#toastWrap');
  const t = el(`<div class="toast ${type==='err'?'err':(type==='ok'?'ok':'')}">${esc(msg)}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3400);
}

/* date helpers: business dates are DD-MM-YYYY */
function parseDMY(str){
  if(!str) return null;
  const m = String(str).trim().match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(!m) return null;
  let [_,d,mo,y] = m;
  if(y.length===2) y = '20'+y;
  const dt = new Date(Number(y), Number(mo)-1, Number(d));
  if(isNaN(dt.getTime())) return null;
  return dt;
}
function fmtDMY(dt){
  if(!dt) return '—';
  const d = String(dt.getDate()).padStart(2,'0');
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const y = dt.getFullYear();
  return `${d}-${m}-${y}`;
}
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function isoToDMYDate(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
// Quick numeric date entry: "260826" -> 26-08-26, "010826" -> 01-08-26, etc.
// Expects exactly 6 digits, DDMMYY, and assumes the 21st century.
function ddmmyyToISO(str){
  const digits = String(str||'').replace(/\D/g,'');
  if(digits.length !== 6) return null;
  const dd = Number(digits.slice(0,2)), mm = Number(digits.slice(2,4)), yy = Number(digits.slice(4,6));
  if(mm<1 || mm>12) return null;
  const year = 2000+yy;
  const daysInMonth = new Date(year, mm, 0).getDate();
  if(dd<1 || dd>daysInMonth) return null;
  return `${year}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

/* location normalization + alias matching */
const LOCATION_ALIASES = {
  'wb':'west bengal', 'w.b.':'west bengal', 'west bengal':'west bengal',
  'kol':'kolkata', 'kolkata':'kolkata', 'cal':'kolkata', 'calcutta':'kolkata',
  'nb':'north bengal', 'north bengal':'north bengal', 'n.bengal':'north bengal', 'nbengal':'north bengal',
  'jhk':'jharkhand', 'jharkhand':'jharkhand',
  'ods':'odisha', 'odisha':'odisha', 'orissa':'odisha',
  'bihar':'bihar', 'patna':'patna',
  'up':'uttar pradesh',
  'guwahati':'guwahati', 'assam':'guwahati', 'guw':'guwahati',
  'delhi':'delhi',
  'abp':'abp',
  'and':'andaman', 'andaman':'andaman',
};
function normLoc(s){
  if(!s) return '';
  let x = String(s).toLowerCase().trim().replace(/[._]/g,' ').replace(/\s+/g,' ');
  x = x.replace(/^location\s*-?\s*/,'').trim();
  return LOCATION_ALIASES[x] || x;
}
function locEq(a,b){
  const na = normLoc(a), nb = normLoc(b);
  if(!na || !nb) return false;
  if(na===nb) return true;
  return na.includes(nb) || nb.includes(na);
}
function normPG(v){
  if(v==null) return '';
  let s = String(v).trim();
  if(/^\d+$/.test(s) && s.length===1) s = '0'+s;
  return s;
}

/* ---------------- App shell ---------------- */
const TABS = [
  {id:'dashboard', label:'Dashboard', num:'00'},
  {id:'setup', label:'Data Setup', num:'01'},
  {id:'ratemaster', label:'Rate Master', num:'02'},
  {id:'ratecheck', label:'Rate Check', num:'03'},
  {id:'reports', label:'Reports', num:'04'},
];

function setupComplete(){ return STATE.dbMaster.length>0 && STATE.priceGroupMap.length>0 && STATE.rateRows.length>0; }

function renderShell(){
  const app = $('#app');
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">RL</div>
        <div class="brand-text">
          <h1>Rate Ledger</h1>
          <p>Overinvoicing audit for the DB → retailer network</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div class="status-strip" id="statusStrip"></div>
        <div class="theme-switch" id="themeSwitch"></div>
      </div>
    </header>
    <nav class="tabstrip" id="tabStrip"><div id="tabButtons" style="display:flex;gap:4px;"></div><span class="tab-indicator" id="tabIndicator"></span></nav>
    <main>
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-setup"></section>
      <section class="view" id="view-ratemaster"></section>
      <section class="view" id="view-ratecheck"></section>
      <section class="view" id="view-reports"></section>
    </main>
    <footer class="appfoot">All data stays in this browser tab — nothing is uploaded to a server. Refreshing the page clears it, so export your report before you close the tab.</footer>
  `;
  renderTabs();
  renderStatusStrip();
  renderThemeSwitch();
}

/* ---------------- Theme switcher ---------------- */
const THEMES = [
  {id:'dark', label:'Tech Universe'},
  {id:'light', label:'Black & White'},
];
function getTheme(){
  try{ return localStorage.getItem('rl_theme') || 'light'; }catch(e){ return 'light'; }
}
function applyTheme(theme){
  if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}
function setTheme(theme){
  applyTheme(theme);
  try{ localStorage.setItem('rl_theme', theme); }catch(e){}
  renderThemeSwitch();
}
function renderThemeSwitch(){
  const host = $('#themeSwitch');
  if(!host) return;
  const current = getTheme();
  host.innerHTML = `
    <span class="small-muted" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600;">Theme</span>
    <div class="pill-group">
      ${THEMES.map(t=>`<div class="pill-opt ${current===t.id?'sel':''}" data-theme-opt="${t.id}">${esc(t.label)}</div>`).join('')}
    </div>`;
  $all('.pill-opt', host).forEach(p=>p.addEventListener('click', ()=> setTheme(p.dataset.themeOpt)));
}
// Apply the saved theme immediately (before first render) so there's no flash.
applyTheme(getTheme());

function renderTabs(){
  const strip = $('#tabStrip');
  const btnHost = $('#tabButtons');
  btnHost.innerHTML = TABS.map(t=>{
    const locked = (t.id==='ratemaster' || t.id==='ratecheck' || t.id==='reports') && !setupComplete();
    return `<button class="tab-btn ${STATE.currentTab===t.id?'active':''}" data-tab="${t.id}" ${locked?'disabled title="Finish Data Setup first"':''}>
      <span class="tab-num">${t.num}</span> ${t.label}
    </button>`;
  }).join('');
  $all('.tab-btn', btnHost).forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
  requestAnimationFrame(positionTabIndicator);
}
function positionTabIndicator(){
  const strip = $('#tabStrip');
  const ind = $('#tabIndicator');
  const active = $('.tab-btn.active', strip);
  if(!strip || !ind || !active) return;
  const sRect = strip.getBoundingClientRect(), aRect = active.getBoundingClientRect();
  ind.style.left = (aRect.left - sRect.left) + 'px';
  ind.style.width = aRect.width + 'px';
}
window.addEventListener('resize', ()=> positionTabIndicator());

function renderStatusStrip(){
  const s = $('#statusStrip');
  const chips = [
    {label:`${STATE.dbMaster.length} DBs`, ready: STATE.dbMaster.length>0},
    {label:`${STATE.priceGroupMap.length} Price Groups`, ready: STATE.priceGroupMap.length>0},
    {label:`${new Set(STATE.rateRows.map(r=>r.location)).size} Locations rated`, ready: STATE.rateRows.length>0},
    {label:`${STATE.bills.length} lines checked`, ready: STATE.bills.length>0},
  ];
  s.innerHTML = chips.map(c=>`<div class="status-chip ${c.ready?'ready':''}"><span class="status-dot"></span>${c.label}</div>`).join('');
}

function switchTab(id){
  if((id==='ratemaster'||id==='ratecheck'||id==='reports') && !setupComplete()){
    toast('Finish Data Setup (Steps 1–3) first', 'err');
    id = 'setup';
  }
  STATE.currentTab = id;
  $all('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  $all('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+id).classList.add('active');
  if(id==='dashboard') renderDashboard();
  if(id==='setup') renderSetup();
  if(id==='ratemaster') renderRateMaster();
  if(id==='ratecheck') renderRateCheck();
  if(id==='reports') renderReports();
  renderTabs();
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const view = $('#view-dashboard');
  const overRows = STATE.bills.filter(b=>b.status==='over');
  const underRows = STATE.bills.filter(b=>b.status==='under');
  const overAmt = overRows.reduce((s,b)=> s + (isNaN(b.overchargeAmt)?0:b.overchargeAmt), 0);
  const underAmt = underRows.reduce((s,b)=> s + (isNaN(b.underchargeAmt)?0:b.underchargeAmt), 0);
  const uniqueBills = new Set(STATE.bills.map(b=>b.billUid)).size;
  const byLoc = {};
  STATE.bills.forEach(b=>{ byLoc[b.location]=byLoc[b.location]||{total:0,over:0}; byLoc[b.location].total++; if(b.status==='over') byLoc[b.location].over++; });

  view.innerHTML = `
    <div class="view-head">
      <div><h2>Dashboard</h2><p class="sub">Snapshot of your rate master coverage and market bill checks so far.</p></div>
    </div>
    <div class="grid-4">
      <div class="stat-card"><div class="stat-label">DB Master</div><div class="stat-value" id="cuDbMaster">0</div><div class="stat-note">distributors loaded</div></div>
      <div class="stat-card"><div class="stat-label">Rate Master SKUs</div><div class="stat-value" id="cuRateSkus">0</div><div class="stat-note">across ${new Set(STATE.rateRows.map(r=>r.location)).size} location(s)</div></div>
      <div class="stat-card"><div class="stat-label">Bills Checked</div><div class="stat-value" id="cuBillsChecked">0</div><div class="stat-note">${fmtInt(STATE.bills.length)} product lines</div></div>
      <div class="stat-card ${overRows.length?'danger':''}"><div class="stat-label">Overcharge Instances</div><div class="stat-value" id="cuOverInst">0</div><div class="stat-note">₹${fmtMoney(overAmt)} total overcharge</div></div>
      <div class="stat-card ${underRows.length?'warn':''}"><div class="stat-label">Undercharge Instances</div><div class="stat-value" id="cuUnderInst">0</div><div class="stat-note">₹${fmtMoney(underAmt)} total undercharge</div></div>
    </div>

    <div class="section-title">Setup checklist</div>
    <div class="grid-4">
      ${checklistCard('1 · DB Master', STATE.dbMaster.length? `${STATE.dbMaster.length} DBs loaded`:'Not uploaded', STATE.dbMaster.length>0)}
      ${checklistCard('2 · Price Group ↔ Location', STATE.priceGroupMap.length? `${STATE.priceGroupMap.length} mappings${STATE.pgMapAuto?' (auto)':''}`:'Not uploaded', STATE.priceGroupMap.length>0)}
      ${checklistCard('3 · Rate Files', STATE.rateRows.length? `${STATE.rateFiles.length} PDF(s), ${STATE.rateRows.length} SKU rows`:'Not uploaded', STATE.rateRows.length>0)}
      ${checklistCard('4 · Beat/SO/ASM/RSM', STATE.beatSoAuto ? `Aligned from DB Master` : (Object.keys(STATE.beatSoMap).length? `${Object.keys(STATE.beatSoMap).length} DB mapped` : 'Optional — not uploaded'), STATE.beatSoAuto || Object.keys(STATE.beatSoMap).length>0, true)}
      ${checklistCard('5 · UOM Conversion', Object.keys(STATE.uomMap).length? `${Object.keys(STATE.uomMap).length} products mapped` : 'Optional — not uploaded', Object.keys(STATE.uomMap).length>0, true)}
    </div>

    ${!setupComplete() ? `<div class="card dashed" style="margin-top:20px;text-align:center;">
        <p style="margin-bottom:10px;color:var(--ink-soft);">Upload Steps 1–3 to unlock Rate Master, Rate Check and Reports.</p>
        <button class="btn accent" id="goSetup">Go to Data Setup →</button>
      </div>` : ''}

    ${Object.keys(byLoc).length ? `
    <div class="section-title">Overcharge by location</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Location</th><th class="num">Lines checked</th><th class="num">Overcharge lines</th><th class="num">Overcharge rate</th></tr></thead>
      <tbody>
        ${Object.entries(byLoc).map(([loc,v])=>`<tr><td>${esc(loc)}</td><td class="num">${v.total}</td><td class="num">${v.over}</td><td class="num">${((v.over/v.total)*100).toFixed(0)}%</td></tr>`).join('')}
      </tbody>
    </table></div>` : ''}
  `;
  const gs = $('#goSetup'); if(gs) gs.addEventListener('click', ()=>switchTab('setup'));
  countUp($('#cuDbMaster'), STATE.dbMaster.length);
  countUp($('#cuRateSkus'), STATE.rateRows.length);
  countUp($('#cuBillsChecked'), uniqueBills);
  countUp($('#cuOverInst'), overRows.length);
  countUp($('#cuUnderInst'), underRows.length);
}
function checklistCard(title, note, done, optional){
  return `<div class="stat-card" style="border-left:3px solid ${done?'var(--success)':(optional?'var(--edge)':'var(--warn)')}">
    <div class="stat-label">${esc(title)}</div>
    <div style="font-size:13px;margin-top:8px;color:${done?'var(--success)':'var(--ink-soft)'};font-weight:600;">${done?'✓ ':''}${esc(note)}</div>
  </div>`;
}

/* ---------------- Generic column-mapper (used by uploaders) ---------------- */
/* Given headerRow (array of strings) + guesses [{key,label,required,patterns:[regex]}]
   renders a mapper block into container and calls onConfirm(map) where map[key]=colIndex */
function autoGuessColumn(headers, patterns){
  for(let i=0;i<headers.length;i++){
    const h = String(headers[i]||'').toLowerCase();
    if(patterns.some(p=>p.test(h))) return i;
  }
  return -1;
}
function renderColumnMapper(container, headers, previewRows, fields, onConfirm){
  const guesses = {};
  fields.forEach(f=>{ guesses[f.key] = autoGuessColumn(headers, f.patterns); });
  const colOptions = (sel)=> `<option value="-1">— none —</option>` + headers.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h || '(col '+(i+1)+')')}</option>`).join('');
  container.innerHTML = `
    <div class="card" style="background:var(--panel);">
      <div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;">Match columns</div>
      ${fields.map(f=>`
        <div class="colmap-row">
          <label>${esc(f.label)} ${f.required?'<span class="colmap-req">*</span>':''}</label>
          <select data-key="${f.key}">${colOptions(guesses[f.key])}</select>
          <span class="small-muted">${f.hint||''}</span>
        </div>`).join('')}
    </div>
    <div class="table-wrap" style="margin-top:14px;max-height:220px;overflow:auto;">
      <table><thead><tr>${headers.map(h=>`<th>${esc(h||'')}</th>`).join('')}</tr></thead>
      <tbody>${previewRows.slice(0,6).map(r=>`<tr>${headers.map((_,i)=>`<td>${esc(r[i]==null?'':r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;">
      <button class="btn accent" id="confirmMapBtn">Confirm & load</button>
      <span class="small-muted" id="mapErr" style="color:var(--danger);"></span>
    </div>
  `;
  $('#confirmMapBtn', container).addEventListener('click', ()=>{
    const map = {};
    fields.forEach(f=>{ const v = $(`select[data-key="${f.key}"]`, container).value; map[f.key] = Number(v); });
    const missing = fields.filter(f=>f.required && map[f.key]===-1);
    if(missing.length){ $('#mapErr',container).textContent = 'Please map: '+missing.map(m=>m.label).join(', '); return; }
    onConfirm(map);
  });
}

function readWorkbookFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array', cellDates:false});
        resolve(wb);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function sheetToRows(ws){
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
}
function findHeaderRowIndex(rows, mustHave){
  for(let i=0;i<Math.min(rows.length,8);i++){
    const row = rows[i].map(c=>String(c||'').toLowerCase());
    if(mustHave.some(pat=>row.some(c=>pat.test(c)))) return i;
  }
  return -1; // no confident header row found — caller should treat the sheet as headerless
}

  container.innerHTML = `

async function handleDbMasterFile(file){
  try{
    const wb = await readWorkbookFile(file);
    const shName = wb.SheetNames[0];
    const rows = sheetToRows(wb.Sheets[shName]);
    let headerIdx = findHeaderRowIndex(rows, [/customer|db\s*code|distributor\s*code|sap/i, /name/i]);
    let headers, dataRows;
    if(headerIdx===-1){ headers = rows[0].map(()=>''); dataRows = rows.filter(r=>r.some(c=>String(c).trim()!=='')); }
    else { headers = rows[headerIdx]; dataRows = rows.slice(headerIdx+1).filter(r=>r.some(c=>String(c).trim()!=='')); }
    const mapDiv = $('#s1mapper');
    renderColumnMapper(mapDiv, headers, dataRows, [
      {key:'code', label:'DB Code', required:true, patterns:[/distributor\s*code/i,/customer/i,/db\s*code/i,/sap/i,/code/i]},
      {key:'name', label:'DB Name', required:true, patterns:[/distributor\s*name/i,/^name$/i,/customer name/i,/db name/i,/party/i]},
      {key:'pg', label:'Price Group', required:true, patterns:[/^price\s*group$/i,/price\s*group\s*code/i,/^pg$/i]},
      {key:'pgName', label:'Price Group Name', required:false, patterns:[/price\s*group\s*name/i], hint:'Used as Location — auto-fills Step 2'},
      {key:'beatCode', label:'Beat Code', required:false, patterns:[/beat\s*code/i,/^beat$/i]},
      {key:'beatName', label:'Beat Name', required:false, patterns:[/beat\s*name/i]},
      {key:'active', label:'Active / Inactive', required:false, patterns:[/active/i,/status/i]},
      {key:'rsm', label:'RSM Name (Sales Head)', required:false, patterns:[/sales\s*head/i,/rsm/i]},
      {key:'asm', label:'ASM Name', required:false, patterns:[/^asm$/i,/asm\s*name/i,/\basm\b/i]},
      {key:'so', label:'SO Name (TSO/RSO)', required:false, patterns:[/tso\s*\/?\s*rso/i,/\btso\b/i,/\brso\b/i,/so\s*name/i]},
    ], (map)=>{
      const g = (r,k)=> map[k]>=0 ? String(r[map[k]]==null?'':r[map[k]]).trim() : '';
      const rawRows = dataRows.map(r=>({
        code: String(r[map.code]).trim(),
        name: String(r[map.name]).trim(),
        pg: normPG(r[map.pg]),
        pgName: g(r,'pgName'),
        active: g(r,'active'),
        beatCode: g(r,'beatCode'),
        beatName: g(r,'beatName'),
        rsm: g(r,'rsm'),
        asm: g(r,'asm'),
        so: g(r,'so'),
      })).filter(x=>x.code && x.code!=='undefined');

      // This file is often "one row per DB-beat" (a distributor covers many beats/routes),
      // so dedupe into one DB Master record per DB code, collecting its distinct beats.
      const byCode = {}; const order = [];
      rawRows.forEach(x=>{
        if(!byCode[x.code]){
          byCode[x.code] = { code:x.code, name:x.name, pg:x.pg, pgName:x.pgName, active:x.active, rsm:x.rsm, asm:x.asm, so:x.so, beats:[] };
          order.push(x.code);
        }
        if(x.beatCode || x.beatName){
          const rec = byCode[x.code];
          if(!rec.beats.some(b=>b.code===x.beatCode && b.name===x.beatName)) rec.beats.push({code:x.beatCode, name:x.beatName});
        }
      });
      const list = order.map(c=>byCode[c]);
      STATE.dbMaster = list;
      STATE.dbMasterFile = file.name;

      // Consolidated format: align Price Group ↔ Location (Step 2) straight from this file.
      if(map.pgName>=0){
        const pgSeen = {};
        list.forEach(x=>{ if(x.pg && x.pgName && !pgSeen[x.pg]) pgSeen[x.pg]=x.pgName; });
        STATE.priceGroupMap = Object.entries(pgSeen).map(([pg,location])=>({pg, location}));
        STATE.pgMapFile = file.name;
        STATE.pgMapAuto = true;
      }
      // Consolidated format: routing (Beat/SO/ASM/RSM) now lives directly on each DB Master
      // record above — clear any stale manual Step 4 override so it doesn't shadow fresh data.
      STATE.beatSoMap = {}; STATE.beatSoFile = null;
      STATE.beatSoAuto = (map.beatCode>=0 || map.beatName>=0 || map.so>=0 || map.asm>=0 || map.rsm>=0);

      const multiBeatDbs = list.filter(x=>x.beats.length>1).length;
      const bits = [`${list.length} DBs`];
      if(STATE.pgMapAuto) bits.push(`${STATE.priceGroupMap.length} price-group→location`);
      if(STATE.beatSoAuto) bits.push('beat/SO/ASM/RSM aligned'+(multiBeatDbs?` (${multiBeatDbs} DBs span multiple beats)`:''));
      toast(`Loaded — ${bits.join(', ')}`, 'ok');
      SETUP_OPEN_STEP = STATE.priceGroupMap.length ? 0 : 2;
      renderSetup(); renderStatusStrip(); renderTabs();
    });
  }catch(err){ console.error(err); toast('Could not read file: '+err.message, 'err'); }
}

async function handleRateZips(files){
  const progDiv = $('#s3progress');
  const allItems = [];
  try{
    for(let fi=0; fi<files.length; fi++){
      const file = files[fi];
      progDiv.innerHTML = `<div class="small-muted" style="margin-top:10px;">Reading ${esc(file.name)} (ZIP ${fi+1}/${files.length})…</div><div class="progress-bar"><div style="width:${Math.round(((fi)/files.length)*100)}%"></div></div>`;
      let zip;
      try{ zip = await JSZip.loadAsync(file); }
      catch(e){ toast(`Could not read ${file.name} — skipped`, 'err'); continue; }
      const pdfEntries = Object.values(zip.files).filter(f=>!f.dir && /\.pdf$/i.test(f.name));
      if(!pdfEntries.length){ toast(`No PDFs found inside ${file.name}`, 'err'); continue; }
      for(let i=0;i<pdfEntries.length;i++){
        const entry = pdfEntries[i];
        const pct = Math.round(((fi + (i+1)/pdfEntries.length) / files.length) * 100);
        progDiv.innerHTML = `<div class="small-muted" style="margin-top:10px;">Parsing ${esc(entry.name)} — ZIP ${fi+1}/${files.length}, file ${i+1}/${pdfEntries.length}…</div><div class="progress-bar"><div style="width:${pct}%"></div></div>`;
        const buf = await entry.async('arraybuffer');
        const meta = parseRateFilename(entry.name.split('/').pop());
        let rows = [];
        try{ rows = await parseRatePdf(buf); }
        catch(e){ console.error('PDF parse failed for', entry.name, e); }
        const matched = matchLocation(meta.location);
        allItems.push({ fileName: entry.name.split('/').pop(), detectedLocation: meta.location, effDateStr: meta.dateStr, matchedLocation: matched, rows });
      }
    }
    progDiv.innerHTML = '';
    if(!allItems.length){ toast('No PDF rate files found in the selected ZIP(s)', 'err'); return; }
    renderRateReview(allItems);
  }catch(err){
    console.error(err); toast('Could not read ZIP(s): '+err.message, 'err'); progDiv.innerHTML='';
  }
}

function parseRateFilename(name){
  const base = name.replace(/\.pdf$/i,'');
  const dm = base.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  let dateStr = null;
  let locPart = base;
  if(dm){
    dateStr = `${dm[1].padStart(2,'0')}-${dm[2].padStart(2,'0')}-${dm[3].length===2?'20'+dm[3]:dm[3]}`;
    locPart = base.slice(0, dm.index);
  }
  locPart = locPart.replace(/current\s*rate/i,'').replace(/[-_]/g,' ').trim();
  return { location: locPart, dateStr };
}
function matchLocation(detected){
  if(!STATE.priceGroupMap.length) return null;
  const uniqueLocs = Array.from(new Set(STATE.priceGroupMap.map(m=>m.location)));
  const hit = uniqueLocs.find(l=>locEq(l, detected));
  return hit || null;
}

/* known category headers on this rate-sheet template, used to tell a real
   category header apart from a bare product-name line (see below) */
const KNOWN_CATEGORIES = [
  'ATTA','MAIDA','SOOJI','DALIA','SATTU','CHANA BESAN','MATAR BESAN','BESAN','INSTANT MIX',
  'PAPAD','RICE & SUGAR','RICE','SUGAR','MILLET FLOUR','ETHNIC FLOUR','PULSES','SPICES',
  'OTHERS','SNACKS','MUMMYS OWN', "MUMMY'S OWN",
];
function isKnownCategory(text){
  const t = text.toUpperCase().replace(/[().]/g,'').trim();
  return KNOWN_CATEGORIES.some(k=> t===k || t.startsWith(k+' '));
}

/* PDF table parser using pdf.js — column positions are consistent across
   this rate-sheet template: Name(<242) | SKU(242-268) | Code(268-305) | Rate(>305) */
async function parseRatePdf(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const rows = [];
  let currentCategory = '';
  let lastProductName = '';
  let lastCode = null;
  let pending = []; // leading data rows with no name yet, waiting for the merged-cell name to appear
  function flushPending(nameForThem){
    pending.forEach(pr=>{ pr.productName = nameForThem || lastProductName || ''; rows.push(pr); });
    pending = [];
  }
  for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({ text: it.str, x: it.transform[4], y: Math.round(it.transform[5]*10)/10 }))
      .filter(it=>it.text.trim()!=='');
    // Cluster into visual lines with a tight y-tolerance. Some rows on this
    // template render two SKU variants of one product on baselines only ~2.4pt
    // apart (with the shared name on its own line between them), so a loose
    // tolerance silently merges/loses rows — keep this tight.
    const lines = [];
    items.forEach(it=>{
      let line = lines.find(l=>Math.abs(l.y-it.y)<1.1);
      if(!line){ line = {y: it.y, items:[]}; lines.push(line); }
      line.items.push(it);
    });
    lines.sort((a,b)=> b.y - a.y);
    for(const line of lines){
      line.items.sort((a,b)=>a.x-b.x);
      const nameWords=[], skuWords=[], codeWords=[], rateWords=[];
      line.items.forEach(it=>{
        if(it.x < 242) nameWords.push(it.text);
        else if(it.x < 268) skuWords.push(it.text);
        else if(it.x < 306) codeWords.push(it.text);
        else rateWords.push(it.text);
      });
      const nameText = nameWords.join(' ').replace(/\s+/g,' ').trim();
      const skuText = skuWords.join(' ').replace(/\s+/g,' ').trim();
      const codeText = codeWords.join('').trim();
      const rateText = rateWords.join('').trim();
      if(nameText==='Product' && skuText==='SKU') continue;
      const rateNum = parseFloat(rateText.replace(/[^0-9.]/g,''));
      const isDataRow = /^\d{3,}$/.test(codeText) && !isNaN(rateNum) && rateNum>0;
      if(isDataRow){
        const codeNum = parseInt(codeText, 10);
        if(nameText){
          flushPending(nameText);
          lastProductName = nameText; lastCode = codeNum;
          rows.push({ category: currentCategory, productName: nameText, sku: skuText, productCode: codeText, rate: rateNum });
        } else if(pending.length===0 && lastCode!=null && !isNaN(codeNum) && Math.abs(codeNum-lastCode)<=20){
          // No name on this row, but its code closely follows the last resolved
          // row — a trailing pack-size variant of that same product.
          lastCode = codeNum;
          rows.push({ category: currentCategory, productName: lastProductName, sku: skuText, productCode: codeText, rate: rateNum });
        } else {
          // Leading edge of a product whose name hasn't rendered yet — hold it.
          pending.push({ category: currentCategory, productName: null, sku: skuText, productCode: codeText, rate: rateNum });
        }
        continue;
      }
      const combined = [nameText,skuText,codeText,rateText].join(' ').trim();
      if(!combined) continue;
      if(/^location\b/i.test(combined)) continue;
      const noDigits = !/\d/.test(combined.replace(/[().&,]/g,''));
      if(noDigits && combined.length < 60 && combined === combined.toUpperCase()){
        if(isKnownCategory(combined)){
          flushPending();
          currentCategory = combined.trim();
          lastProductName = '';
          lastCode = null;
        } else {
          // A bare all-caps line that isn't a known category header is a product
          // name that landed on its own baseline — declare it without starting
          // a new category.
          flushPending(combined);
          lastProductName = combined;
        }
      }
    }
  }
  flushPending();
  return rows;
}

function renderRateReview(items){

  div.innerHTML = `

      <thead><tr><th>File</th><th>Detected</th><th>Matches to</th><th>Effective Date</th><th class="num">Rows parsed</th></tr></thead>
      <tbody>
        ${items.map((it,i)=>`<tr>
          <td class="wrap">${esc(it.fileName)}</td>
          <td>${esc(it.detectedLocation)}</td>
          <td><select data-review-loc="${i}">
              <option value="">— unmatched, skip —</option>
              ${uniqueLocs.map(l=>`<option value="${esc(l)}" ${l===it.matchedLocation?'selected':''}>${esc(l)}</option>`).join('')}
            </select></td>
          <td><input type="text" data-review-date="${i}" value="${esc(it.effDateStr||'')}" style="width:110px;font-family:var(--font-mono);padding:6px 8px;border:1px solid var(--edge);border-radius:3px;" placeholder="DD-MM-YYYY"></td>
          <td class="num">${it.rows.length}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:14px;"><button class="btn accent" id="confirmRateBtn">Add to Rate Master</button></div>
  `;
  $('#confirmRateBtn').addEventListener('click', ()=>{
    let added = 0, skipped = 0;
    items.forEach((it,i)=>{
      const loc = $(`select[data-review-loc="${i}"]`).value;
      const dateStr = $(`input[data-review-date="${i}"]`).value.trim();
      if(!loc || !dateStr || !it.rows.length){ skipped++; return; }
      const effDate = parseDMY(dateStr);
      if(!effDate){ skipped++; return; }
      // remove any previous rows for same location+file+date to avoid dup on re-upload
      STATE.rateRows = STATE.rateRows.filter(r=> !(r.location===loc && r.effDateStr===dateStr));
      it.rows.forEach(r=>{
        STATE.rateRows.push({
          location: loc, category: r.category, gstPct: gstForCategory(r.category),
          productName: r.productName, sku: r.sku, productCode: r.productCode, rate: r.rate,
          effDate, effDateStr: dateStr, sourceFile: it.fileName,
        });
      });
      const existingIdx = STATE.rateFiles.findIndex(f=>f.fileName===it.fileName);
      const rec = {fileName: it.fileName, matchedLocation: loc, effDateStr: dateStr, rowCount: it.rows.length};
      if(existingIdx>=0) STATE.rateFiles[existingIdx]=rec; else STATE.rateFiles.push(rec);
      added++;
    });
    toast(`Added ${added} file(s) to Rate Master${skipped?`, skipped ${skipped}`:''}`, added?'ok':'err');
    SETUP_OPEN_STEP = 0;
    renderSetup(); renderStatusStrip(); renderTabs();
  });
}

async function handleBeatSoFile(file){
  try{
    const wb = await readWorkbookFile(file);
    // let user pick sheet if multiple non-trivial sheets
    const mapDiv = $('#s4mapper');
    if(wb.SheetNames.length>1){
      mapDiv.innerHTML = `<div class="field"><label>Choose sheet</label><select id="s4sheet">${wb.SheetNames.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>

    }
  }catch(err){ console.error(err); toast('Could not read file: '+err.message, 'err'); }

function processBeatSoSheet(ws, fileName, mapDiv){
  const rows = sheetToRows(ws);
  // detect repeated "code" header columns -> month-block mode
  let headerRowIdx = -1, codeColIdxs = [];
  for(let r=0;r<Math.min(rows.length,6);r++){
    const hits = [];
    rows[r].forEach((cell,ci)=>{ if(/code/i.test(String(cell||'')) ) hits.push(ci); });
    if(hits.length>=1){ headerRowIdx=r; codeColIdxs=hits; break; }
  }
  if(headerRowIdx===-1){ toast('Could not find a header row with a Code column', 'err'); return; }
  const header = rows[headerRowIdx];

  if(codeColIdxs.length>1){
    // block mode: figure block width from spacing between consecutive code columns
    const blocks = codeColIdxs.map((startCol, bi)=>{
      const endCol = bi+1<codeColIdxs.length ? codeColIdxs[bi+1] : header.length;
      const nameCol = findInRange(header, startCol, endCol, /name|party/i);
      const asmCol = findInRange(header, startCol, endCol, /asm|bd/i);
      const soCol = findInRange(header, startCol, endCol, /tso|rso|so\b|ase/i);
      const beatCol = findInRange(header, startCol, endCol, /beat/i);
      return {startCol, endCol, codeCol:startCol, nameCol, asmCol, soCol, beatCol};
    });
    const map = {};
    for(let r=headerRowIdx+1;r<rows.length;r++){
      const row = rows[r];
      let code=null, name=null, asm=null, so=null, beat=null;
      blocks.forEach(b=>{
        const cd = row[b.codeCol];
        if(cd!=null && String(cd).trim()!==''){
          code = String(cd).trim();
          if(b.nameCol>=0 && row[b.nameCol]) name = String(row[b.nameCol]).trim();
          if(b.asmCol>=0 && row[b.asmCol]) asm = String(row[b.asmCol]).trim();
          if(b.soCol>=0 && row[b.soCol]) so = String(row[b.soCol]).trim();
          if(b.beatCol>=0 && row[b.beatCol]) beat = String(row[b.beatCol]).trim();
        }
      });
      if(code) map[code] = {name: name||'', asm: asm||'', so: so||'', beat: beat||''};
    }
    STATE.beatSoMap = map; STATE.beatSoFile = fileName; STATE.beatSoAuto = false;
    toast(`Loaded Beat/SO mapping for ${Object.keys(map).length} DBs (${blocks.length} month-blocks detected, using latest)`, 'ok');
    renderStep4(); renderStatusStrip();
  } else {
    // flat mode: use column mapper UI
    const dataRows = rows.slice(headerRowIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
    renderColumnMapper(mapDiv, header, dataRows, [
      {key:'code', label:'DB Code', required:true, patterns:[/code/i]},
      {key:'name', label:'DB Name', required:false, patterns:[/name|party/i]},
      {key:'beat', label:'Beat', required:false, patterns:[/beat/i]},
      {key:'so', label:'SO / ASM / ASE', required:false, patterns:[/tso|rso|so\b|ase/i]},
      {key:'asm', label:'ASM / BD', required:false, patterns:[/asm|bd/i]},
    ], (map)=>{
      const out = {};
      dataRows.forEach(r=>{
        const code = map.code>=0 ? String(r[map.code]).trim() : '';
        if(!code) return;
        out[code] = {
          name: map.name>=0 ? String(r[map.name]||'').trim() : '',
          beat: map.beat>=0 ? String(r[map.beat]||'').trim() : '',
          so: map.so>=0 ? String(r[map.so]||'').trim() : '',
          asm: map.asm>=0 ? String(r[map.asm]||'').trim() : '',
        };
      });
      STATE.beatSoMap = out; STATE.beatSoFile = fileName; STATE.beatSoAuto = false;
      toast(`Loaded Beat/SO mapping for ${Object.keys(out).length} DBs`, 'ok');
      renderStep4(); renderStatusStrip();
    });
  }
}
function findInRange(header, start, end, pattern){
  for(let i=start;i<end;i++){ if(pattern.test(String(header[i]||''))) return i; }
  return -1;
}

function renderStep5(){

  const body = `
    <p class="small-muted">Upload the UOM Conversion / product-wise pack-size master — Product Code, Pack Size, and how many KG make up 1 PC and 1 BAG (e.g. Maida 1kg: 1 PC = 1 kg, 1 BAG = 30 kg). Rate Master rates always stay per KG; this lets field staff enter quantities in PC or BAG on the Rate Check screen and still get the correct total overcharge/undercharge value.</p>
    <div id="s5zone"></div>
    <div id="s5mapper" style="margin-top:14px;"></div>
    ${done ? `<div style="margin-top:12px;"><button class="btn secondary small" id="s5redo">Replace file</button> <span class="small-muted">Loaded from ${esc(STATE.uomMapFile||'')}</span></div>` : ''}
  `;
  stepShell(c, 5, 'UOM Conversion', 'Optional — enables PC/BAG quantity entry', done, status, body);
  if(!done) wireDropzone($('#s5zone'), '.xlsx,.xls,.csv', handleUomFile);
  else { const btn=$('#s5redo'); if(btn) btn.addEventListener('click', ()=>{ STATE.uomMap={}; STATE.uomMapFile=null; renderStep5(); renderStatusStrip(); }); }
}
async function handleUomFile(file){
  try{
    const wb = await readWorkbookFile(file);
    const shName = wb.SheetNames[0];
    const rows = sheetToRows(wb.Sheets[shName]);
    let headerIdx = findHeaderRowIndex(rows, [/product\s*code/i, /pack\s*size/i]);
    let headers, dataRows;
    if(headerIdx===-1){ headers = rows[0].map(()=>''); dataRows = rows.filter(r=>r.some(c=>String(c).trim()!=='')); }
    else { headers = rows[headerIdx]; dataRows = rows.slice(headerIdx+1).filter(r=>r.some(c=>String(c).trim()!=='')); }
    const mapDiv = $('#s5mapper');
    renderColumnMapper(mapDiv, headers, dataRows, [
      {key:'code', label:'Product Code', required:true, patterns:[/product\s*code/i,/\bcode\b/i]},
      {key:'name', label:'Product Name', required:false, patterns:[/product\s*name/i,/\bname\b/i]},
      {key:'category', label:'Category', required:false, patterns:[/category/i]},
      {key:'packSize', label:'Pack Size', required:false, patterns:[/pack\s*size/i]},
      {key:'kgPerPc', label:'1 PC = ? KG', required:true, patterns:[/pc\s*kg/i,/per\s*pc/i,/1\s*pc/i]},
      {key:'kgPerBag', label:'1 BAG = ? KG', required:false, patterns:[/bag\s*kg/i,/per\s*bag/i,/1\s*bag/i]},
    ], (map)=>{
      const g = (r,k)=> map[k]>=0 ? String(r[map[k]]==null?'':r[map[k]]).trim() : '';
      const out = {};
      dataRows.forEach(r=>{
        const code = String(r[map.code]==null?'':r[map.code]).trim();
        if(!code || code==='undefined') return;
        const kgPerPc = parseFloat(g(r,'kgPerPc'));
        const kgPerBag = parseFloat(g(r,'kgPerBag'));
        out[code] = {
          name: g(r,'name'), category: g(r,'category'), packSize: g(r,'packSize'),
          kgPerPc: isNaN(kgPerPc)?null:kgPerPc,
          kgPerBag: isNaN(kgPerBag)?null:kgPerBag,
        };
      });
      STATE.uomMap = out; STATE.uomMapFile = file.name;
      toast(`Loaded UOM conversion for ${Object.keys(out).length} products`, 'ok');
      renderStep5(); renderStatusStrip();
    });
  }catch(err){ console.error(err); toast('Could not read file: '+err.message, 'err'); }
}
/* Available quantity units for a product: KG always; PC/BAG only when the UOM master defines them. */
function uomOptionsForProduct(productCode){
  const opts = [{value:'KG', label:'KG', factor:1}];
  const u = STATE.uomMap[productCode];
  if(u){
    if(u.kgPerPc) opts.push({value:'PC', label:`PC (${u.kgPerPc} kg)`, factor:u.kgPerPc});
    if(u.kgPerBag) opts.push({value:'BAG', label:`BAG (${u.kgPerBag} kg)`, factor:u.kgPerBag});
  }
  return opts;
}
function qtyToKg(li){
  if(li.qty===''||li.qty==null||isNaN(Number(li.qty))) return null;
  const opts = uomOptionsForProduct(li.productCode);
  const opt = opts.find(o=>o.value===(li.uom||'KG')) || opts[0];
  return clamp2(Number(li.qty) * (opt?opt.factor:1));
}

function renderRMTable(){
