<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Ledger — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --void:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F5F7; --panel-3:#E7E9EC;
  --edge:rgba(10,10,15,0.14); --edge-soft:rgba(10,10,15,0.07);
  --ink:#12131A; --ink-soft:#53555C; --ink-faint:#8B8D93;
  --accent:#101114; --accent-soft:rgba(16,17,20,0.08);
  --danger:#D6234B; --danger-soft:rgba(214,35,75,0.12);
  --success:#0FA86B; --success-soft:rgba(15,168,107,0.12);
  --warn:#B9791A; --warn-soft:rgba(185,121,26,0.14);
  --negligible:#2A5FD9; --negligible-soft:rgba(42,95,217,0.10);
  --radius:8px; --radius-sm:4px;
  --font-display:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --shadow-card: 0 0 0 1px rgba(10,10,15,0.08), 0 10px 26px rgba(10,10,15,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);color:var(--ink);background:var(--panel-2);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
#app{max-width:1320px;margin:0 auto;padding:0 24px 60px;}
.topbar{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;background:var(--panel-3);border:1px solid var(--edge);}
.brand-text h1{font-size:20px;}
.version-badge{display:inline-block;vertical-align:middle;font-size:10.5px;font-weight:700;font-family:var(--font-mono);background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--edge);border-radius:5px;padding:2px 7px;margin-left:6px;letter-spacing:.02em;}
.brand-text p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--edge);border-radius:100px;background:var(--panel);font-size:11.5px;color:var(--ink-soft);}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.tabstrip{display:flex;gap:4px;border-bottom:1px solid var(--edge);margin-bottom:22px;flex-wrap:wrap;}
.tab-btn{font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-soft);background:transparent;border:none;padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer;}
.tab-btn.active{color:var(--ink);background:var(--panel-3);}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.stat-card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:16px 18px;position:relative;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
.stat-card.clickable{cursor:pointer;}
.stat-card.clickable:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(16,17,20,.10);border-color:var(--ink-faint);}
.stat-card.clickable:active{transform:translateY(-1px);}
.stat-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.stat-card-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
.stat-card-hint{position:absolute;right:14px;bottom:12px;font-size:10.5px;font-weight:700;color:var(--ink-faint);opacity:0;transform:translateX(-4px);transition:opacity .15s ease, transform .15s ease;}
.stat-card.clickable:hover .stat-card-hint{opacity:1;transform:translateX(0);}
.stat-card-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
.info-dot{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--panel-3, var(--edge));color:var(--ink-soft);font-size:9px;font-weight:700;font-style:italic;font-family:Georgia,serif;margin-left:5px;cursor:help;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0;}
.info-dot:hover{background:var(--ink);color:#fff;}
.info-dot::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:500;line-height:1.4;width:270px;white-space:normal;text-align:left;opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.info-dot::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);margin-bottom:-2px;opacity:0;transition:opacity .12s ease;z-index:20;}
.info-dot:hover::after, .info-dot:hover::before{opacity:1;}
.stat-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;}
.section-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.section-eyebrow::after{content:'';flex:1;height:1px;background:var(--edge);}
.chart-card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 20px;}
.chart-card h3{font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.chart-card .click-hint{font-size:10px;font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0;margin-left:auto;}
.stat-note{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.field{margin-bottom:14px;}
.bill-copy-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
.bill-copy-link:hover{text-decoration:underline;}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:100px;padding:5px 12px;font-size:12px;font-weight:600;margin:6px 6px 0 0;cursor:pointer;}
.filter-chip b{font-weight:700;opacity:.7;}
.filter-chip:hover b{opacity:1;}
.mini-stat-strip{display:flex;gap:0;flex-wrap:wrap;background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);margin:10px 0;overflow:hidden;}
.mini-stat{flex:1;min-width:110px;padding:10px 14px;border-right:1px solid var(--edge-soft);display:flex;flex-direction:column;gap:2px;}
.mini-stat:last-child{border-right:none;}
.mini-stat-val{font-family:var(--font-mono);font-size:17px;font-weight:700;}
.mini-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;}
.verifier-code-wrap{position:relative;}
.verifier-code-wrap input{width:100%;padding-right:26px;}
.eye-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:12px;padding:2px 4px;line-height:1;color:var(--ink-faint);}
.eye-toggle:hover{color:var(--ink-soft);}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font-size:13.5px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.btn{padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid var(--edge);background:var(--panel-3);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--accent);}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent;font-weight:700;}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent;}
.btn.small{padding:6px 11px;font-size:12px;}
.btn.wide{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:var(--radius);}
tr.auditor-group-start td{border-top:2px solid var(--ink);}
thead th{text-align:left;padding:9px 11px;background:var(--panel-3);color:var(--ink-soft);font-weight:600;font-size:10.8px;text-transform:uppercase;white-space:nowrap;}
tbody td{padding:8px 11px;border-bottom:1px solid var(--edge-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
td.num{font-family:var(--font-mono);text-align:right;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:10.8px;font-weight:600;}
.badge.over{background:var(--danger-soft);color:var(--danger);}
.badge.negligible{background:var(--negligible-soft);color:var(--negligible);}
.badge.under{background:var(--warn-soft);color:var(--warn);}
.badge.match{background:var(--success-soft);color:var(--success);}
.badge.active{background:var(--success-soft);color:var(--success);}
.badge.inactive{background:var(--danger-soft);color:var(--danger);}
.divider{height:1px;background:var(--edge);margin:20px 0;}
.small-muted{font-size:11.5px;color:var(--ink-faint);}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin:0 0 12px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.ultimate-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;}
.ultimate-loader svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.06));}
.quick-range{display:flex;gap:6px;flex-wrap:wrap;}
.quick-range button{background:var(--panel-2);border:1px solid var(--edge);border-radius:100px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.quick-range button:hover{background:var(--edge);}
.quick-range button.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
.stale-banner{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.stale-banner .spin{width:11px;height:11px;border:2px solid var(--edge);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.micro-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;}
.micro-bar-row:hover{background:var(--panel-2);}
.micro-bar-row .mb-label{width:160px;flex:none;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.micro-bar-row .mb-track{flex:1;height:16px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.micro-bar-row .mb-fill{height:100%;border-radius:4px;}
.micro-bar-row .mb-count{width:80px;flex:none;text-align:right;font-size:12px;font-weight:700;font-family:var(--font-mono);}
.micro-bar-row.active{outline:2px solid var(--ink);border-radius:6px;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.filterbar .field{margin-bottom:0;min-width:150px;}
.loader{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>

<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ---------------- Backend config ----------------
   Same Web App URL as your Rate Ledger app — paste it here too. */
// Bump this on every delivered file so the running app itself shows which
// build is loaded — matches the same badge pattern in Rate Ledger, so a
// screenshot of either app always confirms which version is actually open.
const APP_VERSION = 'v18-supabase';
/* ==================== SUPABASE BACKEND ====================
   Same action names the app has always used (login / submit / mydata / syncdata …) — each one is
   now a single fast call to a Postgres function (rl_*) on Supabase. Photos go straight to Supabase
   Storage (public link, opens for anyone — no Google login wall). Every submit is idempotent on the
   server (BillUID + ProductCode unique), so an automatic retry can never create a duplicate audit. */
const SUPABASE_URL_DEFAULT = 'https://zhdewzebwzcobdugaiwm.supabase.co';        // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY_DEFAULT = 'sb_publishable_3wjAnYsE9NcFYfXvlLUMKg_UlSFjVby'; // Project Settings → API → anon public key
const SUPA_BUCKET = 'bill-copies';
const SUPA_CFG_KEY = 'rateLedger_supabaseCfg';
const SUPA_TIMEOUT_MS = 15000;
function supaCfg(){
  let o = {};
  try{ o = JSON.parse(localStorage.getItem(SUPA_CFG_KEY)||'{}') || {}; }catch(e){}
  const url = (SUPABASE_URL_DEFAULT.startsWith('PASTE') ? '' : SUPABASE_URL_DEFAULT) || o.url || '';
  const key = (SUPABASE_ANON_KEY_DEFAULT.startsWith('PASTE') ? '' : SUPABASE_ANON_KEY_DEFAULT) || o.key || '';
  return { url: url.replace(/\/+$/,''), key };
}
function supaSaveCfg(url, key, photoUrl){ try{ const o = JSON.parse(localStorage.getItem(SUPA_CFG_KEY)||'{}'); localStorage.setItem(SUPA_CFG_KEY, JSON.stringify({url, key, photoUrl: photoUrl===undefined ? (o.photoUrl||'') : photoUrl})); }catch(e){} }

/* Bill photos live in GOOGLE DRIVE (served by the small photo Apps Script); Supabase only stores the link.
   PHOTO_APP_URL = that script's /exec URL. If it is not set, photos fall back to Supabase Storage. */
const PHOTO_APP_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbw4a5Db2cjkID6zaUasqYLzTQc0269vGo96eaQHAkT04umKq7B0FLjmup1C6_UrXz8TXQ/exec';
function photoAppUrl(){
  if(!PHOTO_APP_URL_DEFAULT.startsWith('PASTE')) return PHOTO_APP_URL_DEFAULT;
  try{ return (JSON.parse(localStorage.getItem(SUPA_CFG_KEY)||'{}').photoUrl || '').trim(); }catch(e){ return ''; }
}
function photoFileId(url){ const m = String(url||'').match(/[?&]fileId=([^&]+)/) || String(url||'').match(/[?&]id=([^&]+)/); return m ? m[1] : null; }
// Any stored Drive-photo link (old or new deployment) -> opens through the CURRENT photo script.
function photoViewUrl(url){
  const base = photoAppUrl(), id = photoFileId(url);
  return (base && id) ? `${base}?action=viewphoto&fileId=${id}` : url;
}
async function driveUploadBillCopy(session, billUid, fileName, mimeType, base64Data){
  const res = await fetch(photoAppUrl(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'uploadBillCopy', code:session.code, pin:session.pin, billUid, fileName, mimeType, base64Data }) });
  const j = await res.json();
  if(!j.ok) return { ok:false, error: j.error || 'Drive upload failed' };
  const at = await supaRpc('rl_attach_copy', { p_code:session.code, p_pin:session.pin, p_bill_uid:billUid, p_url:j.url, p_dl_url:j.url, p_path:j.fileId }, 3);
  if(!at.ok) return { ok:false, error: at.error || 'Could not link the photo to the bill' };
  return { ok:true, url:j.url };
}
function backendConfigured(){ const c = supaCfg(); return !!(c.url && c.key); }

async function supaFetch(path, options, timeoutMs){
  const c = supaCfg();
  if(!c.url || !c.key) throw new Error('Supabase is not configured yet (URL / anon key missing).');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || SUPA_TIMEOUT_MS);
  try{
    return await fetch(c.url + path, { ...options, signal: controller.signal,
      headers: { apikey: c.key, ...(c.key.startsWith('sb_') ? {} : { Authorization: 'Bearer ' + c.key }), ...(options && options.headers || {}) } });
  } catch(e){
    if(e.name === 'AbortError') throw new Error('Request timed out — check your internet connection and try again.');
    throw e;
  } finally { clearTimeout(timer); }
}
// retries: network errors / 5xx are retried automatically (safe — every write is idempotent server-side).
async function supaRpc(fn, args, retries){
  let lastErr;
  for(let attempt = 0; attempt <= (retries||0); attempt++){
    try{
      const res = await supaFetch('/rest/v1/rpc/' + fn, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(args||{}) });
      if(res.status >= 500 && attempt < (retries||0)){ await new Promise(r=>setTimeout(r, 600*(attempt+1))); continue; }
      let j = null; try{ j = await res.json(); }catch(e){}
      if(!res.ok){
        if(j && j.message) return { ok:false, error: j.message };
        throw new Error('Server error ' + res.status);
      }
      return j;
    } catch(e){
      lastErr = e;
      if(attempt < (retries||0)) await new Promise(r=>setTimeout(r, 600*(attempt+1)));
    }
  }
  throw lastErr || new Error('Could not reach the server.');
}

// Rate Ledger's in-app record -> the header-keyed row the database stores (same columns the Sheet had).
function supaMapRow(r){
  const tf = v => v===true ? 'TRUE' : (v===false ? 'FALSE' : '');
  return {
    BillUID:r.billUid||'', Designation:r.designation||'', VerifiedBy:r.verifiedBy||'',
    DBCode:r.dbCode||'', DBName:r.dbName||'', PriceGroup:r.pg||'', Location:r.location||'', BeatCode:r.beatCode||'', BeatName:r.beatName||'',
    SOName:r.so||'', ASMName:r.asm||'', RSMName:r.rsm||'', DBStatus:r.dbActive||'',
    Retailer:r.retailer||'', BillType:r.billType||'', BillNo:r.billNo||'', BillDate:r.billDateStr||'',
    ProductName:r.productName||'', ProductCode:r.productCode||'', Category:r.category||'',
    CompanyRate:r.companyRate||0, InvoiceRate:r.invoiceRate||0, GSTPct:r.gstPct||0,
    DiffPerKg:r.diff||0, VariancePct:r.pct||0, Status:r.status||'', Qty:r.qty||'', UOM:r.uom||'', QtyKG:r.qtyKg||'',
    OverchargeAmt:r.overchargeAmt||0, UnderchargeAmt:r.underchargeAmt||0, NegligibleAmt:r.negligibleAmt||0,
    CollectedBy:r.collectedBy||'', SubmissionDate:r.submissionStr||'', VerifiedByCode:r.verifiedByCode||'',
    PackSizeKg:r.packSizeKg||'', BagSizeLabel:r.bagSizeLabel||'', ComponentsSummary:r.componentsSummary||'', DiffPerPc:r.diffPerPc||'', DiffPerBag:r.diffPerBag||'',
    AmountExcludesGst: r.amountExcludesGst===true?'TRUE':(r.amountExcludesGst===false?'FALSE':''),
    TotalInvoicedExclGst:r.totalInvoicedExclGst||'', AmountInclGstShown:r.amountInclGstShown||'', GSTPctCharged:r.gstPctCharged||'',
    GSTMismatch: r.gstMismatch===true?'TRUE':'', GSTMismatchAmt:r.gstMismatchAmt||'', GSTEntrySuspect: r.gstEntrySuspect===true?'TRUE':'',
    BillCopyURL:r.billCopyUrl||'', BillCopyDownloadURL:r.billCopyDownloadUrl||'', SOSubmitDate:r.soSubmitDateStr||''
  };
}

async function supaDispatch(a){
  const act = String(a.action||'').toLowerCase();
  const nz = v => (v===undefined || v===null || v==='') ? null : v;
  switch(act){
    case 'login':          return supaRpc('rl_login', { p_code:a.code, p_pin:a.pin }, 1);
    case 'verifiers':      return supaRpc('rl_verifiers', {}, 1);
    case 'submit':         return supaRpc('rl_submit', { p_code:a.code, p_pin:a.pin, p_rows:(a.rows||[]).map(supaMapRow) }, 3);
    case 'attachbillcopyurl': return supaRpc('rl_attach_copy', { p_code:a.code, p_pin:a.pin, p_bill_uid:a.billUid, p_url:a.url, p_dl_url:a.downloadUrl||a.url, p_path:a.path||null }, 3);
    case 'mydata':         return supaRpc('rl_my_data', { p_code:a.code, p_pin:a.pin, p_from:nz(a.fromDate), p_to:nz(a.toDate), p_basis:a.dateBasis||'bill' }, 1);
    case 'myverifieddata': return supaRpc('rl_my_verified_data', { p_code:a.code, p_pin:a.pin, p_from:nz(a.fromDate), p_to:nz(a.toDate), p_basis:a.dateBasis||'bill' }, 1);
    case 'alldata':        return supaRpc('rl_all_data', { p_code:a.code, p_pin:a.pin, p_from:nz(a.fromDate), p_to:nz(a.toDate), p_auditor:nz(a.auditorCode), p_basis:a.dateBasis||'bill' }, 1);

/* Photo / PDF -> Supabase Storage, then link it to the bill. Returns {ok, url} / {ok:false, error}. */
function supaB64ToBlob(b64, mime){
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
async function supaUploadBillCopy(session, billUid, fileName, mimeType, base64Data){
  if(photoAppUrl() && base64Data) return driveUploadBillCopy(session, billUid, fileName, mimeType, base64Data);
  if(!base64Data) return { ok:false, error:'No file data' };
  const safe = s => String(s||'').replace(/[^A-Za-z0-9._-]+/g,'_').slice(0,80) || 'file';
  const d = new Date();
  const rand = Math.random().toString(36).slice(2,8);
  const path = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}/${safe(billUid)}/${Date.now()}_${rand}_${safe(fileName)}`;
  const blob = supaB64ToBlob(base64Data, mimeType);
  let res;
  for(let attempt=0; attempt<3; attempt++){
    try{
      res = await supaFetch(`/storage/v1/object/${SUPA_BUCKET}/${path}`, { method:'POST', headers:{ 'Content-Type': mimeType, 'x-upsert':'false', 'cache-control':'max-age=31536000' }, body: blob }, 60000);
      if(res.ok || res.status < 500) break;
    } catch(e){ if(attempt===2) throw e; }
    await new Promise(r=>setTimeout(r, 700*(attempt+1)));
  }
  if(!res.ok){ let m=''; try{ m=(await res.json()).message||''; }catch(e){} return { ok:false, error: m || ('Upload failed (' + res.status + ')') }; }
  const url = `${supaCfg().url}/storage/v1/object/public/${SUPA_BUCKET}/${path}`;
  const at = await supaRpc('rl_attach_copy', { p_code:session.code, p_pin:session.pin, p_bill_uid:billUid, p_url:url, p_dl_url:url, p_path:path }, 3);
  if(!at.ok) return { ok:false, error: at.error || 'Could not link the photo to the bill' };
  return { ok:true, url };
}

const SESSION_KEY = 'rateLedger_session';

/* ---------------- Local cache: instant repeat-opens ----------------
   First open of a tab always hits the network. After that, the result is
   cached in localStorage keyed by the exact query — reopening the SAME
   tab/filter combo renders instantly from cache while a fresh copy loads
   quietly in the background and silently updates the screen if anything
   changed. This is what makes the Dashboard feel fast on every visit
   after the first, without ever showing stale data for more than a beat. */
const DASH_CACHE_TTL_MS = 6*60*60*1000; // background-refresh after 6h regardless
function cacheKeyFor(params){ return 'dashCache_' + JSON.stringify(params, Object.keys(params).sort()); }
function readCache(params){
  try{
    const raw = localStorage.getItem(cacheKeyFor(params));
    if(!raw) return null;
    const {t, data} = JSON.parse(raw);
    return {data, ageMs: Date.now()-t};
  }catch(e){ return null; }
}
function writeCache(params, data){
  try{ localStorage.setItem(cacheKeyFor(params), JSON.stringify({t:Date.now(), data})); }catch(e){}
}
// onFirst: called immediately with cached data if any (fast paint).
// onFresh: called once the network reply lands (always — even if same tab
// has since been left, caller should re-check it's still the active view).
async function cachedBackendGet(params, onFirst, onFresh){
  const cached = readCache(params);
  if(cached) onFirst(cached.data, cached.ageMs);
  let fresh;
  try{
    fresh = await backendGet(params);
  } catch(e){
    // A thrown error here (timeout, network down, bad JSON) used to be an
    // unhandled rejection — onFresh never fired, so the loader never got its
    // stop() call and just sat at 90% forever with no explanation. Turn it
    // into the same {ok:false, error} shape callers already know how to show.
    fresh = { ok:false, error: e.message || 'Could not reach the server.' };
  }
  if(fresh.ok) writeCache(params, fresh);
  onFresh(fresh, !!cached);
}

function ultimateLoaderHtml(id){
  return `<div class="ultimate-loader" id="${id}">
    <svg viewBox="0 0 120 120" width="88" height="88">
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--edge)" stroke-width="8"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"

    </svg>

function startUltimateLoader(id){

  const C = 2*Math.PI*52;

  const tick = ()=>{

    pct = Math.min(90, pct + (90-pct)*0.06 + 0.4);

// Safety net for BillDate/SOSubmitDate/SubmissionDate specifically — Code.gs
// normalizes these server-side now, but a not-yet-redeployed backend (or any
// future slip) could still hand back a raw ISO datetime (Sheets auto-
// converting a text cell to a real Date behind the scenes) instead of the
// plain DD-MM-YYYY every report should show. This catches that here too, so
// the display is never wrong regardless of what the backend currently sends.
function normalizeDMYDisplay(val){
  if(!val) return val;
  const s = String(val);
  const dmy = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if(dmy) return `${dmy[1].padStart(2,'0')}-${dmy[2].padStart(2,'0')}-${dmy[3]}`; // already DD-MM-YYYY — just zero-pad for consistency
  // A raw ISO datetime (e.g. 2026-10-07T18:30:00.000Z) is UTC — the ORIGINAL
  // date was entered as a local-midnight value, so naively reading the UTC
  // Y/M/D back out would land on the wrong calendar day for anyone east of
  // UTC (e.g. 18:30 UTC = 00:00 IST the NEXT day — the correct date is the
  // 8th, not the 7th). Parsing through `new Date(...)` and reading it back
  // with the LOCAL getters (not the UTC ones) recovers the calendar date as
  // it was actually intended, as long as the viewer is in the same timezone
  // the data was entered in (India, for this app).
  if(/^\d{4}-\d{1,2}-\d{1,2}T/.test(s)){

    if(!isNaN(d.getTime())) return istDateDMY(d); // always the IST calendar date, whatever timezone this device is in

/* ---- IST (Asia/Kolkata) — every date/time this app stamps or shows ----
   Reading dates through the browser's own timezone, or through toISOString()
   (which is always UTC), is what put dates a day off and times 5h30m behind:
   between 12:00am–5:30am IST toISOString() still says "yesterday", and
   local-midnight dates shifted back a day when converted to UTC. Everything

   result is identical no matter what timezone the device is set to. */
const IST_TZ = 'Asia/Kolkata';

/* ==================== SHELL ==================== */
let ACTIVE_TAB = null;
/* ==================== Admin local data store ====================
   Analytics, Performance and All Submissions all read from ONE copy of the
   data that lives in this browser (IndexedDB, so it also survives a
   refresh/reopen) instead of each tab asking the Sheet for its own copy every
   time it's opened. The very first open downloads everything once (with real
   progress); after that the Sheet is only asked for rows NEWER than the latest
   one already stored — typically a handful — and those are merged in. Switching
   tabs, changing a date range, or reopening the Dashboard never waits on the
   Sheet again; everything is filtered/aggregated locally.
   Admin-only: Auditor/Verifier views are server-scoped to their own rows and
   keep their existing per-query behaviour — caching "everything" locally
   would be wrong for a role that's only ever allowed to see a slice. */
const AS_DB = 'DashboardAdminCacheDB';
const AdminStore = { rows:[], byKey:new Map(), lastTs:'', lastSyncedAt:0, syncing:false, loaded:false, error:'', progress:null };
let __asDbPromise = null;
function asOpen(){
  if(__asDbPromise) return __asDbPromise;
  __asDbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(AS_DB, 1);
    req.onupgradeneeded = e=>{ const db=e.target.result;
      if(!db.objectStoreNames.contains('rows')) db.createObjectStore('rows',{keyPath:'_k'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'}); };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = ()=>reject(req.error);
  });
  return __asDbPromise;
}
function asTx(stores, mode, fn){
  return asOpen().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(stores, mode);
    const out = fn(tx);
    tx.oncomplete = ()=>resolve(out && out.result!==undefined ? out.result : out);
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  }));
}
function asOwner(){ const s=getSession(); return s ? `${s.code}|${supaCfg().url}` : ''; }
// A row's identity: a bill line is unique per BillUID + ProductCode (same
// rule the server uses to drop duplicates). Very old rows with no BillUID
// fall back to a composite of their own fields.
function asKey(r){
  if(r.BillUID) return r.BillUID+'|'+(r.ProductCode||'');
  return 'legacy|'+[r.Timestamp,r.ProductCode,r.DBCode,r.BillNo,r.InvoiceRate].join('|');
}
function asResetMemory(){ AdminStore.rows=[]; AdminStore.byKey=new Map(); AdminStore.lastTs=''; AdminStore.lastSyncedAt=0; AdminStore.loaded=false; AdminStore.error=''; }
async function asLoad(){
  if(AdminStore.loaded) return;
  try{
    const owner = asOwner();
    const meta = await asTx(['meta'],'readonly', tx=>{ const o={}; ['owner','lastTs','lastSyncedAt'].forEach(k=>{ const r=tx.objectStore('meta').get(k); r.onsuccess=()=>{ o[k]=r.result?r.result.value:null; }; }); return {get result(){return o;}}; });
    if(meta.owner && meta.owner!==owner){ await asWipeDb(); }
    else if(meta.owner){
      const rows = await asTx(['rows'],'readonly', tx=>{ const r=tx.objectStore('rows').getAll(); return {get result(){return r.result||[];}}; });
      rows.forEach(r=>{ AdminStore.byKey.set(r._k, r); });
      AdminStore.rows = rows;
      AdminStore.lastTs = meta.lastTs||''; AdminStore.lastSyncedAt = meta.lastSyncedAt||0;
    }
  } catch(e){ /* IndexedDB blocked (private mode etc.) — still works for this session from memory, just won't persist */ }

}
async function asWipeDb(){ try{ await asTx(['rows','meta'],'readwrite', tx=>{ tx.objectStore('rows').clear(); tx.objectStore('meta').clear(); }); }catch(e){} }
async function asPersist(putRows){
  try{
    await asTx(['rows','meta'],'readwrite', tx=>{
      const rs = tx.objectStore('rows'); putRows.forEach(r=>rs.put(r));
      const ms = tx.objectStore('meta');
      ms.put({key:'owner', value:asOwner()}); ms.put({key:'lastTs', value:AdminStore.lastTs}); ms.put({key:'lastSyncedAt', value:AdminStore.lastSyncedAt});

}
function asCompact(raw){ const r={}; for(const k in raw){ const v=raw[k]; if(v!=='' && v!=null) r[k]=v; } r._k=asKey(r); return r; }
// Pulls whatever the Sheet has that this browser doesn't (everything, the
// first time) and merges it in. Safe to call any time; concurrent calls are
// collapsed into one. Returns how many rows were added/updated.
// Single-flight: if a sync is already running, every other caller (e.g. two
// tabs rendering at once on first open) waits for THAT one and gets its
// result, rather than returning early and painting a half-loaded store.
let __adminSyncInflight = null;
function adminSync(opts){
  if(__adminSyncInflight) return __adminSyncInflight;
  __adminSyncInflight = adminSyncRun(opts).finally(()=>{ __adminSyncInflight = null; });
  return __adminSyncInflight;
}
async function adminSyncRun(opts){
  opts = opts||{};

  AdminStore.syncing = true; AdminStore.error=''; updateAdminSyncChip();
  let changed = 0;

    await asLoad();
    if(opts.full){ await asWipeDb(); asResetMemory(); AdminStore.loaded=true; }
    const firstEver = AdminStore.rows.length===0;
    let offset = 0, total = null, photoLinks = {};
    const putRows = [];
    // Captured ONCE: the server pages through "rows newer than this", so if
    // this moved with each page (lastTs advances as rows are merged) page 2
    // would be an offset into a DIFFERENT, shorter list and rows would be skipped.
    const sinceAtStart = AdminStore.lastTs||'';
    for(;;){
      const res = await backendGet({ action:'syncdata', code:s.code, pin:s.pin, sinceISO: sinceAtStart, offset:String(offset) });
      if(!res.ok) throw new Error(res.error||'Could not sync');
      if(total===null) total = res.total||0;
      res.rows.forEach(raw=>{
        const r = asCompact(raw);
        if(!AdminStore.byKey.has(r._k)){ AdminStore.byKey.set(r._k, r); AdminStore.rows.push(r); putRows.push(r); changed++; }
        if(r.Timestamp && (!AdminStore.lastTs || new Date(r.Timestamp) > new Date(AdminStore.lastTs))) AdminStore.lastTs = r.Timestamp;
      });
      AdminStore.progress = { done: Math.min(offset + res.rows.length, total), total };
      if(firstEver) updateAdminLoadingProgress();
      updateAdminSyncChip();
      if(res.nextOffset==null){ photoLinks = res.photoLinks||{}; break; }
      offset = res.nextOffset;
    }
    // Photos get linked to a bill's rows AFTER those rows were first written,
    // without changing their Timestamp — apply the server's current links so
    // already-stored rows pick them up.
    AdminStore.rows.forEach(r=>{
      const l = photoLinks[r.BillUID];
      if(l && r.BillCopyURL!==l.url){ r.BillCopyURL=l.url; if(l.dl) r.BillCopyDownloadURL=l.dl; putRows.push(r); changed++; }
    });
    AdminStore.lastSyncedAt = Date.now();
    AdminStore.progress = null;
    await asPersist(putRows);
  } catch(e){
    AdminStore.error = e.message || 'Sync failed';
    AdminStore.progress = null;
  } finally {
    AdminStore.syncing = false;
    updateAdminSyncChip();
  }
  if(changed && typeof window.__adminRepaint==='function') window.__adminRepaint();
  return {changed};
}
function updateAdminLoadingProgress(){
  const el = $('#adminFirstLoad'); const p = AdminStore.progress;
  if(!el || !p) return;
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  el.querySelector('.afl-text').textContent = `${fmtInt(p.done)} / ${fmtInt(p.total)} rows`;
  el.querySelector('.afl-fill').style.width = pct+'%';
}
// Resolves once the store has data to show. Instant when it's already
// stored (the common case); only the very first-ever open actually waits,
// and shows real progress while it does.
async function adminStoreReady(containerSel){
  await asLoad();
  if(AdminStore.rows.length){ adminBackgroundSync(); return true; }
  const el = $(containerSel);
  if(el) el.innerHTML = `<div class="empty-state" id="adminFirstLoad" style="max-width:420px;margin:30px auto;">
    <div style="font-weight:700;margin-bottom:6px;">Downloading all submissions to this device — one time only</div>
    <div class="small-muted" style="margin-bottom:10px;">After this, only new bills are fetched, so every tab opens instantly.</div>
    <div style="height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;"><div class="afl-fill" style="height:100%;width:0%;background:var(--ink);transition:width .2s;"></div></div>
    <div class="afl-text small-muted" style="margin-top:6px;">Starting…</div></div>`;
  await adminSync();
  if(AdminStore.error && !AdminStore.rows.length){
    if(el) el.innerHTML = `<div class="empty-state">${esc(AdminStore.error)}<br><button class="btn small" id="adminRetrySync" style="margin-top:10px;">Retry</button></div>`;
    const b=$('#adminRetrySync'); if(b) b.addEventListener('click', ()=>{ if(typeof window.__adminRepaint==='function') window.__adminRepaint(true); });
    return false;
  }
  return true;
}
function adminBackgroundSync(){
  // Don't hammer the Sheet when tabs are flipped quickly — a sync in the last
  // 20 seconds already has everything.
  if(__adminSyncInflight || Date.now()-AdminStore.lastSyncedAt < 20000) return;
  adminSync();
}
function adminAgoText(){
  if(!AdminStore.lastSyncedAt) return 'not synced yet';
  const sec = Math.round((Date.now()-AdminStore.lastSyncedAt)/1000);
  if(sec<10) return 'just now'; if(sec<60) return sec+'s ago';
  const m=Math.round(sec/60); if(m<60) return m+' min ago'; return Math.round(m/60)+' hr ago';
}
function updateAdminSyncChip(){
  const el = $('#adminSyncChip'); if(!el) return;
  const st = AdminStore;
  const dot = st.error ? 'var(--danger)' : (st.syncing ? 'var(--warn)' : 'var(--success)');
  const label = st.syncing ? 'Syncing…' : (st.error ? 'Sync failed — showing saved data' : `Synced ${adminAgoText()}`);
  el.innerHTML = `<span class="status-dot" style="background:${dot};"></span>
    <span>${esc(label)} · ${fmtInt(st.rows.length)} rows stored</span>
    <button class="btn small" id="adminSyncNow" ${st.syncing?'disabled':''} title="Fetch only what's new since the last sync">↻ Sync</button>
    <button class="btn small" id="adminFullRefresh" ${st.syncing?'disabled':''} title="Throw away the stored copy and download everything again — use after deleting/editing rows directly in the Sheet">Full refresh</button>`;
  $('#adminSyncNow').addEventListener('click', ()=>adminSync());
  $('#adminFullRefresh').addEventListener('click', async ()=>{
    if(!confirm('Re-download every submission from the Sheet? This can take a little while.')) return;
    await adminSync({full:true});
  });
}
let __adminAutoTimer = null;
function adminStartAutoSync(){
  if(__adminAutoTimer) return;
  __adminAutoTimer = setInterval(()=>{
    const s=getSession(); if(!s || s.role!=='Admin'){ clearInterval(__adminAutoTimer); __adminAutoTimer=null; return; }
    if(document.hidden) return;
    if(Date.now()-AdminStore.lastSyncedAt >= 60000) adminSync(); else updateAdminSyncChip();
  }, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ const s=getSession(); if(s && s.role==='Admin') adminBackgroundSync(); } });
}
async function adminStoreWipe(){ asResetMemory(); await asWipeDb(); }
// Filtered view of the store for one tab's own date range/basis.
function adminRowsFor(from, to, basis){ return filterRowsByDateClient(AdminStore.rows, from||'', to||'', basis); }

function renderShell(){
  const s = getSession();
  const tabs = s.role==='Admin'
    ? [{id:'analytics',label:'Analytics'},{id:'performance',label:'Performance'},{id:'submissions',label:'All Submissions'},{id:'users',label:'Manage Users'}]

      </div>
      <div style="display:flex;align-items:center;gap:12px;">

        <div class="status-chip"><span class="status-dot"></span>${esc(s.name)} (${esc(s.role)})</div>
        <button class="btn small" id="logoutBtn">Log Out</button>
      </div>

    <main id="tabBody"></main>
  `;

/* ==================== Shared date-range filter bar ====================
   Used by Analytics, All Submissions, My Data and Bills I Verified alike —
   filters by the BILL's own date (not when it was submitted), inclusive
   on both ends. Leaving both blank means "all time". */
function dateRangeBarHtml(idPrefix, fromVal, toVal, dateBasisVal){
  return `
    <div class="filterbar">
      <div class="field"><label>From</label><input type="date" id="${idPrefix}From" value="${fromVal||''}"></div>
      <div class="field"><label>To</label><input type="date" id="${idPrefix}To" value="${toVal||''}"></div>
      <button class="btn" id="${idPrefix}Clear">Clear (All Time)</button>
      <div class="field"><label>Filter dates by</label><select id="${idPrefix}DateBasis">
        <option value="bill" ${dateBasisVal!=='submission'?'selected':''}>Bill Date</option>
        <option value="submission" ${dateBasisVal==='submission'?'selected':''}>Submission Date (when it was actually entered)</option>
      </select></div>
    </div>
  `;
}
function wireDateRangeBar(idPrefix, onChange){
  $(`#${idPrefix}From`).addEventListener('change', onChange);
  $(`#${idPrefix}To`).addEventListener('change', onChange);
  $(`#${idPrefix}Clear`).addEventListener('click', ()=>{
    $(`#${idPrefix}From`).value=''; $(`#${idPrefix}To`).value='';
    onChange();
  });
  const basisEl = $(`#${idPrefix}DateBasis`);
  if(basisEl) basisEl.addEventListener('change', onChange);
}

let chartInstances = [];

async function renderAnalytics(){

function renderAnalyticsContent(rows){

  const over = rows.filter(r=>r.Status==='over');

  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0);
  const underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);
  // A bill often has several product lines — "6 overcharge LINES" can really
  // be just 2 actual bills once you dedupe by BillUID. Both numbers matter
  // (lines for volume of work, bills for "how many audits actually caught
  // something"), so both get their own card.
  const uniqueBillsOverIds = new Set(over.map(r=>r.BillUID));
  const uniqueBillsUnderIds = new Set(under.map(r=>r.BillUID));
  const uniqueBillsTotalIds = new Set(rows.map(r=>r.BillUID));
  const uniqueDBsOverIds = new Set(over.map(r=>r.DBName));
  const uniqueDBsTotalIds = new Set(rows.map(r=>r.DBName));
  const uniqueBillsNegIds = new Set(neg.map(r=>r.BillUID));
  const rangeFilters = { fromDate: window.__anFrom||'', toDate: window.__anTo||'', dateBasis: window.__anDateBasis||'' };

      <div class="stat-card-top">
        <div>
          <div class="stat-label">${label}${info?`<span class="info-dot" data-tip="${esc(info)}">i</span>`:''}</div>
          <div class="stat-value">${value}</div>
          ${sub?`<div class="stat-card-sub">${sub}</div>`:''}
        </div>
        <div class="stat-card-icon" style="background:${iconBg};">${icon}</div>

      ${filters?`<div class="stat-card-hint">View bills →</div>`:''}
    </div>`;
  };

  content.innerHTML = `
    <div class="section-eyebrow">Line-level</div>
    <div class="grid grid-4" style="margin-bottom:8px;">

      ${statCard({icon:'⚠️', iconBg:'var(--danger-soft)', label:'Overcharge Lines', value:fmtInt(over.length), sub:`₹${fmtMoney(overAmt)} total`, filters:{status:'over'}, info:'Lines where Invoice Rate > Company Rate by 1% or more. ₹ total = sum of (Invoice Rate − Company Rate) × Qty(kg) for each line.'})}
      ${statCard({icon:'↩️', iconBg:'var(--warn-soft)', label:'Undercharge Lines', value:fmtInt(under.length), sub:`₹${fmtMoney(underAmt)} total`, filters:{status:'under'}, info:'Lines where Invoice Rate is below Company Rate — no negligible band on this side, any amount counts.'})}
      ${statCard({icon:'≈', iconBg:'var(--negligible-soft)', label:'Negligible', value:fmtInt(neg.length), filters:{status:'negligible'}, info:'Lines where Invoice Rate > Company Rate, but by under 1% — technically an overcharge, but too small to flag.'})}

      ${statCard({icon:'🏬', iconBg:'var(--panel-2)', label:'Total Unique Distributors', value:fmtInt(uniqueDBsTotalIds.size), filters:{uniqueBillsOnly:true}, info:'Distinct DB Names that appear anywhere in this range — regardless of whether any of their bills had an overcharge.'})}
      ${statCard({icon:'🔴', iconBg:'var(--danger-soft)', label:'Bills w/ Overcharge', value:fmtInt(uniqueBillsOverIds.size), sub:`${rows.length?Math.round(uniqueBillsOverIds.size/uniqueBillsTotalIds.size*100):0}% of all bills`, filters:{status:'over', uniqueBillsOnly:true}, info:'Unique bills that have AT LEAST ONE overcharge line — a bill with 2 overcharge lines still only counts once.'})}
      ${statCard({icon:'🟡', iconBg:'var(--warn-soft)', label:'Bills w/ Undercharge', value:fmtInt(uniqueBillsUnderIds.size), sub:`${rows.length?Math.round(uniqueBillsUnderIds.size/uniqueBillsTotalIds.size*100):0}% of all bills`, filters:{status:'under', uniqueBillsOnly:true}, info:'Unique bills that have at least one undercharge line.'})}
    </div>
    <div class="grid grid-3" style="margin-bottom:18px;">
      ${statCard({icon:'🔵', iconBg:'var(--negligible-soft)', label:'Bills w/ Negligible Overcharge', value:fmtInt(uniqueBillsNegIds.size), sub:`${rows.length?Math.round(uniqueBillsNegIds.size/uniqueBillsTotalIds.size*100):0}% of all bills — under 1%, not flagged`, filters:{status:'negligible', uniqueBillsOnly:true}, info:'Unique bills whose only issue (if any) is a negligible (<1%) overcharge line.'})}
      ${statCard({icon:'🏢', iconBg:'var(--danger-soft)', label:'Distributors w/ Overcharge', value:fmtInt(uniqueDBsOverIds.size), sub:'unique DBs, at least 1 overcharge line', filters:{status:'over', uniqueBillsOnly:true}, info:'Distinct DB Names with at least one overcharge line anywhere in their bills, out of the Total Unique Distributors above.'})}
      ${statCard({icon:'🟢', iconBg:'var(--success-soft)', label:'Clean Bills', value:fmtInt(uniqueBillsTotalIds.size-new Set([...uniqueBillsOverIds,...uniqueBillsUnderIds,...uniqueBillsNegIds]).size), sub:'no over/undercharge/negligible line at all', info:'Total Unique Bills minus any bill that has even one over/under/negligible line — every line on these bills was an exact Match.'})}
    </div>
    <div class="grid grid-2" style="margin-bottom:18px;">

  // Every clickable stat card routes through the exact same place any other

  // always the same familiar table/export, just pre-filtered differently.
  $all('.stat-card.clickable', content).forEach(card=>{
    card.addEventListener('click', ()=>{
      const filters = JSON.parse(card.getAttribute('data-goto'));
      goToFilteredSubmissions(filters);

  });

  function topN(field, n){
    const m = {};
    over.forEach(r=>{ const k=r[field]||'—'; m[k]=(m[k]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
  }
  const byDay = {};
  rows.forEach(r=>{ if(r.Status==='over'){ const d=(r.BillDate||'').slice(0,10)||'?'; byDay[d]=(byDay[d]||0)+(Number(r.OverchargeAmt)||0); } });
  // BillDate is DD-MM-YYYY, so a plain string sort puts "05-12-2026" before
  // "20-01-2027" — chronologically backwards. Parse each into a real Date
  // for ordering, keep the original DD-MM-YYYY string as the display label.
  const parseDMYClientA = (s)=>{ const m=String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); return m? new Date(Number(m[3]),Number(m[2])-1,Number(m[1])) : null; };
  const days = Object.keys(byDay).sort((a,b)=>{
    const da=parseDMYClientA(a), db=parseDMYClientA(b);
    if(da && db) return da-db;
    return a.localeCompare(b); // fallback for any stray unparseable label (e.g. "?")
  });
  const topAud = topN('AuditorName', 8);
  const topDB = topN('DBName', 8);
  const topCat = topN('Category', 10);

  // Chart.js loads from a CDN — if a firewall, ad-blocker, or offline moment

    $('#chTrendWrap').innerHTML = days.length ? simpleBarListHtml(days.map(d=>[d, Math.round(byDay[d]*100)/100, 'var(--danger)', {status:'over', fromDate:dmyToISOClient(d), toDate:dmyToISOClient(d), dateBasis:'bill'}]), true, rangeFilters) : '<div class="empty-state">No overcharge lines in this period.</div>';
    $('#chAuditorsWrap').innerHTML = topAud.length ? simpleBarListHtml(topAud.map(([k,v])=>[k,v,'var(--ink)', {status:'over', auditorName:k}]), false, rangeFilters) : '<div class="empty-state">No overcharge lines.</div>';
    $('#chDBsWrap').innerHTML = topDB.length ? simpleBarListHtml(topDB.map(([k,v])=>[k,v,'var(--danger)', {status:'over', dbName:k}]), false, rangeFilters) : '<div class="empty-state">No overcharge lines.</div>';
    $('#chCategoryWrap').innerHTML = topCat.length ? simpleBarListHtml(topCat.map(([k,v])=>[k,v,'var(--negligible)', {status:'over', category:k}]), false, rangeFilters) : '<div class="empty-state">No overcharge lines.</div>';
    $all('.micro-bar-row[data-goto]', content).forEach(row=>{
      row.addEventListener('click', ()=> goToFilteredSubmissions(JSON.parse(row.getAttribute('data-goto'))));
    });
    return;
  }

  chartInstances.push(new Chart($('#chStatus'), {
    type:'doughnut',
    data:{ labels:['Overcharge','Overcharge – Negligible','Undercharge','Match'],

    options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}}, onClick:(evt,els)=>{

    }, onHover:(evt,els)=>{ evt.native.target.style.cursor = els.length?'pointer':'default'; } }
  }));
  chartInstances.push(new Chart($('#chCategory'), {
    type:'bar',
    data:{ labels:topCat.map(x=>x[0]), datasets:[{ label:'Overcharge lines', data:topCat.map(x=>x[1]), backgroundColor:'#2A5FD9' }] },
    options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}}, onClick:(evt,els)=>{

    }, onHover:(evt,els)=>{ evt.native.target.style.cursor = els.length?'pointer':'default'; } }
  }));
}
function simpleBarListHtml(items, isCurrency, rangeFilters){
  const max = Math.max(...items.map(i=>i[1]), 1);
  return `<div style="padding:4px 0;">${items.map(([label,val,color,filters])=>`
    <div class="micro-bar-row" data-goto='${esc(JSON.stringify({...(rangeFilters||{}), ...filters}))}'>
      <div class="mb-label" title="${esc(String(label))}">${esc(String(label))}</div>
      <div class="mb-track"><div class="mb-fill" style="width:${(val/max)*100}%;background:${color};"></div></div>
      <div class="mb-count">${isCurrency?'₹'+fmtMoney(val):fmtInt(val)}</div>

function computePerformanceRows(rows, nameField){
  const byPerson = {};
  rows.forEach(r=>{
    const name = r[nameField];
    if(!name) return;
    if(!byPerson[name]) byPerson[name] = { name, bills:new Set(), overBills:new Set(), underBills:new Set(), overAmt:0, underAmt:0, lines:0 };
    const p = byPerson[name];
    p.bills.add(r.BillUID);
    p.lines++;
    if(r.Status==='over'){ p.overBills.add(r.BillUID); p.overAmt += Number(r.OverchargeAmt)||0; }
    if(r.Status==='under'){ p.underBills.add(r.BillUID); p.underAmt += Number(r.UnderchargeAmt)||0; }
  });
  return Object.values(byPerson).map(p=>({
    name:p.name, uniqueBills:p.bills.size, lines:p.lines,
    overBills:p.overBills.size, underBills:p.underBills.size,
    overAmt:p.overAmt, underAmt:p.underAmt,
  })).sort((a,b)=>b.uniqueBills-a.uniqueBills);
}
function paintPerformance(rows){

    const verifierRows = computePerformanceRows(rows, 'VerifiedBy').map(p=>({...p, role:'Verifier'}));
    // Identical tables (same people did both jobs) export as one set of
    // rows labelled for both roles instead of every row twice.
    exportPerformanceExcel(window.__pfIdentical ? auditorRows.map(p=>({...p, role:'Auditor & Verifier'})) : [...auditorRows, ...verifierRows]);
  };
  if(!rows.length){ $('#pfContent').innerHTML = '<div class="empty-state">No submissions in this period yet.</div>'; return; }

  const auditorPerf = computePerformanceRows(rows, 'AuditorName');

  const rangeFilters = { fromDate: window.__pfFrom||'', toDate: window.__pfTo||'', dateBasis: window.__pfDateBasis||'' };

  // When the same people did both jobs on the same bills (an Auditor who also

  const perfKey = p => [p.name,p.uniqueBills,p.lines,p.overBills,p.underBills,p.overAmt.toFixed(2),p.underAmt.toFixed(2)].join('|');
  const audKeys = auditorPerf.map(perfKey).sort(), verKeys = verifierPerf.map(perfKey).sort();
  const identical = audKeys.length>0 && audKeys.length===verKeys.length && audKeys.every((k,i)=>k===verKeys[i]);
  window.__pfIdentical = identical;
  const audNames = new Set(auditorPerf.map(p=>p.name)), verNames = new Set(verifierPerf.map(p=>p.name));

  const perfTable = (list, roleLabel, filterKey, otherNames, otherLabel)=>`
    <div class="table-wrap"><table>
      <thead><tr><th>${roleLabel}</th><th class="num">Unique Bills</th><th class="num">Lines</th><th class="num">Overcharge Bills</th><th class="num">₹ Overcharge</th><th class="num">Undercharge Bills</th><th class="num">₹ Undercharge</th></tr></thead>
      <tbody>${list.map(p=>`<tr class="perf-row" data-goto='${esc(JSON.stringify({...rangeFilters, [filterKey]:p.name}))}'>
        <td><b>${esc(p.name)}</b>${otherNames&&otherNames.has(p.name)?` <span class="small-muted" style="font-size:10.5px;">· also ${otherLabel}</span>`:''}</td>
        <td class="num">${fmtInt(p.uniqueBills)}</td>
        <td class="num small-muted">${fmtInt(p.lines)}</td>
        <td class="num" style="color:${p.overBills?'var(--danger)':'inherit'};font-weight:${p.overBills?700:400};">${fmtInt(p.overBills)}</td>
        <td class="num" style="color:${p.overBills?'var(--danger)':'inherit'};">₹${fmtMoney(p.overAmt)}</td>
        <td class="num" style="color:${p.underBills?'var(--warn)':'inherit'};font-weight:${p.underBills?700:400};">${fmtInt(p.underBills)}</td>
        <td class="num" style="color:${p.underBills?'var(--warn)':'inherit'};">₹${fmtMoney(p.underAmt)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;

  if(identical){
    $('#pfContent').innerHTML = `
      <div class="section-eyebrow">👥 Auditor &amp; Verifier performance <span class="click-hint" style="margin-left:8px;">same people, same bills — click a row to view their bills</span></div>

    `;
  }
  $all('.perf-row', $('#pfContent')).forEach(row=>{
    row.addEventListener('click', ()=> goToFilteredSubmissions(JSON.parse(row.getAttribute('data-goto'))));
  });
}
async function exportPerformanceExcel(perfRows){

// Parses a 'DD-MM-YYYY' BillDate string into a comparable Date (local
// midnight) — mirrors Code.gs's own parseDMY_ so client-side filtering of
// the background-prefetched full dataset gives identical results to what
// the server would have returned for the same range.
function parseDMYClient(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(!m) return null;
  return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
}
function dmyToISOClient(s){ const m=String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : ''; }
function filterRowsByDateClient(rows, fromStr, toStr, dateBasis){
  if(!fromStr && !toStr) return rows;
  const from = fromStr ? new Date(fromStr+'T00:00:00') : null;
  const to = toStr ? new Date(toStr+'T00:00:00') : null;
  const field = dateBasis==='submission' ? 'SubmissionDate' : 'BillDate';
  return rows.filter(r=>{
    const bd = parseDMYClient(normalizeDMYDisplay(r[field]));
    if(!bd) return true; // keep rows with an unparseable date rather than silently dropping them
    if(from && bd < from) return false;
    if(to && bd > to) return false;
    return true;
  });
}

function applySubmissionFilters(){

  if(sig!==window.__subSig){ window.__subSig = sig; window.__subPage = 1; } // a background sync adding rows keeps your page; changing a filter starts from page 1

  if(window.__subStatus) rows = rows.filter(r=>r.Status===window.__subStatus);
  if(window.__subCategory) rows = rows.filter(r=>r.Category===window.__subCategory);
  if(window.__subDBName) rows = rows.filter(r=>r.DBName===window.__subDBName);

  renderFilteredAnalyticsStrip(rows);

      <button class="btn small" id="subNext" ${window.__subPage>=totalPages?'disabled':''}>Next →</button></div>` : '';
  content.innerHTML = `${pager}<div class="table-wrap"><table>
    <thead><tr>${cols.map(c=>`<th>${c==='BillCopy'?'Bill Copy':c}</th>`).join('')}</tr></thead>
    <tbody>${pageRows.map(r=>{

      if(['CompanyRate','InvoiceRate','OverchargeAmt','UnderchargeAmt'].includes(c)) return `<td class="num">${fmtMoney(r[c])}</td>`;
      if(c==='VariancePct') return `<td class="num">${r[c]!=null && r[c]!==''?r[c]+'%':'—'}</td>`;
      if(c==='Timestamp') return `<td>${esc(formatISTDateTime(r[c]))}</td>`;
      if(DATE_DISPLAY_FIELDS.includes(c)) return `<td>${esc(normalizeDMYDisplay(r[c]))}</td>`;
      return `<td>${esc(r[c])}</td>`;
    }).join('')}</tr>`; }).join('')}</tbody>
  </table></div>${pager}`;
  $all('#subPrev').forEach(b=>b.addEventListener('click', ()=>{ window.__subPage--; renderSubmissionsTable(rows); }));
  $all('#subNext').forEach(b=>b.addEventListener('click', ()=>{ window.__subPage++; renderSubmissionsTable(rows); }));
}

/* Same colored "Pro" look AND the SAME full column set as Rate Ledger's own
   Excel export — so a report downloaded from anywhere (any Dashboard view,
   by any Verifier or Auditor) is byte-for-byte the same shape and style as
   one downloaded straight from Rate Ledger. Source rows here come from the
   Sheet (PascalCase headers); a couple of columns Rate Ledger computes
   in-browser (₹/PC rates) aren't stored as their own Sheet columns, so
   they're recomputed here from PackSizeKg, which IS stored. */
async function exportProExcel(rows, filenamePrefix, viewLabel){
  if(!rows || !rows.length){ toast('Nothing to export', 'err'); return; }
  const INK='FF1E2438', DANGER='FFB23A2E', DANGERSOFT='FFF3DEDA',
        SUCCESSSOFT='FFDCEBE0', WARNSOFT='FFF1E4C6', NEGLIGIBLESOFT='FFDCE6F5', NEGLIGIBLE='FF2A5FD9',

  const wb = new ExcelJS.Workbook();

  const ws = wb.addWorksheet('Overinvoicing Report', {views:[{state:'frozen', ySplit:5}]});
  const cols = [
    {header:'SL', key:'sl', width:6}, {header:'Bill UID', key:'BillUID', width:16}, {header:'DB Code', key:'DBCode', width:11}, {header:'DB Name', key:'DBName', width:26},

    {header:'Bill No', key:'BillNo', width:14}, {header:'Bill Date', key:'BillDate', width:12}, {header:'SO Submitted On', key:'SOSubmitDate', width:14}, {header:'Product', key:'ProductName', width:34},
    {header:'Pack Size (kg)', key:'PackSizeKg', width:12}, {header:'Product Code', key:'ProductCode', width:13}, {header:'GST %', key:'GSTPct', width:8},
    {header:'Company Rate (₹/kg)', key:'CompanyRate', width:14}, {header:'Company Rate (₹/PC)', key:'CompanyRatePerPc', width:14},
    {header:'Bag Size', key:'BagSizeLabel', width:12}, {header:'Components', key:'ComponentsSummary', width:30},

    {header:'Undercharge Amt', key:'UnderchargeAmt', width:16}, {header:'Wrong GST Charged (₹)', key:'GSTMismatchLabel', width:18},
    {header:'Collected By', key:'CollectedBy', width:20}, {header:'Designation', key:'Designation', width:16},
    {header:'Verified By', key:'VerifiedBy', width:20}, {header:'Submission Date', key:'SubmissionDate', width:15}, {header:'Entered At (IST)', key:'Timestamp', width:22}, {header:'Bill Copy', key:'BillCopyURL', width:16},
  ];
  ws.columns = cols.map(c=>({key:c.key, width:c.width}));

  const titleCell = ws.getCell(1,1);

  titleCell.font = {name:'Calibri', size:14, bold:true, color:{argb:WHITE}};
  titleCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:INK}};
  ws.getRow(1).height = 26;
  const over = rows.filter(r=>r.Status==='over'), under = rows.filter(r=>r.Status==='under'), neg = rows.filter(r=>r.Status==='negligible');
  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0), underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);
  ws.mergeCells(2,1,2,cols.length);
  ws.getCell(2,1).value = `Generated ${formatISTDateTime(new Date())} IST  ·  ${rows.length} lines  ·  ${over.length} overcharge (₹${overAmt.toFixed(2)})  ·  ${under.length} undercharge (₹${underAmt.toFixed(2)})  ·  ${neg.length} negligible (<1%, excluded)`;
  ws.getCell(2,1).font = {name:'Calibri', size:10, italic:true, color:{argb:'FF6B6E76'}};
  const headerRow = ws.getRow(4);
  cols.forEach((c,i)=>{ headerRow.getCell(i+1).value = c.header; });
  headerRow.eachCell(cell=>{ cell.font={name:'Calibri',size:10,bold:true,color:{argb:WHITE}}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; cell.alignment={vertical:'middle'}; });

  rows.forEach((row,idx)=>{
    const status = (row.Status||'').toLowerCase();

    const sColor = status==='over'?DANGER:(status==='negligible'?NEGLIGIBLE:(status==='under'?'FF9C6B12':'FF1E7A4C'));
    const statusLabel = status==='over'?'OVERCHARGE':(status==='negligible'?'OVERCHARGE - NEGLIGIBLE':(status==='under'?'UNDERCHARGE':'MATCH'));
    const packKg = Number(row.PackSizeKg)||null;
    const companyRatePerPc = packKg ? (Number(row.CompanyRate)||0)*packKg : '';
    const blendedRatePerPc = packKg ? (Number(row.InvoiceRate)||0)*packKg : '';
    // TotalInvoiced isn't its own Sheet column (only the per-kg rate is) —
    // it's exactly QtyKG × the blended rate, so derive it rather than add
    // yet another column to migrate for.
    const totalInvoiced = (row.TotalInvoiced!=null && row.TotalInvoiced!=='') ? row.TotalInvoiced : (Number(row.QtyKG)||0)*(Number(row.InvoiceRate)||0);
    const vp = row.VariancePct==null||row.VariancePct===''?'':row.VariancePct;
    const variancePctLabel = vp===''?'':((Number(vp)>0?'+':'')+vp+'%');
    const chargeAmt = status==='over' ? Number(row.OverchargeAmt)||0 : (status==='under' ? -(Number(row.UnderchargeAmt)||0) : (Number(row.NegligibleAmt)||0));
    const diffAmountLabel = (chargeAmt>0?'+':'')+chargeAmt.toFixed(2);
    const gstMismatch = String(row.GSTMismatch).toUpperCase()==='TRUE';
    const gstMismatchLabel = gstMismatch ? `${row.GSTPctCharged}% charged vs correct ${row.GSTPct}% = ${Number(row.GSTMismatchAmt)>0?'+':''}${row.GSTMismatchAmt}` : '';

    const excelRow = ws.getRow(r);
    cols.forEach((c,i)=>{
      let v = rowData[c.key];
      if(DATE_DISPLAY_FIELDS.includes(c.key) && v) v = normalizeDMYDisplay(v);
      if(c.key==='Timestamp' && v) v = formatISTDateTime(v);
      if(c.key==='BillCopyURL' && v){

      }
      excelRow.getCell(i+1).fill = {type:'pattern', pattern:'solid', fgColor:{argb: gstMismatch ? (GSTMISMATCHSOFT) : fillColor}};
    });
    ['CompanyRate','CompanyRatePerPc','InvoiceRate','BlendedRatePerPc','TotalInvoiced','OverchargeAmt','UnderchargeAmt','DiffPerKg','DiffPerPc','DiffPerBag'].forEach(k=>{
      const ci = cols.findIndex(c=>c.key===k)+1;
      if(ci>0) excelRow.getCell(ci).numFmt = '#,##0.00';
    });
    const byKey = k=>{ const ci=cols.findIndex(c=>c.key===k)+1; return ci>0?excelRow.getCell(ci):null; };
    [byKey('StatusLabel'), byKey('VariancePctLabel'), byKey('DiffAmountLabel')].forEach(cell=>{ if(cell) cell.font={bold:true,color:{argb:sColor}}; });
    if(status==='over'){ const c=byKey('OverchargeAmt'); if(c) c.font={bold:true,color:{argb:DANGER}}; }
    if(status==='under'){ const c=byKey('UnderchargeAmt'); if(c) c.font={bold:true,color:{argb:'FF9C6B12'}}; }
    if(gstMismatch){ const c=byKey('GSTMismatchLabel'); if(c){ c.font={bold:true,color:{argb:'FF9B59EB'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:GSTMISMATCHSOFT}}; } }
    excelRow.height = 18;
    r++;
  });
  // Summary sheet — same structure as Rate Ledger's own Pro export, so both
  // reports carry the identical at-a-glance overview alongside the detail.
  const ws2 = wb.addWorksheet('Summary');
  ws2.columns = [{width:28},{width:18},{width:18}];
  ws2.getCell('A1').value = 'RATE LEDGER — SUMMARY';
  ws2.getCell('A1').font = {size:13,bold:true,color:{argb:WHITE}};
  ws2.mergeCells('A1:B1'); ws2.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}};
  ws2.getRow(1).height = 22;
  const overCount = over.length, overAmt2 = over.reduce((s,rr)=>s+(Number(rr.OverchargeAmt)||0),0);
  const underCount = under.length, underAmt2 = under.reduce((s,rr)=>s+(Number(rr.UnderchargeAmt)||0),0);
  const negCount = neg.length, negAmt = neg.reduce((s,rr)=>s+(Number(rr.NegligibleAmt)||0),0);
  const byLoc = {};
  rows.forEach(rr=>{
    const loc = rr.Location||'—';
    byLoc[loc] = byLoc[loc] || {total:0, over:0, overAmt:0, under:0, underAmt:0};
    byLoc[loc].total++;
    if(rr.Status==='over'){ byLoc[loc].over++; byLoc[loc].overAmt += Number(rr.OverchargeAmt)||0; }
    if(rr.Status==='under'){ byLoc[loc].under++; byLoc[loc].underAmt += Number(rr.UnderchargeAmt)||0; }
  });
  let sr = 3;
  ws2.getCell(`A${sr}`).value='Total lines checked'; ws2.getCell(`B${sr}`).value=rows.length; sr++;
  ws2.getCell(`A${sr}`).value='Overcharge instances (≥1% of rate)'; ws2.getCell(`B${sr}`).value=overCount; sr++;
  ws2.getCell(`A${sr}`).value='Total overcharge value (₹)'; ws2.getCell(`B${sr}`).value=Number(overAmt2.toFixed(2)); sr++;
  ws2.getCell(`A${sr}`).value='Undercharge instances'; ws2.getCell(`B${sr}`).value=underCount; sr++;
  ws2.getCell(`A${sr}`).value='Total undercharge value (₹)'; ws2.getCell(`B${sr}`).value=Number(underAmt2.toFixed(2)); sr++;
  ws2.getCell(`A${sr}`).value='Negligible instances (<1% of rate)'; ws2.getCell(`B${sr}`).value=negCount; sr++;
  ws2.getCell(`A${sr}`).value='Total negligible value (₹, excluded from overcharge)'; ws2.getCell(`B${sr}`).value=Number(negAmt.toFixed(2)); sr+=2;
  ws2.getCell(`A${sr}`).value='Location'; ws2.getCell(`B${sr}`).value='Overcharge lines'; ws2.getCell(`C${sr}`).value='Undercharge lines';
  ws2.getRow(sr).eachCell(c=>{ c.font={bold:true,color:{argb:WHITE}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; });
  sr++;
  Object.entries(byLoc).forEach(([loc,v])=>{ ws2.getCell(`A${sr}`).value=loc; ws2.getCell(`B${sr}`).value=v.over; ws2.getCell(`C${sr}`).value=v.under; sr++; });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filenamePrefix}_${istDateDMY()}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();

}

/* Bulk-downloads every bill photo currently on screen as one ZIP, built right in the browser
   straight from the public Supabase Storage links (no server round-trip, no Drive). Folder per DB,
   file name = DBCode_DBName_Verifier_CollectedBy_BillDate_uid — same as before. */
async function exportBillPhotosZip(rows, btn){
  const seen = {}; const bills = [];
  rows.forEach(r=>{ if(r.BillCopyURL && !seen[r.BillUID]){ seen[r.BillUID]=1; bills.push(r); } });
  if(!bills.length){ toast('No bill photos in the current filtered view', 'err'); return; }
  const origLabel = btn.innerHTML;
  btn.disabled = true;
  try{
    if(typeof JSZip === 'undefined'){
      await new Promise((ok,bad)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload=ok; sc.onerror=()=>bad(new Error('Could not load the ZIP library')); document.head.appendChild(sc); });
    }
    const zip = new JSZip();
    const clean = s => String(s||'').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'_').trim() || 'unknown';
    let done = 0, ok = 0, next = 0;
    const worker = async ()=>{
      while(next < bills.length){
        const r = bills[next++];
        try{
          let blob, ext;
          const fid = photoFileId(r.BillCopyURL);
          if(fid && photoAppUrl()){            // Drive photo -> fetched as JSON (base64) through the photo script
            const resp = await fetch(`${photoAppUrl()}?action=photojson&fileId=${fid}`);
            const j = await resp.json();
            if(!j.ok) throw new Error(j.error||'photo');
            blob = supaB64ToBlob(j.base64, j.mime); ext = /pdf/i.test(j.mime) ? 'pdf' : 'jpg';
          } else {
            const resp = await fetch(r.BillCopyURL);
            if(!resp.ok) throw new Error('HTTP '+resp.status);
            blob = await resp.blob();
            ext = /pdf/i.test(blob.type) || /\.pdf($|\?)/i.test(r.BillCopyURL) ? 'pdf' : 'jpg';
          }
          const folder = clean(`${r.DBCode}_${r.DBName}`);
          const base = clean(`${r.DBCode}_${r.DBName}_${r.VerifiedBy||'Unverified'}_${r.CollectedBy||'Unknown'}_${r.BillDate||''}_${String(r.BillUID).replace('bill_','')}`);
          zip.file(`${folder}/${base}.${ext}`, blob);
          ok++;
        }catch(e){ /* skip unreadable file */ }
        done++;
        btn.innerHTML = `<span class="loader"></span> Packing ${done}/${bills.length}…`;
      }
    };
    await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
    if(!ok){ toast('Found bills, but none of their photo files could be downloaded', 'err'); return; }
    const out = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url; a.download = `Bill_Photos_${istDateDMY()}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast(`Downloaded ${ok} bill photo${ok===1?'':'s'}, organised by DB`, 'ok');
  } catch(e){
    toast('Could not build the photo ZIP — ' + (e.message||'try again'), 'err');
  } finally {
    btn.disabled = false; btn.innerHTML = origLabel;
  }
}

/* Weekly / Monthly / Today / All-time quick filter buttons, alongside the
   existing From/To range — clicking one sets both dates and re-renders. */
function quickRangeHtml(prefix){
  return `<div class="quick-range" id="${prefix}QuickRange">
    <button data-q="today">Today</button>
    <button data-q="week">This Week</button>
    <button data-q="month">This Month</button>
    <button data-q="all">All Time</button>
  </div>`;
}
function wireQuickRange(prefix, onPick){
  const wrap = $(`#${prefix}QuickRange`);
  if(!wrap) return;
  wrap.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{
    let from='', to='';
    if(btn.dataset.q==='today'){ from = to = istDateISO(); }
    else if(btn.dataset.q==='week'){ from = istWeekStartISO(); to = istDateISO(); }
    else if(btn.dataset.q==='month'){ from = istMonthStartISO(); to = istDateISO(); }
    else { from=''; to=''; }
    onPick(from, to);
  }));
}

async function addUserHandler(){

      <button class="btn secondary" id="mvExportPhotos" disabled>📷 Download All Photos (ZIP)</button>
