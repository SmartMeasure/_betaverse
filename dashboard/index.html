<title>Rate Ledger — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --void:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F5F7; --panel-3:#E7E9EC;
  --edge:rgba(10,10,15,0.14); --edge-soft:rgba(10,10,15,0.07);
  --ink:#12131A; --ink-soft:#53555C; --ink-faint:#8B8D93;
  --accent:#101114; --accent-soft:rgba(16,17,20,0.08);
  --danger:#D6234B; --danger-soft:rgba(214,35,75,0.12);
  --success:#0FA86B; --success-soft:rgba(15,168,107,0.12);
  --warn:#B9791A; --warn-soft:rgba(185,121,26,0.14);
  --negligible:#2A5FD9; --negligible-soft:rgba(42,95,217,0.10);
  --radius:8px; --radius-sm:4px;
  --font-display:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --shadow-card: 0 0 0 1px rgba(10,10,15,0.08), 0 10px 26px rgba(10,10,15,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);color:var(--ink);background:var(--panel-2);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
#app{max-width:1320px;margin:0 auto;padding:0 24px 60px;}
.topbar{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;background:var(--panel-3);border:1px solid var(--edge);}
.brand-text h1{font-size:20px;}
.version-badge{display:inline-block;vertical-align:middle;font-size:10.5px;font-weight:700;font-family:var(--font-mono);background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--edge);border-radius:5px;padding:2px 7px;margin-left:6px;letter-spacing:.02em;}
.brand-text p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--edge);border-radius:100px;background:var(--panel);font-size:11.5px;color:var(--ink-soft);}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.tabstrip{display:flex;gap:4px;border-bottom:1px solid var(--edge);margin-bottom:22px;flex-wrap:wrap;}
.tab-btn{font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-soft);background:transparent;border:none;padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer;}
.tab-btn.active{color:var(--ink);background:var(--panel-3);}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.stat-card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:16px 18px;position:relative;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
.stat-card.clickable{cursor:pointer;}
.stat-card.clickable:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(16,17,20,.10);border-color:var(--ink-faint);}
.stat-card.clickable:active{transform:translateY(-1px);}
.stat-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.stat-card-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
.stat-card-hint{position:absolute;right:14px;bottom:12px;font-size:10.5px;font-weight:700;color:var(--ink-faint);opacity:0;transform:translateX(-4px);transition:opacity .15s ease, transform .15s ease;}
.stat-card.clickable:hover .stat-card-hint{opacity:1;transform:translateX(0);}
.stat-card-sub{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
.info-dot{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--panel-3, var(--edge));color:var(--ink-soft);font-size:9px;font-weight:700;font-style:italic;font-family:Georgia,serif;margin-left:5px;cursor:help;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0;}
.info-dot:hover{background:var(--ink);color:#fff;}
.info-dot::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;font-weight:500;line-height:1.4;width:270px;white-space:normal;text-align:left;opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.info-dot::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);margin-bottom:-2px;opacity:0;transition:opacity .12s ease;z-index:20;}
.info-dot:hover::after, .info-dot:hover::before{opacity:1;}
.stat-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;}
.section-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.section-eyebrow::after{content:'';flex:1;height:1px;background:var(--edge);}
.chart-card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 20px;}
.chart-card h3{font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.chart-card .click-hint{font-size:10px;font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0;margin-left:auto;}
.stat-note{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.field{margin-bottom:14px;}
.bill-copy-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
.bill-copy-link:hover{text-decoration:underline;}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:100px;padding:5px 12px;font-size:12px;font-weight:600;margin:6px 6px 0 0;cursor:pointer;}
.filter-chip b{font-weight:700;opacity:.7;}
.filter-chip:hover b{opacity:1;}
.mini-stat-strip{display:flex;gap:0;flex-wrap:wrap;background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);margin:10px 0;overflow:hidden;}
.mini-stat{flex:1;min-width:110px;padding:10px 14px;border-right:1px solid var(--edge-soft);display:flex;flex-direction:column;gap:2px;}
.mini-stat:last-child{border-right:none;}
.mini-stat-val{font-family:var(--font-mono);font-size:17px;font-weight:700;}
.mini-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;}
.verifier-code-wrap{position:relative;}
.verifier-code-wrap input{width:100%;padding-right:26px;}
.eye-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:12px;padding:2px 4px;line-height:1;color:var(--ink-faint);}
.eye-toggle:hover{color:var(--ink-soft);}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font-size:13.5px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.btn{padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid var(--edge);background:var(--panel-3);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--accent);}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent;font-weight:700;}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent;}
.btn.small{padding:6px 11px;font-size:12px;}
.btn.wide{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:var(--radius);}
tr.auditor-group-start td{border-top:2px solid var(--ink);}
thead th{text-align:left;padding:9px 11px;background:var(--panel-3);color:var(--ink-soft);font-weight:600;font-size:10.8px;text-transform:uppercase;white-space:nowrap;}
tbody td{padding:8px 11px;border-bottom:1px solid var(--edge-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
td.num{font-family:var(--font-mono);text-align:right;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:10.8px;font-weight:600;}
.badge.over{background:var(--danger-soft);color:var(--danger);}
.badge.negligible{background:var(--negligible-soft);color:var(--negligible);}
.badge.under{background:var(--warn-soft);color:var(--warn);}
.badge.match{background:var(--success-soft);color:var(--success);}
.badge.active{background:var(--success-soft);color:var(--success);}
.badge.inactive{background:var(--danger-soft);color:var(--danger);}
.divider{height:1px;background:var(--edge);margin:20px 0;}
.small-muted{font-size:11.5px;color:var(--ink-faint);}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin:0 0 12px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.ultimate-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;}
.ultimate-loader svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.06));}
.quick-range{display:flex;gap:6px;flex-wrap:wrap;}
.quick-range button{background:var(--panel-2);border:1px solid var(--edge);border-radius:100px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.quick-range button:hover{background:var(--edge);}
.quick-range button.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
.stale-banner{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.stale-banner .spin{width:11px;height:11px;border:2px solid var(--edge);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.micro-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;}
.micro-bar-row:hover{background:var(--panel-2);}
.micro-bar-row .mb-label{width:160px;flex:none;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.micro-bar-row .mb-track{flex:1;height:16px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.micro-bar-row .mb-fill{height:100%;border-radius:4px;}
.micro-bar-row .mb-count{width:80px;flex:none;text-align:right;font-size:12px;font-weight:700;font-family:var(--font-mono);}
.micro-bar-row.active{outline:2px solid var(--ink);border-radius:6px;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.filterbar .field{margin-bottom:0;min-width:150px;}
.loader{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ===== Analytics (v29) ===== */
.an-hero{--o:#FF4D73;--n:#6C95FF;--u:#F0A93E;--m:#2FD08D;display:grid;grid-template-columns:minmax(0,1.25fr) auto minmax(0,1.5fr);gap:28px 36px;align-items:center;background:#12131A;color:#fff;border-radius:16px;padding:28px 32px;margin-bottom:16px;position:relative;overflow:hidden;}
.an-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(520px 220px at 12% 0%,rgba(255,77,115,.20),transparent 70%);pointer-events:none;}
.an-hero > *{position:relative;}
.an-hero-lbl{font-size:13px;color:rgba(255,255,255,.62);margin-bottom:6px;}
.an-hero-val{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,4.6vw,58px);line-height:1.04;letter-spacing:-.02em;font-variant-numeric:tabular-nums;cursor:pointer;display:inline-block;}
.an-hero-val .rs{color:var(--o);margin-right:4px;font-weight:500;}
.an-hero-val:hover{text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:6px;}
.an-hero-sub{margin-top:12px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.66);max-width:46ch;}
.an-hero-sub b{color:#fff;font-weight:600;}
.an-hero-ring{position:relative;width:112px;height:112px;cursor:pointer;}
.an-ring-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) .15s;}
.an-ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.an-ring-txt b{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1;}
.an-ring-txt span{font-size:9.5px;line-height:1.2;color:rgba(255,255,255,.6);margin-top:3px;}
.an-hero-ring:hover .an-ring-arc{stroke:#ff7a96;}
.an-split-h{font-size:13px;color:rgba(255,255,255,.62);margin-bottom:10px;}
.an-ribbon{display:flex;gap:3px;height:38px;}
.an-seg{min-width:6px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#12131A;cursor:pointer;transform-origin:left center;transform:scaleX(0);opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1), opacity .5s ease, filter .15s ease, margin .15s ease;}
.an-ribbon.in .an-seg{transform:scaleX(1);opacity:1;}
.an-seg:hover{filter:brightness(1.12);transform:scaleY(1.14);}
.s-over{background:var(--o);} .s-neg{background:var(--n);} .s-under{background:var(--u);} .s-match{background:var(--m);}
.an-legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:14px;}
.an-lg{display:grid;grid-template-columns:10px 1fr auto 38px;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px;border-radius:8px;font-size:12.5px;cursor:pointer;color:rgba(255,255,255,.78);}
.an-lg i{width:10px;height:10px;border-radius:3px;}
.an-lg.s-over i{background:var(--o);} .an-lg.s-neg i{background:var(--n);} .an-lg.s-under i{background:var(--u);} .an-lg.s-match i{background:var(--m);}
.an-lg .an-lg-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.an-lg b{color:#fff;font-variant-numeric:tabular-nums;} .an-lg em{font-style:normal;text-align:right;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;}
.an-lg:hover{background:rgba(255,255,255,.09);}
.an-lg.s-over,.an-lg.s-neg,.an-lg.s-under,.an-lg.s-match{background:transparent;}
.an-lg.s-over:hover,.an-lg.s-neg:hover,.an-lg.s-under:hover,.an-lg.s-match:hover{background:rgba(255,255,255,.09);}
.an-hero [role=button]:focus-visible,.kpi:focus-visible,.rk-row:focus-visible{outline:2px solid #6C95FF;outline-offset:2px;}
.an-panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:20px 22px;margin-bottom:16px;}
.an-ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.an-ph h3{font-size:15px;} .an-ph span{font-size:12px;color:var(--ink-faint);}
.an-ph2{margin-top:22px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px;}
.kpi{background:var(--panel-2);border-radius:12px;padding:14px 16px 14px;border:1px solid transparent;position:relative;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;}
.kpi.clickable{cursor:pointer;}
.kpi.clickable:hover{background:var(--panel);border-color:var(--ink-faint);box-shadow:0 8px 22px rgba(16,17,20,.10);}
.kpi-l{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:2px;}
.kpi-v{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.kpi-s{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.kpi-bar{height:4px;border-radius:4px;background:var(--panel-3);margin-top:11px;overflow:hidden;}
.kpi-bar i{display:block;height:100%;border-radius:4px;}
.an-trend{padding-bottom:12px;}
.an-rank-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 10px;}
.an-rank-head .an-ph{margin:0;}
.an-seg-toggle{display:inline-flex;background:var(--panel-3);border-radius:10px;padding:3px;}
.an-seg-toggle button{font:600 12.5px var(--font-body);border:0;background:transparent;color:var(--ink-soft);padding:7px 14px;border-radius:8px;cursor:pointer;}
.an-seg-toggle button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(16,17,20,.15);}
.an-seg-toggle button:focus-visible{outline:2px solid var(--negligible);outline-offset:1px;}
.an-rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;align-items:start;}
.an-rank-grid .an-panel{margin-bottom:0;}
.rk-row{display:flex;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:10px;cursor:pointer;transition:background .12s ease;}
.rk-row:hover{background:var(--panel-2);}
.rk-row.rk-hide{display:none;}
.rk-n{flex:none;width:20px;font-size:12px;font-weight:700;color:var(--ink-faint);padding-top:1px;font-variant-numeric:tabular-nums;}
.rk-main{flex:1;min-width:0;}
.rk-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
.rk-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.rk-val{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;flex:none;}
.rk-track{height:6px;border-radius:6px;background:var(--panel-3);margin:6px 0 4px;overflow:hidden;}
.rk-fill{height:100%;border-radius:6px;}
.rk-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.rk-more{margin-top:8px;width:100%;border:1px dashed var(--edge);background:transparent;border-radius:10px;padding:8px;font:600 12.5px var(--font-body);color:var(--ink-soft);cursor:pointer;}
.rk-more:hover{background:var(--panel-2);color:var(--ink);}
@media (min-width:1100px){.kpi-bills{grid-template-columns:repeat(12,1fr);}.kpi-bills .kpi{grid-column:span 4;}.kpi-bills .kpi:nth-child(-n+4){grid-column:span 3;}}
.kpi{min-height:92px;}

<script>
/* ---------------- Backend config ----------------
   Same Web App URL as your Rate Ledger app — paste it here too. */
// Bump this on every delivered file so the running app itself shows which
// build is loaded — matches the same badge pattern in Rate Ledger, so a
// screenshot of either app always confirms which version is actually open.
const APP_VERSION = 'v29';
/* ==================== SUPABASE BACKEND ====================
   Same action names the app has always used (login / submit / mydata / syncdata …) — each one is
   now a single fast call to a Postgres function (rl_*) on Supabase. Photos go straight to Supabase
   Storage (public link, opens for anyone — no Google login wall). Every submit is idempotent on the
   server (BillUID + ProductCode unique), so an automatic retry can never create a duplicate audit. */
const SUPABASE_URL_DEFAULT = 'https://zhdewzebwzcobdugaiwm.supabase.co';        // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY_DEFAULT = 'sb_publishable_3wjAnYsE9NcFYfXvlLUMKg_UlSFjVby'; // Project Settings → API → anon public key
const SUPA_BUCKET = 'bill-copies';
const SUPA_CFG_KEY = 'rateLedger_supabaseCfg';
const SUPA_TIMEOUT_MS = 15000;
function supaCfg(){
  let o = {};
  try{ o = JSON.parse(localStorage.getItem(SUPA_CFG_KEY)||'{}') || {}; }catch(e){}
  const url = (SUPABASE_URL_DEFAULT.startsWith('PASTE') ? '' : SUPABASE_URL_DEFAULT) || o.url || '';
  const key = (SUPABASE_ANON_KEY_DEFAULT.startsWith('PASTE') ? '' : SUPABASE_ANON_KEY_DEFAULT) || o.key || '';
  return { url: url.replace(/\/+$/,''), key };
}
function supaSaveCfg(url, key, photoUrl){ try{ const o = JSON.parse(localStorage.getItem(SUPA_CFG_KEY)||'{}'); localStorage.setItem(SUPA_CFG_KEY, JSON.stringify({url, key, photoUrl: photoUrl===undefined ? (o.photoUrl||'') : photoUrl})); }catch(e){} }

/* Bill photos live in GOOGLE DRIVE (served by the small photo Apps Script); Supabase only stores the link.
   PHOTO_APP_URL = that script's /exec URL. If it is not set, photos fall back to Supabase Storage. */
const PHOTO_APP_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbwBVkuujpth71CfbEVF_vYTRwVzyzo2gBHqkrh4fTEX2XycjTMzoa5y87Z6rlKLhRlYkg/exec';
function photoAppUrl(){
  if(!PHOTO_APP_URL_DEFAULT.startsWith('PASTE')) return PHOTO_APP_URL_DEFAULT;
  try{ return (JSON.parse(localStorage.getItem(SUPA_CFG_KEY)||'{}').photoUrl || '').trim(); }catch(e){ return ''; }
}
function photoFileId(url){ const m = String(url||'').match(/[?&]fileId=([^&]+)/) || String(url||'').match(/[?&]id=([^&]+)/); return m ? m[1] : null; }
// Any stored Drive-photo link (old or new deployment) -> opens through the CURRENT photo script.
const PHOTO_APP_URL_OLD = 'https://script.google.com/macros/s/AKfycbw4a5Db2cjkID6zaUasqYLzTQc0269vGo96eaQHAkT04umKq7B0FLjmup1C6_UrXz8TXQ/exec';   // photos uploaded earlier stay on this (old Drive) script
// A stored link that already points at the OLD photo script keeps using it; every other link opens through the CURRENT script.
function photoBaseFor(url){ return String(url||'').indexOf(PHOTO_APP_URL_OLD)===0 ? PHOTO_APP_URL_OLD : photoAppUrl(); }
function photoViewUrl(url){
  const base = photoBaseFor(url), id = photoFileId(url);
  return (base && id) ? `${base}?action=viewphoto&fileId=${id}` : url;
}
/* Which link to open: the LATEST photos have a safety copy in Supabase Storage (fast, independent of Google);
   everything else (and any photo whose Supabase copy was trimmed) opens from Google Drive. */
function photoBestUrl(url, dlUrl){
  if(dlUrl && /\/storage\/v1\/object\/public\//.test(dlUrl)) return safeHref(dlUrl);
  return safeHref(photoViewUrl(url));
}
async function driveUploadBillCopy(session, billUid, fileName, mimeType, base64Data, folderName){
  // Uploads to the permanent Google Drive home only (no link written here) -> {ok, url, fileId}
  const res = await fetch(photoAppUrl(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'uploadBillCopy', code:session.code, pin:session.pin, billUid, fileName, folderName: folderName||'', mimeType, base64Data }) });
  const j = await res.json();
  if(!j.ok) return { ok:false, error: j.error || 'Drive upload failed' };
  return { ok:true, url:j.url, fileId:j.fileId };
}
function backendConfigured(){ const c = supaCfg(); return !!(c.url && c.key); }

async function supaFetch(path, options, timeoutMs){
  const c = supaCfg();
  if(!c.url || !c.key) throw new Error('Supabase is not configured yet (URL / anon key missing).');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || SUPA_TIMEOUT_MS);
  try{
    return await fetch(c.url + path, { ...options, signal: controller.signal,
      headers: { apikey: c.key, ...(c.key.startsWith('sb_') ? {} : { Authorization: 'Bearer ' + c.key }), ...(options && options.headers || {}) } });
  } catch(e){
    if(e.name === 'AbortError') throw new Error('Request timed out — check your internet connection and try again.');
    throw e;
  } finally { clearTimeout(timer); }
}
// retries: network errors / 5xx are retried automatically (safe — every write is idempotent server-side).
async function supaRpc(fn, args, retries){
  let lastErr;
  for(let attempt = 0; attempt <= (retries||0); attempt++){
    try{
      const res = await supaFetch('/rest/v1/rpc/' + fn, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(args||{}) });
      if(res.status >= 500 && attempt < (retries||0)){ await new Promise(r=>setTimeout(r, 600*(attempt+1))); continue; }
      let j = null; try{ j = await res.json(); }catch(e){}
      if(!res.ok){
        if(j && j.message) return { ok:false, error: j.message };
        throw new Error('Server error ' + res.status);
      }
      return j;
    } catch(e){
      lastErr = e;
      if(attempt < (retries||0)) await new Promise(r=>setTimeout(r, 600*(attempt+1)));
    }
  }
  throw lastErr || new Error('Could not reach the server.');
}

// Rate Ledger's in-app record -> the header-keyed row the database stores (same columns the Sheet had).
function supaMapRow(r){
  const tf = v => v===true ? 'TRUE' : (v===false ? 'FALSE' : '');
  return {
    BillUID:r.billUid||'', Designation:r.designation||'', VerifiedBy:r.verifiedBy||'',
    DBCode:r.dbCode||'', DBName:r.dbName||'', PriceGroup:r.pg||'', Location:r.location||'', BeatCode:r.beatCode||'', BeatName:r.beatName||'',
    SOName:r.so||'', ASMName:r.asm||'', RSMName:r.rsm||'', DBStatus:r.dbActive||'',
    Retailer:r.retailer||'', BillType:r.billType||'', BillNo:r.billNo||'', BillDate:r.billDateStr||'',
    ProductName:r.productName||'', ProductCode:r.productCode||'', Category:r.category||'',
    CompanyRate:r.companyRate||0, InvoiceRate:r.invoiceRate||0, GSTPct:r.gstPct||0,
    DiffPerKg:r.diff||0, VariancePct:r.pct||0, Status:r.status||'', Qty:r.qty||'', UOM:r.uom||'', QtyKG:r.qtyKg||'',
    OverchargeAmt:r.overchargeAmt||0, UnderchargeAmt:r.underchargeAmt||0, NegligibleAmt:r.negligibleAmt||0,
    CollectedBy:(String(r.designation||'').toUpperCase()==='3PA')?'EXTERNAL AUDITOR':(r.collectedBy||''), SubmissionDate:r.submissionStr||'', VerifiedByCode:r.verifiedByCode||'',
    PackSizeKg:r.packSizeKg||'', BagSizeLabel:r.bagSizeLabel||'', ComponentsSummary:r.componentsSummary||'', DiffPerPc:r.diffPerPc||'', DiffPerBag:r.diffPerBag||'',
    AmountExcludesGst: r.amountExcludesGst===true?'TRUE':(r.amountExcludesGst===false?'FALSE':''),
    TotalInvoicedExclGst:r.totalInvoicedExclGst||'', AmountInclGstShown:r.amountInclGstShown||'', GSTPctCharged:r.gstPctCharged||'',
    GSTMismatch: r.gstMismatch===true?'TRUE':'', GSTMismatchAmt:r.gstMismatchAmt||'', GSTEntrySuspect: r.gstEntrySuspect===true?'TRUE':'',
    BillCopyURL:r.billCopyUrl||'', BillCopyDownloadURL:r.billCopyDownloadUrl||'', SOSubmitDate:r.soSubmitDateStr||''
  };
}

async function supaDispatch(a){
  const act = String(a.action||'').toLowerCase();
  const nz = v => (v===undefined || v===null || v==='') ? null : v;
  switch(act){
    case 'login':          return supaRpc('rl_login', { p_code:a.code, p_pin:a.pin }, 1);
    case 'verifiers':      return supaRpc('rl_verifiers', {}, 1);
    case 'submit':         return supaRpc('rl_submit', { p_code:a.code, p_pin:a.pin, p_rows:(a.rows||[]).map(supaMapRow) }, 3);
    case 'attachbillcopyurl': return supaRpc('rl_attach_copy', { p_code:a.code, p_pin:a.pin, p_bill_uid:a.billUid, p_url:a.url, p_dl_url:a.downloadUrl||a.url, p_path:a.path||null }, 3);
    case 'mydata':         return supaRpc('rl_my_data', { p_code:a.code, p_pin:a.pin, p_from:nz(a.fromDate), p_to:nz(a.toDate), p_basis:a.dateBasis||'bill' }, 1);
    case 'myverifieddata': return supaRpc('rl_my_verified_data', { p_code:a.code, p_pin:a.pin, p_from:nz(a.fromDate), p_to:nz(a.toDate), p_basis:a.dateBasis||'bill' }, 1);
    case 'alldata':        return supaRpc('rl_all_data', { p_code:a.code, p_pin:a.pin, p_from:nz(a.fromDate), p_to:nz(a.toDate), p_auditor:nz(a.auditorCode), p_basis:a.dateBasis||'bill' }, 1);
    case 'syncdata':       return supaRpc('rl_sync', { p_code:a.code, p_pin:a.pin, p_since:nz(a.sinceISO), p_offset:Number(a.offset)||0 }, 2);
    case 'deletebill':     return supaRpc('rl_delete_bill', { p_code:a.code, p_pin:a.pin, p_bill_uid:a.billUid, p_product_codes:a.productCodes||null, p_reason:a.reason||'' }, 0);
    case 'deletemany':     return supaRpc('rl_delete_many', { p_code:a.code, p_pin:a.pin, p_items:a.items||[], p_reason:a.reason||'' }, 0);
    case 'deletedlist':    return supaRpc('rl_deleted_list', { p_code:a.code, p_pin:a.pin }, 1);
    case 'usage':          return supaRpc('rl_usage', { p_code:a.code, p_pin:a.pin }, 1);
    case 'users':          return supaRpc('rl_users_list', { p_code:a.code, p_pin:a.pin }, 1);
    case 'adduser':        return supaRpc('rl_add_user', { p_code:a.code, p_pin:a.pin, p_new:a.newUser }, 0);
    case 'toggleuser':     return supaRpc('rl_toggle_user', { p_code:a.code, p_pin:a.pin, p_target:a.targetCode, p_active:!!a.active }, 0);
    case 'resetpin':       return supaRpc('rl_reset_pin', { p_code:a.code, p_pin:a.pin, p_target:a.targetCode, p_new_pin:a.newPin }, 0);
  }
  return { ok:false, error:'Unknown action: ' + a.action };
}
const backendPost = supaDispatch;
const backendGet = supaDispatch;

/* Photo / PDF -> Supabase Storage, then link it to the bill. Returns {ok, url} / {ok:false, error}. */
function supaB64ToBlob(b64, mime){
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
/* Every bill photo is saved TWICE:
     1) Google Drive  = the permanent home of ALL photos (link stored in url)
     2) Supabase Storage = a safety-net copy of the latest photos (link stored in dl_url); a nightly job keeps this
        bucket at about 70% full by removing the OLDEST copies that are already safe on Drive.
   If Drive is down the bill still gets its Supabase copy (and a nightly job copies it to Drive later);
   if Supabase is down the Drive copy alone is linked. Only if BOTH fail is the photo queued for retry. */
async function supaStoragePut_(billUid, fileName, mimeType, base64Data, folderName){
  const safe = s => String(s||'').replace(/[^A-Za-z0-9._-]+/g,'_').slice(0,80) || 'file';
  const rand = Math.random().toString(36).slice(2,8);
  let path = `${safe(folderName || 'UNASSIGNED')}/${safe(fileName)}`;   // one folder per Auditor/Verifier
  const blob = supaB64ToBlob(base64Data, mimeType);
  let res;
  for(let attempt=0; attempt<3; attempt++){
    try{
      res = await supaFetch(`/storage/v1/object/${SUPA_BUCKET}/${path}`, { method:'POST', headers:{ 'Content-Type': mimeType, 'x-upsert':'false', 'cache-control':'max-age=31536000' }, body: blob }, 60000);
      if(res.status===400 || res.status===409){ // same file name already there (e.g. a retry) -> keep both, never overwrite
        let m=''; try{ m=JSON.stringify(await res.clone().json()); }catch(e){}
        if(/exist|duplicate/i.test(m)){ path = path.replace(/(\.[A-Za-z0-9]+)$/, '_'+rand+'$1'); continue; }
      }
      if(res.ok || res.status < 500) break;
    } catch(e){ if(attempt===2) throw e; }
    await new Promise(r=>setTimeout(r, 700*(attempt+1)));
  }
  if(!res || !res.ok){ let m=''; try{ m=(await res.json()).message||''; }catch(e){} return { ok:false, error: m || ('Upload failed (' + (res&&res.status) + ')') }; }
  return { ok:true, path, url: `${supaCfg().url}/storage/v1/object/public/${SUPA_BUCKET}/${path}` };
}
async function supaUploadBillCopy(session, billUid, fileName, mimeType, base64Data, folderName){
  if(!base64Data) return { ok:false, error:'No file data' };
  let sb = null, dr = null, sbErr = '', drErr = '';
  try{ sb = await supaStoragePut_(billUid, fileName, mimeType, base64Data, folderName); if(!sb.ok){ sbErr = sb.error; sb = null; } }catch(e){ sbErr = String(e.message||e); sb = null; }
  if(photoAppUrl()){
    try{ dr = await driveUploadBillCopy(session, billUid, fileName, mimeType, base64Data, folderName); if(!dr.ok){ drErr = dr.error; dr = null; } }catch(e){ drErr = String(e.message||e); dr = null; }
  }
  if(!sb && !dr) return { ok:false, error: drErr || sbErr || 'Upload failed' };
  const url  = dr ? dr.url : sb.url;                 // permanent link (Drive) — Supabase link only if Drive failed
  const dl   = sb ? sb.url : dr.url;                 // safety-net copy
  const path = dr ? dr.fileId : sb.path;
  const at = await supaRpc('rl_attach_copy', { p_code:session.code, p_pin:session.pin, p_bill_uid:billUid, p_url:url, p_dl_url:dl, p_path:path }, 3);
  if(!at.ok) return { ok:false, error: at.error || 'Could not link the photo to the bill' };
  return { ok:true, url, dl, alreadyAttached: !!at.alreadyAttached };
}

/* Shared session with the Rate Ledger app: if this Dashboard is opened from
   the same browser/origin as Rate Ledger, a user already logged in there
   won't need to log in again here (and vice versa). */
const SESSION_KEY = 'rateLedger_session';
function getSession(){ try{ const s = JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); if(s && typeof idleExpired_==='function' && idleExpired_()){ localStorage.removeItem(SESSION_KEY); return null; } return s; }catch(e){ return null; } }
function setSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); idleTouch_(); }catch(e){} }
/* ---- Idle sign-out: after 60 minutes without any click / key press the saved login is erased ---- */
const IDLE_KEY = 'rl_dash_last_active', IDLE_MS = 3600000;
function idleTouch_(){ try{ localStorage.setItem(IDLE_KEY, String(Date.now())); }catch(e){} }
function idleExpired_(){ try{ const t = Number(localStorage.getItem(IDLE_KEY)||0); return t>0 && (Date.now()-t) > IDLE_MS; }catch(e){ return false; } }
(function(){
  let last = 0;
  ['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ const n=Date.now(); if(n-last>15000){ last=n; idleTouch_(); } }, {passive:true, capture:true}));
  setInterval(()=>{ if(getSession() && idleExpired_()){ clearSession(); try{ if(typeof adminStoreWipe==='function') adminStoreWipe(); }catch(e){} location.reload(); } }, 60000);
})();

function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); Object.keys(localStorage).filter(k=>k.indexOf('dashCache_')===0).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
/* Only https links to our own Google script / Supabase storage may ever be put in an href or opened — blocks javascript: / foreign links stored in data. */
function safeHref(u){ u = String(u||'').trim(); return /^https:\/\/(script\.google\.com|script\.googleusercontent\.com|[a-z0-9-]+\.supabase\.co)\//i.test(u) ? u : '#'; }


/* ---------------- Local cache: instant repeat-opens ----------------
   First open of a tab always hits the network. After that, the result is
   cached in localStorage keyed by the exact query — reopening the SAME
   tab/filter combo renders instantly from cache while a fresh copy loads
   quietly in the background and silently updates the screen if anything
   changed. This is what makes the Dashboard feel fast on every visit
   after the first, without ever showing stale data for more than a beat. */
const DASH_CACHE_TTL_MS = 6*60*60*1000; // background-refresh after 6h regardless
function cacheKeyFor(params){ return 'dashCache_' + JSON.stringify(params, Object.keys(params).sort()); }
function readCache(params){
  try{
    const raw = localStorage.getItem(cacheKeyFor(params));
    if(!raw) return null;
    const {t, data} = JSON.parse(raw);
    return {data, ageMs: Date.now()-t};
  }catch(e){ return null; }
}
function writeCache(params, data){
  try{ localStorage.setItem(cacheKeyFor(params), JSON.stringify({t:Date.now(), data})); }catch(e){}
}
// onFirst: called immediately with cached data if any (fast paint).
// onFresh: called once the network reply lands (always — even if same tab
// has since been left, caller should re-check it's still the active view).
async function cachedBackendGet(params, onFirst, onFresh){
  const cached = readCache(params);
  if(cached) onFirst(cached.data, cached.ageMs);
  let fresh;
  try{
    fresh = await backendGet(params);
  } catch(e){
    // A thrown error here (timeout, network down, bad JSON) used to be an
    // unhandled rejection — onFresh never fired, so the loader never got its
    // stop() call and just sat at 90% forever with no explanation. Turn it
    // into the same {ok:false, error} shape callers already know how to show.
    fresh = { ok:false, error: e.message || 'Could not reach the server.' };
  }
  if(fresh.ok) writeCache(params, fresh);
  onFresh(fresh, !!cached);
}
/* An "ultimate" percentage loader for the first-ever (uncached) load of a
   screen — smoothly animates 0→90% while the request is in flight (we don't
   get real byte progress from a JSON reply), then snaps to 100% and fades
   when data actually arrives. Returns a stop() to call once data is in. */
function ultimateLoaderHtml(id){
  return `<div class="ultimate-loader" id="${id}">
    <svg viewBox="0 0 120 120" width="88" height="88">
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--edge)" stroke-width="8"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
        id="${id}_ring" stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52}"
        transform="rotate(-90 60 60)"/>
      <text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" id="${id}_pct">0%</text>
    </svg>
    <div class="small-muted" style="margin-top:10px;" id="${id}_label">Fetching your data…</div>
  </div>`;
}
function startUltimateLoader(id){
  const ring = document.getElementById(id+'_ring');
  const pctEl = document.getElementById(id+'_pct');
  if(!ring||!pctEl) return ()=>{};
  const C = 2*Math.PI*52;
  let pct = 0, stopped = false;
  const tick = ()=>{
    if(stopped) return;
    pct = Math.min(90, pct + (90-pct)*0.06 + 0.4);
    ring.setAttribute('stroke-dashoffset', C*(1-pct/100));
    pctEl.textContent = Math.round(pct)+'%';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return (finalLabel)=>{
    stopped = true;
    ring.setAttribute('stroke-dashoffset', 0);
    pctEl.textContent = '100%';
    const labelEl = document.getElementById(id+'_label');
    if(labelEl && finalLabel) labelEl.textContent = finalLabel;
  };
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Safety net for BillDate/SOSubmitDate/SubmissionDate specifically — Code.gs
// normalizes these server-side now, but a not-yet-redeployed backend (or any
// future slip) could still hand back a raw ISO datetime (Sheets auto-
// converting a text cell to a real Date behind the scenes) instead of the
// plain DD-MM-YYYY every report should show. This catches that here too, so
// the display is never wrong regardless of what the backend currently sends.
function normalizeDMYDisplay(val){
  if(!val) return val;
  const s = String(val);
  const dmy = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if(dmy) return `${dmy[1].padStart(2,'0')}-${dmy[2].padStart(2,'0')}-${dmy[3]}`; // already DD-MM-YYYY — just zero-pad for consistency
  // A raw ISO datetime (e.g. 2026-10-07T18:30:00.000Z) is UTC — the ORIGINAL
  // date was entered as a local-midnight value, so naively reading the UTC
  // Y/M/D back out would land on the wrong calendar day for anyone east of
  // UTC (e.g. 18:30 UTC = 00:00 IST the NEXT day — the correct date is the
  // 8th, not the 7th). Parsing through `new Date(...)` and reading it back
  // with the LOCAL getters (not the UTC ones) recovers the calendar date as
  // it was actually intended, as long as the viewer is in the same timezone
  // the data was entered in (India, for this app).
  if(/^\d{4}-\d{1,2}-\d{1,2}T/.test(s)){
    const d = new Date(s);
    if(!isNaN(d.getTime())) return istDateDMY(d); // always the IST calendar date, whatever timezone this device is in
  }
  return s;
}
const DATE_DISPLAY_FIELDS = ['BillDate','SOSubmitDate','SubmissionDate'];

/* ---- IST (Asia/Kolkata) — every date/time this app stamps or shows ----
   Reading dates through the browser's own timezone, or through toISOString()
   (which is always UTC), is what put dates a day off and times 5h30m behind:
   between 12:00am–5:30am IST toISOString() still says "yesterday", and
   local-midnight dates shifted back a day when converted to UTC. Everything
   here goes through an explicit Asia/Kolkata formatter instead, so the
   result is identical no matter what timezone the device is set to. */
const IST_TZ = 'Asia/Kolkata';
function istParts(d, hour12){
  const p = {};
  new Intl.DateTimeFormat('en-US',{timeZone:IST_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!!hour12})
    .formatToParts(d||new Date()).forEach(x=>{ p[x.type]=x.value; });

}
function istDateISO(d){ const p=istParts(d); return `${p.year}-${p.month}-${p.day}`; }            // 2026-09-26
function istDateDMY(d){ const p=istParts(d); return `${p.day}-${p.month}-${p.year}`; }            // 26-09-2026
function istTime12(d){ const p=istParts(d,true); return `${p.hour}:${p.minute}:${p.second} ${p.dayPeriod}`; } // 02:21:05 PM
function formatISTDateTime(val){                                                                    // 26-09-2026 02:21:05 PM
  if(!val) return '';

}
function istWeekStartISO(){ // Monday of the current IST week

  dt.setUTCDate(dt.getUTCDate()-day+1);

}
function istMonthStartISO(){ return istDateISO().slice(0,8)+'01'; }

function fmtMoney(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN'); }

let ACTIVE_TAB = null;
/* ==================== Admin local data store ====================
   Analytics, Performance and All Submissions all read from ONE copy of the
   data that lives in this browser (IndexedDB, so it also survives a
   refresh/reopen) instead of each tab asking the Sheet for its own copy every
   time it's opened. The very first open downloads everything once (with real
   progress); after that the Sheet is only asked for rows NEWER than the latest
   one already stored — typically a handful — and those are merged in. Switching
   tabs, changing a date range, or reopening the Dashboard never waits on the
   Sheet again; everything is filtered/aggregated locally.
   Admin-only: Auditor/Verifier views are server-scoped to their own rows and
   keep their existing per-query behaviour — caching "everything" locally
   would be wrong for a role that's only ever allowed to see a slice. */
const AS_DB = 'DashboardAdminCacheDB';
const AdminStore = { rows:[], byKey:new Map(), lastTs:'', lastSyncedAt:0, syncing:false, loaded:false, error:'', progress:null, archiveBusy:false, archiveFailAt:0 };
let __asDbPromise = null;
function asOpen(){
  if(__asDbPromise) return __asDbPromise;
  __asDbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(AS_DB, 1);
    req.onupgradeneeded = e=>{ const db=e.target.result;
      if(!db.objectStoreNames.contains('rows')) db.createObjectStore('rows',{keyPath:'_k'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'}); };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = ()=>reject(req.error);
  });
  return __asDbPromise;
}
function asTx(stores, mode, fn){
  return asOpen().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(stores, mode);
    const out = fn(tx);
    tx.oncomplete = ()=>resolve(out && out.result!==undefined ? out.result : out);
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  }));
}
function asOwner(){ const s=getSession(); return s ? `${s.code}|${supaCfg().url}` : ''; }
// A row's identity: a bill line is unique per BillUID + ProductCode (same
// rule the server uses to drop duplicates). Very old rows with no BillUID
// fall back to a composite of their own fields.
function asKey(r){
  if(r.BillUID) return r.BillUID+'|'+(r.ProductCode||'');
  return 'legacy|'+[r.Timestamp,r.ProductCode,r.DBCode,r.BillNo,r.InvoiceRate].join('|');
}
function asResetMemory(){ try{ localStorage.removeItem(archiveFromKey()); }catch(e){} AdminStore.rows=[]; AdminStore.byKey=new Map(); AdminStore.lastTs=''; AdminStore.lastSyncedAt=0; AdminStore.loaded=false; AdminStore.error=''; }
async function asLoad(){
  if(AdminStore.loaded) return;
  try{
    const owner = asOwner();
    const meta = await asTx(['meta'],'readonly', tx=>{ const o={}; ['owner','lastTs','lastSyncedAt'].forEach(k=>{ const r=tx.objectStore('meta').get(k); r.onsuccess=()=>{ o[k]=r.result?r.result.value:null; }; }); return {get result(){return o;}}; });
    if(meta.owner && meta.owner!==owner){ await asWipeDb(); }
    else if(meta.owner){
      const rows = await asTx(['rows'],'readonly', tx=>{ const r=tx.objectStore('rows').getAll(); return {get result(){return r.result||[];}}; });
      rows.forEach(r=>{ AdminStore.byKey.set(r._k, r); });
      AdminStore.rows = rows;
      AdminStore.lastTs = meta.lastTs||''; AdminStore.lastSyncedAt = meta.lastSyncedAt||0;
    }
  } catch(e){ /* IndexedDB blocked (private mode etc.) — still works for this session from memory, just won't persist */ }
  AdminStore.loaded = true;
}
async function asWipeDb(){ try{ await asTx(['rows','meta'],'readwrite', tx=>{ tx.objectStore('rows').clear(); tx.objectStore('meta').clear(); }); }catch(e){} }
async function asPersist(putRows){
  try{
    await asTx(['rows','meta'],'readwrite', tx=>{
      const rs = tx.objectStore('rows'); putRows.forEach(r=>rs.put(r));
      const ms = tx.objectStore('meta');
      ms.put({key:'owner', value:asOwner()}); ms.put({key:'lastTs', value:AdminStore.lastTs}); ms.put({key:'lastSyncedAt', value:AdminStore.lastSyncedAt});
    });
  } catch(e){}
}
// Removes deleted lines (by BillUID|ProductCode) from memory and from the browser's local copy.
async function asRemoveKeys(keys){
  let n = 0;
  keys.forEach(k=>{ if(AdminStore.byKey.has(k)){ AdminStore.byKey.delete(k); n++; } });
  if(n){ const set = new Set(keys); AdminStore.rows = AdminStore.rows.filter(r=>!set.has(r._k)); }
  try{ await asTx(['rows'],'readwrite', tx=>{ const rs = tx.objectStore('rows'); keys.forEach(k=>rs.delete(k)); }); }catch(e){}
  return n;
}
function asCompact(raw){ const r={}; for(const k in raw){ const v=raw[k]; if(v!=='' && v!=null) r[k]=v; } r._k=asKey(r); return r; }
// Pulls whatever the Sheet has that this browser doesn't (everything, the
// first time) and merges it in. Safe to call any time; concurrent calls are
// collapsed into one. Returns how many rows were added/updated.
// Single-flight: if a sync is already running, every other caller (e.g. two
// tabs rendering at once on first open) waits for THAT one and gets its
// result, rather than returning early and painting a half-loaded store.
let __adminSyncInflight = null;
function adminSync(opts){
  if(__adminSyncInflight) return __adminSyncInflight;
  __adminSyncInflight = adminSyncRun(opts).finally(()=>{ __adminSyncInflight = null; });
  return __adminSyncInflight;
}
async function adminSyncRun(opts){
  opts = opts||{};
  const s = getSession();
  if(!s || s.role!=='Admin') return {changed:0};
  AdminStore.syncing = true; AdminStore.error=''; updateAdminSyncChip();
  let changed = 0;
  try{
    await asLoad();
    if(opts.full){ await asWipeDb(); asResetMemory(); AdminStore.loaded=true; }
    const firstEver = AdminStore.rows.length===0;
    let offset = 0, total = null, photoLinks = {};
    const putRows = []; const delKeys = [];
    // Captured ONCE: the server pages through "rows newer than this", so if
    // this moved with each page (lastTs advances as rows are merged) page 2
    // would be an offset into a DIFFERENT, shorter list and rows would be skipped.
    const sinceAtStart = AdminStore.lastTs||'';
    for(;;){
      const res = await backendGet({ action:'syncdata', code:s.code, pin:s.pin, sinceISO: sinceAtStart, offset:String(offset) });
      if(!res.ok) throw new Error(res.error||'Could not sync');
      if(total===null) total = res.total||0;
      res.rows.forEach(raw=>{
        const r = asCompact(raw);
        if(!AdminStore.byKey.has(r._k)){ AdminStore.byKey.set(r._k, r); AdminStore.rows.push(r); putRows.push(r); changed++; }
        if(r.Timestamp && (!AdminStore.lastTs || new Date(r.Timestamp) > new Date(AdminStore.lastTs))) AdminStore.lastTs = r.Timestamp;
      });
      AdminStore.progress = { done: Math.min(offset + res.rows.length, total), total };
      if(firstEver) updateAdminLoadingProgress();
      updateAdminSyncChip();
      if(res.nextOffset==null){ photoLinks = res.photoLinks||{}; (res.deleted||[]).forEach(k=>delKeys.push(k)); break; }
      offset = res.nextOffset;
    }
    // Photos get linked to a bill's rows AFTER those rows were first written,
    // without changing their Timestamp — apply the server's current links so
    // already-stored rows pick them up.
    AdminStore.rows.forEach(r=>{
      const l = photoLinks[r.BillUID];
      if(l && (r.BillCopyURL!==l.url || (l.dl && r.BillCopyDownloadURL!==l.dl))){ r.BillCopyURL=l.url; if(l.dl) r.BillCopyDownloadURL=l.dl; putRows.push(r); changed++; }
    });
    if(delKeys.length){ const n = await asRemoveKeys(delKeys); changed += n; }
    AdminStore.lastSyncedAt = Date.now();
    AdminStore.progress = null;
    await asPersist(putRows);
  } catch(e){
    AdminStore.error = e.message || 'Sync failed';
    AdminStore.progress = null;
  } finally {
    AdminStore.syncing = false;
    updateAdminSyncChip();
  }
  if(changed && typeof window.__adminRepaint==='function') window.__adminRepaint();
  return {changed};
}
function updateAdminLoadingProgress(){
  const el = $('#adminFirstLoad'); const p = AdminStore.progress;
  if(!el || !p) return;
  const pct = p.total ? Math.round(p.done/p.total*100) : 0;
  el.querySelector('.afl-text').textContent = `${fmtInt(p.done)} / ${fmtInt(p.total)} rows`;
  el.querySelector('.afl-fill').style.width = pct+'%';
}
// Resolves once the store has data to show. Instant when it's already
// stored (the common case); only the very first-ever open actually waits,
// and shows real progress while it does.
async function adminStoreReady(containerSel){
  await asLoad();
  if(AdminStore.rows.length){ adminBackgroundSync(); return true; }
  const el = $(containerSel);
  if(el) el.innerHTML = `<div class="empty-state" id="adminFirstLoad" style="max-width:420px;margin:30px auto;">
    <div style="font-weight:700;margin-bottom:6px;">Downloading all submissions to this device — one time only</div>
    <div class="small-muted" style="margin-bottom:10px;">After this, only new bills are fetched, so every tab opens instantly.</div>
    <div style="height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;"><div class="afl-fill" style="height:100%;width:0%;background:var(--ink);transition:width .2s;"></div></div>

function adminBackgroundSync(){
  // Don't hammer the Sheet when tabs are flipped quickly — a sync in the last

}
function adminAgoText(){

/* Supabase headroom monitor (Admin). Free plan = 500 MB database + 1 GB photo storage; on a paid plan raise these two numbers.

const SUPA_DB_LIMIT_MB = 500, SUPA_STORAGE_LIMIT_MB = 1024;
let __usageAt = 0;
async function loadUsageChip(force){
  const el = $('#usageChip'); const s = getSession(); if(!el || !s) return;

function updateAdminSyncChip(){

let __adminAutoTimer = null;
function adminStartAutoSync(){
  if(__adminAutoTimer) return;

    const s=getSession(); if(!s || s.role!=='Admin'){ clearInterval(__adminAutoTimer); __adminAutoTimer=null; return; }

async function adminStoreWipe(){ asResetMemory(); await asWipeDb(); }
// Filtered view of the store for one tab's own date range/basis.
/* ---- Bills older than the 6-month Supabase window live in the Google Sheet archive ----

   from the Google script (one monthly tab per call), merged into this device's store and remembered. */
const ARCHIVE_DAYS = 183;
function archiveFromKey(){ return 'rlArchiveFrom|' + asOwner(); }
function archiveFromGet(b){ try{ return (JSON.parse(localStorage.getItem(archiveFromKey())||'{}'))[b] || ''; }catch(e){ return ''; } }

function adminMaybeLoadArchive(from, basis){
  from = from || '2000-01-01';                                  // "All time" = from the very beginning
  if(!photoAppUrl() || AdminStore.archiveBusy) return;
  const cutoff = istDateISO(new Date(Date.now() - ARCHIVE_DAYS*86400000));
  if(from >= cutoff) return;                                    // inside the Supabase window — nothing to fetch
  const b = 'all';          // one fetch serves both date bases: a bill is submitted on/after its bill date, so 'submission date >= from' is a superset
  const have = archiveFromGet(b);

  const s = getSession(); if(!s || s.role!=='Admin') return;
  AdminStore.archiveBusy = true;

  (async ()=>{
    let added = 0;
    try{
      await asLoad();
      let cursor = 0; const putRows = [];
      for(;;){
        const res = await fetch(photoAppUrl(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({ action:'archiveRows', code:s.code, pin:s.pin, from, basis:'submission', cursor }) });
        const j = await res.json();
        if(!j.ok) throw new Error(j.error || 'archive error');
        (j.rows||[]).forEach(raw=>{

        });
        if(j.nextCursor==null) break;
        cursor = j.nextCursor;
      }
      await asPersist(putRows);
      archiveFromSet(b, from);
      toast(added ? `Loaded ${fmtInt(added)} older bill lines from the archive` : 'Archive checked — no extra older bills in this range', 'ok');
    }catch(e){
      AdminStore.archiveFailAt = Date.now();
      toast('Could not load older bills from the Google archive (' + (e.message||e) + '). Showing what is already stored.', 'err');
    }finally{
      AdminStore.archiveBusy = false;
    }
    if(added && typeof window.__adminRepaint==='function') window.__adminRepaint();
  })();
}
function adminRowsFor(from, to, basis){ adminMaybeLoadArchive(from, basis); return filterRowsByDateClient(AdminStore.rows, from||'', to||'', basis); }

      </div>
      <div style="display:flex;align-items:center;gap:12px;">

        <div class="status-chip"><span class="status-dot"></span>${esc(s.name)} (${esc(s.superAdmin ? 'Super Admin' : s.role)})</div>

  `;

/* ==================== Shared date-range filter bar ====================
   Used by Analytics, All Submissions, My Data and Bills I Verified alike —
   filters by the BILL's own date (not when it was submitted), inclusive
   on both ends. Leaving both blank means "all time". */
function dateRangeBarHtml(idPrefix, fromVal, toVal, dateBasisVal){
  return `
    <div class="filterbar">
      <div class="field"><label>From</label><input type="date" id="${idPrefix}From" value="${fromVal||''}"></div>
      <div class="field"><label>To</label><input type="date" id="${idPrefix}To" value="${toVal||''}"></div>
      <button class="btn" id="${idPrefix}Clear">Clear (All Time)</button>
      <div class="field"><label>Filter dates by</label><select id="${idPrefix}DateBasis">
        <option value="bill" ${dateBasisVal!=='submission'?'selected':''}>Bill Date</option>
        <option value="submission" ${dateBasisVal==='submission'?'selected':''}>Submission Date (when it was actually entered)</option>
      </select></div>
    </div>
  `;
}
function wireDateRangeBar(idPrefix, onChange){
  $(`#${idPrefix}From`).addEventListener('change', onChange);
  $(`#${idPrefix}To`).addEventListener('change', onChange);
  $(`#${idPrefix}Clear`).addEventListener('click', ()=>{
    $(`#${idPrefix}From`).value=''; $(`#${idPrefix}To`).value='';
    onChange();
  });
  const basisEl = $(`#${idPrefix}DateBasis`);
  if(basisEl) basisEl.addEventListener('change', onChange);
}

/* ==================== ANALYTICS (Admin) ==================== */
let chartInstances = [];
function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances = []; }

async function renderAnalytics(){
  const body = $('#tabBody');
  if(window.__anDateBasis===undefined) window.__anDateBasis = 'submission';
  body.innerHTML = `
    ${dateRangeBarHtml('an', window.__anFrom, window.__anTo, window.__anDateBasis)}
    <div id="anContent"></div>
  `;
  const paint = ()=>{ if(ACTIVE_TAB!=='analytics') return; renderAnalyticsContent(adminRowsFor(window.__anFrom, window.__anTo, window.__anDateBasis)); };
  window.__adminRepaint = (force)=>{ if(force) renderAnalytics(); else paint(); };
  wireDateRangeBar('an', ()=>{
    window.__anFrom = $('#anFrom').value; window.__anTo = $('#anTo').value;
    window.__anDateBasis = $('#anDateBasis').value;
    paint();
  });
  if(await adminStoreReady('#anContent')) paint();
}

function renderAnalyticsContent(rows){
  const content = $('#anContent');
  destroyCharts();
  if(!rows.length){ content.innerHTML = '<div class="empty-state">No submissions in this period yet.</div>'; return; }

  const over = rows.filter(r=>r.Status==='over');
  const neg = rows.filter(r=>r.Status==='negligible');
  const under = rows.filter(r=>r.Status==='under');
  const match = rows.filter(r=>r.Status==='match');
  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0);
  const underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);
  // A bill often has several product lines, so "6 overcharge lines" can be just
  // 2 real bills. Lines = volume of work; bills = how many audits caught something.
  const billsOver = new Set(over.map(r=>r.BillUID));
  const billsUnder = new Set(under.map(r=>r.BillUID));
  const billsTotal = new Set(rows.map(r=>r.BillUID));
  const dbsOver = new Set(over.map(r=>r.DBName));
  const dbsTotal = new Set(rows.map(r=>r.DBName));
  const billsNeg = new Set(neg.map(r=>r.BillUID));
  const billsAnyIssue = new Set([...billsOver, ...billsUnder, ...billsNeg]);
  const billsClean = billsTotal.size - billsAnyIssue.size;
  const rangeFilters = { fromDate: window.__anFrom||'', toDate: window.__anTo||'', dateBasis: window.__anDateBasis||'' };
  const pct = (a,b)=> b ? Math.round(a/b*100) : 0;
  const goAttr = (f)=> `data-goto='${esc(JSON.stringify({...rangeFilters, ...f}))}' role="button" tabindex="0"`;

  /* ---------- Hero: how much was overcharged + how the lines split ---------- */
  const seg = [
    {key:'over',       label:'Overcharge',              n:over.length,  cls:'s-over'},
    {key:'negligible', label:'Overcharge – Negligible', n:neg.length,   cls:'s-neg'},
    {key:'under',      label:'Undercharge',             n:under.length, cls:'s-under'},
    {key:'match',      label:'Match',                   n:match.length, cls:'s-match'},
  ];
  const ribbon = seg.filter(s=>s.n>0).map(s=>
    `<div class="an-seg ${s.cls}" ${goAttr({status:s.key})} style="flex-grow:${s.n};" title="${esc(s.label)}: ${fmtInt(s.n)} lines (${pct(s.n,rows.length)}%)"><span>${pct(s.n,rows.length)>=7?pct(s.n,rows.length)+'%':''}</span></div>`).join('');
  const legend = seg.map(s=>
    `<div class="an-lg ${s.cls}" ${goAttr({status:s.key})}><i></i><span class="an-lg-n">${esc(s.label)}</span><b>${fmtInt(s.n)}</b><em>${pct(s.n,rows.length)}%</em></div>`).join('');
  const ringPct = pct(billsOver.size, billsTotal.size);
  const C = 2*Math.PI*38;

  const hero = `
    <section class="an-hero">
      <div class="an-hero-main">
        <div class="an-hero-lbl">Overcharged in this period</div>
        <div class="an-hero-val" ${goAttr({status:'over'})}><span class="rs">₹</span>${fmtMoney(overAmt)}</div>
        <div class="an-hero-sub">${fmtInt(over.length)} overcharge ${over.length===1?'line':'lines'} on ${fmtInt(billsOver.size)} ${billsOver.size===1?'bill':'bills'} from ${fmtInt(dbsOver.size)} ${dbsOver.size===1?'distributor':'distributors'}.
          Undercharge in the same period: <b>₹${fmtMoney(underAmt)}</b>.</div>
      </div>
      <div class="an-hero-ring" ${goAttr({status:'over', uniqueBillsOnly:true})} title="Bills with at least one overcharge line">
        <svg viewBox="0 0 100 100" width="112" height="112" aria-hidden="true">
          <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
          <circle class="an-ring-arc" cx="50" cy="50" r="38" fill="none" stroke="#FF4D73" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-ringPct/100)}" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="an-ring-txt"><b>${ringPct}%</b><span>of bills have<br>an overcharge</span></div>
      </div>
      <div class="an-hero-split">
        <div class="an-split-h">How the ${fmtInt(rows.length)} audited lines split</div>
        <div class="an-ribbon">${ribbon}</div>
        <div class="an-legend">${legend}</div>
      </div>
    </section>`;

  /* ---------- KPI tiles ---------- */
  const kpi = ({label, value, sub, share, color, filters, info})=>{
    const tag = filters ? 'div' : 'div';
    return `<${tag} class="kpi ${filters?'clickable':''}" ${filters?goAttr(filters):''}>
      <div class="kpi-l">${label}${info?`<span class="info-dot" data-tip="${esc(info)}">i</span>`:''}</div>
      <div class="kpi-v">${value}</div>
      ${sub?`<div class="kpi-s">${sub}</div>`:''}
      ${share!=null?`<div class="kpi-bar"><i style="width:${Math.max(0,Math.min(100,share))}%;background:${color||'var(--ink)'}"></i></div>`:''}
    </${tag}>`;
  };
  const kpis = `
    <section class="an-panel">
      <div class="an-ph"><h3>Lines</h3><span>Every product line on every bill</span></div>
      <div class="kpi-grid">
        ${kpi({label:'Lines submitted', value:fmtInt(rows.length), filters:{}, info:'Every product line across every bill in this date range — one 5-product bill counts as 5 lines here.'})}
        ${kpi({label:'Overcharge lines', value:fmtInt(over.length), sub:`₹${fmtMoney(overAmt)} total`, share:pct(over.length,rows.length), color:'var(--danger)', filters:{status:'over'}, info:'Lines where Invoice Rate > Company Rate by 1% or more. ₹ total = sum of (Invoice Rate − Company Rate) × Qty(kg) for each line.'})}
        ${kpi({label:'Undercharge lines', value:fmtInt(under.length), sub:`₹${fmtMoney(underAmt)} total`, share:pct(under.length,rows.length), color:'var(--warn)', filters:{status:'under'}, info:'Lines where Invoice Rate is below Company Rate — no negligible band on this side, any amount counts.'})}
        ${kpi({label:'Negligible', value:fmtInt(neg.length), sub:'under 1%, not flagged', share:pct(neg.length,rows.length), color:'var(--negligible)', filters:{status:'negligible'}, info:'Lines where Invoice Rate > Company Rate, but by under 1% — technically an overcharge, but too small to flag.'})}
      </div>
      <div class="an-ph an-ph2"><h3>Bills</h3><span>Unique bills, not lines — how many actual audits</span></div>
      <div class="kpi-grid kpi-bills">
        ${kpi({label:'Unique bills', value:fmtInt(billsTotal.size), filters:{uniqueBillsOnly:true}, info:'Distinct Bill UIDs in this range — a bill with 5 product lines still counts once here, however many lines it has.'})}
        ${kpi({label:'Unique distributors', value:fmtInt(dbsTotal.size), filters:{uniqueBillsOnly:true}, info:'Distinct DB Names that appear anywhere in this range — regardless of whether any of their bills had an overcharge.'})}
        ${kpi({label:'Bills with overcharge', value:fmtInt(billsOver.size), sub:`${pct(billsOver.size,billsTotal.size)}% of all bills`, share:pct(billsOver.size,billsTotal.size), color:'var(--danger)', filters:{status:'over', uniqueBillsOnly:true}, info:'Unique bills that have AT LEAST ONE overcharge line — a bill with 2 overcharge lines still only counts once.'})}
        ${kpi({label:'Bills with undercharge', value:fmtInt(billsUnder.size), sub:`${pct(billsUnder.size,billsTotal.size)}% of all bills`, share:pct(billsUnder.size,billsTotal.size), color:'var(--warn)', filters:{status:'under', uniqueBillsOnly:true}, info:'Unique bills that have at least one undercharge line.'})}
        ${kpi({label:'Bills with negligible overcharge', value:fmtInt(billsNeg.size), sub:`${pct(billsNeg.size,billsTotal.size)}% of all bills`, share:pct(billsNeg.size,billsTotal.size), color:'var(--negligible)', filters:{status:'negligible', uniqueBillsOnly:true}, info:'Unique bills whose only issue (if any) is a negligible (<1%) overcharge line.'})}
        ${kpi({label:'Distributors with overcharge', value:fmtInt(dbsOver.size), sub:`of ${fmtInt(dbsTotal.size)} distributors`, share:pct(dbsOver.size,dbsTotal.size), color:'var(--danger)', filters:{status:'over', uniqueBillsOnly:true}, info:'Distinct DB Names with at least one overcharge line anywhere in their bills, out of the Unique distributors above.'})}
        ${kpi({label:'Clean bills', value:fmtInt(billsClean), sub:'every line matched exactly', share:pct(billsClean,billsTotal.size), color:'var(--success)', info:'Unique bills minus any bill that has even one over/under/negligible line — every line on these bills was an exact Match.'})}
      </div>
    </section>`;

  /* ---------- Trend + rankings shells ---------- */
  content.innerHTML = `
    ${hero}
    ${kpis}
    <section class="an-panel an-trend">
      <div class="an-ph"><h3>Overcharge value by day</h3><span>Click a bar to open that day's overcharge lines</span></div>
      <div id="chTrendWrap"></div>
    </section>
    <div class="an-rank-head">
      <div class="an-ph"><h3>Where it comes from</h3><span>Click any row to open its overcharge lines</span></div>
      <div class="an-seg-toggle" role="group" aria-label="Rank by">
        <button type="button" data-rank="lines">Overcharge lines</button>
        <button type="button" data-rank="amt">Overcharge value</button>
      </div>
    </div>
    <div class="an-rank-grid" id="anRankGrid"></div>
    <div style="margin-top:18px;">${msAnalyticsCardHtml(rows)}</div>
  `;

  // One entrance moment: the ribbon grows and the ring fills.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    content.querySelector('.an-ribbon')?.classList.add('in');
    const arc = content.querySelector('.an-ring-arc'); if(arc) arc.style.strokeDashoffset = arc.getAttribute('data-off');
  }));

  $all('[data-ms-go]').forEach(b=>b.addEventListener('click', ()=>{
    const n = b.dataset.msGo; MS.group = 'auditor'; MS.person = n ? n : null; window.__msKeep = true; ACTIVE_TAB = 'missing'; renderShell();
  }));

  // Every clickable element routes through goToFilteredSubmissions, so the
  // destination is always the same familiar table, pre-filtered.
  const wireGo = (root)=>{
    $all('[data-goto]', root).forEach(el=>{
      if(el.__wired) return; el.__wired = true;
      const go = ()=> goToFilteredSubmissions(JSON.parse(el.getAttribute('data-goto')));
      el.addEventListener('click', e=>{ if(e.target.closest('.info-dot')) return; go(); });
      el.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
    });
  };
  wireGo(content);

  /* ---------- Trend (SVG) ---------- */
  const byDay = {};
  over.forEach(r=>{ const d=(r.BillDate||'').slice(0,10)||'?'; byDay[d]=(byDay[d]||0)+(Number(r.OverchargeAmt)||0); });
  // BillDate is DD-MM-YYYY — parse for chronological order, keep the string as the label.
  const parseDMYClientA = (s)=>{ const m=String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); return m? new Date(Number(m[3]),Number(m[2])-1,Number(m[1])) : null; };
  const days = Object.keys(byDay).sort((a,b)=>{
    const da=parseDMYClientA(a), db=parseDMYClientA(b);
    if(da && db) return da-db;
    return a.localeCompare(b);
  });
  drawTrendChart($('#chTrendWrap'), days, byDay, rangeFilters);

  /* ---------- Rankings: auditors, distributors, categories ---------- */
  const agg = (field)=>{
    const m = {};
    over.forEach(r=>{ const k=r[field]||'—'; const o=m[k]||(m[k]={k, lines:0, amt:0}); o.lines++; o.amt += Number(r.OverchargeAmt)||0; });
    return Object.values(m);
  };
  const groups = [
    {title:'Auditors',     sub:'who found the overcharges', field:'AuditorName', filt:k=>({status:'over', auditorName:k}), color:'var(--ink)',        data:agg('AuditorName')},
    {title:'Distributors', sub:'where the overcharges are', field:'DBName',      filt:k=>({status:'over', dbName:k}),      color:'var(--danger)',     data:agg('DBName')},
    {title:'Categories',   sub:'which products',            field:'Category',    filt:k=>({status:'over', category:k}),    color:'var(--negligible)', data:agg('Category')},
  ];
  const SHOW = 6;
  const paintRanks = ()=>{
    const by = window.__anRankBy || 'lines';
    $all('.an-seg-toggle button', content).forEach(b=>b.classList.toggle('on', b.dataset.rank===by));
    const grid = $('#anRankGrid');
    const open = grid.__open || (grid.__open = {});
    grid.innerHTML = groups.map((g,gi)=>{
      const list = g.data.slice().sort((a,b)=> (b[by]-a[by]) || (b.lines-a.lines));
      if(!list.length) return `<section class="an-panel"><div class="an-ph"><h3>${g.title}</h3><span>${g.sub}</span></div><div class="empty-state" style="padding:22px 0;">No overcharge lines in this period.</div></section>`;
      const tot = list.reduce((s,x)=>s+x[by],0) || 1, max = Math.max(list[0][by], 1e-9);
      const isOpen = !!open[gi];
      const rowsHtml = list.map((x,i)=>{
        const main = by==='amt' ? '₹'+fmtMoney(x.amt) : fmtInt(x.lines);
        const alt  = by==='amt' ? fmtInt(x.lines)+(x.lines===1?' line':' lines') : '₹'+fmtMoney(x.amt);
        return `<div class="rk-row ${i>=SHOW && !isOpen ? 'rk-hide':''}" ${goAttr(g.filt(x.k))} title="${esc(String(x.k))}">
          <span class="rk-n">${i+1}</span>
          <div class="rk-main">
            <div class="rk-top"><span class="rk-name">${esc(String(x.k))}</span><span class="rk-val">${main}</span></div>
            <div class="rk-track"><div class="rk-fill" style="width:${(x[by]/max)*100}%;background:${g.color};${i===0?'':'opacity:.55;'}"></div></div>
            <div class="rk-sub"><span>${Math.round(x[by]/tot*100)}% of ${by==='amt'?'value':'lines'}</span><span>${alt}</span></div>
          </div>
        </div>`;
      }).join('');
      const more = list.length>SHOW ? `<button type="button" class="rk-more" data-gi="${gi}">${isOpen?'Show top '+SHOW:'Show all '+list.length}</button>` : '';
      return `<section class="an-panel"><div class="an-ph"><h3>${g.title}</h3><span>${g.sub}</span></div>${rowsHtml}${more}</section>`;
    }).join('');
    wireGo(grid);
    $all('.rk-more', grid).forEach(b=>b.addEventListener('click', ()=>{ grid.__open[b.dataset.gi] = !grid.__open[b.dataset.gi]; paintRanks(); }));
  };
  $all('.an-seg-toggle button', content).forEach(b=>b.addEventListener('click', ()=>{ window.__anRankBy = b.dataset.rank; paintRanks(); }));
  paintRanks();
}

/* Overcharge ₹ per day — drawn as plain SVG (no charting library), so it looks the same everywhere, even when the CDN is blocked. */
let __trendArgs = null;
function drawTrendChart(wrap, days, byDay, rangeFilters){
  __trendArgs = { wrap, days, byDay, rangeFilters };
  if(!wrap) return;
  if(!days.length){ wrap.innerHTML = '<div class="empty-state">No overcharge in this period.</div>'; return; }
  const vals = days.map(d=>byDay[d]);
  const total = vals.reduce((a,b)=>a+b,0), avg = total/vals.length;
  const peakI = vals.indexOf(Math.max(...vals));
  const W = Math.max(320, wrap.clientWidth || 560), H = 250, L = 46, R = 10, T = 14, B = 34;
  const iw = W-L-R, ih = H-T-B;
  const niceMax = (v)=>{ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const f = v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; };
  const ymax = niceMax(Math.max(...vals,1));
  const yTicks = [0,1,2,3,4].map(i=>ymax*i/4);
  const compact = v=> v>=100000 ? (v/100000).toFixed(v%100000===0?0:1)+'L' : v>=1000 ? (v/1000).toFixed(v%1000===0?0:1)+'k' : String(Math.round(v));
  const n = vals.length, step = iw/n, bw = Math.max(2, Math.min(26, step*0.66));
  const x = i=> L + step*i + step/2, y = v=> T + ih - (v/ymax)*ih;
  const every = Math.max(1, Math.ceil(n/Math.max(4, Math.floor(iw/52))));
  let g = '';
  yTicks.forEach(t=>{ g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--edge)" ${t===0?'':'stroke-dasharray="3 4"'} /><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="var(--ink-soft)">${t===0?'0':'₹'+compact(t)}</text>`; });
  let bars = '';
  vals.forEach((v,i)=>{
    const h = Math.max(v>0?2:0, ih-(y(v)-T)), bx = x(i)-bw/2;
    bars += `<rect class="tc-bar" data-i="${i}" x="${bx}" y="${T+ih-h}" width="${bw}" height="${h}" rx="${Math.min(4,bw/2)}" fill="${i===peakI?'var(--danger)':'color-mix(in srgb, var(--danger) 62%, transparent)'}"/>`;
    bars += `<rect class="tc-hit" data-i="${i}" x="${L+step*i}" y="${T}" width="${step}" height="${ih}" fill="transparent" style="cursor:pointer"/>`;
    if(i%every===0 || i===n-1){ const p = days[i].split('-'); bars += `<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">${esc(p[0]+'-'+p[1])}</text>`; }
  });
  const avgY = y(avg);
  wrap.innerHTML = `
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 8px;font-size:12.5px;color:var(--ink-soft);">
      <span>Total <b style="color:var(--danger);font-family:var(--font-mono);">₹${fmtMoney2(total)}</b></span>
      <span>Daily average <b style="color:var(--ink);font-family:var(--font-mono);">₹${fmtMoney2(avg)}</b></span>
      <span>Highest <b style="color:var(--ink);font-family:var(--font-mono);">₹${fmtMoney2(vals[peakI])}</b> on ${esc(days[peakI])}</span>
    </div>
    <div style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Overcharge value by day" style="display:block;font-family:inherit;">
        ${g}${bars}
        <line x1="${L}" x2="${W-R}" y1="${avgY}" y2="${avgY}" stroke="var(--ink)" stroke-opacity=".55" stroke-dasharray="5 4"/>
        <text x="${W-R}" y="${avgY-5}" text-anchor="end" font-size="10.5" fill="var(--ink-soft)">avg ₹${compact(avg)}</text>
      </svg>

function computePerformanceRows(rows, nameField){
  const byPerson = {};
  rows.forEach(r=>{
    const name = r[nameField];
    if(!name) return;
    if(!byPerson[name]) byPerson[name] = { name, bills:new Set(), overBills:new Set(), underBills:new Set(), overAmt:0, underAmt:0, lines:0 };
    const p = byPerson[name];
    p.bills.add(r.BillUID);
    p.lines++;
    if(r.Status==='over'){ p.overBills.add(r.BillUID); p.overAmt += Number(r.OverchargeAmt)||0; }
    if(r.Status==='under'){ p.underBills.add(r.BillUID); p.underAmt += Number(r.UnderchargeAmt)||0; }
  });
  return Object.values(byPerson).map(p=>({
    name:p.name, uniqueBills:p.bills.size, lines:p.lines,
    overBills:p.overBills.size, underBills:p.underBills.size,
    overAmt:p.overAmt, underAmt:p.underAmt,
  })).sort((a,b)=>b.uniqueBills-a.uniqueBills);
}

// Parses a 'DD-MM-YYYY' BillDate string into a comparable Date (local
// midnight) — mirrors Code.gs's own parseDMY_ so client-side filtering of
// the background-prefetched full dataset gives identical results to what
// the server would have returned for the same range.
function parseDMYClient(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(!m) return null;
  return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
}
function dmyToISOClient(s){ const m=String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : ''; }
function filterRowsByDateClient(rows, fromStr, toStr, dateBasis){
  if(!fromStr && !toStr) return rows;
  const from = fromStr ? new Date(fromStr+'T00:00:00') : null;
  const to = toStr ? new Date(toStr+'T00:00:00') : null;
  const field = dateBasis==='submission' ? 'SubmissionDate' : 'BillDate';
  return rows.filter(r=>{
    const bd = parseDMYClient(normalizeDMYDisplay(r[field]));
    if(!bd) return true; // keep rows with an unparseable date rather than silently dropping them
    if(from && bd < from) return false;
    if(to && bd > to) return false;
    return true;
  });
}

const __subHay = new WeakMap();
// Everything a person could search a bill by: every field of the line + readable status + copy attached / missing.
function subHaystack(r){
  let h = __subHay.get(r);
  if(h===undefined){
    const vals = []; for(const k in r){ if(k==='_k' || k==='Timestamp') continue; const v = r[k]; if(v!==undefined && v!==null && v!=='') vals.push(String(v)); }
    h = (vals.join(' ') + ' ' + statusLabelFor(r.Status) + ' ' + (r.BillCopyURL ? 'copy attached has photo' : 'copy missing no photo nocopy') + ' ' + String(r.BillUID||'').replace('bill_','')).toLowerCase();
    __subHay.set(r, h);
  }
  return h;
}
function applySubmissionFilters(){
  let rows = window.__subRows||[];
  const sig = [window.__subAuditor,window.__subVerifier,window.__subStatus,window.__subCategory,window.__subDBName,window.__subUniqueBillsOnly,window.__subFrom,window.__subTo,window.__subDateBasis,window.__subQ].join('|');
  if(sig!==window.__subSig){ window.__subSig = sig; window.__subPage = 1; } // a background sync adding rows keeps your page; changing a filter starts from page 1
  if(window.__subAuditor) rows = rows.filter(r=>r.AuditorName===window.__subAuditor);
  if(window.__subVerifier) rows = rows.filter(r=>r.VerifiedBy===window.__subVerifier);
  if(window.__subStatus) rows = rows.filter(r=>r.Status===window.__subStatus);
  if(window.__subCategory) rows = rows.filter(r=>r.Category===window.__subCategory);
  if(window.__subDBName) rows = rows.filter(r=>r.DBName===window.__subDBName);
  { const terms = String(window.__subQ||'').toLowerCase().split(/\s+/).filter(Boolean);       // every word must match somewhere in the row
    if(terms.length) rows = rows.filter(r=>{ const h = subHaystack(r); return terms.every(t=>h.includes(t)); }); }
  // Analytics strip above the table reflects every filter EXCEPT the
  // unique-bills-only display toggle — so "unique bills" there always means
  // the real count for whatever's filtered, whether or not the table itself
  // is currently deduped down to one row per bill.
  renderFilteredAnalyticsStrip(rows);
  if(window.__subUniqueBillsOnly){
    const seen = new Set();
    rows = rows.filter(r=>{ if(seen.has(r.BillUID)) return false; seen.add(r.BillUID); return true; });
  }
  // Grouped by Auditor first (then Verifier, then date) so one person's
  // lines sit together instead of interleaved in submission order — this is
  // the "arranged by auditor/verifier" view without needing a separate tab.
  rows = [...rows].sort((a,b)=>
    (a.AuditorName||'').localeCompare(b.AuditorName||'') ||
    (a.VerifiedBy||'').localeCompare(b.VerifiedBy||'') ||
    String(a.Timestamp||'').localeCompare(String(b.Timestamp||''))
  );

  renderSubmissionsTable(rows);
  renderActiveFilterChips();
