    <div id="mvContent">${ultimateLoaderHtml('mvLoader')}</div>
  `;
  wireDateRangeBar('mv', ()=>{
    window.__mvFrom = $('#mvFrom').value; window.__mvTo = $('#mvTo').value; window.__mvDateBasis = $('#mvDateBasis').value;
    renderMyVerified();
  });
  wireQuickRange('mv', (from,to)=>{
    window.__mvFrom = from; window.__mvTo = to;
    renderMyVerified();
  });
  const s = getSession();
  const params = { action:'myverifieddata', code:s.code, pin:s.pin, fromDate: window.__mvFrom||'', toDate: window.__mvTo||'', dateBasis: window.__mvDateBasis||'submission' };
  const stop = startUltimateLoader('mvLoader');
  let painted = false;
  await cachedBackendGet(params,
    (data)=>{ painted = true; stop('Loaded from local cache'); paintMyVerified(data.rows||[], true); },
    (fresh, hadCache)=>{
      if(document.querySelector('.tab-btn.active')?.dataset.tab !== 'myverified') return; // left the tab meanwhile
      if(!fresh.ok){ if(!painted) $('#mvContent').innerHTML = `<div class="empty-state">${esc(fresh.error||'Could not load.')}</div>`; return; }
      stop();
      paintMyVerified(fresh.rows, false);
    }
  );
}
/* ==================== SHARED ROLE VIEW (Auditor "My Data" + Verifier "Bills I Verified") ====================
   Same tiles as the Admin Analytics tab — line-level AND unique-bill / unique-distributor — each with an
   info (i) tooltip explaining the logic, and every tile is clickable: it filters the table below in place. */
window.__rd = window.__rd || {};
function rdFilter(rows, st){
  let f = rows;
  if(st.status) f = f.filter(r=>r.Status===st.status);
  if(st.db) f = f.filter(r=>(r.DBName||'—')===st.db);
  if(st.product) f = f.filter(r=>(r.ProductName||'—')===st.product);
  if(st.clean){
    const dirty = new Set(rows.filter(r=>r.Status!=='match').map(r=>r.BillUID));
    f = f.filter(r=>!dirty.has(r.BillUID));
  }
  if(st.unique){ const seen = new Set(); f = f.filter(r=>{ if(seen.has(r.BillUID)) return false; seen.add(r.BillUID); return true; }); }
  return f;
}
function rdChips(st){
  const c = [];
  if(st.view==='dbs') c.push(['view','Distributor summary']);
  if(st.status) c.push(['status','Status: '+statusLabelFor(st.status)]);
  if(st.clean) c.push(['clean','Clean bills only']);
  if(st.db) c.push(['db','Distributor: '+st.db]);
  if(st.product) c.push(['product','Product: '+st.product]);
  if(st.unique) c.push(['unique','One row per unique bill']);
  return c;
}
function rdTableHtml(rows, st, cfg){
  if(st.view==='dbs'){
    const m = {};
    rows.forEach(r=>{ const k=r.DBName||'—'; const o=m[k]=m[k]||{name:k,bills:new Set(),lines:0,overBills:new Set(),over:0,overAmt:0}; o.bills.add(r.BillUID); o.lines++; if(r.Status==='over'){ o.overBills.add(r.BillUID); o.over++; o.overAmt+=Number(r.OverchargeAmt)||0; } });
    const list = Object.values(m).sort((x,y)=>y.overBills.size-x.overBills.size || y.bills.size-x.bills.size);
    return `<div class="table-wrap"><table>
      <thead><tr><th>Distributor</th><th class="num">Unique Bills</th><th class="num">Lines</th><th class="num">Bills w/ Overcharge</th><th class="num">Overcharge Lines</th><th class="num">Overcharge ₹</th></tr></thead>
      <tbody>${list.map(o=>`<tr class="rd-db-row" data-db="${esc(o.name)}" style="cursor:pointer;"><td>${esc(o.name)}</td><td class="num">${fmtInt(o.bills.size)}</td><td class="num">${fmtInt(o.lines)}</td><td class="num">${fmtInt(o.overBills.size)}</td><td class="num">${fmtInt(o.over)}</td><td class="num">₹${fmtMoney(o.overAmt)}</td></tr>`).join('')}</tbody></table></div>
      <div class="small-muted" style="margin-top:6px;">Click a distributor to see its bills.</div>`;
  }
  if(!rows.length) return `<div class="empty-state">${st.status||st.db||st.product||st.clean ? 'Nothing matches this filter.' : cfg.emptyMsg}</div>`;
  const CAP = 500, shown = rows.slice(0, CAP);
  return `<div class="table-wrap"><table>
      <thead><tr><th>Bill Date</th><th>Distributor</th><th>Retailer</th><th>Product</th><th>${cfg.personCol}</th><th class="num">Company Rate</th><th class="num">Invoice Rate</th><th>Status</th><th>Bill UID</th><th>Bill Copy</th></tr></thead>
      <tbody>${shown.map(r=>`<tr>
        <td>${esc(normalizeDMYDisplay(r.BillDate))}</td><td>${esc(r.DBName)}</td><td>${esc(r.Retailer)}</td><td>${esc(r.ProductName)}</td><td>${esc(r[cfg.personKey])}</td>
        <td class="num">${fmtMoney(r.CompanyRate)}</td><td class="num">${fmtMoney(r.InvoiceRate)}</td>
        <td>${statusBadge(r.Status)}</td><td class="small-muted">${esc(String(r.BillUID||'').replace('bill_',''))}</td><td>${billCopyLinkCell(r)}</td>
      </tr>`).join('')}</tbody>
    </table></div>${rows.length>CAP?`<div class="small-muted" style="margin-top:6px;">Showing the first ${CAP} of ${fmtInt(rows.length)} lines — Export includes all of them.</div>`:''}`;
}
function paintRoleView(cfg, rows, isStale){
  const el = $(cfg.content);
  if(!el) return;
  const p = cfg.p;
  const st = window.__rd[p] = window.__rd[p] || {};
  const over = rows.filter(r=>r.Status==='over'), under = rows.filter(r=>r.Status==='under'), neg = rows.filter(r=>r.Status==='negligible');
  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0);
  const underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);
  const ub = new Set(rows.map(r=>r.BillUID)), udb = new Set(rows.map(r=>r.DBName||'—'));
  const ubOver = new Set(over.map(r=>r.BillUID)), ubUnder = new Set(under.map(r=>r.BillUID)), ubNeg = new Set(neg.map(r=>r.BillUID));
  const dbOver = new Set(over.map(r=>r.DBName||'—'));
  const cleanN = ub.size - new Set([...ubOver,...ubUnder,...ubNeg]).size;
  const pct = n => ub.size ? Math.round(n/ub.size*100) : 0;
  $(cfg.exportBtn).disabled = !rows.length; $(cfg.photoBtn).disabled = !rows.length;
  window[cfg.allKey] = rows;

  const tile = (icon, bg, label, value, sub, filt, info) => `<div class="stat-card clickable" data-filt='${esc(JSON.stringify(filt))}'>
      <div class="stat-card-top"><div>
        <div class="stat-label">${label}<span class="info-dot" data-tip="${esc(info)}">i</span></div>
        <div class="stat-value">${value}</div>${sub?`<div class="stat-card-sub">${sub}</div>`:''}
      </div><div class="stat-card-icon" style="background:${bg};">${icon}</div></div>
      <div class="stat-card-hint">View →</div></div>`;

  const byProduct = {};
  rows.forEach(r=>{ const k=r.ProductName||'—'; (byProduct[k]=byProduct[k]||[]).push(r); });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
  const maxCount = topProducts.length ? topProducts[0][1].length : 1;

  el.innerHTML = `
    ${isStale ? `<div class="stale-banner"><span class="spin"></span> Refreshing in the background…</div>` : ''}
    <div class="section-eyebrow">Line-level</div>
    <div class="grid grid-4" style="margin-bottom:8px;">
      ${tile('📋','var(--panel-2)',cfg.linesLabel,fmtInt(rows.length),'',{}, 'Every product line in the selected date range. A bill with 5 products = 5 lines. Lines = count of rows '+cfg.scope+'.')}
      ${tile('⚠️','var(--danger-soft)','Overcharge Lines',fmtInt(over.length),`₹${fmtMoney(overAmt)} total`,{status:'over'}, 'Lines where Invoice Rate (per kg, incl. GST) is higher than Company Rate by 1% or more. Variance % = (Invoice − Company) ÷ Company × 100 (≥ 1%). ₹ total = Σ (Invoice − Company) × Qty in kg over these lines.')}
      ${tile('↩️','var(--warn-soft)','Undercharge Lines',fmtInt(under.length),`₹${fmtMoney(underAmt)} total`,{status:'under'}, 'Lines where Invoice Rate is below Company Rate (any amount, no tolerance band). ₹ total = Σ (Company − Invoice) × Qty in kg.')}
      ${tile('≈','var(--negligible-soft)','Negligible',fmtInt(neg.length),'',{status:'negligible'}, 'Lines where Invoice Rate is above Company Rate but by less than 1% (0% < variance < 1%). Technically an overcharge, too small to flag, so it is counted separately and NOT in Overcharge Lines.')}
    </div>
    <div class="section-eyebrow">Unique bills — actual bills, not lines</div>
    <div class="grid grid-4" style="margin-bottom:8px;">
      ${tile('🧾','var(--panel-2)','Total Unique Bills',fmtInt(ub.size),'',{unique:true}, 'Count of distinct Bill UIDs in this range. Every bill gets one UID when saved, so a bill with 5 product lines is still counted once.')}
      ${tile('🏬','var(--panel-2)','Total Unique Distributors',fmtInt(udb.size),'',{view:'dbs'}, 'Count of distinct distributor (DB) names in this range, whether or not any of their bills had an overcharge. Click to see a distributor-wise summary.')}
      ${tile('🔴','var(--danger-soft)','Unique Bills w/ Overcharge',fmtInt(ubOver.size),`${pct(ubOver.size)}% of all bills`,{status:'over',unique:true}, 'Distinct bills having AT LEAST ONE Overcharge line (variance ≥ 1%). A bill with 2 overcharge lines counts once. % = this ÷ Total Unique Bills × 100.')}
      ${tile('🏢','var(--danger-soft)','Distributors w/ Overcharge',fmtInt(dbOver.size),`of ${fmtInt(udb.size)} distributors`,{status:'over',view:'dbs'}, 'Distinct distributors with at least one Overcharge line in this range. Compare with Total Unique Distributors to see how many distributors were clean.')}
    </div>
    <div class="grid grid-3" style="margin-bottom:18px;">
      ${tile('🟡','var(--warn-soft)','Unique Bills w/ Undercharge',fmtInt(ubUnder.size),`${pct(ubUnder.size)}% of all bills`,{status:'under',unique:true}, 'Distinct bills having at least one Undercharge line (Invoice Rate below Company Rate).')}
      ${tile('🔵','var(--negligible-soft)','Unique Bills w/ Negligible',fmtInt(ubNeg.size),`${pct(ubNeg.size)}% — under 1%, not flagged`,{status:'negligible',unique:true}, 'Distinct bills having at least one Negligible line (overcharge below 1%).')}
      ${tile('🟢','var(--success-soft)','Clean Bills',fmtInt(cleanN),'every line matched',{clean:true,unique:true}, 'Total Unique Bills minus every bill that has even one Over / Under / Negligible line. All lines on these bills matched the Company Rate exactly.')}
    </div>
    ${topProducts.length ? `<div class="card" style="margin-bottom:16px;">
      <div class="section-title">By Product — click to filter below</div>
      ${topProducts.map(([name, list])=>{
        const o = list.filter(r=>r.Status==='over').length;
        return `<div class="micro-bar-row ${st.product===name?'active':''}" data-product="${esc(name)}">
          <div class="mb-label" title="${esc(name)}">${esc(name)}</div>
          <div class="mb-track"><div class="mb-fill" style="width:${(list.length/maxCount)*100}%;background:${o>0?'var(--danger)':'var(--accent)'};"></div></div>
          <div class="mb-count">${list.length} line${list.length===1?'':'s'}</div>
        </div>`; }).join('')}
    </div>` : ''}
    <div id="${p}Chips" style="margin-bottom:8px;"></div>
    <div id="${p}TableWrap"></div>`;

  const apply = ()=>{
    const f = st.view==='dbs' ? rows.filter(r=>!st.status || r.Status===st.status) : rdFilter(rows, st);
    window[cfg.filtKey] = (st.view==='dbs') ? f : f;
    const chips = rdChips(st);
    $(`#${p}Chips`).innerHTML = chips.map(([k,l])=>`<span class="filter-chip" data-k="${k}">${esc(l)} <b>×</b></span>`).join('');
    $all(`#${p}Chips .filter-chip`).forEach(ch=>ch.addEventListener('click', ()=>{ const k=ch.dataset.k; if(k==='view') st.view=''; else if(k==='unique') st.unique=false; else if(k==='clean') st.clean=false; else st[k]=''; apply(); }));
    const wrap = $(`#${p}TableWrap`);
    wrap.innerHTML = rdTableHtml(f, st, cfg);
    $all('.rd-db-row', wrap).forEach(tr=>tr.addEventListener('click', ()=>{ st.view=''; st.db = tr.dataset.db; apply(); }));
    $all('.micro-bar-row', el).forEach(r=>r.classList.toggle('active', r.dataset.product===st.product));
  };
  $all('.stat-card.clickable', el).forEach(card=>card.addEventListener('click', ()=>{
    const f = JSON.parse(card.getAttribute('data-filt'));
    window.__rd[p] = Object.assign(st, {status:'', db:'', product:'', clean:false, unique:false, view:''}, f);
    apply();
    $(`#${p}Chips`).scrollIntoView({behavior:'smooth', block:'nearest'});
  }));
  $all('.micro-bar-row', el).forEach(row=>row.addEventListener('click', ()=>{ st.product = (st.product===row.dataset.product) ? '' : row.dataset.product; apply(); }));
  $(cfg.exportBtn).onclick = ()=>exportProExcel(window[cfg.filtKey]||rows, cfg.exportName, cfg.sheetName);
  $(cfg.photoBtn).onclick = ()=>exportBillPhotosZip(window[cfg.filtKey]||rows, $(cfg.photoBtn));
  apply();
}
function paintMyVerified(rows, isStale){
  paintRoleView({ p:'mv', content:'#mvContent', exportBtn:'#mvExport', photoBtn:'#mvExportPhotos', allKey:'__mvAllRows', filtKey:'__mvFilteredRows',
    exportName:'Bills_I_Verified', sheetName:'Bills I Verified', linesLabel:'Lines Verified', scope:'verified against your name',
    personCol:'Collected By', personKey:'CollectedBy', emptyMsg:'No bills verified against your name in this period yet.' }, rows, isStale);
}
function paintMyData(rows, isStale){
  paintRoleView({ p:'my', content:'#myContent', exportBtn:'#myExport', photoBtn:'#myExportPhotos', allKey:'__myAllRows', filtKey:'__myFilteredRows',
    exportName:'My_Data', sheetName:'My Data', linesLabel:'Lines Submitted', scope:'you submitted',
    personCol:'Verified By', personKey:'VerifiedBy', emptyMsg:'No submissions in this period yet.' }, rows, isStale);
}

/* ==================== MY DATA (Auditor) ==================== */
async function renderMyData(){
  const body = $('#tabBody');
  window.__rd.my = {};
  if(window.__myDateBasis===undefined) window.__myDateBasis = 'submission';
  if(window.__myFrom===undefined && window.__myTo===undefined){ window.__myFrom = istWeekStartISO(); window.__myTo = istDateISO(); }
  body.innerHTML = `
    <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:4px;">
      ${dateRangeBarHtml('my', window.__myFrom, window.__myTo, window.__myDateBasis)}
      ${quickRangeHtml('my')}
      <button class="btn accent" id="myExport" style="margin-left:auto;" disabled>⬇ Export (Pro format)</button>
      <button class="btn secondary" id="myExportPhotos" disabled>📷 Download All Photos (ZIP)</button>
    </div>
    <div id="myContent">${ultimateLoaderHtml('myLoader')}</div>
  `;
  wireDateRangeBar('my', ()=>{
    window.__myFrom = $('#myFrom').value; window.__myTo = $('#myTo').value; window.__myDateBasis = $('#myDateBasis').value;
    renderMyData();
  });
  wireQuickRange('my', (from,to)=>{
    window.__myFrom = from; window.__myTo = to;
    renderMyData();
  });
  const s = getSession();
  const params = { action:'mydata', code:s.code, pin:s.pin, fromDate: window.__myFrom||'', toDate: window.__myTo||'', dateBasis: window.__myDateBasis||'submission' };
  const stop = startUltimateLoader('myLoader');
  let painted = false;
  await cachedBackendGet(params,
    (data)=>{ painted = true; stop('Loaded from local cache'); paintMyData(data.rows||[], true); },
    (fresh)=>{
      if(document.querySelector('.tab-btn.active')?.dataset.tab !== 'mydata') return;
      if(!fresh.ok){ if(!painted) $('#myContent').innerHTML = `<div class="empty-state">${esc(fresh.error||'Could not load.')}</div>`; return; }
      stop();
      paintMyData(fresh.rows, false);
    }
  );
}
/* ==================== BOOT ==================== */
function boot(){
  const s = getSession();
  if(!s){ renderLogin(); return; }
  renderShell();
}
document.addEventListener('DOMContentLoaded', boot);
