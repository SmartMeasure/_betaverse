// destination, same report format, whatever was clicked — just with
// different filters pre-applied, so "click anything" always lands on a
// real, correctly-filtered list of the underlying bills.
function goToFilteredSubmissions(filters){
  filters = filters || {};
  window.__subStatus = filters.status || '';
  window.__subCategory = filters.category || '';
  window.__subAuditor = filters.auditorName || '';
  window.__subVerifier = filters.verifiedByName || '';
  window.__subDBName = filters.dbName || '';
  window.__subUniqueBillsOnly = !!filters.uniqueBillsOnly;
  if(filters.fromDate!==undefined) window.__subFrom = filters.fromDate;
  if(filters.toDate!==undefined) window.__subTo = filters.toDate;
  if(filters.dateBasis) window.__subDateBasis = filters.dateBasis;
  switchToTab('submissions');
}
function renderActiveFilterChips(){
  const el = $('#subActiveFilters');
  if(!el) return;
  const chips = [];
  if(window.__subStatus) chips.push({label:`Status: ${statusLabelFor(window.__subStatus)}`, clear:()=>{window.__subStatus='';}});
  if(window.__subCategory) chips.push({label:`Category: ${window.__subCategory}`, clear:()=>{window.__subCategory='';}});
  if(window.__subAuditor) chips.push({label:`Auditor: ${window.__subAuditor}`, clear:()=>{window.__subAuditor='';}});
  if(window.__subVerifier) chips.push({label:`Verifier: ${window.__subVerifier}`, clear:()=>{window.__subVerifier='';}});
  if(window.__subDBName) chips.push({label:`Distributor: ${window.__subDBName}`, clear:()=>{window.__subDBName='';}});
  if(window.__subUniqueBillsOnly) chips.push({label:'Unique bills only', clear:()=>{window.__subUniqueBillsOnly=false;}});
  if(!chips.length){ el.innerHTML=''; return; }
  el.innerHTML = chips.map((c,i)=>`<span class="filter-chip" data-chip="${i}">${esc(c.label)} <b>×</b></span>`).join('');
  $all('.filter-chip', el).forEach((chip,i)=>chip.addEventListener('click', ()=>{
    chips[i].clear();
    // Keep the Auditor/Verifier dropdowns in sync when their chip is cleared.
    $('#subAuditorFilter').value = window.__subAuditor||'';
    $('#subVerifierFilter').value = window.__subVerifier||'';
    $('#subStatusFilter').value = window.__subStatus||'';
    applySubmissionFilters();
  }));
}
function statusLabelFor(s){ return s==='over'?'Overcharge':(s==='under'?'Undercharge':(s==='negligible'?'Overcharge – Negligible':'Match')); }
function billCopyLinkCell(r){
  if(!r.BillCopyURL) return r.BillUID ? `<button class="btn small accent" data-attach-uid="${esc(r.BillUID)}" title="Attach the bill copy (it cannot be changed once attached)">📎 Attach</button>` : '<span class="small-muted">—</span>';
  // The viewer page (opened in a new tab) has its own visible download link
  // for the actual file — a plain <a download> here would just save the
  // HTML wrapper page itself, since Apps Script can only ever hand back
  // HTML/text from a Web App, never a raw file, so there's only one link
  // now rather than a separate (and broken) direct-download one.
  return `<a href="${esc(photoBestUrl(r.BillCopyURL, r.BillCopyDownloadURL))}" target="_blank" rel="noopener" class="bill-copy-link">📷 View</a>`;
}
function renderSubmissionsTable(rows){
  const content = $('#subInner');
  const SUPER = !!(getSession()||{}).superAdmin;
  window.__subSel = window.__subSel || new Set();
  if(!rows.length){ content.innerHTML = '<div class="empty-state">No submissions match these filters.</div>'; return; }
  const cols = ['Timestamp','BillUID','AuditorCode','AuditorName','VerifiedBy','DBCode','DBName','Location','Retailer','BillDate','SOSubmitDate','ProductName','ProductCode','CompanyRate','InvoiceRate','VariancePct','Status','OverchargeAmt','UnderchargeAmt','BillCopy'];
  let lastAuditor = null;
  // Only one page of rows is ever drawn into the DOM — with the whole sheet
  // held locally, painting every row (tens of thousands) would freeze the
  // tab. Export, the analytics strip and filters still work on ALL rows.
  const PAGE = 200;
  const totalPages = Math.max(1, Math.ceil(rows.length/PAGE));
  if(!window.__subPage || window.__subPage>totalPages) window.__subPage = 1;
  const pageRows = rows.slice((window.__subPage-1)*PAGE, window.__subPage*PAGE);
  const pager = rows.length>PAGE ? `<div style="display:flex;gap:10px;align-items:center;margin:10px 0;">
      <button class="btn small" id="subPrev" ${window.__subPage<=1?'disabled':''}>← Prev</button>
      <span class="small-muted">Rows ${fmtInt((window.__subPage-1)*PAGE+1)}–${fmtInt(Math.min(window.__subPage*PAGE, rows.length))} of ${fmtInt(rows.length)} · page ${window.__subPage}/${totalPages}</span>
      <button class="btn small" id="subNext" ${window.__subPage>=totalPages?'disabled':''}>Next →</button></div>` : '';
  content.innerHTML = `${SUPER?`<div id="subSelBar" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--panel-3);"></div>`:''}${pager}<div class="table-wrap"><table>
    <thead><tr>${SUPER?`<th><input type="checkbox" id="subSelPage" title="Select this page"></th>`:''}${cols.map(c=>`<th>${c==='BillCopy'?'Bill Copy':c}</th>`).join('')}${SUPER?'<th>Delete</th>':''}</tr></thead>
    <tbody>${pageRows.map(r=>{
      const newGroup = r.AuditorName!==lastAuditor;
      lastAuditor = r.AuditorName;
      return `<tr class="${newGroup?'auditor-group-start':''}">${SUPER?`<td><input type="checkbox" data-sel="${esc(r._k||'')}" ${window.__subSel.has(r._k)?'checked':''}></td>`:''}${cols.map(c=>{
      if(c==='BillCopy') return `<td>${billCopyLinkCell(r)}</td>`;
      if(c==='Status') return `<td>${statusBadge(r[c])}</td>`;
      if(['CompanyRate','InvoiceRate','OverchargeAmt','UnderchargeAmt'].includes(c)) return `<td class="num">${fmtMoney(r[c])}</td>`;
      if(c==='VariancePct') return `<td class="num">${r[c]!=null && r[c]!==''?r[c]+'%':'—'}</td>`;
      if(c==='Timestamp') return `<td>${esc(formatISTDateTime(r[c]))}</td>`;
      if(DATE_DISPLAY_FIELDS.includes(c)) return `<td>${esc(normalizeDMYDisplay(r[c]))}</td>`;
      return `<td>${esc(r[c])}</td>`;
    }).join('')}${SUPER?`<td style="white-space:nowrap;"><button class="btn small danger" data-del-line="${esc(r._k||'')}">🗑 Line</button> <button class="btn small danger" data-del-bill="${esc(r.BillUID||'')}">🗑 Bill</button></td>`:''}</tr>`; }).join('')}</tbody>
  </table></div>${pager}`;
  $all('[data-del-line]').forEach(b=>b.addEventListener('click', ()=>{ const r = AdminStore.byKey.get(b.dataset.delLine); if(r) sdOpenDelete([r]); }));
  $all('[data-del-bill]').forEach(b=>b.addEventListener('click', ()=>{ const ls = AdminStore.rows.filter(x=>x.BillUID===b.dataset.delBill); if(ls.length) sdOpenDelete(ls); }));
  if(SUPER){
    const paintBar = ()=>{
      const n = window.__subSel.size, bar = $('#subSelBar'); if(!bar) return;
      bar.innerHTML = `<b>${fmtInt(n)}</b> selected
        <button class="btn small" id="subSelAll">Select all ${fmtInt(rows.length)} shown (every page)</button>
        <button class="btn small" id="subSelClear" ${n?'':'disabled'}>Clear</button>
        <button class="btn small danger" id="subSelDelete" ${n?'':'disabled'}>🗑 Delete selected${n?' ('+fmtInt(n)+')':''}</button>
        <span class="small-muted">Tick lines (or "select all"), then delete them together.${window.__subUniqueBillsOnly?' (Unique-bills view: each ticked row deletes its WHOLE bill.)':''}</span>`;
      $('#subSelAll').onclick = ()=>{ rows.forEach(r=>window.__subSel.add(r._k)); syncChecks(); paintBar(); };
      $('#subSelClear').onclick = ()=>{ window.__subSel.clear(); syncChecks(); paintBar(); };
      $('#subSelDelete').onclick = ()=>{ sdOpenDeleteSelected(rows); };
    };
    const syncChecks = ()=>{ $all('[data-sel]').forEach(c=>{ c.checked = window.__subSel.has(c.dataset.sel); }); const pg = $('#subSelPage'); if(pg) pg.checked = pageRows.length>0 && pageRows.every(r=>window.__subSel.has(r._k)); };
    $all('[data-sel]').forEach(c=>c.addEventListener('change', ()=>{ if(c.checked) window.__subSel.add(c.dataset.sel); else window.__subSel.delete(c.dataset.sel); syncChecks(); paintBar(); }));
    const pg = $('#subSelPage'); if(pg) pg.addEventListener('change', ()=>{ pageRows.forEach(r=>{ if(pg.checked) window.__subSel.add(r._k); else window.__subSel.delete(r._k); }); syncChecks(); paintBar(); });
    syncChecks(); paintBar();
  }
  $all('#subPrev').forEach(b=>b.addEventListener('click', ()=>{ window.__subPage--; renderSubmissionsTable(rows); }));
  $all('#subNext').forEach(b=>b.addEventListener('click', ()=>{ window.__subPage++; renderSubmissionsTable(rows); }));
}
function exportRowsToExcel(rows, filenamePrefix){
  if(!rows || !rows.length){ toast('Nothing to export', 'err'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, `${filenamePrefix}_${istDateDMY()}.xlsx`);
}

/* Same colored "Pro" look AND the SAME full column set as Rate Ledger's own
   Excel export — so a report downloaded from anywhere (any Dashboard view,
   by any Verifier or Auditor) is byte-for-byte the same shape and style as
   one downloaded straight from Rate Ledger. Source rows here come from the
   Sheet (PascalCase headers); a couple of columns Rate Ledger computes
   in-browser (₹/PC rates) aren't stored as their own Sheet columns, so
   they're recomputed here from PackSizeKg, which IS stored. */
async function exportProExcel(rows, filenamePrefix, viewLabel){
  if(!rows || !rows.length){ toast('Nothing to export', 'err'); return; }
  const INK='FF1E2438', DANGER='FFB23A2E', DANGERSOFT='FFF3DEDA',
        SUCCESSSOFT='FFDCEBE0', WARNSOFT='FFF1E4C6', NEGLIGIBLESOFT='FFDCE6F5', NEGLIGIBLE='FF2A5FD9',
        GSTMISMATCHSOFT='FFF1E8FC', GSTSUSPECTSOFT='FFFDF0DA', WHITE='FFFFFFFF';
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Rate Ledger'; wb.created = new Date();
  const ws = wb.addWorksheet('Overinvoicing Report', {views:[{state:'frozen', ySplit:5}]});
  const cols = [
    {header:'SL', key:'sl', width:6}, {header:'Bill UID', key:'BillUID', width:16}, {header:'DB Code', key:'DBCode', width:11}, {header:'DB Name', key:'DBName', width:26},
    {header:'Location', key:'Location', width:14}, {header:'Beat Code', key:'BeatCode', width:12}, {header:'Beat Name', key:'BeatName', width:22},
    {header:'SO Name', key:'SOName', width:16}, {header:'ASM Name', key:'ASMName', width:16}, {header:'RSM Name', key:'RSMName', width:16},
    {header:'DB Status', key:'DBStatus', width:11}, {header:'Retailer / Outlet', key:'Retailer', width:24}, {header:'Bill Type', key:'BillType', width:12},
    {header:'Bill No', key:'BillNo', width:14}, {header:'Bill Date', key:'BillDate', width:12}, {header:'SO Submitted On', key:'SOSubmitDate', width:14}, {header:'Product', key:'ProductName', width:34},
    {header:'Pack Size (kg)', key:'PackSizeKg', width:12}, {header:'Product Code', key:'ProductCode', width:13}, {header:'GST %', key:'GSTPct', width:8},
    {header:'Company Rate (₹/kg)', key:'CompanyRate', width:14}, {header:'Company Rate (₹/PC)', key:'CompanyRatePerPc', width:14},
    {header:'Bag Size', key:'BagSizeLabel', width:12}, {header:'Components', key:'ComponentsSummary', width:30},
    {header:'Total Qty (kg-equiv)', key:'QtyKG', width:14}, {header:'Total Invoiced (₹)', key:'TotalInvoiced', width:15},
    {header:'Invoice Rate (₹/kg)', key:'InvoiceRate', width:15}, {header:'Invoice Rate (₹/PC)', key:'BlendedRatePerPc', width:15},
    {header:'Diff (₹/kg)', key:'DiffPerKg', width:12}, {header:'Diff (₹/PC)', key:'DiffPerPc', width:12}, {header:'Diff (₹/BAG)', key:'DiffPerBag', width:13},
    {header:'Variance %', key:'VariancePctLabel', width:11}, {header:'Status', key:'StatusLabel', width:13},
    {header:'Over/Undercharge (₹)', key:'DiffAmountLabel', width:16}, {header:'Overcharge Amt', key:'OverchargeAmt', width:15},
    {header:'Undercharge Amt', key:'UnderchargeAmt', width:16}, {header:'Wrong GST Charged (₹)', key:'GSTMismatchLabel', width:18},
    {header:'Collected By', key:'CollectedBy', width:20}, {header:'Designation', key:'Designation', width:16},
    {header:'Verified By', key:'VerifiedBy', width:20}, {header:'Submission Date', key:'SubmissionDate', width:15}, {header:'Entered At (IST)', key:'Timestamp', width:22}, {header:'Bill Copy', key:'BillCopyURL', width:16},
  ];
  ws.columns = cols.map(c=>({key:c.key, width:c.width}));
  ws.mergeCells(1,1,1,cols.length);
  const titleCell = ws.getCell(1,1);
  titleCell.value = `RATE LEDGER — OVERINVOICING AUDIT REPORT`;
  titleCell.font = {name:'Calibri', size:14, bold:true, color:{argb:WHITE}};
  titleCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:INK}};
  ws.getRow(1).height = 26;
  const over = rows.filter(r=>r.Status==='over'), under = rows.filter(r=>r.Status==='under'), neg = rows.filter(r=>r.Status==='negligible');
  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0), underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);
  ws.mergeCells(2,1,2,cols.length);
  ws.getCell(2,1).value = `Generated ${formatISTDateTime(new Date())} IST  ·  ${rows.length} lines  ·  ${over.length} overcharge (₹${overAmt.toFixed(2)})  ·  ${under.length} undercharge (₹${underAmt.toFixed(2)})  ·  ${neg.length} negligible (<1%, excluded)`;
  ws.getCell(2,1).font = {name:'Calibri', size:10, italic:true, color:{argb:'FF6B6E76'}};
  const headerRow = ws.getRow(4);
  cols.forEach((c,i)=>{ headerRow.getCell(i+1).value = c.header; });
  headerRow.eachCell(cell=>{ cell.font={name:'Calibri',size:10,bold:true,color:{argb:WHITE}}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; cell.alignment={vertical:'middle'}; });
  headerRow.height = 20;
  let r = 6;
  rows.forEach((row,idx)=>{
    const status = (row.Status||'').toLowerCase();
    const fillColor = status==='over'?DANGERSOFT:(status==='negligible'?NEGLIGIBLESOFT:(status==='under'?WARNSOFT:SUCCESSSOFT));
    const sColor = status==='over'?DANGER:(status==='negligible'?NEGLIGIBLE:(status==='under'?'FF9C6B12':'FF1E7A4C'));
    const statusLabel = status==='over'?'OVERCHARGE':(status==='negligible'?'OVERCHARGE - NEGLIGIBLE':(status==='under'?'UNDERCHARGE':'MATCH'));
    const packKg = Number(row.PackSizeKg)||null;
    const companyRatePerPc = packKg ? (Number(row.CompanyRate)||0)*packKg : '';
    const blendedRatePerPc = packKg ? (Number(row.InvoiceRate)||0)*packKg : '';
    // TotalInvoiced isn't its own Sheet column (only the per-kg rate is) —
    // it's exactly QtyKG × the blended rate, so derive it rather than add
    // yet another column to migrate for.
    const totalInvoiced = (row.TotalInvoiced!=null && row.TotalInvoiced!=='') ? row.TotalInvoiced : (Number(row.QtyKG)||0)*(Number(row.InvoiceRate)||0);
    const vp = row.VariancePct==null||row.VariancePct===''?'':row.VariancePct;
    const variancePctLabel = vp===''?'':((Number(vp)>0?'+':'')+vp+'%');
    const chargeAmt = status==='over' ? Number(row.OverchargeAmt)||0 : (status==='under' ? -(Number(row.UnderchargeAmt)||0) : (Number(row.NegligibleAmt)||0));
    const diffAmountLabel = (chargeAmt>0?'+':'')+chargeAmt.toFixed(2);
    const gstMismatch = String(row.GSTMismatch).toUpperCase()==='TRUE';
    const gstMismatchLabel = gstMismatch ? `${row.GSTPctCharged}% charged vs correct ${row.GSTPct}% = ${Number(row.GSTMismatchAmt)>0?'+':''}${row.GSTMismatchAmt}` : '';
    const rowData = { sl:idx+1, ...row, CompanyRatePerPc:companyRatePerPc, BlendedRatePerPc:blendedRatePerPc, TotalInvoiced:totalInvoiced,
      VariancePctLabel:variancePctLabel, StatusLabel:statusLabel, DiffAmountLabel:diffAmountLabel, GSTMismatchLabel:gstMismatchLabel };
    const excelRow = ws.getRow(r);
    cols.forEach((c,i)=>{
      let v = rowData[c.key];
      if(DATE_DISPLAY_FIELDS.includes(c.key) && v) v = normalizeDMYDisplay(v);
      if(c.key==='Timestamp' && v) v = formatISTDateTime(v);
      if(c.key==='BillCopyURL' && v){
        excelRow.getCell(i+1).value = { text:'View photo', hyperlink: photoViewUrl(v) };
        excelRow.getCell(i+1).font = { color:{argb:'FF2A5FD9'}, underline:true };
      } else {
        excelRow.getCell(i+1).value = (v===undefined||v==='') ? null : v;
      }
      excelRow.getCell(i+1).fill = {type:'pattern', pattern:'solid', fgColor:{argb: gstMismatch ? (GSTMISMATCHSOFT) : fillColor}};
    });
    ['CompanyRate','CompanyRatePerPc','InvoiceRate','BlendedRatePerPc','TotalInvoiced','OverchargeAmt','UnderchargeAmt','DiffPerKg','DiffPerPc','DiffPerBag'].forEach(k=>{
      const ci = cols.findIndex(c=>c.key===k)+1;
      if(ci>0) excelRow.getCell(ci).numFmt = '#,##0.00';
    });
    const byKey = k=>{ const ci=cols.findIndex(c=>c.key===k)+1; return ci>0?excelRow.getCell(ci):null; };
    [byKey('StatusLabel'), byKey('VariancePctLabel'), byKey('DiffAmountLabel')].forEach(cell=>{ if(cell) cell.font={bold:true,color:{argb:sColor}}; });
    if(status==='over'){ const c=byKey('OverchargeAmt'); if(c) c.font={bold:true,color:{argb:DANGER}}; }
    if(status==='under'){ const c=byKey('UnderchargeAmt'); if(c) c.font={bold:true,color:{argb:'FF9C6B12'}}; }
    if(gstMismatch){ const c=byKey('GSTMismatchLabel'); if(c){ c.font={bold:true,color:{argb:'FF9B59EB'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:GSTMISMATCHSOFT}}; } }
    excelRow.height = 18;
    r++;
  });
  // Summary sheet — same structure as Rate Ledger's own Pro export, so both
  // reports carry the identical at-a-glance overview alongside the detail.
  const ws2 = wb.addWorksheet('Summary');
  ws2.columns = [{width:28},{width:18},{width:18}];
  ws2.getCell('A1').value = 'RATE LEDGER — SUMMARY';
  ws2.getCell('A1').font = {size:13,bold:true,color:{argb:WHITE}};
  ws2.mergeCells('A1:B1'); ws2.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}};
  ws2.getRow(1).height = 22;
  const overCount = over.length, overAmt2 = over.reduce((s,rr)=>s+(Number(rr.OverchargeAmt)||0),0);
  const underCount = under.length, underAmt2 = under.reduce((s,rr)=>s+(Number(rr.UnderchargeAmt)||0),0);
  const negCount = neg.length, negAmt = neg.reduce((s,rr)=>s+(Number(rr.NegligibleAmt)||0),0);
  const byLoc = {};
  rows.forEach(rr=>{
    const loc = rr.Location||'—';
    byLoc[loc] = byLoc[loc] || {total:0, over:0, overAmt:0, under:0, underAmt:0};
    byLoc[loc].total++;
    if(rr.Status==='over'){ byLoc[loc].over++; byLoc[loc].overAmt += Number(rr.OverchargeAmt)||0; }
    if(rr.Status==='under'){ byLoc[loc].under++; byLoc[loc].underAmt += Number(rr.UnderchargeAmt)||0; }
  });
  let sr = 3;
  ws2.getCell(`A${sr}`).value='Total lines checked'; ws2.getCell(`B${sr}`).value=rows.length; sr++;
  ws2.getCell(`A${sr}`).value='Overcharge instances (≥1% of rate)'; ws2.getCell(`B${sr}`).value=overCount; sr++;
  ws2.getCell(`A${sr}`).value='Total overcharge value (₹)'; ws2.getCell(`B${sr}`).value=Number(overAmt2.toFixed(2)); sr++;
  ws2.getCell(`A${sr}`).value='Undercharge instances'; ws2.getCell(`B${sr}`).value=underCount; sr++;
  ws2.getCell(`A${sr}`).value='Total undercharge value (₹)'; ws2.getCell(`B${sr}`).value=Number(underAmt2.toFixed(2)); sr++;
  ws2.getCell(`A${sr}`).value='Negligible instances (<1% of rate)'; ws2.getCell(`B${sr}`).value=negCount; sr++;
  ws2.getCell(`A${sr}`).value='Total negligible value (₹, excluded from overcharge)'; ws2.getCell(`B${sr}`).value=Number(negAmt.toFixed(2)); sr+=2;
  ws2.getCell(`A${sr}`).value='Location'; ws2.getCell(`B${sr}`).value='Overcharge lines'; ws2.getCell(`C${sr}`).value='Undercharge lines';
  ws2.getRow(sr).eachCell(c=>{ c.font={bold:true,color:{argb:WHITE}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; });
  sr++;
  Object.entries(byLoc).forEach(([loc,v])=>{ ws2.getCell(`A${sr}`).value=loc; ws2.getCell(`B${sr}`).value=v.over; ws2.getCell(`C${sr}`).value=v.under; sr++; });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filenamePrefix}_${istDateDMY()}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* Bulk-downloads every bill photo currently on screen as one ZIP, built right in the browser
   straight from the public Supabase Storage links (no server round-trip, no Drive). Folder per DB,
   file name = DBCode_DBName_Verifier_CollectedBy_BillDate_uid — same as before. */
async function exportBillPhotosZip(rows, btn){
  const seen = {}; const bills = [];
  rows.forEach(r=>{ if(r.BillCopyURL && !seen[r.BillUID]){ seen[r.BillUID]=1; bills.push(r); } });
  if(!bills.length){ toast('No bill photos in the current filtered view', 'err'); return; }
  const origLabel = btn.innerHTML;
  btn.disabled = true;
  try{
    if(typeof JSZip === 'undefined'){
      await new Promise((ok,bad)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload=ok; sc.onerror=()=>bad(new Error('Could not load the ZIP library')); document.head.appendChild(sc); });
    }
    const zip = new JSZip();
    const clean = s => String(s||'').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'_').trim() || 'unknown';
    let done = 0, ok = 0, next = 0;
    const worker = async ()=>{
      while(next < bills.length){
        const r = bills[next++];
        try{
          let blob, ext;
          const fid = photoFileId(r.BillCopyURL);
          const sbCopy = /\/storage\/v1\/object\/public\//.test(r.BillCopyDownloadURL||'') ? r.BillCopyDownloadURL : '';
          if(sbCopy){
            try{
              const resp0 = await fetch(sbCopy);
              if(resp0.ok){ blob = await resp0.blob(); ext = /pdf/i.test(blob.type) || /\.pdf($|\?)/i.test(sbCopy) ? 'pdf' : 'jpg'; }
            }catch(e){ blob = null; }
          }
          if(blob){ /* got it from the Supabase safety copy */ }
          else if(fid && photoAppUrl()){            // Drive photo -> fetched as JSON (base64) through the photo script
            const resp = await fetch(`${photoBaseFor(r.BillCopyURL)}?action=photojson&fileId=${fid}`);
            const j = await resp.json();
            if(!j.ok) throw new Error(j.error||'photo');
            blob = supaB64ToBlob(j.base64, j.mime); ext = /pdf/i.test(j.mime) ? 'pdf' : 'jpg';
          } else {
            const resp = await fetch(r.BillCopyURL);
            if(!resp.ok) throw new Error('HTTP '+resp.status);
            blob = await resp.blob();
            ext = /pdf/i.test(blob.type) || /\.pdf($|\?)/i.test(r.BillCopyURL) ? 'pdf' : 'jpg';
          }
          const folder = clean(`${r.DBCode}_${r.DBName}`);
          const base = clean(`${r.DBCode}_${r.DBName}_${r.VerifiedBy||'Unverified'}_${r.CollectedBy||'Unknown'}_${r.BillDate||''}_${String(r.BillUID).replace('bill_','')}`);
          zip.file(`${folder}/${base}.${ext}`, blob);
          ok++;
        }catch(e){ /* skip unreadable file */ }
        done++;
        btn.innerHTML = `<span class="loader"></span> Packing ${done}/${bills.length}…`;
      }
    };
    await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
    if(!ok){ toast('Found bills, but none of their photo files could be downloaded', 'err'); return; }
    const out = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url; a.download = `Bill_Photos_${istDateDMY()}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast(`Downloaded ${ok} bill photo${ok===1?'':'s'}, organised by DB`, 'ok');
  } catch(e){
    toast('Could not build the photo ZIP — ' + (e.message||'try again'), 'err');
  } finally {
    btn.disabled = false; btn.innerHTML = origLabel;
  }
}

function wireQuickRange(prefix, onPick){

  if(st.product) f = f.filter(r=>(r.ProductName||'—')===st.product);
  if(st.clean){

    f = f.filter(r=>!dirty.has(r.BillUID));

function wrapCanvasText(ctx, text, maxWidth){
  const words = String(text).split(' '); const lines = []; let cur = '';
  for(const w of words){ const test = cur ? cur+' '+w : w; if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; } else cur = test; }
  if(cur) lines.push(cur); return lines;
}
function downscaleImage(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = ev.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}
function stampBillPhotoFooter(dataUrl, footerLines){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const W = img.width, PAD = 14, LINE_H = 20, TITLE_SIZE = 13, BODY_SIZE = 12;
      const cm = document.createElement('canvas').getContext('2d');
      let wrapped = [];
      footerLines.forEach((line, i)=>{
        cm.font = (i===0 ? `700 ${TITLE_SIZE}px Arial` : `400 ${BODY_SIZE}px Arial`);
        wrapCanvasText(cm, line, W-PAD*2).forEach(l=>wrapped.push({text:l, bold:i===0}));
      });
      const footerH = PAD*2 + wrapped.length*LINE_H;
      const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = img.height + footerH;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
      ctx.fillStyle = 'rgba(10,10,15,0.88)'; ctx.fillRect(0, img.height, W, footerH);
      ctx.textBaseline = 'top'; let y = img.height + PAD;
      wrapped.forEach(l=>{ ctx.font = l.bold ? `700 ${TITLE_SIZE}px Arial` : `400 ${BODY_SIZE}px Arial`; ctx.fillStyle = '#FFFFFF'; ctx.fillText(l.text, PAD, y); y += LINE_H; });
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject; img.src = dataUrl;
  });
}
function fileSafe(s, max){ return String(s||'').trim().replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,max||30) || 'NA'; }
// One bill = all its product lines. Same verdict rule as Rate Ledger's billInvoicingLabel.
function msBillVerdict(lines){
  let over=0, under=0;
  lines.forEach(r=>{ over += Number(r.OverchargeAmt)||0; under += Number(r.UnderchargeAmt)||0; });
  if(over>0 && over>=under) return { label:'Overinvoicing', amt:over };
  if(under>0) return { label:'Underinvoicing', amt:under };
  return { label:'Correct-Invoicing', amt:0 };
}
function msFileName(b, label, ext){
  return `${label}_Sub-${b.sub}_${fileSafe(b.verifier,24)}_Coll-${fileSafe(b.collected,24)}_Bill-${b.billDate}_${String(b.uid||'').replace('bill_','').slice(-6)}.${ext}`;
}
function msFooterLines(b, label, amt, fileName){
  const L = [];
  L.push(`${label.toUpperCase()}${amt>0 ? ' — ₹'+fmtMoney(amt) : ''}`);
  L.push(`${b.dbName||'—'} (${b.dbCode||'—'})  —  ${b.retailer||'—'}`);
  L.push(`Submission Date: ${b.sub||'—'}    |    Bill Date: ${b.billDate||'—'}`);
  L.push(`Auditor/Verifier: ${b.verifier||'—'}    |    Collected By: ${b.collected||'—'}`);
  const ov = b.lines.filter(r=>r.Status==='over' && Number(r.OverchargeAmt)>0);
  if(ov.length) L.push('⚠ Overcharge — ' + ov.map(r=>`${r.ProductName} +₹${fmtMoney(Number(r.OverchargeAmt))}`).join(';  '));
  L.push(`File: ${fileName}`);
  return L;
}
/* Bills (unique BillUID) from raw rows, with whether a copy exists. */
function msBills(rows){
  const m = new Map();
  rows.forEach(r=>{
    if(!r.BillUID) return;
    let b = m.get(r.BillUID);
    if(!b){
      b = { uid:r.BillUID, dbName:r.DBName||'', dbCode:r.DBCode||'', retailer:r.Retailer||'', billNo:r.BillNo||'', billDate:r.BillDate||'',
            sub:r.SubmissionDate||'', collected:String(r.CollectedBy||'').toUpperCase(), verifier:String(r.VerifiedBy||'').toUpperCase(),
            auditor:r.AuditorName||'', auditorCode:r.AuditorCode||'', hasCopy:false, lines:[] };
      m.set(r.BillUID, b);
    }
    b.lines.push(r);
    if(r.BillCopyURL) b.hasCopy = true;
  });
  const out = [...m.values()];
  out.forEach(b=>{ const v = msBillVerdict(b.lines); b.verdict = v.label; b.amt = v.amt; });
  return out;
}

  const m = new Map();
  bills.forEach(b=>{
    const name = (group==='verifier' ? b.verifier : b.auditor) || '— (not set)';
    let g = m.get(name); if(!g){ g = { name, total:0, missing:0 }; m.set(name, g); }
    g.total++; if(!b.hasCopy) g.missing++;
  });
  return [...m.values()].sort((a,b)=>b.missing-a.missing || a.name.localeCompare(b.name));
}

async function msAttachFlow(bill, file){
  const s = getSession();
  const isImage = /^image\//.test(file.type) || /\.(jpe?g|png|webp|heic)$/i.test(file.name);
  const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  if(!isImage && !isPdf){ toast('Only a photo or a PDF can be attached', 'err'); return; }
  toast('Preparing the photo…');
  const v = msBillVerdict(bill.lines);
  const ext = isImage ? 'jpg' : 'pdf';
  const savedName = msFileName(bill, v.label, ext);
  const folderName = (bill.verifier || String(s.name||'')).toUpperCase() || 'UNASSIGNED';
  let dataUrl, mime;
  try{
    if(isImage){
      const base = await downscaleImage(file, 1100, 0.78);
      try{ dataUrl = await stampBillPhotoFooter(base, msFooterLines(bill, v.label, v.amt, savedName)); }catch(e){ dataUrl = base; }
      mime = 'image/jpeg';
    } else {
      dataUrl = await new Promise((res, rej)=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.onerror=rej; r.readAsDataURL(file); });
      mime = 'application/pdf';
    }
  }catch(e){ toast('Could not read this file', 'err'); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,15,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.innerHTML = `<div class="card" style="background:var(--panel);border-radius:12px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:18px;">
    <h3 style="margin-bottom:8px;">Attach this bill copy?</h3>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">${esc(bill.dbName)} — ${esc(bill.retailer)} | Bill ${esc(bill.billNo)} | ${esc(bill.billDate)}</div>
    ${isImage ? `<img src="${dataUrl}" style="width:100%;border-radius:8px;border:1px solid var(--edge);">` : `<div class="empty-state">📄 ${esc(file.name)}</div>`}
    <div style="font-size:12px;margin:10px 0;word-break:break-all;"><b>File:</b> ${esc(savedName)}<br><b>Folder:</b> ${esc(folderName)}</div>
    <div style="font-size:12px;background:#fff4e5;border:1px solid #f0c27b;border-radius:8px;padding:8px 10px;margin-bottom:12px;">⚠ Once attached, this copy <b>cannot be changed or replaced</b>. Please make sure this is the correct bill.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" id="msCancel">Cancel</button><button class="btn accent" id="msConfirm">✔ Confirm & Attach</button></div></div>`;
  document.body.appendChild(ov);
  $('#msCancel').onclick = ()=>ov.remove();
  $('#msConfirm').onclick = async ()=>{
    const btn = $('#msConfirm'); btn.disabled = true; btn.textContent = 'Uploading…'; $('#msCancel').disabled = true;
    let res;
    try{ res = await supaUploadBillCopy(s, bill.uid, savedName, mime, dataUrl.split(',')[1]||'', folderName); }
    catch(e){ res = { ok:false, error:String(e.message||e) }; }
    if(!res.ok){ toast('Could not attach: ' + (res.error||'error'), 'err'); btn.disabled=false; btn.textContent='✔ Retry'; $('#msCancel').disabled=false; return; }
    ov.remove();
    if(res.alreadyAttached){ toast('This bill already had a copy attached — nothing was changed.', 'err'); }
    else toast('Bill copy attached ✔', 'ok');
    bill.lines.forEach(r=>{ if(!res.alreadyAttached){ r.BillCopyURL = res.url; r.BillCopyDownloadURL = res.dl || res.url; } });
    if(s.role==='Admin' && !res.alreadyAttached){ try{ await asPersist(bill.lines.filter(r=>r._k)); }catch(e){} }
    msClearCaches();
    if(res.alreadyAttached){ MS.rows = null; if(ACTIVE_TAB==='missing') renderMissing(true); else renderShell(); }
    else msRepaintCurrent();
  };
}

/* "📎 Attach" button shown in the Bill Copy column of every table where a bill has no copy yet. */
document.addEventListener('click', ev=>{
  const btn = ev.target.closest && ev.target.closest('[data-attach-uid]'); if(!btn) return;
  const uid = btn.dataset.attachUid;
  const src = [window.__mvAllRows, window.__myAllRows, MS.rows, (getSession()||{}).role==='Admin' ? AdminStore.rows : null].filter(Boolean);
  let bill = null;
  for(const arr of src){ const b = msBills(arr.filter(r=>r.BillUID===uid))[0]; if(b){ bill = b; break; } }
  if(!bill){ toast('This bill was not found in the list — please Sync and try again', 'err'); return; }
  if(bill.hasCopy){ toast('This bill already has a copy attached', 'err'); return; }
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*,application/pdf'; inp.style.display='none';
  inp.addEventListener('change', ()=>{ const f = inp.files && inp.files[0]; inp.remove(); if(f) msAttachFlow(bill, f); });
  document.body.appendChild(inp); inp.click();
});

   log first (who / when / why / full row), and a deleted line can never come back through a queued retry. */
function sdOpenDeleteSelected(shownRows){

// lines = the exact lines to delete (rows from the local store). A bill whose lines are ALL included is removed completely
// (its bill copy is deleted from Drive + Supabase + the Sheet archive too).
function sdOpenDelete(lines){
  const s = getSession();
  const byBill = new Map();
  lines.forEach(r=>{ if(!byBill.has(r.BillUID)) byBill.set(r.BillUID, []); byBill.get(r.BillUID).push(r); });
  const items = []; let fullBills = 0, withPhoto = 0;
  byBill.forEach((ls, uid)=>{
    const all = AdminStore.rows.filter(x=>x.BillUID===uid);
    const full = all.every(x=>ls.includes(x));
    if(full){ fullBills++; if(all.some(x=>x.BillCopyURL)) withPhoto++; }
    items.push({ billUid: uid, productCodes: full ? null : ls.map(x=>x.ProductCode||'') });
  });
  const first = lines[0];
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,15,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;';
  const people = [...new Set(lines.map(r=>r.AuditorName).filter(Boolean))];
  ov.innerHTML = `<div class="card" style="background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px;">
    <h3 style="margin-bottom:8px;color:var(--danger);">Delete ${fmtInt(lines.length)} line(s) from ${fmtInt(byBill.size)} bill(s)?</h3>
    <div style="font-size:13px;margin-bottom:8px;">${byBill.size===1 ? `${esc(first.DBName||'')} — ${esc(first.Retailer||'')} | Bill ${esc(first.BillNo||'')} | ${esc(first.BillDate||'')}<br>` : ''}Auditor(s): <b>${esc(people.slice(0,4).join(', '))}${people.length>4?' …':''}</b></div>
    <div style="font-size:12px;max-height:150px;overflow:auto;border:1px solid var(--edge);border-radius:8px;padding:8px;margin-bottom:10px;">${lines.slice(0,60).map(x=>`• ${esc(x.RetailerName||x.Retailer||'')} · Bill ${esc(x.BillNo||'')} · ${esc(x.ProductName||x.ProductCode||'')} — ${esc(statusLabelFor(x.Status))}`).join('<br>')}${lines.length>60?`<br>… and ${fmtInt(lines.length-60)} more`:''}</div>
    <div class="field"><label>Reason for deletion (required)</label><input type="text" id="sdReason" placeholder="e.g. wrong entries by auditor"></div>
    <div style="font-size:12px;background:#fdecea;border:1px solid #e6a39b;border-radius:8px;padding:8px 10px;margin:10px 0;">⚠ These lines disappear from every report. ${fullBills ? `<b>${fmtInt(fullBills)} bill(s) are removed completely${withPhoto?` — ${fmtInt(withPhoto)} bill copy photo(s) will be deleted from Google Drive, Supabase Storage and the Sheet archive too`:''}.</b>` : ''} A record of the deletion is kept in the Deleted Log.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" id="sdCancel">Cancel</button><button class="btn danger" id="sdConfirm">🗑 Delete</button></div></div>`;
  document.body.appendChild(ov);
  $('#sdCancel').onclick = ()=>ov.remove();
  $('#sdConfirm').onclick = async ()=>{
    const reason = $('#sdReason').value.trim();
    if(reason.length<3){ toast('Please enter a reason', 'err'); return; }
    const btn = $('#sdConfirm'); btn.disabled = true; btn.textContent = 'Deleting…';
    let res;
    try{ res = await backendPost({ action:'deletemany', code:s.code, pin:s.pin, items, reason }); }
    catch(e){ res = { ok:false, error:String(e.message||e) }; }
    if(!res.ok){ toast('Not deleted: '+(res.error||'error'), 'err'); btn.disabled=false; btn.textContent='🗑 Delete'; return; }
    const keys = lines.map(x=>x._k);
    await asRemoveKeys(keys);
    { const gone = new Set(keys); if(Array.isArray(window.__subRows)) window.__subRows = window.__subRows.filter(x=>!gone.has(x._k)); keys.forEach(k=>window.__subSel && window.__subSel.delete(k)); }
    ov.remove(); toast(`Deleted ${fmtInt(res.deleted)} line(s)`, 'ok');
    msClearCaches();
    if(ACTIVE_TAB==='submissions' && typeof applySubmissionFilters==='function'){ applySubmissionFilters(); } else renderShell();
    sdPurgeNow(true);
  };
}
/* Asks the Google script to remove the photos (Drive + Supabase Storage) and archive-sheet rows of deleted bills. */
async function sdPurgeNow(quiet){
  const s = getSession(); const url = photoAppUrl();
  if(!url){ return { ok:false, error:'Google script URL not set' }; }
  if(!quiet) toast('Removing photos and archive rows…');
  try{
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'purgeDeleted', code:s.code, pin:s.pin }) });
    const j = await res.json();
    if(!j.ok){ toast('Photo clean-up will finish tonight automatically ('+(j.error||'script not updated')+')', 'err'); return j; }
    toast(`Clean-up done — photos removed: ${j.photosRemoved}, archive rows removed: ${j.archiveRowsRemoved}${j.pending?` · ${j.pending} still pending (runs tonight)`:''}`, 'ok');
    return j;
  }catch(e){ toast('Photo clean-up will finish tonight automatically (could not reach the Google script)', 'err'); return { ok:false, error:String(e.message||e) }; }
}
async function renderDeletedLog(){
  const body = $('#tabBody'); const s = getSession();
  body.innerHTML = `<div id="dlBody">${ultimateLoaderHtml('dlLoader')}</div>`;
  const stop = startUltimateLoader('dlLoader');
  const res = await backendGet({ action:'deletedlist', code:s.code, pin:s.pin });
  stop();
  if(ACTIVE_TAB!=='deleted') return;
  if(!res.ok){ $('#dlBody').innerHTML = `<div class="empty-state">${esc(res.error||'Could not load.')}</div>`; return; }
  const rows = res.rows||[];
  $('#dlBody').innerHTML = rows.length ? `<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:13px;">Last ${fmtInt(rows.length)} deleted line(s) — newest first. Deleted data is kept here for the record.${res.pending?` <button class="btn small accent" id="dlPurge" style="margin-left:auto;">Run photo / archive clean-up now (${fmtInt(res.pending)} pending)</button>`:''}</div>
    <div class="table-wrap"><table><thead><tr>${['Deleted at','Deleted by','Reason','Auditor','Verifier','Distributor','Retailer','Bill No','Bill Date','Product','Status','Photo','Archive row'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>{ const d=r.data||{}; return `<tr><td>${esc(formatISTDateTime(r.deletedAt))}</td><td>${esc(r.deletedBy)}</td><td>${esc(r.reason)}</td><td>${esc(d.AuditorName||r.auditorCode||'')}</td><td>${esc(r.verifiedBy||'')}</td><td>${esc(d.DBName||'')}</td><td>${esc(d.Retailer||'')}</td><td>${esc(d.BillNo||'')}</td><td>${esc(d.BillDate||'')}</td><td>${esc(d.ProductName||r.productCode||'')}</td><td>${statusBadge(d.Status)}</td><td>${r.hadPhoto ? (r.photoPending ? '<span class="small-muted">⏳ pending</span>' : '✔ removed') : '—'}</td><td>${r.archivePending ? '<span class="small-muted">⏳ pending</span>' : '✔'}</td></tr>`; }).join('')}</tbody></table></div>`
    : '<div class="empty-state">Nothing has been deleted yet.</div>';
  const pb = $('#dlPurge'); if(pb) pb.onclick = async ()=>{ pb.disabled = true; await sdPurgeNow(); renderDeletedLog(); };
}

/* ==================== BOOT ==================== */
function boot(){
  const s = getSession();
  if(!s){ renderLogin(); return; }
  renderShell();
  refreshSessionRole(s);
}
// A login saved earlier (before a role change / new feature) is re-checked with the server once per page load,
// so e.g. a user promoted to Super Admin gets the new tabs without having to log out and in again.
async function refreshSessionRole(s){
  try{
    const res = await backendPost({ action:'login', code:s.code, pin:s.pin });
    if(!res || !res.ok) return;
    const cur = getSession(); if(!cur || cur.code!==s.code) return;
    const changed = (!!res.superAdmin !== !!cur.superAdmin) || res.role!==cur.role || res.name!==cur.name;
    if(changed){ setSession(Object.assign({}, cur, { role:res.role, name:res.name, designation:res.designation, superAdmin:!!res.superAdmin })); renderShell(); }
  }catch(e){}
}
document.addEventListener('DOMContentLoaded', boot);
</script>
