<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Ledger — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --void:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F5F7; --panel-3:#E7E9EC;
  --edge:rgba(10,10,15,0.14); --edge-soft:rgba(10,10,15,0.07);
  --ink:#12131A; --ink-soft:#53555C; --ink-faint:#8B8D93;
  --accent:#101114; --accent-soft:rgba(16,17,20,0.08);
  --danger:#D6234B; --danger-soft:rgba(214,35,75,0.12);
  --success:#0FA86B; --success-soft:rgba(15,168,107,0.12);
  --warn:#B9791A; --warn-soft:rgba(185,121,26,0.14);
  --negligible:#2A5FD9; --negligible-soft:rgba(42,95,217,0.10);
  --radius:8px; --radius-sm:4px;
  --font-display:'Space Grotesk','Segoe UI',sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --shadow-card: 0 0 0 1px rgba(10,10,15,0.08), 0 10px 26px rgba(10,10,15,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body);color:var(--ink);background:var(--panel-2);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
#app{max-width:1320px;margin:0 auto;padding:0 24px 60px;}
.topbar{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;background:var(--panel-3);border:1px solid var(--edge);}
.brand-text h1{font-size:20px;}
.version-badge{display:inline-block;vertical-align:middle;font-size:10.5px;font-weight:700;font-family:var(--font-mono);background:var(--panel-2);color:var(--ink-soft);border:1px solid var(--edge);border-radius:5px;padding:2px 7px;margin-left:6px;letter-spacing:.02em;}
.brand-text p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--edge);border-radius:100px;background:var(--panel);font-size:11.5px;color:var(--ink-soft);}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.tabstrip{display:flex;gap:4px;border-bottom:1px solid var(--edge);margin-bottom:22px;flex-wrap:wrap;}
.tab-btn{font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-soft);background:transparent;border:none;padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer;}
.tab-btn.active{color:var(--ink);background:var(--panel-3);}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.stat-card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:16px 18px;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;}
.stat-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;}
.stat-note{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.field{margin-bottom:14px;}
.bill-copy-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
.bill-copy-link:hover{text-decoration:underline;}
.verifier-code-wrap{position:relative;}
.verifier-code-wrap input{width:100%;padding-right:26px;}
.eye-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;font-size:12px;padding:2px 4px;line-height:1;color:var(--ink-faint);}
.eye-toggle:hover{color:var(--ink-soft);}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font-size:13.5px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.btn{padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid var(--edge);background:var(--panel-3);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--accent);}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent;font-weight:700;}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent;}
.btn.small{padding:6px 11px;font-size:12px;}
.btn.wide{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:var(--radius);}
tr.auditor-group-start td{border-top:2px solid var(--ink);}
thead th{text-align:left;padding:9px 11px;background:var(--panel-3);color:var(--ink-soft);font-weight:600;font-size:10.8px;text-transform:uppercase;white-space:nowrap;}
tbody td{padding:8px 11px;border-bottom:1px solid var(--edge-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
td.num{font-family:var(--font-mono);text-align:right;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:10.8px;font-weight:600;}
.badge.over{background:var(--danger-soft);color:var(--danger);}
.badge.negligible{background:var(--negligible-soft);color:var(--negligible);}
.badge.under{background:var(--warn-soft);color:var(--warn);}
.badge.match{background:var(--success-soft);color:var(--success);}
.badge.active{background:var(--success-soft);color:var(--success);}
.badge.inactive{background:var(--danger-soft);color:var(--danger);}
.divider{height:1px;background:var(--edge);margin:20px 0;}
.small-muted{font-size:11.5px;color:var(--ink-faint);}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin:0 0 12px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.ultimate-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;}
.ultimate-loader svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.06));}
.quick-range{display:flex;gap:6px;flex-wrap:wrap;}
.quick-range button{background:var(--panel-2);border:1px solid var(--edge);border-radius:100px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.quick-range button:hover{background:var(--edge);}
.quick-range button.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
.stale-banner{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.stale-banner .spin{width:11px;height:11px;border:2px solid var(--edge);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.micro-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;}
.micro-bar-row:hover{background:var(--panel-2);}
.micro-bar-row .mb-label{width:160px;flex:none;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.micro-bar-row .mb-track{flex:1;height:16px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.micro-bar-row .mb-fill{height:100%;border-radius:4px;}
.micro-bar-row .mb-count{width:80px;flex:none;text-align:right;font-size:12px;font-weight:700;font-family:var(--font-mono);}
.micro-bar-row.active{outline:2px solid var(--ink);border-radius:6px;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
.chart-card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);padding:18px 20px;}
.chart-card h3{font-size:13px;margin-bottom:14px;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.filterbar .field{margin-bottom:0;min-width:150px;}
.loader{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ---------------- Backend config ----------------
   Same Web App URL as your Rate Ledger app — paste it here too. */
// Bump this on every delivered file so the running app itself shows which
// build is loaded — matches the same badge pattern in Rate Ledger, so a
// screenshot of either app always confirms which version is actually open.
const APP_VERSION = 'v4';
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw4a5Db2cjkID6zaUasqYLzTQc0269vGo96eaQHAkT04umKq7B0FLjmup1C6_UrXz8TXQ/exec';

/* Shared session with the Rate Ledger app: if this Dashboard is opened from
   the same browser/origin as Rate Ledger, a user already logged in there
   won't need to log in again here (and vice versa). */
const SESSION_KEY = 'rateLedger_session';
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } }
function setSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function backendPost(payload){
  const res = await fetch(WEB_APP_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  return res.json();
}
async function backendGet(params){
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${WEB_APP_URL}?${qs}`);
  return res.json();
}
/* ---------------- Local cache: instant repeat-opens ----------------
   First open of a tab always hits the network. After that, the result is
   cached in localStorage keyed by the exact query — reopening the SAME
   tab/filter combo renders instantly from cache while a fresh copy loads
   quietly in the background and silently updates the screen if anything
   changed. This is what makes the Dashboard feel fast on every visit
   after the first, without ever showing stale data for more than a beat. */
const DASH_CACHE_TTL_MS = 6*60*60*1000; // background-refresh after 6h regardless
function cacheKeyFor(params){ return 'dashCache_' + JSON.stringify(params, Object.keys(params).sort()); }
function readCache(params){
  try{
    const raw = localStorage.getItem(cacheKeyFor(params));
    if(!raw) return null;
    const {t, data} = JSON.parse(raw);
    return {data, ageMs: Date.now()-t};
  }catch(e){ return null; }
}
function writeCache(params, data){
  try{ localStorage.setItem(cacheKeyFor(params), JSON.stringify({t:Date.now(), data})); }catch(e){}
}
// onFirst: called immediately with cached data if any (fast paint).
// onFresh: called once the network reply lands (always — even if same tab
// has since been left, caller should re-check it's still the active view).
async function cachedBackendGet(params, onFirst, onFresh){
  const cached = readCache(params);
  if(cached) onFirst(cached.data, cached.ageMs);
  const fresh = await backendGet(params);
  if(fresh.ok) writeCache(params, fresh);
  onFresh(fresh, !!cached);
}
/* An "ultimate" percentage loader for the first-ever (uncached) load of a
   screen — smoothly animates 0→90% while the request is in flight (we don't
   get real byte progress from a JSON reply), then snaps to 100% and fades
   when data actually arrives. Returns a stop() to call once data is in. */
function ultimateLoaderHtml(id){
  return `<div class="ultimate-loader" id="${id}">
    <svg viewBox="0 0 120 120" width="88" height="88">
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--edge)" stroke-width="8"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"
        id="${id}_ring" stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52}"
        transform="rotate(-90 60 60)"/>
      <text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" id="${id}_pct">0%</text>
    </svg>
    <div class="small-muted" style="margin-top:10px;" id="${id}_label">Fetching your data…</div>
  </div>`;
}
function startUltimateLoader(id){
  const ring = document.getElementById(id+'_ring');
  const pctEl = document.getElementById(id+'_pct');
  if(!ring||!pctEl) return ()=>{};
  const C = 2*Math.PI*52;
  let pct = 0, stopped = false;
  const tick = ()=>{
    if(stopped) return;
    pct = Math.min(90, pct + (90-pct)*0.06 + 0.4);
    ring.setAttribute('stroke-dashoffset', C*(1-pct/100));
    pctEl.textContent = Math.round(pct)+'%';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return (finalLabel)=>{
    stopped = true;
    ring.setAttribute('stroke-dashoffset', 0);
    pctEl.textContent = '100%';
    const labelEl = document.getElementById(id+'_label');
    if(labelEl && finalLabel) labelEl.textContent = finalLabel;
  };
}
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN'); }
function toast(msg, type){
  const wrap = $('#toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'+(type?' '+type:'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function currentMonth(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function statusBadge(status){
  if(status==='over') return '<span class="badge over">Overcharge</span>';
  if(status==='negligible') return '<span class="badge negligible">Overcharge – Negligible</span>';
  if(status==='under') return '<span class="badge under">Undercharge</span>';
  if(status==='match') return '<span class="badge match">Match</span>';
  return '<span class="small-muted">—</span>';
}

/* ==================== LOGIN ==================== */
function renderLogin(errorMsg){
  $('#app').innerHTML = `
    <div style="min-height:90vh;display:flex;align-items:center;justify-content:center;">
      <div class="card" style="max-width:380px;width:100%;padding:32px 28px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div class="brand-mark">RL</div>
          <div><h1 style="font-size:19px;">Rate Ledger</h1><p class="small-muted" style="margin-top:2px;">Dashboard sign-in</p></div>
        </div>
        <div class="field"><label>User Code</label><input type="text" id="loginCode" style="text-transform:uppercase;"></div>
        <div class="field"><label>PIN</label>
          <div class="verifier-code-wrap" style="flex:none;">
            <input type="password" id="loginPin" style="width:100%;">
            <button type="button" class="eye-toggle" id="loginPinEye" tabindex="-1" title="Show/hide PIN">👁</button>
          </div>
        </div>
        ${errorMsg ? `<p style="color:var(--danger);font-size:12.5px;margin:-6px 0 12px;">${esc(errorMsg)}</p>` : ''}
        <button class="btn accent wide" id="loginBtn">Log In</button>
      </div>
    </div>
  `;
  const doLogin = async ()=>{
    const code = $('#loginCode').value.trim();
    const pin = $('#loginPin').value;
    if(!code || !pin){ renderLogin('Enter both User Code and PIN.'); return; }
    const btn = $('#loginBtn'); btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Signing in…';
    try{
      const res = await backendPost({ action:'login', code, pin });
      if(res.ok){ setSession({code:res.code, pin, name:res.name, role:res.role, designation:res.designation}); boot(); }
      else renderLogin(res.error || 'Login failed.');
    }catch(e){ renderLogin('Could not reach the server — check your connection.'); }
  };
  $('#loginBtn').addEventListener('click', doLogin);
  $('#loginPin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  const loginEye = $('#loginPinEye');
  if(loginEye) loginEye.addEventListener('click', ()=>{
    const pinEl = $('#loginPin');
    const showing = pinEl.type==='text';
    pinEl.type = showing ? 'password' : 'text';
    loginEye.textContent = showing ? '👁' : '🙈';
  });
  $('#loginCode').focus();
}
function logout(){ clearSession(); boot(); }

/* ==================== SHELL ==================== */
let ACTIVE_TAB = null;
function renderShell(){
  const s = getSession();
  const tabs = s.role==='Admin'
    ? [{id:'analytics',label:'Analytics'},{id:'submissions',label:'All Submissions'},{id:'users',label:'Manage Users'}]
    : s.role==='Verifier'
    ? [{id:'myverified',label:'Bills I Verified'}]
    : [{id:'mydata',label:'My Data'}];
  if(!ACTIVE_TAB || !tabs.find(t=>t.id===ACTIVE_TAB)) ACTIVE_TAB = tabs[0].id;
  $('#app').innerHTML = `
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">RL</div>
        <div class="brand-text"><h1>Rate Ledger <span class="version-badge" title="Build version — check this matches what support/chat referenced">${APP_VERSION}</span></h1><p>Dashboard</p></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="status-chip"><span class="status-dot"></span>${esc(s.name)} (${esc(s.role)})</div>
        <button class="btn small" id="logoutBtn">Log Out</button>
      </div>
    </header>
    <nav class="tabstrip">${tabs.map(t=>`<button class="tab-btn ${ACTIVE_TAB===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}</nav>
    <main id="tabBody"></main>
  `;
  $('#logoutBtn').addEventListener('click', logout);
  $all('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ ACTIVE_TAB=b.dataset.tab; renderShell(); }));
  const renderers = { analytics:renderAnalytics, submissions:renderSubmissions, users:renderUsers, mydata:renderMyData, myverified:renderMyVerified };
  (renderers[ACTIVE_TAB]||(()=>{}))();
}

/* ==================== Shared date-range filter bar ====================
   Used by Analytics, All Submissions, My Data and Bills I Verified alike —
   filters by the BILL's own date (not when it was submitted), inclusive
   on both ends. Leaving both blank means "all time". */
function dateRangeBarHtml(idPrefix, fromVal, toVal){
  return `
    <div class="filterbar">
      <div class="field"><label>From</label><input type="date" id="${idPrefix}From" value="${fromVal||''}"></div>
      <div class="field"><label>To</label><input type="date" id="${idPrefix}To" value="${toVal||''}"></div>
      <button class="btn" id="${idPrefix}Clear">Clear (All Time)</button>
    </div>
  `;
}
function wireDateRangeBar(idPrefix, onChange){
  $(`#${idPrefix}From`).addEventListener('change', onChange);
  $(`#${idPrefix}To`).addEventListener('change', onChange);
  $(`#${idPrefix}Clear`).addEventListener('click', ()=>{
    $(`#${idPrefix}From`).value=''; $(`#${idPrefix}To`).value='';
    onChange();
  });
}

/* ==================== ANALYTICS (Admin) ==================== */
let chartInstances = [];
function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances = []; }

async function renderAnalytics(){
  const body = $('#tabBody');
  body.innerHTML = `
    ${dateRangeBarHtml('an', window.__anFrom, window.__anTo)}
    <div id="anContent">${ultimateLoaderHtml('anLoader')}</div>
  `;
  wireDateRangeBar('an', ()=>{
    window.__anFrom = $('#anFrom').value; window.__anTo = $('#anTo').value;
    renderAnalytics();
  });
  const s = getSession();
  const params = { action:'alldata', code:s.code, pin:s.pin, fromDate: window.__anFrom||'', toDate: window.__anTo||'' };
  const stop = startUltimateLoader('anLoader');
  let painted = false;
  await cachedBackendGet(params,
    (data)=>{
      painted = true; stop('Loaded from local cache');
      $('#anContent').innerHTML = `<div class="stale-banner"><span class="spin"></span> Refreshing in the background…</div><div id="anInner"></div>`;
      renderAnalyticsContent(data.rows||[]);
    },
    (fresh)=>{
      if(document.querySelector('.tab-btn.active')?.dataset.tab !== 'analytics') return;
      if(!fresh.ok){ if(!painted) $('#anContent').innerHTML = `<div class="empty-state">${esc(fresh.error||'Could not load data.')}</div>`; return; }
      stop();
      $('#anContent').innerHTML = `<div id="anInner"></div>`;
      renderAnalyticsContent(fresh.rows);
    }
  );
}

function renderAnalyticsContent(rows){
  const content = $('#anInner') || $('#anContent');
  destroyCharts();
  if(!rows.length){ content.innerHTML = '<div class="empty-state">No submissions in this period yet.</div>'; return; }

  const over = rows.filter(r=>r.Status==='over');
  const neg = rows.filter(r=>r.Status==='negligible');
  const under = rows.filter(r=>r.Status==='under');
  const match = rows.filter(r=>r.Status==='match');
  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0);
  const underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);

  content.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Lines Submitted</div><div class="stat-value">${fmtInt(rows.length)}</div></div>
      <div class="stat-card"><div class="stat-label">Overcharge · ₹${fmtMoney(overAmt)}</div><div class="stat-value" style="color:var(--danger);">${fmtInt(over.length)}</div></div>
      <div class="stat-card"><div class="stat-label">Undercharge · ₹${fmtMoney(underAmt)}</div><div class="stat-value" style="color:var(--warn);">${fmtInt(under.length)}</div></div>
      <div class="stat-card"><div class="stat-label">Negligible</div><div class="stat-value" style="color:var(--negligible);">${fmtInt(neg.length)}</div></div>
    </div>
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="chart-card"><h3>Status Breakdown</h3><div id="chStatusWrap"><canvas id="chStatus" height="220"></canvas></div></div>
      <div class="chart-card"><h3>Overcharge Value by Day</h3><div id="chTrendWrap"><canvas id="chTrend" height="220"></canvas></div></div>
    </div>
    <div class="grid grid-2" style="margin-bottom:18px;">
      <div class="chart-card"><h3>Top Auditors by Overcharge Lines</h3><div id="chAuditorsWrap"><canvas id="chAuditors" height="240"></canvas></div></div>
      <div class="chart-card"><h3>Top Distributors by Overcharge Lines</h3><div id="chDBsWrap"><canvas id="chDBs" height="240"></canvas></div></div>
    </div>
    <div class="chart-card">
      <h3>Overcharge Lines by Category</h3><div id="chCategoryWrap"><canvas id="chCategory" height="200"></canvas></div>
    </div>
  `;

  function topN(field, n){
    const m = {};
    over.forEach(r=>{ const k=r[field]||'—'; m[k]=(m[k]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
  }
  const byDay = {};
  rows.forEach(r=>{ if(r.Status==='over'){ const d=(r.BillDate||'').slice(0,10)||'?'; byDay[d]=(byDay[d]||0)+(Number(r.OverchargeAmt)||0); } });
  const days = Object.keys(byDay).sort();
  const topAud = topN('AuditorName', 8);
  const topDB = topN('DBName', 8);
  const topCat = topN('Category', 10);

  // Chart.js loads from a CDN — if a firewall, ad-blocker, or offline moment
  // blocks it, `Chart` never exists and every one of these would otherwise
  // throw and leave the whole Analytics screen blank below the stat cards.
  // Fall back to plain HTML/CSS bars (same look as the My Data breakdown)
  // so the numbers are always visible even without the charting library.
  if(typeof Chart === 'undefined'){
    $('#chStatusWrap').innerHTML = simpleBarListHtml([
      ['Overcharge', over.length, 'var(--danger)'], ['Overcharge – Negligible', neg.length, 'var(--negligible)'],
      ['Undercharge', under.length, 'var(--warn)'], ['Match', match.length, 'var(--success)'],
    ]);
    $('#chTrendWrap').innerHTML = days.length ? simpleBarListHtml(days.map(d=>[d, Math.round(byDay[d]*100)/100, 'var(--danger)']), true) : '<div class="empty-state">No overcharge lines in this period.</div>';
    $('#chAuditorsWrap').innerHTML = topAud.length ? simpleBarListHtml(topAud.map(([k,v])=>[k,v,'var(--ink)'])) : '<div class="empty-state">No overcharge lines.</div>';
    $('#chDBsWrap').innerHTML = topDB.length ? simpleBarListHtml(topDB.map(([k,v])=>[k,v,'var(--danger)'])) : '<div class="empty-state">No overcharge lines.</div>';
    $('#chCategoryWrap').innerHTML = topCat.length ? simpleBarListHtml(topCat.map(([k,v])=>[k,v,'var(--negligible)'])) : '<div class="empty-state">No overcharge lines.</div>';
    return;
  }

  chartInstances.push(new Chart($('#chStatus'), {
    type:'doughnut',
    data:{ labels:['Overcharge','Overcharge – Negligible','Undercharge','Match'],
      datasets:[{ data:[over.length, neg.length, under.length, match.length], backgroundColor:['#D6234B','#2A5FD9','#B9791A','#0FA86B'] }] },
    options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:12,font:{size:11}}}} }
  }));
  chartInstances.push(new Chart($('#chTrend'), {
    type:'line',
    data:{ labels:days, datasets:[{ label:'Overcharge ₹', data:days.map(d=>Math.round(byDay[d]*100)/100), borderColor:'#D6234B', backgroundColor:'rgba(214,35,75,0.1)', fill:true, tension:.25 }] },
    options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}} }
  }));
  chartInstances.push(new Chart($('#chAuditors'), {
    type:'bar',
    data:{ labels:topAud.map(x=>x[0]), datasets:[{ label:'Overcharge lines', data:topAud.map(x=>x[1]), backgroundColor:'#101114' }] },
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}} }
  }));
  chartInstances.push(new Chart($('#chDBs'), {
    type:'bar',
    data:{ labels:topDB.map(x=>x[0]), datasets:[{ label:'Overcharge lines', data:topDB.map(x=>x[1]), backgroundColor:'#D6234B' }] },
    options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}} }
  }));
  chartInstances.push(new Chart($('#chCategory'), {
    type:'bar',
    data:{ labels:topCat.map(x=>x[0]), datasets:[{ label:'Overcharge lines', data:topCat.map(x=>x[1]), backgroundColor:'#2A5FD9' }] },
    options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}} }
  }));
}
function simpleBarListHtml(items, isCurrency){
  const max = Math.max(...items.map(i=>i[1]), 1);
  return `<div style="padding:4px 0;">${items.map(([label,val,color])=>`
    <div class="micro-bar-row" style="cursor:default;">
      <div class="mb-label" title="${esc(String(label))}">${esc(String(label))}</div>
      <div class="mb-track"><div class="mb-fill" style="width:${(val/max)*100}%;background:${color};"></div></div>
      <div class="mb-count">${isCurrency?'₹'+fmtMoney(val):fmtInt(val)}</div>
    </div>`).join('')}</div>`;
}

async function renderSubmissions(){
  const body = $('#tabBody');
  body.innerHTML = `
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      ${dateRangeBarHtml('sub', window.__subFrom, window.__subTo)}
      ${quickRangeHtml('sub')}
      <div class="field"><label>Auditor</label><select id="subAuditorFilter"><option value="">All</option></select></div>
      <div class="field"><label>Verifier</label><select id="subVerifierFilter"><option value="">All</option></select></div>
      <button class="btn accent" id="subExport" style="margin-left:auto;" disabled>⬇ Export (Pro format)</button>
      <button class="btn secondary" id="subExportPhotos" disabled>📷 Download All Photos (ZIP)</button>
    </div>
    <div id="subContent">${ultimateLoaderHtml('subLoader')}</div>
  `;
  wireDateRangeBar('sub', ()=>{
    window.__subFrom = $('#subFrom').value; window.__subTo = $('#subTo').value;
    renderSubmissions();
  });
  wireQuickRange('sub', (from,to)=>{
    window.__subFrom = from; window.__subTo = to;
    renderSubmissions();
  });
  const s = getSession();
  const params = { action:'alldata', code:s.code, pin:s.pin, fromDate: window.__subFrom||'', toDate: window.__subTo||'' };
  const stop = startUltimateLoader('subLoader');
  let painted = false;
  await cachedBackendGet(params,
    (data)=>{ painted = true; stop('Loaded from local cache'); paintSubmissions(data.rows||[], true); },
    (fresh)=>{
      if(document.querySelector('.tab-btn.active')?.dataset.tab !== 'submissions') return;
      if(!fresh.ok){ if(!painted) $('#subContent').innerHTML = `<div class="empty-state">${esc(fresh.error||'Could not load data.')}</div>`; return; }
      stop();
      paintSubmissions(fresh.rows, false);
    }
  );
}
function paintSubmissions(rows, isStale){
  window.__subRows = rows;
  $('#subExport').disabled = !rows.length;
  $('#subExport').onclick = ()=>exportProExcel(window.__subFilteredRows||rows, 'All_Submissions', 'All Submissions');
  $('#subExportPhotos').disabled = !rows.length;
  $('#subExportPhotos').onclick = ()=>exportBillPhotosZip(window.__subFilteredRows||rows, $('#subExportPhotos'));
  const staleBanner = isStale ? `<div class="stale-banner"><span class="spin"></span> Refreshing in the background…</div>` : '';
  $('#subContent').innerHTML = staleBanner + '<div id="subInner"></div>';
  // Populate the Auditor/Verifier dropdowns from whatever names actually
  // appear in this period's data, so the list is always accurate without a
  // separate lookup — then group the table by whichever one is selected.
  const auditors = [...new Set(rows.map(r=>r.AuditorName).filter(Boolean))].sort();
  const verifiers = [...new Set(rows.map(r=>r.VerifiedBy).filter(Boolean))].sort();
  $('#subAuditorFilter').innerHTML = `<option value="">All (${auditors.length})</option>` + auditors.map(a=>`<option value="${esc(a)}" ${window.__subAuditor===a?'selected':''}>${esc(a)}</option>`).join('');
  $('#subVerifierFilter').innerHTML = `<option value="">All (${verifiers.length})</option>` + verifiers.map(v=>`<option value="${esc(v)}" ${window.__subVerifier===v?'selected':''}>${esc(v)}</option>`).join('');
  $('#subAuditorFilter').addEventListener('change', e=>{ window.__subAuditor = e.target.value; applySubmissionFilters(); });
  $('#subVerifierFilter').addEventListener('change', e=>{ window.__subVerifier = e.target.value; applySubmissionFilters(); });
  applySubmissionFilters();
}
function applySubmissionFilters(){
  let rows = window.__subRows||[];
  if(window.__subAuditor) rows = rows.filter(r=>r.AuditorName===window.__subAuditor);
  if(window.__subVerifier) rows = rows.filter(r=>r.VerifiedBy===window.__subVerifier);
  // Grouped by Auditor first (then Verifier, then date) so one person's
  // lines sit together instead of interleaved in submission order — this is
  // the "arranged by auditor/verifier" view without needing a separate tab.
  rows = [...rows].sort((a,b)=>
    (a.AuditorName||'').localeCompare(b.AuditorName||'') ||
    (a.VerifiedBy||'').localeCompare(b.VerifiedBy||'') ||
    String(a.Timestamp||'').localeCompare(String(b.Timestamp||''))
  );
  window.__subFilteredRows = rows;
  renderSubmissionsTable(rows);
}
function billCopyLinkCell(r){
  if(!r.BillCopyURL) return '<span class="small-muted">—</span>';
  const dl = r.BillCopyDownloadURL || r.BillCopyURL;
  return `<a href="${esc(r.BillCopyURL)}" target="_blank" rel="noopener" class="bill-copy-link">📷 View</a> · <a href="${esc(dl)}" class="bill-copy-link" download>⬇</a>`;
}
function renderSubmissionsTable(rows){
  const content = $('#subInner');
  if(!rows.length){ content.innerHTML = '<div class="empty-state">No submissions match these filters.</div>'; return; }
  const cols = ['Timestamp','AuditorCode','AuditorName','VerifiedBy','DBCode','DBName','Location','Retailer','BillDate','ProductName','ProductCode','CompanyRate','InvoiceRate','VariancePct','Status','OverchargeAmt','UnderchargeAmt','BillCopy'];
  let lastAuditor = null;
  content.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${cols.map(c=>`<th>${c==='BillCopy'?'Bill Copy':c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>{
      const newGroup = r.AuditorName!==lastAuditor;
      lastAuditor = r.AuditorName;
      return `<tr class="${newGroup?'auditor-group-start':''}">${cols.map(c=>{
      if(c==='BillCopy') return `<td>${billCopyLinkCell(r)}</td>`;
      if(c==='Status') return `<td>${statusBadge(r[c])}</td>`;
      if(['CompanyRate','InvoiceRate','OverchargeAmt','UnderchargeAmt'].includes(c)) return `<td class="num">${fmtMoney(r[c])}</td>`;
      if(c==='VariancePct') return `<td class="num">${r[c]!=null && r[c]!==''?r[c]+'%':'—'}</td>`;
      if(c==='Timestamp') return `<td>${esc(String(r[c]).slice(0,19).replace('T',' '))}</td>`;
      return `<td>${esc(r[c])}</td>`;
    }).join('')}</tr>`; }).join('')}</tbody>
  </table></div>`;
}
function exportRowsToExcel(rows, filenamePrefix){
  if(!rows || !rows.length){ toast('Nothing to export', 'err'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, `${filenamePrefix}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* Same colored "Pro" look AND the SAME full column set as Rate Ledger's own
   Excel export — so a report downloaded from anywhere (any Dashboard view,
   by any Verifier or Auditor) is byte-for-byte the same shape and style as
   one downloaded straight from Rate Ledger. Source rows here come from the
   Sheet (PascalCase headers); a couple of columns Rate Ledger computes
   in-browser (₹/PC rates) aren't stored as their own Sheet columns, so
   they're recomputed here from PackSizeKg, which IS stored. */
async function exportProExcel(rows, filenamePrefix, viewLabel){
  if(!rows || !rows.length){ toast('Nothing to export', 'err'); return; }
  const INK='FF1E2438', DANGER='FFB23A2E', DANGERSOFT='FFF3DEDA',
        SUCCESSSOFT='FFDCEBE0', WARNSOFT='FFF1E4C6', NEGLIGIBLESOFT='FFDCE6F5', NEGLIGIBLE='FF2A5FD9',
        GSTMISMATCHSOFT='FFF1E8FC', GSTSUSPECTSOFT='FFFDF0DA', WHITE='FFFFFFFF';
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Rate Ledger'; wb.created = new Date();
  const ws = wb.addWorksheet('Overinvoicing Report', {views:[{state:'frozen', ySplit:5}]});
  const cols = [
    {header:'SL', key:'sl', width:6}, {header:'DB Code', key:'DBCode', width:11}, {header:'DB Name', key:'DBName', width:26},
    {header:'Location', key:'Location', width:14}, {header:'Beat Code', key:'BeatCode', width:12}, {header:'Beat Name', key:'BeatName', width:22},
    {header:'SO Name', key:'SOName', width:16}, {header:'ASM Name', key:'ASMName', width:16}, {header:'RSM Name', key:'RSMName', width:16},
    {header:'DB Status', key:'DBStatus', width:11}, {header:'Retailer / Outlet', key:'Retailer', width:24}, {header:'Bill Type', key:'BillType', width:12},
    {header:'Bill No', key:'BillNo', width:14}, {header:'Bill Date', key:'BillDate', width:12}, {header:'Product', key:'ProductName', width:34},
    {header:'Pack Size (kg)', key:'PackSizeKg', width:12}, {header:'Product Code', key:'ProductCode', width:13}, {header:'GST %', key:'GSTPct', width:8},
    {header:'Company Rate (₹/kg)', key:'CompanyRate', width:14}, {header:'Company Rate (₹/PC)', key:'CompanyRatePerPc', width:14},
    {header:'Bag Size', key:'BagSizeLabel', width:12}, {header:'Components', key:'ComponentsSummary', width:30},
    {header:'Total Qty (kg-equiv)', key:'QtyKG', width:14}, {header:'Total Invoiced (₹)', key:'TotalInvoiced', width:15},
    {header:'Invoice Rate (₹/kg)', key:'InvoiceRate', width:15}, {header:'Invoice Rate (₹/PC)', key:'BlendedRatePerPc', width:15},
    {header:'Diff (₹/kg)', key:'DiffPerKg', width:12}, {header:'Diff (₹/PC)', key:'DiffPerPc', width:12}, {header:'Diff (₹/BAG)', key:'DiffPerBag', width:13},
    {header:'Variance %', key:'VariancePctLabel', width:11}, {header:'Status', key:'StatusLabel', width:13},
    {header:'Over/Undercharge (₹)', key:'DiffAmountLabel', width:16}, {header:'Overcharge Amt', key:'OverchargeAmt', width:15},
    {header:'Undercharge Amt', key:'UnderchargeAmt', width:16}, {header:'Wrong GST Charged (₹)', key:'GSTMismatchLabel', width:18},
    {header:'Collected By', key:'CollectedBy', width:20}, {header:'Designation', key:'Designation', width:16},
    {header:'Verified By', key:'VerifiedBy', width:20}, {header:'Submission Date', key:'SubmissionDate', width:15}, {header:'Bill Copy', key:'BillCopyURL', width:16},
  ];
  ws.columns = cols.map(c=>({key:c.key, width:c.width}));
  ws.mergeCells(1,1,1,cols.length);
  const titleCell = ws.getCell(1,1);
  titleCell.value = `RATE LEDGER — OVERINVOICING AUDIT REPORT`;
  titleCell.font = {name:'Calibri', size:14, bold:true, color:{argb:WHITE}};
  titleCell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:INK}};
  ws.getRow(1).height = 26;
  const over = rows.filter(r=>r.Status==='over'), under = rows.filter(r=>r.Status==='under'), neg = rows.filter(r=>r.Status==='negligible');
  const overAmt = over.reduce((s,r)=>s+(Number(r.OverchargeAmt)||0),0), underAmt = under.reduce((s,r)=>s+(Number(r.UnderchargeAmt)||0),0);
  ws.mergeCells(2,1,2,cols.length);
  ws.getCell(2,1).value = `Generated ${new Date().toLocaleDateString('en-IN')}  ·  ${rows.length} lines  ·  ${over.length} overcharge (₹${overAmt.toFixed(2)})  ·  ${under.length} undercharge (₹${underAmt.toFixed(2)})  ·  ${neg.length} negligible (<1%, excluded)`;
  ws.getCell(2,1).font = {name:'Calibri', size:10, italic:true, color:{argb:'FF6B6E76'}};
  const headerRow = ws.getRow(4);
  cols.forEach((c,i)=>{ headerRow.getCell(i+1).value = c.header; });
  headerRow.eachCell(cell=>{ cell.font={name:'Calibri',size:10,bold:true,color:{argb:WHITE}}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; cell.alignment={vertical:'middle'}; });
  headerRow.height = 20;
  let r = 6;
  rows.forEach((row,idx)=>{
    const status = (row.Status||'').toLowerCase();
    const fillColor = status==='over'?DANGERSOFT:(status==='negligible'?NEGLIGIBLESOFT:(status==='under'?WARNSOFT:SUCCESSSOFT));
    const sColor = status==='over'?DANGER:(status==='negligible'?NEGLIGIBLE:(status==='under'?'FF9C6B12':'FF1E7A4C'));
    const statusLabel = status==='over'?'OVERCHARGE':(status==='negligible'?'OVERCHARGE - NEGLIGIBLE':(status==='under'?'UNDERCHARGE':'MATCH'));
    const packKg = Number(row.PackSizeKg)||null;
    const companyRatePerPc = packKg ? (Number(row.CompanyRate)||0)*packKg : '';
    const blendedRatePerPc = packKg ? (Number(row.InvoiceRate)||0)*packKg : '';
    // TotalInvoiced isn't its own Sheet column (only the per-kg rate is) —
    // it's exactly QtyKG × the blended rate, so derive it rather than add
    // yet another column to migrate for.
    const totalInvoiced = (row.TotalInvoiced!=null && row.TotalInvoiced!=='') ? row.TotalInvoiced : (Number(row.QtyKG)||0)*(Number(row.InvoiceRate)||0);
    const vp = row.VariancePct==null||row.VariancePct===''?'':row.VariancePct;
    const variancePctLabel = vp===''?'':((Number(vp)>0?'+':'')+vp+'%');
    const chargeAmt = status==='over' ? Number(row.OverchargeAmt)||0 : (status==='under' ? -(Number(row.UnderchargeAmt)||0) : (Number(row.NegligibleAmt)||0));
    const diffAmountLabel = (chargeAmt>0?'+':'')+chargeAmt.toFixed(2);
    const gstMismatch = String(row.GSTMismatch).toUpperCase()==='TRUE';
    const gstMismatchLabel = gstMismatch ? `${row.GSTPctCharged}% charged vs correct ${row.GSTPct}% = ${Number(row.GSTMismatchAmt)>0?'+':''}${row.GSTMismatchAmt}` : '';
    const rowData = { sl:idx+1, ...row, CompanyRatePerPc:companyRatePerPc, BlendedRatePerPc:blendedRatePerPc, TotalInvoiced:totalInvoiced,
      VariancePctLabel:variancePctLabel, StatusLabel:statusLabel, DiffAmountLabel:diffAmountLabel, GSTMismatchLabel:gstMismatchLabel };
    const excelRow = ws.getRow(r);
    cols.forEach((c,i)=>{
      let v = rowData[c.key];
      if(c.key==='SubmissionDate' && v) v = String(v).slice(0,19).replace('T',' ');
      if(c.key==='BillCopyURL' && v){
        excelRow.getCell(i+1).value = { text:'View photo', hyperlink: v };
        excelRow.getCell(i+1).font = { color:{argb:'FF2A5FD9'}, underline:true };
      } else {
        excelRow.getCell(i+1).value = (v===undefined||v==='') ? null : v;
      }
      excelRow.getCell(i+1).fill = {type:'pattern', pattern:'solid', fgColor:{argb: gstMismatch ? (GSTMISMATCHSOFT) : fillColor}};
    });
    ['CompanyRate','CompanyRatePerPc','InvoiceRate','BlendedRatePerPc','TotalInvoiced','OverchargeAmt','UnderchargeAmt','DiffPerKg','DiffPerPc','DiffPerBag'].forEach(k=>{
      const ci = cols.findIndex(c=>c.key===k)+1;
      if(ci>0) excelRow.getCell(ci).numFmt = '#,##0.00';
    });
    const byKey = k=>{ const ci=cols.findIndex(c=>c.key===k)+1; return ci>0?excelRow.getCell(ci):null; };
    [byKey('StatusLabel'), byKey('VariancePctLabel'), byKey('DiffAmountLabel')].forEach(cell=>{ if(cell) cell.font={bold:true,color:{argb:sColor}}; });
    if(status==='over'){ const c=byKey('OverchargeAmt'); if(c) c.font={bold:true,color:{argb:DANGER}}; }
    if(status==='under'){ const c=byKey('UnderchargeAmt'); if(c) c.font={bold:true,color:{argb:'FF9C6B12'}}; }
    if(gstMismatch){ const c=byKey('GSTMismatchLabel'); if(c){ c.font={bold:true,color:{argb:'FF9B59EB'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:GSTMISMATCHSOFT}}; } }
    excelRow.height = 18;
    r++;
  });
  // Summary sheet — same structure as Rate Ledger's own Pro export, so both
  // reports carry the identical at-a-glance overview alongside the detail.
  const ws2 = wb.addWorksheet('Summary');
  ws2.columns = [{width:28},{width:18},{width:18}];
  ws2.getCell('A1').value = 'RATE LEDGER — SUMMARY';
  ws2.getCell('A1').font = {size:13,bold:true,color:{argb:WHITE}};
  ws2.mergeCells('A1:B1'); ws2.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}};
  ws2.getRow(1).height = 22;
  const overCount = over.length, overAmt2 = over.reduce((s,rr)=>s+(Number(rr.OverchargeAmt)||0),0);
  const underCount = under.length, underAmt2 = under.reduce((s,rr)=>s+(Number(rr.UnderchargeAmt)||0),0);
  const negCount = neg.length, negAmt = neg.reduce((s,rr)=>s+(Number(rr.NegligibleAmt)||0),0);
  const byLoc = {};
  rows.forEach(rr=>{
    const loc = rr.Location||'—';
    byLoc[loc] = byLoc[loc] || {total:0, over:0, overAmt:0, under:0, underAmt:0};
    byLoc[loc].total++;
    if(rr.Status==='over'){ byLoc[loc].over++; byLoc[loc].overAmt += Number(rr.OverchargeAmt)||0; }
    if(rr.Status==='under'){ byLoc[loc].under++; byLoc[loc].underAmt += Number(rr.UnderchargeAmt)||0; }
  });
  let sr = 3;
  ws2.getCell(`A${sr}`).value='Total lines checked'; ws2.getCell(`B${sr}`).value=rows.length; sr++;
  ws2.getCell(`A${sr}`).value='Overcharge instances (≥1% of rate)'; ws2.getCell(`B${sr}`).value=overCount; sr++;
  ws2.getCell(`A${sr}`).value='Total overcharge value (₹)'; ws2.getCell(`B${sr}`).value=Number(overAmt2.toFixed(2)); sr++;
  ws2.getCell(`A${sr}`).value='Undercharge instances'; ws2.getCell(`B${sr}`).value=underCount; sr++;
  ws2.getCell(`A${sr}`).value='Total undercharge value (₹)'; ws2.getCell(`B${sr}`).value=Number(underAmt2.toFixed(2)); sr++;
  ws2.getCell(`A${sr}`).value='Negligible instances (<1% of rate)'; ws2.getCell(`B${sr}`).value=negCount; sr++;
  ws2.getCell(`A${sr}`).value='Total negligible value (₹, excluded from overcharge)'; ws2.getCell(`B${sr}`).value=Number(negAmt.toFixed(2)); sr+=2;
  ws2.getCell(`A${sr}`).value='Location'; ws2.getCell(`B${sr}`).value='Overcharge lines'; ws2.getCell(`C${sr}`).value='Undercharge lines';
  ws2.getRow(sr).eachCell(c=>{ c.font={bold:true,color:{argb:WHITE}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:INK}}; });
  sr++;
  Object.entries(byLoc).forEach(([loc,v])=>{ ws2.getCell(`A${sr}`).value=loc; ws2.getCell(`B${sr}`).value=v.over; ws2.getCell(`C${sr}`).value=v.under; sr++; });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filenamePrefix}_${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* Bulk-downloads every bill photo currently on screen as one ZIP — the
   actual zipping happens server-side (Code.gs), which avoids the CORS wall
   that would block fetching Drive files directly from browser JS. Sends the
   exact BillUIDs visible right now, so it matches whatever filters (date
   range, Auditor/Verifier dropdown) are currently applied. */
async function exportBillPhotosZip(rows, btn){
  const uids = [...new Set(rows.filter(r=>r.BillCopyURL).map(r=>r.BillUID))];
  if(!uids.length){ toast('No bill photos in the current filtered view', 'err'); return; }
  const s = getSession();
  const origLabel = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Packing photos…';
  try{
    const res = await backendPost({ action:'exportBillPhotosZip', code:s.code, pin:s.pin, billUids:uids });
    if(!res.ok){ toast(res.error||'Could not build the photo ZIP', 'err'); return; }
    const bin = atob(res.base64Zip);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], {type:'application/zip'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = res.fileName || `Bill_Photos_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(`Downloaded ${res.count} bill photo${res.count===1?'':'s'}, organised by DB`, 'ok');
  } catch(e){
    toast('Could not build the photo ZIP — try again', 'err');
  } finally {
    btn.disabled = false; btn.innerHTML = origLabel;
  }
}

/* Weekly / Monthly / Today / All-time quick filter buttons, alongside the
   existing From/To range — clicking one sets both dates and re-renders. */
function quickRangeHtml(prefix){
  return `<div class="quick-range" id="${prefix}QuickRange">
    <button data-q="today">Today</button>
    <button data-q="week">This Week</button>
    <button data-q="month">This Month</button>
    <button data-q="all">All Time</button>
  </div>`;
}
function wireQuickRange(prefix, onPick){
  const wrap = $(`#${prefix}QuickRange`);
  if(!wrap) return;
  wrap.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{
    const now = new Date();
    let from='', to='';
    const iso = d => d.toISOString().slice(0,10);
    if(btn.dataset.q==='today'){ from = to = iso(now); }
    else if(btn.dataset.q==='week'){ const day=now.getDay()||7; const mon=new Date(now); mon.setDate(now.getDate()-day+1); from=iso(mon); to=iso(now); }
    else if(btn.dataset.q==='month'){ from = iso(new Date(now.getFullYear(), now.getMonth(), 1)); to = iso(now); }
    else { from=''; to=''; }
    onPick(from, to);
  }));
}

function paintMyVerified(rows, isStale){
  const el = $('#mvContent');

  const neg = rows.filter(r=>r.Status==='negligible');

  window.__mvFilteredRows = rows;
  // Micro-level: which PRODUCT shows up most often in what I've verified,
  // and its own over/under split — click a bar to filter the table below.
  const byProduct = {};
  rows.forEach(r=>{ const k=r.ProductName||'—'; (byProduct[k]=byProduct[k]||[]).push(r); });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
  const maxCount = topProducts.length ? topProducts[0][1].length : 1;
  el.innerHTML = `
    ${isStale ? `<div class="stale-banner"><span class="spin"></span> Refreshing in the background…</div>` : ''}
    <div class="grid grid-4" style="margin-bottom:18px;">

      <div class="stat-card"><div class="stat-label">Negligible</div><div class="stat-value" style="color:var(--negligible);">${fmtInt(neg.length)}</div></div>
    </div>
    ${topProducts.length ? `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-title">By Product — click to filter below</div>
      ${topProducts.map(([name, list])=>{
        const o = list.filter(r=>r.Status==='over').length;
        return `<div class="micro-bar-row" data-product="${esc(name)}">
          <div class="mb-label" title="${esc(name)}">${esc(name)}</div>

        </div>`;
      }).join('')}

    const wasActive = row.classList.contains('active');

  }));
}
function renderMyVerifiedTable(rows){
